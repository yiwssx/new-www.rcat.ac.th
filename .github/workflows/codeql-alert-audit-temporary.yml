name: Temporary CodeQL Alert State Audit
on:
  push:
    branches:
      - security/codeql-context-review-regressions

permissions:
  contents: read
  security-events: read

jobs:
  read-main-alert-states:
    if: github.repository == 'yiwssx/new-www.rcat.ac.th'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read CodeQL alert IDs and states (no source checkout)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for page in $(seq 1 10); do
            response="$(curl --fail-with-body --silent --show-error --retry 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/code-scanning/alerts?state=all&ref=refs%2Fheads%2Fmain&per_page=100&page=${page}")"
            count="$(printf '%s' "$response" | jq 'length')"
            printf '%s' "$response" | jq -c '.[] | select(.number >= 1 and .number <= 18) | {number, state, rule: .rule.id}'
            if [ "$count" -lt 100 ]; then
              break
            fi
          done
