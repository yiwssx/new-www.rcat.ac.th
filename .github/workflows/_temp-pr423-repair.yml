name: Temporary / PR 423 Repair

on:
  push:
    branches:
      - refactor/workflow-architecture-consolidation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/workflow-architecture-consolidation
      - uses: ./.github/actions/setup-project

      - name: Restore production fixture diagnostics and cleanup verification
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/production-data-operations.yml')
          text = path.read_text()

          old_schema = '''          if [[ "$schema_status" -ne 0 ]]; then echo "::error::Production fixture schema inspection failed (wrangler exit $schema_status)."; exit "$schema_status"; fi
'''
          new_schema = '''          if [[ "$schema_status" -ne 0 ]]; then
            echo "::error::Production fixture schema inspection failed (wrangler exit $schema_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$schema_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$schema_json" --label "wrangler stdout" || true
            exit "$schema_status"
          fi
'''
          if old_schema not in text:
              raise SystemExit('schema diagnostic target not found')
          text = text.replace(old_schema, new_schema, 1)

          old_audit = '''          audit_json="$RUNNER_TEMP/production-fixture-audit.json"
          audit_sql="$(cat cloudflare/public-api/sql/production-fixture-audit.sql)"
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command="$audit_sql" --json > "$audit_json"
          node scripts/check-production-fixture-audit.mjs --file "$audit_json"
'''
          new_audit = '''          audit_json="$RUNNER_TEMP/production-fixture-audit.json"
          audit_stderr="$RUNNER_TEMP/production-fixture-audit.stderr"
          audit_sql="$(cat cloudflare/public-api/sql/production-fixture-audit.sql)"
          set +e
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \\
            --remote \\
            --command="$audit_sql" \\
            --json > "$audit_json" 2> "$audit_stderr"
          audit_status=$?
          set -e

          if [[ "$audit_status" -ne 0 ]]; then
            echo "::error::Production fixture audit query failed before payload validation (wrangler exit $audit_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_json" --label "wrangler stdout" || true
            exit "$audit_status"
          fi

          node scripts/check-production-fixture-audit.mjs --file "$audit_json"
'''
          if old_audit not in text:
              raise SystemExit('fixture audit target not found')
          text = text.replace(old_audit, new_audit, 1)

          old_home = '''          audit_json="$RUNNER_TEMP/production-home-section-fixture-audit.json"
          audit_sql="$(cat cloudflare/public-api/sql/production-home-section-fixture-audit.sql)"
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command="$audit_sql" --json > "$audit_json"
          node scripts/check-production-fixture-audit.mjs --file "$audit_json"
'''
          new_home = '''          audit_json="$RUNNER_TEMP/production-home-section-fixture-audit.json"
          audit_stderr="$RUNNER_TEMP/production-home-section-fixture-audit.stderr"
          audit_sql="$(cat cloudflare/public-api/sql/production-home-section-fixture-audit.sql)"
          set +e
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \\
            --remote \\
            --command="$audit_sql" \\
            --json > "$audit_json" 2> "$audit_stderr"
          audit_status=$?
          set -e

          if [[ "$audit_status" -ne 0 ]]; then
            echo "::error::Optional public_home_sections fixture audit failed (wrangler exit $audit_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_json" --label "wrangler stdout" || true
            exit "$audit_status"
          fi

          node scripts/check-production-fixture-audit.mjs --file "$audit_json"
'''
          if old_home not in text:
              raise SystemExit('home audit target not found')
          text = text.replace(old_home, new_home, 1)

          old_post = '''          audit_json="$RUNNER_TEMP/production-fixture-post-audit.json"
          audit_sql="$(cat cloudflare/public-api/sql/production-fixture-audit.sql)"
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command="$audit_sql" --json > "$audit_json"
          node scripts/check-production-fixture-audit.mjs --file "$audit_json" --expect-clean
'''
          new_post = '''          audit_json="$RUNNER_TEMP/production-fixture-post-audit.json"
          audit_stderr="$RUNNER_TEMP/production-fixture-post-audit.stderr"
          audit_sql="$(cat cloudflare/public-api/sql/production-fixture-audit.sql)"
          set +e
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \\
            --remote \\
            --command="$audit_sql" \\
            --json > "$audit_json" 2> "$audit_stderr"
          audit_status=$?
          set -e

          if [[ "$audit_status" -ne 0 ]]; then
            echo "::error::Post-cleanup production fixture audit query failed before payload validation (wrangler exit $audit_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_json" --label "wrangler stdout" || true
            exit "$audit_status"
          fi

          node scripts/check-production-fixture-audit.mjs --file "$audit_json" --expect-clean

      - name: Verify optional public_home_sections sentinel is clean
        if: ${{ inputs.operation == 'fixture-cleanup' && env.PUBLIC_HOME_SECTIONS_PRESENT == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          audit_json="$RUNNER_TEMP/production-home-section-fixture-post-audit.json"
          audit_stderr="$RUNNER_TEMP/production-home-section-fixture-post-audit.stderr"
          audit_sql="$(cat cloudflare/public-api/sql/production-home-section-fixture-audit.sql)"
          set +e
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \\
            --remote \\
            --command="$audit_sql" \\
            --json > "$audit_json" 2> "$audit_stderr"
          audit_status=$?
          set -e

          if [[ "$audit_status" -ne 0 ]]; then
            echo "::error::Post-cleanup public_home_sections fixture audit failed (wrangler exit $audit_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_json" --label "wrangler stdout" || true
            exit "$audit_status"
          fi

          node scripts/check-production-fixture-audit.mjs --file "$audit_json" --expect-clean
'''
          if old_post not in text:
              raise SystemExit('post-clean audit target not found')
          text = text.replace(old_post, new_post, 1)
          path.write_text(text)

      - name: Apply repository Prettier to changed text files
        run: |
          pnpm exec prettier --write \
            .github/workflows/dependency-status-sync.yml \
            .github/workflows/maintenance-recovery.yml \
            .github/workflows/production-data-operations.yml \
            .github/workflows/production-verification.yml \
            scripts/check-p5f-security-boundary.mjs \
            scripts/check-p5h-maintainability-observability.mjs \
            scripts/check-p6b-security-enforcement.mjs \
            scripts/check-p6c-recovery-reliability.mjs \
            server/healthAggregation/handler.mjs \
            server/healthAggregation/handler.test.mjs \
            src/test/dependencyAutomationContract.test.ts \
            src/test/deploymentHistoryTaxonomy.test.ts \
            src/test/phaseAAutomationContract.test.ts \
            src/test/phaseAProductionBrowserSmokeContract.test.ts \
            src/test/phaseC2ProductionGuard.test.ts \
            src/test/phaseCDeepFieldVerificationContract.test.ts \
            src/test/productionDataIntegritySafety.test.ts \
            src/test/vercelIgnoreBuild.test.mjs \
            src/test/workflowInventoryGovernance.test.ts

      - name: Commit deterministic repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/production-data-operations.yml scripts server src
          git commit -m "fix(ci): preserve data safety after workflow consolidation"
          git push origin HEAD:refactor/workflow-architecture-consolidation
