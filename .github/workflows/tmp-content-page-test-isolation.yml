name: Temporary ContentPage Test Isolation Fix

on:
  push:
    branches:
      - fix/facebook-thumbnail-field-reliability
    paths:
      - .github/workflows/tmp-content-page-test-isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/facebook-thumbnail-field-reliability

      - name: Patch async test isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/admin/pages/ContentPage.test.tsx")
          text = path.read_text()
          old = '''    expect(swalInstance.update).toHaveBeenCalledWith(\n      expect.objectContaining({\n        text: "100% • บันทึกและอัปเดตข้อมูลเรียบร้อย"\n      })\n    );\n  });\n\n  it("keeps a visible warning after content saves when Facebook thumbnail creation fails", async () => {'''
          new = '''    expect(swalInstance.update).toHaveBeenCalledWith(\n      expect.objectContaining({\n        text: "100% • บันทึกและอัปเดตข้อมูลเรียบร้อย"\n      })\n    );\n    await waitFor(() => {\n      expect(findSwalCall((options) => options.title === "บันทึกเนื้อหาสำเร็จ")).toEqual(\n        expect.objectContaining({ icon: "success" })\n      );\n    });\n  });\n\n  it("keeps a visible warning after content saves when Facebook thumbnail creation fails", async () => {'''
          if old not in text:
              raise SystemExit("expected test block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write src/admin/pages/ContentPage.test.tsx

      - name: Commit test isolation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/pages/ContentPage.test.tsx
          git commit -m "test(content): await thumbnail progress save completion"
          git push origin HEAD:fix/facebook-thumbnail-field-reliability
