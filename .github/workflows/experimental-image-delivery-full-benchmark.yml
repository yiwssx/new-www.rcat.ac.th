name: Experimental / Full Image Delivery Benchmark

on:
  push:
    branches:
      - experiment/image-delivery-full-benchmark
    paths:
      - "scripts/experimental-image-delivery-page-benchmark.mjs"
      - ".github/workflows/experimental-image-delivery-full-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark Drive vs Cloudflare image delivery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install chromium

      - name: Run full image delivery benchmark
        run: node scripts/experimental-image-delivery-page-benchmark.mjs

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-delivery-full-benchmark
          path: image-delivery-benchmark-results.json
          if-no-files-found: warn
          retention-days: 7
