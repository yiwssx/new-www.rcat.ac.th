name: v3.3.2 Task 7 Transform

on:
  push:
    branches:
      - feat/v3.3.2-task-7-admin-bundle-governance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message || '', 'apply conditional optional runtime') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: node scripts/v332-task7-admin-bundle.mjs
      - run: pnpm exec prettier --write src/admin/components/RichTextEditorImpl.tsx src/admin/components/RichTextEditorCore.tsx src/admin/components/RichTextEditorOptionalMode.tsx src/admin/components/richTextEditorParity.test.ts scripts/check-admin-editor-bundle.mjs package.json .github/workflows/ci.yml docs/workstreams/v3.3.2-content-editor-performance-tracker.md
      - run: node scripts/run-vitest.mjs run src/admin/components/richTextEditorParity.test.ts
      - run: pnpm build
      - run: pnpm editor:bundle:check
      - name: Commit generated Task 7 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/components/RichTextEditorImpl.tsx src/admin/components/RichTextEditorCore.tsx src/admin/components/RichTextEditorOptionalMode.tsx src/admin/components/richTextEditorParity.test.ts scripts/check-admin-editor-bundle.mjs package.json .github/workflows/ci.yml docs/workstreams/v3.3.2-content-editor-performance-tracker.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "perf(editor): apply conditional optional runtime"
          git push origin HEAD:feat/v3.3.2-task-7-admin-bundle-governance
