name: Facebook Reels Block Layout

on:
  push:
    branches:
      - feature/facebook-reels-embed

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply Reel layout to content blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer_path = Path('src/shared/components/ContentBlocksRenderer.tsx')
          source = renderer_path.read_text(encoding='utf-8')

          old_import = '  buildFacebookPostPluginUrl,\n  clampFacebookPostPluginWidth,\n  isUnsupportedFacebookUrl,\n  normalizeFacebookPostUrl'
          new_import = '  buildFacebookPostPluginUrl,\n  clampFacebookPostPluginWidth,\n  isFacebookReelUrl,\n  isUnsupportedFacebookUrl,\n  normalizeFacebookPostUrl'
          assert old_import in source, 'facebookEmbed import block not found'
          source = source.replace(old_import, new_import, 1)

          old_constant = 'const defaultFacebookPostHeight = 761;'
          new_constant = 'const defaultFacebookPostHeight = 761;\nconst maximumFacebookReelWidth = 440;'
          assert old_constant in source, 'Facebook height constant not found'
          source = source.replace(old_constant, new_constant, 1)

          old_setup = '  const href = normalizeFacebookPostUrl(block.href);\n  const isUnsupported = isUnsupportedFacebookUrl(block.href);\n  const width = clampFacebookPostPluginWidth(block.width || 500);\n  const pluginUrl = buildFacebookPostPluginUrl({ href, showText: block.showText, width });'
          new_setup = '  const href = normalizeFacebookPostUrl(block.href);\n  const isUnsupported = isUnsupportedFacebookUrl(block.href);\n  const isReel = isFacebookReelUrl(href);\n  const requestedWidth = clampFacebookPostPluginWidth(block.width || 500);\n  const width = isReel ? Math.min(requestedWidth, maximumFacebookReelWidth) : requestedWidth;\n  const pluginUrl = buildFacebookPostPluginUrl({ href, showText: block.showText, width });'
          assert old_setup in source, 'Facebook block setup not found'
          source = source.replace(old_setup, new_setup, 1)

          old_embed = '          <PublicDeferredEmbed\n            title="Facebook post"\n            src={pluginUrl}\n            scrolling="no"\n            frameBorder="0"\n            allowFullScreen\n            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"\n            width={width}\n            height={block.height || defaultFacebookPostHeight}\n            sx={{\n              width: "100%",\n              maxWidth: width,\n              height: block.height || defaultFacebookPostHeight,\n              borderRadius: designTokens.radius.small\n            }}\n          />'
          new_embed = '          <PublicDeferredEmbed\n            title={isReel ? "Facebook Reel" : "Facebook post"}\n            src={pluginUrl}\n            scrolling="no"\n            frameBorder="0"\n            allowFullScreen\n            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"\n            width={width}\n            height={isReel && !block.height ? undefined : block.height || defaultFacebookPostHeight}\n            sx={\n              isReel && !block.height\n                ? {\n                    width: "100%",\n                    maxWidth: width,\n                    aspectRatio: "9 / 16",\n                    borderRadius: designTokens.radius.small\n                  }\n                : {\n                    width: "100%",\n                    maxWidth: width,\n                    height: block.height || defaultFacebookPostHeight,\n                    borderRadius: designTokens.radius.small\n                  }\n            }\n          />'
          assert old_embed in source, 'Facebook block embed markup not found'
          source = source.replace(old_embed, new_embed, 1)

          old_button = '          >\n            เปิดโพสต์บน Facebook\n          </Button>'
          new_button = '          >\n            {isReel ? "เปิด Reels บน Facebook" : "เปิดโพสต์บน Facebook"}\n          </Button>'
          assert old_button in source, 'Facebook source button not found'
          source = source.replace(old_button, new_button, 1)

          old_fallback = 'ไม่สามารถฝังโพสต์ Facebook นี้ได้โดยตรง'
          new_fallback = 'ไม่สามารถฝังเนื้อหา Facebook นี้ได้โดยตรง'
          assert old_fallback in source, 'Facebook fallback text not found'
          source = source.replace(old_fallback, new_fallback, 1)
          renderer_path.write_text(source, encoding='utf-8')

          test_path = Path('src/test/facebookEmbedRegression.test.tsx')
          test_source = test_path.read_text(encoding='utf-8')
          old_reel_title = 'const iframe = screen.getByTitle("Facebook post");\n    const iframeSrc = iframe.getAttribute("src") || "";\n    const pluginUrl = new URL(iframeSrc);\n\n    expect(pluginUrl.origin + pluginUrl.pathname).toBe("https://www.facebook.com/plugins/video.php");'
          new_reel_title = 'const iframe = screen.getByTitle("Facebook Reel");\n    const iframeSrc = iframe.getAttribute("src") || "";\n    const pluginUrl = new URL(iframeSrc);\n\n    expect(pluginUrl.origin + pluginUrl.pathname).toBe("https://www.facebook.com/plugins/video.php");'
          assert old_reel_title in test_source, 'Reel regression title assertion not found'
          test_source = test_source.replace(old_reel_title, new_reel_title, 1)

          old_reel_link = 'expect(pluginUrl.searchParams.get("show_text")).toBe("false");\n    expect(screen.getByRole("link", { name: "เปิดโพสต์บน Facebook" })).toHaveAttribute("href", facebookReelUrl);'
          new_reel_link = 'expect(pluginUrl.searchParams.get("show_text")).toBe("false");\n    expect(pluginUrl.searchParams.get("width")).toBe("440");\n    expect(screen.getByRole("link", { name: "เปิด Reels บน Facebook" })).toHaveAttribute("href", facebookReelUrl);'
          assert old_reel_link in test_source, 'Reel regression link assertion not found'
          test_source = test_source.replace(old_reel_link, new_reel_link, 1)
          test_source = test_source.replace('expect(screen.getByText("ไม่สามารถฝังโพสต์ Facebook นี้ได้โดยตรง")).toBeInTheDocument();', 'expect(screen.getByText("ไม่สามารถฝังเนื้อหา Facebook นี้ได้โดยตรง")).toBeInTheDocument();')
          test_path.write_text(test_source, encoding='utf-8')
          PY
      - name: Format with project Prettier
        run: pnpm exec prettier src/shared/components/ContentBlocksRenderer.tsx src/test/facebookEmbedRegression.test.tsx --write
      - name: Run focused Reels tests
        run: pnpm exec vitest run src/utils/facebookEmbed.test.ts src/components/embeds/FacebookPostEmbed.test.tsx src/test/facebookEmbedRegression.test.tsx src/test/contentBlocksRenderer.test.tsx
      - name: Typecheck and build
        run: pnpm build
      - name: Remove temporary workflow and commit validated changes
        run: |
          rm .github/workflows/facebook-reels-block-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/components/ContentBlocksRenderer.tsx src/test/facebookEmbedRegression.test.tsx .github/workflows/facebook-reels-block-layout.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(content): optimize Facebook Reels block layout [skip ci]"
          git push origin HEAD:feature/facebook-reels-embed
