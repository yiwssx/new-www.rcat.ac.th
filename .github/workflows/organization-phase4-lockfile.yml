name: Organization Phase 4 dependency lockfile
on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: organization-phase4-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/org-01-domain-schema' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Add reviewed Phase 4 forms stack and resolve lockfile
        run: |
          pnpm add 'react-hook-form@^7.65.0' 'zod@^4.1.12' '@hookform/resolvers@^5.2.2' --strict-peer-dependencies
          pnpm exec prettier --write package.json
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Push manifest and lockfile only
        id: push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(organization): install phase 4 form validation stack"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ "$REMOTE_SHA" != "$SOURCE_SHA" ]; then
            echo "Remote branch advanced; skip stale dependency commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Recheck committed dependency head
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api --method POST "repos/$GH_REPO/actions/workflows/ci.yml/dispatches" -f "ref=$BRANCH"
