name: Experimental / Apply Image Delivery Test Contract Updates

on:
  push:
    branches:
      - experiment/image-delivery-rollout

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore(test): arm rollout legacy test updater' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update legacy tests for mandatory IntroGate readiness
        run: |
          python - <<'PY'
          from pathlib import Path

          homepage = Path('src/test/homepageSettingsComponents.test.tsx')
          text = homepage.read_text()
          old = '''    render(<PublicIntroGate settings={createIntroGateSettings()} />);\n\n    fireEvent.click(screen.getByRole("button", { name: /เข้าสู่เว็บไซต์หลัก/ }));'''
          new = '''    render(<PublicIntroGate settings={createIntroGateSettings()} />);\n\n    fireEvent.load(screen.getByRole("img", { name: "Intro image" }));\n    fireEvent.click(screen.getByRole("button", { name: /เข้าสู่เว็บไซต์หลัก/ }));'''
          if text.count(old) != 1:
              raise SystemExit(f'homepage IntroGate replacement count={text.count(old)}')
          text = text.replace(old, new)

          anchor = '''function expectMotionSpeed(\n  motion: ReturnType<typeof getMarqueeMotion>,\n  totalDistancePx: number,\n  expectedPixelsPerSecond: number\n) {'''
          helper = '''function getMarqueeInjectedStyles() {\n  return [...document.head.querySelectorAll("style")]\n    .map((style) => style.textContent || "")\n    .filter((styles) => styles.includes("rcat-marquee-track"))\n    .join("")\n    .replace(/\\s/g, "");\n}\n\nfunction expectMotionSpeed(\n  motion: ReturnType<typeof getMarqueeMotion>,\n  totalDistancePx: number,\n  expectedPixelsPerSecond: number\n) {'''
          if text.count(anchor) != 1:
              raise SystemExit(f'marquee helper anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper)

          old_styles = '''    const injectedStyles = (document.head.textContent || "").replace(/\\s/g, "");'''
          if text.count(old_styles) != 2:
              raise SystemExit(f'marquee style replacement count={text.count(old_styles)}')
          text = text.replace(old_styles, '''    const injectedStyles = getMarqueeInjectedStyles();''')
          homepage.write_text(text)

          public_pages = Path('src/test/publicDataDrivenPages.test.tsx')
          text = public_pages.read_text()
          old = '''    expect(screen.queryByRole("link", { name: "สอบถามข้อมูลผ่าน Messenger" })).not.toBeInTheDocument();\n\n    fireEvent.click(screen.getByRole("button", { name: "เข้าสู่เว็บไซต์" }));'''
          new = '''    expect(screen.queryByRole("link", { name: "สอบถามข้อมูลผ่าน Messenger" })).not.toBeInTheDocument();\n\n    fireEvent.load(screen.getByRole("img", { name: "Intro gate fixture" }));\n    fireEvent.click(screen.getByRole("button", { name: "เข้าสู่เว็บไซต์" }));'''
          if text.count(old) != 1:
              raise SystemExit(f'public pages IntroGate replacement count={text.count(old)}')
          public_pages.write_text(text.replace(old, new))
          PY
      - name: Remove one-shot updater
        run: rm .github/workflows/experimental-image-delivery-test-fix.yml
      - name: Commit test contract updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/homepageSettingsComponents.test.tsx src/test/publicDataDrivenPages.test.tsx .github/workflows/experimental-image-delivery-test-fix.yml
          git commit -m "test(intro): align legacy suites with mandatory readiness"
          git push origin HEAD:experiment/image-delivery-rollout
