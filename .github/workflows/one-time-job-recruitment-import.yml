name: One-Time Job Recruitment Import

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-time-job-recruitment-import.yml
      - ops/job-recruitment-import-source.txt
      - ops/job-recruitment-import-manifest.json

permissions:
  contents: read

jobs:
  import:
    name: Import job recruitment announcements
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require protected production credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID"

      - name: Resolve exact production D1 identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs \
            --database-list "$RUNNER_TEMP/d1-databases.json" \
            --verify-identity-only

      - name: Reconstruct reviewed import payload
        shell: bash
        run: |
          IMPORT_FILE="$RUNNER_TEMP/rcat-job-recruitment-import.sql"
          awk '
            /<<'\''B64'\''/ { capture = 1; next }
            capture && $0 == "B64" { exit }
            capture { print }
          ' ops/job-recruitment-import-source.txt \
            | tr -d '[:space:]' \
            | base64 -d \
            | gunzip > "$IMPORT_FILE"
          actual_sha="$(sha256sum "$IMPORT_FILE" | awk '{print $1}')"
          test "$actual_sha" = "1622a0877352e53249a789b01df9d87292f469fda8d53ab6d67f6f1e72f043a4"
          test "$(grep -c '^INSERT OR IGNORE INTO contents' "$IMPORT_FILE")" = "26"
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("ops/job-recruitment-import-manifest.json", "utf8"));
          if (manifest.row_count !== 26 || manifest.oldest !== "2024-10-03" || manifest.newest !== "2026-02-25") {
            throw new Error("Job recruitment manifest verification failed.");
          }
          const uniqueFiles = new Set(manifest.items.map((item) => item.file_id));
          if (manifest.items.length !== 26 || uniqueFiles.size !== 26) {
            throw new Error("Job recruitment manifest file ids are not unique.");
          }
          console.log("Reviewed job recruitment manifest verified: 26 source files.");
          NODE
          echo "IMPORT_FILE=$IMPORT_FILE" >> "$GITHUB_ENV"
          echo "Reviewed job recruitment payload verified: 26 idempotent inserts."

      - name: Inspect existing import scope
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --command="SELECT COUNT(*) AS existing_count FROM contents WHERE created_by = 'gdrive-job-import' AND COALESCE(deleted_at, '') = '';" \
            --json > "$RUNNER_TEMP/job-import-before.json"
          cat "$RUNNER_TEMP/job-import-before.json"

      - name: Capture pre-import Time Travel bookmark
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 time-travel info "$PRODUCTION_D1_RESOURCE_NAME" \
            --json > "$RUNNER_TEMP/job-import-pre-time-travel.json"
          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + "/job-import-pre-time-travel.json", "utf8")
          );
          const metadata = Array.isArray(value) ? value[0] : value;
          if (typeof metadata?.bookmark !== "string" || metadata.bookmark.length === 0) {
            throw new Error("Production Time Travel bookmark was not returned; refusing import.");
          }
          console.log("Pre-import Time Travel bookmark captured.");
          NODE

      - name: Import 26 job recruitment announcements
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --file "$IMPORT_FILE"

      - name: Verify production rows
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --command="SELECT COUNT(*) AS row_count, COUNT(DISTINCT body_doc_id) AS distinct_files, MIN(publish_at) AS oldest, MAX(publish_at) AS newest, SUM(CASE WHEN type = 'announcement' AND status = 'published' AND category = 'รับสมัครงาน' THEN 1 ELSE 0 END) AS valid_rows FROM contents WHERE created_by = 'gdrive-job-import' AND COALESCE(deleted_at, '') = '';" \
            --json > "$RUNNER_TEMP/job-import-after.json"
          cat "$RUNNER_TEMP/job-import-after.json"
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/job-import-after.json", "utf8"));
          const statements = Array.isArray(payload) ? payload : [payload];
          const rows = statements.flatMap((statement) =>
            Array.isArray(statement?.results) ? statement.results : []
          );
          const row = rows[0] || {};
          if (
            Number(row.row_count) !== 26 ||
            Number(row.distinct_files) !== 26 ||
            Number(row.valid_rows) !== 26
          ) {
            throw new Error(
              `Job recruitment verification failed: row_count=${row.row_count}, distinct_files=${row.distinct_files}, valid_rows=${row.valid_rows}`
            );
          }
          if (
            row.oldest !== "2024-10-03T00:00:00.000Z" ||
            row.newest !== "2026-02-25T00:00:00.000Z"
          ) {
            throw new Error(`Job recruitment date range mismatch: ${row.oldest} .. ${row.newest}`);
          }
          console.log("Job recruitment production import verified: 26 rows, 26 files, expected date range.");
          NODE
