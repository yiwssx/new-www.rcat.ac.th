name: Temporary Media Upload 100 MB Boundary Update

on:
  push:
    branches:
      - agent/media-upload-100mb

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-upload-100mb
          fetch-depth: 0

      - name: Align 100 MB boundary fixtures and helper text
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const uiFiles = [
            'src/admin/pages/MediaPage.tsx',
            'src/admin/components/ContentEditorDialog.tsx',
            'src/admin/pages/MediaPage.test.tsx',
            'src/admin/components/ContentEditorDialog.test.tsx'
          ];

          for (const file of uiFiles) {
            let text = fs.readFileSync(file, 'utf8');
            text = text
              .replaceAll('รองรับไฟล์ขนาดไม่เกิน 10 MB', 'รองรับไฟล์ขนาดไม่เกิน 100 MB')
              .replaceAll('files over 10 MB', 'files over 100 MB')
              .replaceAll('10 * 1024 * 1024 + 1', '100 * 1024 * 1024 + 1');
            fs.writeFileSync(file, text);
          }

          const appsScriptTest = 'src/test/appsScriptCode.test.ts';
          let testText = fs.readFileSync(appsScriptTest, 'utf8');
          testText = testText
            .replaceAll('files over 10 MB', 'files over 100 MB')
            .replaceAll('10 * 1024 * 1024 + 1', '100 * 1024 * 1024 + 1');
          fs.writeFileSync(appsScriptTest, testText);
          NODE

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/temporary-media-upload-100mb-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/pages/MediaPage.tsx src/admin/components/ContentEditorDialog.tsx src/admin/pages/MediaPage.test.tsx src/admin/components/ContentEditorDialog.test.tsx src/test/appsScriptCode.test.ts
          git commit -m "test(media): exercise 100 MB boundary"
          git push origin HEAD:agent/media-upload-100mb
