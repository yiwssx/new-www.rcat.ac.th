name: One-shot P2C Maintenance

on:
  push:
    branches:
      - p2-critical-coverage-20260815
    paths:
      - .github/workflows/one-shot-p2c-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p2-critical-coverage-20260815
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write vitest.critical-coverage.config.ts
      - run: pnpm deps:status
      - name: Commit generated maintenance files and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-p2c-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitest.critical-coverage.config.ts docs/maintenance/dependency-current-status.md .github/workflows/one-shot-p2c-maintenance.yml
          git commit -m "chore(p2): refresh coverage config and dependency status"
          git push origin HEAD:p2-critical-coverage-20260815
