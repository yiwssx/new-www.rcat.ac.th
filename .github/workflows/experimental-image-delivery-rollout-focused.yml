name: Experimental / Image Delivery Rollout Focused Tests

on:
  push:
    branches:
      - experiment/image-delivery-rollout

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Run focused rollout regressions
        run: >-
          pnpm exec vitest run
          src/shared/media/publicImageSources.test.ts
          src/shared/media/publicImageDeliveryWarmup.test.ts
          src/utils/safeUrl.test.ts
          src/features/admin-write/adminWriteProvider.test.ts
          src/test/PublicIntroGateRegression.test.tsx
          src/test/publicMediaPriorityCoordination.test.tsx
          src/test/carouselImageStage.test.tsx
          src/test/publicHomeCarouselRegression.test.tsx
          src/test/homepageSettings.test.ts
          src/test/siteSettings.test.ts
          src/test/publicSiteShellSsrReadiness.test.ts
          --reporter=verbose
