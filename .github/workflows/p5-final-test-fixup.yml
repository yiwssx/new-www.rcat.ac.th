name: P5 Final Test Fixup

on:
  push:
    branches:
      - agent/p5a-p5d-data-ssr-efficiency

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5a-p5d-data-ssr-efficiency
      - name: Fix nullable legacy test display settings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "src/test/publicDataDrivenPages.test.tsx";
          let source = fs.readFileSync(path, "utf8");
          const from = "    displaySettings: snapshot.displaySettings,";
          const to = "    displaySettings: snapshot.displaySettings!,";
          if (!source.includes(from)) {
            if (source.includes(to)) process.exit(0);
            throw new Error("Expected displaySettings fixture assignment not found");
          }
          fs.writeFileSync(path, source.replace(from, to));
          NODE
      - name: Commit test fixup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(p5): assert legacy display settings fixture"
          git push origin HEAD:agent/p5a-p5d-data-ssr-efficiency
