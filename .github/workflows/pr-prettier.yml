name: PR Prettier

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: pr-prettier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Apply repository Prettier
        run: pnpm exec prettier --write .
      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Prettier produced no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git -c core.hooksPath=/dev/null commit -m "style: apply Prettier formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
