name: Facebook Metadata Reclassification

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/facebook-metadata-reclassification.yml
      - scripts/facebook/facebook-content-classifier.mjs
      - scripts/facebook/refetch-imported-facebook-posts.mjs
      - scripts/facebook/reclassify-facebook-imports.mjs
      - scripts/facebook/transform-posts-to-d1-sql.mjs
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit metadata only, or apply the generated repair to production D1"
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
      apply_confirmation:
        description: "For apply only, enter RECLASSIFY_FACEBOOK_IMPORTS"
        required: false
        type: string

permissions:
  contents: read

jobs:
  reclassify:
    name: Facebook Metadata Reclassification
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview
      RECLASSIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'audit' }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require protected production credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROLE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && 'D1 write' || 'D1 read' }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID is unavailable from the protected production environment." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Required $CLOUDFLARE_CREDENTIAL_ROLE credential is unavailable from the protected production environment." >&2
            exit 1
          }
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID" || {
            echo "RCAT_PRODUCTION_D1_DATABASE_ID is unavailable from the protected production environment." >&2
            exit 1
          }
          test -n "$META_PAGE_ACCESS_TOKEN" || {
            echo "META_PAGE_ACCESS_TOKEN is unavailable; exact facebook-import source messages cannot be recovered safely." >&2
            exit 1
          }

          if [[ "$RECLASSIFICATION_MODE" == "apply" && "${{ inputs.apply_confirmation }}" != "RECLASSIFY_FACEBOOK_IMPORTS" ]]; then
            echo "Apply mode requires apply_confirmation=RECLASSIFY_FACEBOOK_IMPORTS." >&2
            exit 1
          fi

      - name: Resolve exact production D1 identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs \
            --database-list "$RUNNER_TEMP/d1-databases.json" \
            --verify-identity-only

      - name: Run classifier self-test
        run: node scripts/facebook/facebook-content-classifier.mjs --self-test

      - name: Read only facebook-import production rows
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/facebook-reclassification/result"
          query="SELECT id, slug, title, summary, category, tags_json, canonical_url, template, owner, created_by, updated_by, revision, publish_at FROM contents WHERE type = 'news' AND COALESCE(deleted_at, '') = '' AND template = 'facebook-embed' AND (id LIKE 'facebook-post-%' OR slug LIKE 'facebook-%') AND (owner = 'facebook-import' OR created_by = 'facebook-import') ORDER BY publish_at ASC;"
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --command="$query" \
            --json > "$RUNNER_TEMP/facebook-reclassification/d1-before.json"

      - name: Count scoped facebook-import rows
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          import { flattenWranglerRows, isFacebookImportRow } from "./scripts/facebook/reclassify-facebook-imports.mjs";

          const payload = JSON.parse(
            await readFile(process.env.RUNNER_TEMP + "/facebook-reclassification/d1-before.json", "utf8")
          );
          const rows = flattenWranglerRows(payload).filter(isFacebookImportRow);
          if (rows.length === 0) throw new Error("No facebook-import production rows were found.");
          await appendFile(process.env.GITHUB_ENV, `FACEBOOK_IMPORT_COUNT=${rows.length}\n`);
          console.log(`Scoped facebook-import rows: ${rows.length}.`);
          NODE

      - name: Refetch exact original source for every facebook-import row
        shell: bash
        run: |
          node scripts/facebook/refetch-imported-facebook-posts.mjs \
            --d1-json "$RUNNER_TEMP/facebook-reclassification/d1-before.json" \
            --output "$RUNNER_TEMP/facebook-reclassification/facebook-source.json" \
            --concurrency 5 \
            --max-attempts 3

      - name: Build metadata audit and guarded repair SQL
        shell: bash
        run: |
          node scripts/facebook/reclassify-facebook-imports.mjs \
            --d1-json "$RUNNER_TEMP/facebook-reclassification/d1-before.json" \
            --facebook-json "$RUNNER_TEMP/facebook-reclassification/facebook-source.json" \
            --output-dir "$RUNNER_TEMP/facebook-reclassification/result" \
            --batch-size 100

      - name: Require safe apply readiness
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const root = process.env.RUNNER_TEMP + "/facebook-reclassification/result";
          const [summary, manifest] = await Promise.all([
            readFile(root + "/summary.json", "utf8").then(JSON.parse),
            readFile(root + "/repair-manifest.json", "utf8").then(JSON.parse)
          ]);
          const expectedCount = Number(process.env.FACEBOOK_IMPORT_COUNT);
          if (summary.totalFacebookImports !== expectedCount) {
            throw new Error(`Audit row count changed unexpectedly: expected ${expectedCount}, got ${summary.totalFacebookImports}.`);
          }
          if (summary.facebookExport.chunkErrors !== 0) {
            throw new Error(`Unexpected source export error count: ${summary.facebookExport.chunkErrors}.`);
          }
          console.log(
            `Apply readiness: ${expectedCount} facebook-import rows, ${summary.matched} exact Facebook sources, ${summary.d1Fallback} unavailable sources left review-only, ${manifest.totalRepairRows} guarded repairs.`
          );
          NODE

      - name: Capture pre-repair D1 Time Travel bookmark
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 time-travel info "$PRODUCTION_D1_RESOURCE_NAME" --json \
            > "$RUNNER_TEMP/facebook-reclassification/result/pre-repair-time-travel.json"
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/facebook-reclassification/result/pre-repair-time-travel.json", "utf8"));
            const metadata = Array.isArray(value) ? value[0] : value;
            if (typeof metadata?.bookmark !== "string" || metadata.bookmark.length === 0) {
              throw new Error("production Time Travel bookmark was not returned");
            }
            console.log("Pre-repair production Time Travel bookmark captured.");
          '

      - name: Apply guarded repair batches to production D1
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/facebook-reclassification/result/repair-part-*.sql)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No metadata changes are required."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Applying $(basename "$file")"
            pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --file "$file"
          done

      - name: Read repaired facebook-import metadata for verification
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          query="SELECT id, category, tags_json, revision FROM contents WHERE type = 'news' AND COALESCE(deleted_at, '') = '' AND template = 'facebook-embed' AND (id LIKE 'facebook-post-%' OR slug LIKE 'facebook-%') AND (owner = 'facebook-import' OR created_by = 'facebook-import') ORDER BY publish_at ASC;"
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --command="$query" \
            --json > "$RUNNER_TEMP/facebook-reclassification/d1-after.json"

      - name: Verify every planned metadata repair
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        shell: bash
        run: |
          node scripts/facebook/reclassify-facebook-imports.mjs \
            --d1-json "$RUNNER_TEMP/facebook-reclassification/d1-after.json" \
            --verify-report "$RUNNER_TEMP/facebook-reclassification/result/report.json" \
            --output-dir "$RUNNER_TEMP/facebook-reclassification/result"

      - name: Upload audit and repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: facebook-metadata-reclassification-${{ github.run_id }}
          path: ${{ runner.temp }}/facebook-reclassification/result/
          if-no-files-found: warn
          retention-days: 30
