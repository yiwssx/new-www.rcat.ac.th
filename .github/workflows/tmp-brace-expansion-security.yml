name: Temporary / Inspect Dependency Advisories

on:
  push:
    branches:
      - fix/apps-script-bridge-reliability

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/apps-script-bridge-reliability
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Apply candidate brace-expansion override locally
        shell: python
        run: |
          from pathlib import Path
          path = Path("pnpm-workspace.yaml")
          text = path.read_text()
          old = '  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9'
          new = '  "brace-expansion@>=4.0.0 <5.0.11": 5.0.11'
          if old not in text:
              raise SystemExit("expected brace-expansion override not found")
          path.write_text(text.replace(old, new, 1))
      - name: Install candidate tree
        run: pnpm install --no-frozen-lockfile --strict-peer-dependencies
      - name: Print remaining audit findings
        run: pnpm audit --json || true
