name: Temporary / Refresh Transitive Security Overrides

on:
  push:
    branches:
      - fix/apps-script-bridge-reliability

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/apps-script-bridge-reliability
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Update transitive security overrides
        shell: python
        run: |
          from pathlib import Path
          path = Path("pnpm-workspace.yaml")
          text = path.read_text()
          replacements = {
              '  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9':
                  '  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12',
              '  "fast-uri@>=3.0.0 <3.1.7": 3.1.7':
                  '  "fast-uri@>=3.0.0 <3.1.8": 3.1.8',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected security override not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Refresh dependency tree
        run: pnpm install --no-frozen-lockfile --strict-peer-dependencies
      - name: Require zero audit findings
        run: pnpm audit
      - name: Refresh dependency status snapshot
        run: node scripts/generate-dependency-status.mjs
      - name: Format dependency files
        run: pnpm exec prettier --write pnpm-workspace.yaml docs/maintenance/dependency-current-status.md
      - name: Commit security refresh and remove temporary workflow
        run: |
          rm .github/workflows/tmp-brace-expansion-security.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(deps): patch new transitive advisories"
          git push origin HEAD:fix/apps-script-bridge-reliability
