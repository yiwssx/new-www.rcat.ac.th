name: Phase C1 Field Fix Temp

on:
  push:
    branches:
      - fix/phase-c1-field-verification

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/phase-c1-field-verification
      - name: Apply bounded C1 production fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path("src/public/components/PublicSiteShell.tsx")
          text = shell.read_text()
          old = '''                      placeholder="ค้นหาในเว็บไซต์"
                      aria-label="ค้นหาในเว็บไซต์"
                      fullWidth
                      slotProps={{
                        input: {'''
          new = '''                      placeholder="ค้นหาในเว็บไซต์"
                      fullWidth
                      slotProps={{
                        htmlInput: { "aria-label": "ค้นหาในเว็บไซต์" },
                        input: {'''
          if old in text:
              text = text.replace(old, new, 1)
              shell.write_text(text)
          elif 'htmlInput: { "aria-label": "ค้นหาในเว็บไซต์" }' not in text:
              raise SystemExit("PublicSiteShell search-field contract not found")

          config = Path("playwright.production.config.ts")
          text = config.read_text()
          old = '''  fullyParallel: false,
  retries:'''
          new = '''  fullyParallel: false,
  workers: 1,
  retries:'''
          if old in text:
              text = text.replace(old, new, 1)
              config.write_text(text)
          elif "workers: 1," not in text:
              raise SystemExit("production Playwright worker contract not found")

          test = Path("src/test/phaseC1ProductionGuard.test.ts")
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\ndescribe("Phase C1 production field guard", () => {\n  it("puts the public header search accessible name on the native input", () => {\n    const source = readFileSync("src/public/components/PublicSiteShell.tsx", "utf8");\n\n    expect(source).toContain('htmlInput: { "aria-label": "ค้นหาในเว็บไซต์" }');\n    expect(source).not.toContain('placeholder="ค้นหาในเว็บไซต์"\\n                      aria-label="ค้นหาในเว็บไซต์"');\n  });\n\n  it("keeps production browser verification serial and low impact", () => {\n    const source = readFileSync("playwright.production.config.ts", "utf8");\n\n    expect(source).toMatch(/fullyParallel:\\s*false/);\n    expect(source).toMatch(/workers:\\s*1/);\n  });\n});\n''')
          PY
      - name: Commit applied fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "C1 fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/components/PublicSiteShell.tsx playwright.production.config.ts src/test/phaseC1ProductionGuard.test.ts
          git commit -m "fix(qa): close Phase C1 production findings"
          git push origin HEAD:fix/phase-c1-field-verification
