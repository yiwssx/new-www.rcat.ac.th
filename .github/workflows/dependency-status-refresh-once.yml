name: Dependency Status Refresh Once

on:
  push:
    branches:
      - fix/dependency-status-refresh-2026-09-19

permissions:
  contents: write

concurrency:
  group: dependency-status-refresh-once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependency-status-refresh-2026-09-19
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts

      - name: Generate canonical dependency status
        run: pnpm deps:status

      - name: Verify generated scope
        shell: bash
        run: |
          unexpected="$(git status --porcelain --untracked-files=no | awk '$2 != "docs/maintenance/dependency-current-status.md" && $2 != ".github/workflows/dependency-status-refresh-once.yml" { print }')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-time workflow and commit result
        shell: bash
        run: |
          rm .github/workflows/dependency-status-refresh-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md .github/workflows/dependency-status-refresh-once.yml
          git diff --cached --check
          git commit -m "docs(deps): refresh dependency status after lint-staged update"
          git push origin HEAD:fix/dependency-status-refresh-2026-09-19
