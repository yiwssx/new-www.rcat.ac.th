name: Patch Facebook Audit Trigger V2

on:
  push:
    branches:
      - fix/facebook-metadata-reclassification-v2

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/facebook-metadata-reclassification-v2

      - name: Make master push audit-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path(".github/workflows/facebook-metadata-reclassification.yml")
          source = file.read_text(encoding="utf-8")

          old_trigger = '''on:\n  workflow_dispatch:\n'''
          new_trigger = '''on:\n  push:\n    branches:\n      - master\n    paths:\n      - .github/workflows/facebook-metadata-reclassification.yml\n      - scripts/facebook/facebook-content-classifier.mjs\n      - scripts/facebook/reclassify-facebook-imports.mjs\n      - scripts/facebook/transform-posts-to-d1-sql.mjs\n  workflow_dispatch:\n'''
          if old_trigger not in source:
              raise SystemExit("workflow_dispatch trigger anchor not found")
          source = source.replace(old_trigger, new_trigger, 1)

          source = source.replace(
              "${{ inputs.mode == 'apply' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}",
              "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}"
          )
          source = source.replace(
              "${{ inputs.mode == 'apply' && 'D1 write' || 'D1 read' }}",
              "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && 'D1 write' || 'D1 read' }}"
          )
          source = source.replace(
              'if [[ "${{ inputs.mode }}" == "apply" && "${{ inputs.apply_confirmation }}" != "RECLASSIFY_FACEBOOK_IMPORTS" ]]; then',
              'if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "apply" && "${{ inputs.apply_confirmation }}" != "RECLASSIFY_FACEBOOK_IMPORTS" ]]; then'
          )
          source = source.replace(
              "if: ${{ inputs.mode == 'apply' }}",
              "if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}"
          )

          file.write_text(source, encoding="utf-8")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/facebook-metadata-reclassification.yml
          git commit -m "ci(content): audit Facebook metadata after merge"
          git push origin HEAD:fix/facebook-metadata-reclassification-v2
