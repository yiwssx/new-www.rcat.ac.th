name: Patch Facebook Transformer V2

on:
  push:
    branches:
      - fix/facebook-metadata-reclassification-v2

permissions:
  contents: write

jobs:
  patch-transformer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/facebook-metadata-reclassification-v2

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Replace first-match importer metadata logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          file = Path("scripts/facebook/transform-posts-to-d1-sql.mjs")
          source = file.read_text(encoding="utf-8")

          import_line = 'import { classifyFacebookContent } from "./facebook-content-classifier.mjs";\n'
          anchor = 'import { pathToFileURL } from "node:url";\n'
          if import_line not in source:
              source = source.replace(anchor, anchor + import_line, 1)

          source, removed = re.subn(
              r'\nconst CATEGORY_RULES = \[.*?\n\];\n\nconst KEYWORD_TAGS = \[.*?\n\];\n',
              '\n',
              source,
              count=1,
              flags=re.S,
          )
          if removed not in (0, 1):
              raise SystemExit(f"unexpected metadata constant replacement count: {removed}")

          function_pattern = re.compile(
              r'function classifyCategory\(postText\) \{.*?\n\}\n\nfunction extractHashtags\(postText\) \{.*?\n\}\n\nfunction createTagsJson\(postText, category\) \{.*?\n\}\n',
              re.S,
          )
          replacement = '''function classifyCategory(postText) {\n  return classifyFacebookContent(postText).category;\n}\n'''
          source, functions_replaced = function_pattern.subn(replacement, source, count=1)
          if functions_replaced not in (0, 1):
              raise SystemExit(f"unexpected metadata function replacement count: {functions_replaced}")

          old_category = '  const category = classifyCategory(postText);\n'
          new_category = '  const classification = classifyFacebookContent(postText);\n  const category = classification.category;\n'
          if old_category in source:
              source = source.replace(old_category, new_category, 1)

          old_tags = '    tags_json: createTagsJson(postText, category),\n'
          new_tags = '    tags_json: JSON.stringify(classification.tags),\n'
          if old_tags in source:
              source = source.replace(old_tags, new_tags, 1)

          if 'const CATEGORY_RULES' in source or 'const KEYWORD_TAGS' in source or 'createTagsJson(' in source:
              raise SystemExit("legacy first-match metadata logic remains after patch")
          if 'classifyFacebookContent(postText)' not in source:
              raise SystemExit("shared classifier integration was not installed")

          file.write_text(source, encoding="utf-8")
          PY

          pnpm exec prettier --write scripts/facebook/transform-posts-to-d1-sql.mjs
          node --check scripts/facebook/transform-posts-to-d1-sql.mjs
          git diff --check

      - name: Commit transformer patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Transformer already uses classifier v2."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/facebook/transform-posts-to-d1-sql.mjs
          git commit -m "fix(content): use classifier v2 for Facebook imports"
          git push origin HEAD:fix/facebook-metadata-reclassification-v2
