name: Patch Facebook Targeted Refetch

on:
  push:
    branches:
      - fix/facebook-import-targeted-refetch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/facebook-import-targeted-refetch
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Make D1 fallback review-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/facebook/reclassify-facebook-imports.mjs")
          source = script.read_text(encoding="utf-8")
          source = source.replace(
              "eligibleForRepair: changed,",
              'eligibleForRepair: changed && sourceKind === "facebook",',
              1,
          )
          source = source.replace(
              'chunkErrors: Array.isArray(rawExport?.errors) ? rawExport.errors.length : 0\n    },',
              'chunkErrors: Array.isArray(rawExport?.errors) ? rawExport.errors.length : 0,\n      sourceFailures: Array.isArray(rawExport?.targetedRecovery?.failures)\n        ? rawExport.targetedRecovery.failures.length\n        : 0\n    },',
              1,
          )
          script.write_text(source, encoding="utf-8")

          test = Path("scripts/facebook/facebook-reclassification.test.mjs")
          source = test.read_text(encoding="utf-8")
          source = source.replace(
              'expect(result.reportRows[0].eligibleForRepair).toBe(true);',
              'expect(result.reportRows[0].eligibleForRepair).toBe(false);',
              1,
          )
          test.write_text(source, encoding="utf-8")
          PY

          pnpm exec prettier --write \
            scripts/facebook/refetch-imported-facebook-posts.mjs \
            scripts/facebook/refetch-imported-facebook-posts.test.mjs \
            scripts/facebook/reclassify-facebook-imports.mjs \
            scripts/facebook/facebook-reclassification.test.mjs

      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/facebook/refetch-imported-facebook-posts.mjs \
            scripts/facebook/refetch-imported-facebook-posts.test.mjs \
            scripts/facebook/reclassify-facebook-imports.mjs \
            scripts/facebook/facebook-reclassification.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(content): restrict repairs to exact Facebook sources"
          git push origin HEAD:fix/facebook-import-targeted-refetch
