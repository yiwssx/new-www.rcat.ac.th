name: Step 3 Prettier Fix

on:
  push:
    branches:
      - refactor/ssr-readiness-step3
    paths:
      - .github/workflows/step3-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ssr-readiness-step3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write src/public/routing/searchParams.ts
      - name: Commit formatted source and remove one-shot workflow
        run: |
          rm .github/workflows/step3-prettier-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/routing/searchParams.ts .github/workflows/step3-prettier-fix.yml
          git commit -m "style(ssr): apply repository formatter to search params"
          git push origin HEAD:refactor/ssr-readiness-step3
