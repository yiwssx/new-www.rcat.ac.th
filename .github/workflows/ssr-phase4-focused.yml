name: SSR Phase 4 Focused

on:
  push:
    branches:
      - feat/ssr-emotion-critical-css
  pull_request:
    branches:
      - refactor/ssr-readiness

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm format:check
      - run: pnpm lint:strict
      - run: pnpm vitest run src/test/emotionSsr.test.tsx src/test/emotionClientHydration.test.ts src/test/queryHydration.test.ts src/test/ssrRuntimeFoundation.test.tsx src/test/publicRouteLoaders.test.ts src/test/publicRouteHeadSsrReadiness.test.ts src/test/publicSiteShellSsrReadiness.test.ts src/public/routing/publicRouteHead.test.ts
      - run: pnpm build
      - run: pnpm build:ssr:foundation
      - run: pnpm perf:check
      - run: pnpm media:check
      - run: pnpm layout:check
