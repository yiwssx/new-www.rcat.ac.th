name: Temporary RCAT O2O Origin Repair Formatter

on:
  pull_request:
    paths:
      - "middleware.ts"
      - "src/test/vercelCanonicalRedirect.test.ts"
      - "cloudflare/web-failover/**"
      - "docs/operations/cloudflare-o2o-saas-feasibility.md"
      - ".github/workflows/rcat-o2o-origin-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/o2o-origin-canonical-loop-760'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Normalize only changed RCAT O2O origin repair files
        run: |
          pnpm exec prettier --write \
            middleware.ts \
            src/test/vercelCanonicalRedirect.test.ts \
            cloudflare/web-failover/saas-gateway-worker.mjs \
            cloudflare/web-failover/origin-readiness.mjs \
            cloudflare/web-failover/saas-gateway.node-check.mjs \
            cloudflare/web-failover/origin-readiness.node-check.mjs \
            docs/operations/cloudflare-o2o-saas-feasibility.md
      - name: Commit Prettier output on trusted branch
        shell: bash
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            middleware.ts \
            src/test/vercelCanonicalRedirect.test.ts \
            cloudflare/web-failover/saas-gateway-worker.mjs \
            cloudflare/web-failover/origin-readiness.mjs \
            cloudflare/web-failover/saas-gateway.node-check.mjs \
            cloudflare/web-failover/origin-readiness.node-check.mjs \
            docs/operations/cloudflare-o2o-saas-feasibility.md
          git commit -m "style(operations): format SaaS origin bridge repair (#760)"
          git push origin HEAD:fix/o2o-origin-canonical-loop-760
