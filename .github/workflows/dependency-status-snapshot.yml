name: Dependency Status Snapshot

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'chore/dependency-status-gate-repair'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm deps:status
      - name: Print generated dependency status
        run: |
          echo '-----BEGIN DEPENDENCY STATUS-----'
          cat docs/maintenance/dependency-current-status.md
          echo '-----END DEPENDENCY STATUS-----'
