name: P5 Unit Fixup

on:
  push:
    branches:
      - agent/p5a-p5d-data-ssr-efficiency

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5a-p5d-data-ssr-efficiency

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Apply P5 unit compatibility fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          function replace(path, from, to) {
            let source = fs.readFileSync(path, "utf8");
            if (!source.includes(from)) {
              if (source.includes(to)) return;
              throw new Error(`Expected text not found in ${path}: ${from}`);
            }
            fs.writeFileSync(path, source.replace(from, to));
          }

          replace(
            "src/features/public-shell/api.ts",
            "    const legacyHome = await getPublicHomeSnapshotFromCloudflare(options);",
            "    const legacyHome = (await getPublicHomeSnapshotFromCloudflare(options)) as unknown as PublicShellSnapshot;"
          );

          replace(
            "src/public/pages/PublicContentDetailPage.tsx",
            "  const mediaAssets = contentDetailQuery.media;\n  const relatedItems = contentDetailQuery.relatedItems;",
            "  const mediaAssets = contentDetailQuery.media ?? [];\n  const relatedItems = contentDetailQuery.relatedItems ?? [];"
          );

          replace(
            "src/test/publicRouteLoaders.test.ts",
            "    const siteSettings = { siteName: \"RCAT\" };\n",
            ""
          );
          replace(
            "src/test/publicRouteLoaders.test.ts",
            "      if (queryKey[0] === \"cms-snapshot\") return { media: [], siteSettings };\n",
            ""
          );
          replace(
            "src/test/publicRouteLoaders.test.ts",
            "    expect(keys).toContainEqual([\"cms-snapshot\"]);\n    expect(loaderData).toEqual({ item, siteSettings, featuredMedia });",
            "    expect(keys).not.toContainEqual([\"cms-snapshot\"]);\n    expect(loaderData).toEqual({\n      item: {\n        id: item.id,\n        title: item.title,\n        slug: item.slug,\n        type: item.type,\n        summary: item.summary,\n        seoTitle: undefined,\n        seoDescription: undefined,\n        canonicalUrl: undefined,\n        publishAt: item.publishAt,\n        updatedAt: item.updatedAt,\n        category: undefined,\n        tags: undefined\n      },\n      featuredMedia\n    });"
          );

          replace(
            "src/test/publicDataDrivenPages.test.tsx",
            "    return {\n      data: currentSnapshot,\n      ...currentQueryState\n    };\n  }\n}));\n\nvi.mock(\"@tanstack/react-router\"",
            "    const legacyHomeShell =\n      currentHomeSnapshot && \"siteSettings\" in currentHomeSnapshot ? currentHomeSnapshot : undefined;\n\n    return {\n      data: legacyHomeShell ?? currentSnapshot,\n      ...currentQueryState\n    };\n  }\n}));\n\nvi.mock(\"@tanstack/react-router\""
          );
          replace(
            "src/test/publicDataDrivenPages.test.tsx",
            "    expect(usePublicCmsSnapshotMock.mock.calls.every(([options]) => options?.enabled === false)).toBe(true);",
            "    expect(usePublicCmsSnapshotMock).toHaveBeenCalledWith(undefined);"
          );

          replace(
            "src/test/publicContentDetailRegression.test.tsx",
            "  usePublicContentDetail: () => ({\n    data: currentDetail,\n    isLoading: false,\n    isFetching: false\n  })",
            "  usePublicContentDetail: () => ({\n    data: currentDetail,\n    media: currentSnapshot?.media ?? [],\n    relatedItems: (currentSnapshot?.content ?? []).filter((item) => item.id !== currentDetail?.id),\n    isLoading: false,\n    isFetching: false\n  })"
          );

          replace(
            "src/test/publicContentDetailPage.test.tsx",
            "    currentDetailQueryState = {\n      isLoading: false,\n      isFetching: false\n    };\n\n    render(<PublicContentDetailPage slug=\"announcement-1\" />);",
            "    currentDetailQueryState = {\n      isLoading: true,\n      isFetching: false\n    };\n\n    render(<PublicContentDetailPage slug=\"announcement-1\" />);"
          );
          NODE

      - run: pnpm format
      - run: >-
          node scripts/run-vitest.mjs run
          src/test/publicRouteLoaders.test.ts
          src/test/publicDataDrivenPages.test.tsx
          src/test/publicContentDetailRegression.test.tsx
          src/test/publicContentDetailPage.test.tsx
          src/test/publicBlogFilters.test.tsx
          src/test/publicApiContractReadiness.test.ts
      - run: pnpm build

      - name: Commit verified fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No compatibility fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(p5): align unit contracts with split data ownership"
          git push origin HEAD:agent/p5a-p5d-data-ssr-efficiency
