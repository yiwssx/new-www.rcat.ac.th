name: Temporary CodeQL S10 Main Audit
on:
  push:
    branches:
      - security/codeql-s10-finalization

permissions:
  contents: read
  security-events: read

jobs:
  read-main-alert-states:
    if: github.repository == 'yiwssx/new-www.rcat.ac.th'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current main Code Scanning state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/code-scanning/alerts?state=all&ref=refs%2Fheads%2Fmain&per_page=100")"
          printf '%s' "$response" | jq -c '.[] | select(.number >= 1 and .number <= 18) | {number, state, rule: .rule.id}'
          echo "BASELINE_IDS_COUNT=$(printf '%s' "$response" | jq '[.[] | select(.number >= 1 and .number <= 18)] | length')"
          echo "BASELINE_IDS_OPEN=$(printf '%s' "$response" | jq '[.[] | select(.number >= 1 and .number <= 18 and .state == "open")] | length')"
          echo "ALL_OPEN_SCAN_ALERTS=$(curl --fail-with-body --silent --show-error --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/code-scanning/alerts?state=open&ref=refs%2Fheads%2Fmain&per_page=100" | jq 'length')"
