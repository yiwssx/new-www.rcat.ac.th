name: Step 5 Restore Content Detail Tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  restore-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ssr-readiness-step5
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Restore staging tests and add shell hook mocks only
        shell: bash
        run: |
          git show 85b6b016e9ef6d0a32ccbc14a30874af91d85a85:src/test/publicContentDetailPage.test.tsx > src/test/publicContentDetailPage.test.tsx
          git show 85b6b016e9ef6d0a32ccbc14a30874af91d85a85:src/test/publicContentDetailRegression.test.tsx > src/test/publicContentDetailRegression.test.tsx
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/test/publicContentDetailPage.test.tsx": (
                  '''vi.mock("../public/hooks/usePublicCmsSnapshot", () => ({
            usePublicCmsSnapshot: () => ({
              data: currentSnapshot,
              ...currentSnapshotQueryState
            })
          }));
          ''',
                  '''vi.mock("../public/hooks/usePublicCmsSnapshot", () => ({
            usePublicCmsSnapshot: () => ({
              data: currentSnapshot,
              ...currentSnapshotQueryState
            })
          }));

          vi.mock("../public/hooks/usePublicShellSnapshot", () => ({
            usePublicShellSnapshot: () => ({
              data: currentSnapshot ? { siteSettings: {}, menu: [] } : undefined,
              ...currentSnapshotQueryState
            })
          }));
          ''',
              ),
              "src/test/publicContentDetailRegression.test.tsx": (
                  '''vi.mock("../public/hooks/usePublicCmsSnapshot", () => ({
            usePublicCmsSnapshot: () => ({
              data: currentSnapshot,
              isLoading: false,
              isFetching: false,
              isError: false,
              refetch: vi.fn()
            })
          }));
          ''',
                  '''vi.mock("../public/hooks/usePublicCmsSnapshot", () => ({
            usePublicCmsSnapshot: () => ({
              data: currentSnapshot,
              isLoading: false,
              isFetching: false,
              isError: false,
              refetch: vi.fn()
            })
          }));

          vi.mock("../public/hooks/usePublicShellSnapshot", () => ({
            usePublicShellSnapshot: () => ({
              data: { siteSettings: {}, menu: [] },
              isLoading: false,
              isFetching: false,
              isError: false,
              refetch: vi.fn()
            })
          }));
          ''',
              ),
          }

          for file_name, (before, after) in replacements.items():
              path = Path(file_name)
              source = path.read_text()
              if source.count(before) != 1:
                  raise SystemExit(f"expected one mock anchor in {file_name}, found {source.count(before)}")
              path.write_text(source.replace(before, after, 1))
          PY
      - run: pnpm exec prettier --write src/test/publicContentDetailPage.test.tsx src/test/publicContentDetailRegression.test.tsx
      - name: Focused content detail and Step 5 regression suite
        run: >-
          pnpm exec vitest run
          src/test/publicContentDetailPage.test.tsx
          src/test/publicContentDetailRegression.test.tsx
          src/test/publicSiteShellSsrReadiness.test.ts
      - name: Verify only shell hook mocks differ from staging
        shell: bash
        run: |
          page_stats="$(git diff --numstat 85b6b016e9ef6d0a32ccbc14a30874af91d85a85 -- src/test/publicContentDetailPage.test.tsx)"
          regression_stats="$(git diff --numstat 85b6b016e9ef6d0a32ccbc14a30874af91d85a85 -- src/test/publicContentDetailRegression.test.tsx)"
          test "$page_stats" = $'7\t0\tsrc/test/publicContentDetailPage.test.tsx'
          test "$regression_stats" = $'10\t0\tsrc/test/publicContentDetailRegression.test.tsx'
          git diff 85b6b016e9ef6d0a32ccbc14a30874af91d85a85 -- src/test/publicContentDetailPage.test.tsx | grep -q 'usePublicShellSnapshot'
          git diff 85b6b016e9ef6d0a32ccbc14a30874af91d85a85 -- src/test/publicContentDetailRegression.test.tsx | grep -q 'usePublicShellSnapshot'
      - name: Commit restored test fixtures and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/step5-restore-content-detail-tests.yml
          git add src/test/publicContentDetailPage.test.tsx src/test/publicContentDetailRegression.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ssr): align content detail shell hook mocks"
          git push origin HEAD:refactor/ssr-readiness-step5
