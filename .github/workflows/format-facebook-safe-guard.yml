name: Format Facebook Safe Guard

on:
  push:
    branches:
      - fix/facebook-safe-apply-guard
    paths:
      - .github/workflows/format-facebook-safe-guard.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write scripts/facebook/reclassify-facebook-imports.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-facebook-safe-guard
          path: scripts/facebook/reclassify-facebook-imports.mjs
          retention-days: 1
