name: Phase C3 One-Time Dispatch

# Round 13 dispatch after sanitized production-auth diagnostics landed.
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/phase-c3-one-time-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected Phase C3 field verification
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Phase C3 on master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/phase-c3-authenticated-cms-field.yml/dispatches" \
            -d '{"ref":"master"}'
