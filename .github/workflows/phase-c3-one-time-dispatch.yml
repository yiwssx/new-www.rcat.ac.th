name: Phase C3 One-Time Dispatch

# Round 16 forces a real Vercel frontend deployment, then starts with the protected Worker production release; that workflow dispatches C3 only after deploy succeeds.
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/phase-c3-one-time-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected Worker production release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Worker Production Release on master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/worker-production.yml/dispatches" \
            -d '{"ref":"master"}'
