name: D1 Recovery Drill

on:
  workflow_dispatch:
    inputs:
      acknowledge_read_only_production:
        description: "Confirm this production readiness drill is read-only and never restores"
        required: true
        type: boolean
      restore_timestamp:
        description: "Optional RFC3339/ISO-8601 past timestamp to resolve as a read-only recovery point"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  production-readiness:
    name: Production Time Travel Readiness
    if: ${{ inputs.acknowledge_read_only_production == true && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require protected Cloudflare D1 read credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID is unavailable from the protected production environment." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_D1_READ_TOKEN is unavailable from the protected production environment." >&2
            exit 1
          }
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID" || {
            echo "RCAT_PRODUCTION_D1_DATABASE_ID is unavailable from the protected production environment." >&2
            exit 1
          }

      - name: Guard destructive commands
        shell: bash
        run: |
          if grep -nE 'pnpm[[:space:]]+wrangler[[:space:]]+d1[[:space:]]+time-travel[[:space:]]+restore' .github/workflows/d1-recovery-drill.yml; then
            echo "Recovery drill workflow must never contain restore commands." >&2
            exit 1
          fi

      - name: Resolve exact production D1 identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs \
            --database-list "$RUNNER_TEMP/d1-databases.json" \
            --verify-identity-only

      - name: Inspect production D1 metadata
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          pnpm wrangler d1 info "$PRODUCTION_D1_RESOURCE_NAME" --json > "$RUNNER_TEMP/d1-production-info.json"
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/d1-production-info.json", "utf8"));
            const metadata = Array.isArray(value) ? value[0] : value;
            if (metadata?.name !== process.env.PRODUCTION_D1_RESOURCE_NAME) throw new Error("production D1 metadata did not resolve the expected physical resource");
            if (metadata?.version && metadata.version !== "production") throw new Error("production D1 is not on the Time Travel capable production storage backend");
            console.log("Production D1 metadata resolved for the promoted data-bearing resource.");
          '

      - name: Resolve production Time Travel bookmark
        id: time-travel
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RESTORE_TIMESTAMP: ${{ inputs.restore_timestamp }}
        run: |
          set -euo pipefail
          if [[ -n "$RESTORE_TIMESTAMP" ]]; then
            node -e '
              const value = process.env.RESTORE_TIMESTAMP;
              const parsed = Date.parse(value);
              if (!Number.isFinite(parsed)) throw new Error("restore_timestamp must be a valid RFC3339/ISO-8601 timestamp");
              if (parsed >= Date.now()) throw new Error("restore_timestamp must be in the past");
            '
            pnpm wrangler d1 time-travel info "$PRODUCTION_D1_RESOURCE_NAME" \
              --timestamp="$RESTORE_TIMESTAMP" \
              --json > "$RUNNER_TEMP/d1-production-time-travel.json"
            echo "target_mode=historical-timestamp" >> "$GITHUB_OUTPUT"
          else
            pnpm wrangler d1 time-travel info "$PRODUCTION_D1_RESOURCE_NAME" \
              --json > "$RUNNER_TEMP/d1-production-time-travel.json"
            echo "target_mode=current" >> "$GITHUB_OUTPUT"
          fi
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/d1-production-time-travel.json", "utf8"));
            const metadata = Array.isArray(value) ? value[0] : value;
            if (typeof metadata?.bookmark !== "string" || metadata.bookmark.length === 0) throw new Error("production Time Travel bookmark was not returned");
            console.log("Production Time Travel recovery point resolved. No restore was executed.");
          '

      - name: Drill summary
        shell: bash
        env:
          TARGET_MODE: ${{ steps.time-travel.outputs.target_mode }}
        run: |
          {
            echo "## D1 Recovery Drill"
            echo
            echo "- Canonical role: production"
            echo "- D1 physical resource label: legacy preview name retained; protected UUID is authoritative"
            echo "- Credential role: dedicated D1 read token from protected production Environment"
            echo "- Recovery point mode: $TARGET_MODE"
            echo "- Readiness proof: Wrangler Time Travel info returned a production bookmark"
            echo "- Mode: read-only metadata / Time Travel recovery-point resolution"
            echo "- Time Travel restore: not present in this workflow"
            echo "- Production D1 write: none"
          } >> "$GITHUB_STEP_SUMMARY"

  retire-environment-deployment:
    name: Retire drill environment deployment
    needs: production-readiness
    if: ${{ always() && inputs.acknowledge_read_only_production == true && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7

      - name: Delete this drill's GitHub Environment pseudo-deployment
        shell: bash
        run: |
          set -euo pipefail

          gh api "/repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/d1-drill-run.json"
          gh api "/repos/$GH_REPO/deployments?sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/d1-drill-deployments.json"

          deployment_id="$(node scripts/resolve-d1-drill-environment-deployment.mjs \
            --run "$RUNNER_TEMP/d1-drill-run.json" \
            --deployments "$RUNNER_TEMP/d1-drill-deployments.json" \
            --sha "$GITHUB_SHA" \
            --actor "$GITHUB_ACTOR")"

          gh api --method POST "/repos/$GH_REPO/deployments/$deployment_id/statuses" \
            -f state=inactive \
            -f environment=production \
            -f description='D1 recovery drill credential-gate deployment retired' >/dev/null

          gh api --method DELETE "/repos/$GH_REPO/deployments/$deployment_id"
          echo "Retired and deleted the current D1 drill GitHub Environment pseudo-deployment; workflow run remains as audit evidence."
