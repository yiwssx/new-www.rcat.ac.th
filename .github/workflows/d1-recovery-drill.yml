name: D1 Recovery Drill

on:
  workflow_dispatch:
    inputs:
      acknowledge_non_production:
        description: "Confirm this drill must remain read-only and preview-only"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  preview-readiness:
    name: Preview Time Travel Readiness
    if: ${{ inputs.acknowledge_non_production == true && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require protected Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID is unavailable from the protected production environment." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN is unavailable from the protected production environment." >&2
            exit 1
          }

      - name: Guard destructive commands
        shell: bash
        run: |
          if grep -nE 'pnpm[[:space:]]+wrangler[[:space:]]+d1[[:space:]]+time-travel[[:space:]]+restore' .github/workflows/d1-recovery-drill.yml; then
            echo "Recovery drill workflow must never contain restore commands." >&2
            exit 1
          fi

      - name: Resolve exact preview D1 name
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/d1-databases.json", "utf8"));
            if (!Array.isArray(value)) throw new Error("unexpected D1 list response shape");
            const matches = value.filter((database) => database?.name === "rcat-public-api-preview");
            if (matches.length !== 1) throw new Error(`expected exactly one rcat-public-api-preview database, found ${matches.length}`);
            if (matches[0]?.name === "rcat-public-api-production") throw new Error("production database resolved as preview target");
            console.log("Exact preview D1 name resolved in the protected Cloudflare account.");
          '

      - name: Inspect preview D1 metadata
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 info rcat-public-api-preview --json > "$RUNNER_TEMP/d1-preview-info.json"
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/d1-preview-info.json", "utf8"));
            const metadata = Array.isArray(value) ? value[0] : value;
            const text = JSON.stringify(value);
            if (text.includes("rcat-public-api-production")) throw new Error("production database appeared in preview drill output");
            if (metadata?.name !== "rcat-public-api-preview") throw new Error("preview D1 metadata did not resolve the expected database name");
            console.log("Preview D1 metadata resolved for the expected non-production database.");
          '

      - name: Resolve preview Time Travel bookmark
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 time-travel info rcat-public-api-preview --json > "$RUNNER_TEMP/d1-preview-time-travel.json"
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/d1-preview-time-travel.json", "utf8"));
            const text = JSON.stringify(value);
            if (text.includes("rcat-public-api-production")) throw new Error("production database appeared in preview drill output");
            if (typeof value?.bookmark !== "string" || value.bookmark.length === 0) throw new Error("preview Time Travel bookmark was not returned");
            console.log("Preview Time Travel bookmark resolved. No restore was executed.");
          '

      - name: Drill summary
        shell: bash
        run: |
          {
            echo "## D1 Recovery Drill"
            echo
            echo "- Target: rcat-public-api-preview"
            echo "- Resolution: exact account-scoped D1 name; committed preview database_id placeholder is not used"
            echo "- Credentials: protected production environment; production database ID is not provided"
            echo "- Readiness proof: Wrangler Time Travel info returned a current preview bookmark"
            echo "- Mode: read-only metadata / Time Travel bookmark resolution"
            echo "- Production restore: not present in this workflow"
            echo "- Production D1 write: none"
          } >> "$GITHUB_STEP_SUMMARY"
