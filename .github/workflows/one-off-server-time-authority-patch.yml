name: One-off Server Time Authority Patch

on:
  push:
    branches:
      - fix/server-authoritative-publish-time
    paths:
      - .github/workflows/one-off-server-time-authority-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/server-authoritative-publish-time
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply Worker publish-time authority patch
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path("cloudflare/public-api/src/routes/adminWrite.ts")
          source = worker.read_text()

          old_normalizer = '''function normalizeContentPublishAt(action: string, value: unknown, now: string) {
            const currentPublishAt = trimString(value);

            if (action === "publish") {
              return currentPublishAt || now;
            }

            return currentPublishAt;
          }
          '''
          new_normalizer = '''function isPublishAtAtOrBefore(value: string, now: string) {
            const valueMillis = Date.parse(value);
            const nowMillis = Date.parse(now);

            return Number.isFinite(valueMillis) && Number.isFinite(nowMillis) && valueMillis <= nowMillis;
          }

          export function resolveContentPublishAtForWrite(
            status: string,
            value: unknown,
            existingStatus: string | undefined,
            existingPublishAtValue: unknown,
            now: string
          ) {
            const requestedPublishAt = trimString(value);
            const existingPublishAt = trimString(existingPublishAtValue);

            if (status === "published") {
              if (existingStatus === "published" && existingPublishAt && isPublishAtAtOrBefore(existingPublishAt, now)) {
                return existingPublishAt;
              }

              if (existingStatus && existingStatus !== "published" && requestedPublishAt && isPublishAtAtOrBefore(requestedPublishAt, now)) {
                return requestedPublishAt;
              }

              return now;
            }

            if (status === "scheduled") {
              if (!requestedPublishAt) {
                throw new AdminHttpError("scheduled publishAt is required", 400, { field: "publishAt" });
              }

              const requestedMillis = Date.parse(requestedPublishAt);
              const nowMillis = Date.parse(now);

              if (!Number.isFinite(requestedMillis) || !Number.isFinite(nowMillis) || requestedMillis <= nowMillis) {
                throw new AdminHttpError("scheduled publishAt must be a valid future timestamp", 400, {
                  field: "publishAt"
                });
              }

              return requestedPublishAt;
            }

            const inactivePublishAt = requestedPublishAt || existingPublishAt;
            return inactivePublishAt && isPublishAtAtOrBefore(inactivePublishAt, now) ? inactivePublishAt : "";
          }

          export function normalizeContentPublishAtForAction(action: string, value: unknown, now: string) {
            const currentPublishAt = trimString(value);

            if (action === "publish") {
              return currentPublishAt && isPublishAtAtOrBefore(currentPublishAt, now) ? currentPublishAt : now;
            }

            return currentPublishAt && isPublishAtAtOrBefore(currentPublishAt, now) ? currentPublishAt : "";
          }
          '''
          if old_normalizer not in source:
            raise SystemExit("normalizeContentPublishAt source block did not match")
          source = source.replace(old_normalizer, new_normalizer, 1)

          old_create = '''  const type = assertAllowedValue(optionalString(body.type, existing?.type ?? ""), CONTENT_TYPES, "content type");
            const id = optionalString(body.id, existing?.id ?? makeId("content"));

            return {
          '''
          new_create = '''  const type = assertAllowedValue(optionalString(body.type, existing?.type ?? ""), CONTENT_TYPES, "content type");
            const id = optionalString(body.id, existing?.id ?? makeId("content"));
            const publishAt = resolveContentPublishAtForWrite(
              status,
              body.publishAt,
              existing?.status,
              existing?.publish_at,
              now
            );

            return {
          '''
          if old_create not in source:
            raise SystemExit("createContentRow prelude did not match")
          source = source.replace(old_create, new_create, 1)

          old_publish_at = '''    publish_at: optionalString(body.publishAt, existing?.publish_at ?? now),
          '''
          if old_publish_at not in source:
            raise SystemExit("createContentRow publish_at assignment did not match")
          source = source.replace(old_publish_at, '''    publish_at: publishAt,
          ''', 1)

          old_action_call = '''        normalizeContentPublishAt(action, existing.publish_at, now),
          '''
          if old_action_call not in source:
            raise SystemExit("publish action normalizer call did not match")
          source = source.replace(old_action_call, '''        normalizeContentPublishAtForAction(action, existing.publish_at, now),
          ''', 1)
          worker.write_text(source)
          PY

          cat > cloudflare/public-api/test/contentPublishTimeAuthority.test.ts <<'TEST'
          // @vitest-environment node
          import { describe, expect, it } from "vitest";
          import {
            normalizeContentPublishAtForAction,
            resolveContentPublishAtForWrite
          } from "../src/routes/adminWrite";

          const now = "2026-10-02T00:00:00.000Z";
          const past = "2026-09-30T08:45:00.000Z";
          const future = "2026-10-30T08:45:00.000Z";

          describe("Worker-authoritative content publish time", () => {
            it("ignores a future client clock for a direct published create", () => {
              expect(resolveContentPublishAtForWrite("published", future, undefined, undefined, now)).toBe(now);
            });

            it("clamps a future client timestamp when draft content becomes published", () => {
              expect(resolveContentPublishAtForWrite("published", future, "draft", past, now)).toBe(now);
            });

            it("preserves an explicit valid past timestamp when draft content becomes published", () => {
              expect(resolveContentPublishAtForWrite("published", past, "draft", past, now)).toBe(past);
            });

            it("preserves the historical server-approved timestamp during published edits", () => {
              expect(resolveContentPublishAtForWrite("published", future, "published", past, now)).toBe(past);
            });

            it("repairs a legacy published future timestamp to Worker time", () => {
              expect(resolveContentPublishAtForWrite("published", future, "published", future, now)).toBe(now);
            });

            it("allows future timestamps only for scheduled content", () => {
              expect(resolveContentPublishAtForWrite("scheduled", future, "draft", past, now)).toBe(future);
              expect(() => resolveContentPublishAtForWrite("scheduled", past, "draft", past, now)).toThrow(
                "scheduled publishAt must be a valid future timestamp"
              );
              expect(() => resolveContentPublishAtForWrite("scheduled", "", "draft", past, now)).toThrow(
                "scheduled publishAt is required"
              );
            });

            it("does not retain future client timestamps on inactive content", () => {
              expect(resolveContentPublishAtForWrite("draft", future, "draft", future, now)).toBe("");
              expect(resolveContentPublishAtForWrite("review", future, "review", future, now)).toBe("");
            });

            it("clamps legacy future timestamps on the dedicated publish action", () => {
              expect(normalizeContentPublishAtForAction("publish", future, now)).toBe(now);
              expect(normalizeContentPublishAtForAction("publish", past, now)).toBe(past);
              expect(normalizeContentPublishAtForAction("unpublish", future, now)).toBe("");
            });
          });
          TEST
      - name: Run Worker regression tests
        run: pnpm exec vitest run cloudflare/public-api/test/contentPublishTimeAuthority.test.ts cloudflare/public-api/test/adminWriteRoutes.test.ts
      - name: Commit tested patch and remove one-off workflow
        run: |
          rm .github/workflows/one-off-server-time-authority-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/public-api/src/routes/adminWrite.ts cloudflare/public-api/test/contentPublishTimeAuthority.test.ts .github/workflows/one-off-server-time-authority-patch.yml
          git commit -m "fix(content): make worker authoritative for publish time"
          git push origin HEAD:fix/server-authoritative-publish-time
