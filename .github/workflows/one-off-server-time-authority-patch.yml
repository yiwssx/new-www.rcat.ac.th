name: One-off Server Time Authority Patch

on:
  push:
    branches:
      - fix/server-authoritative-publish-time
    paths:
      - .github/workflows/one-off-server-time-authority-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/server-authoritative-publish-time
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply Worker publish-time authority patch
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path("cloudflare/public-api/src/routes/adminWrite.ts")
          source = worker.read_text()

          old_normalizer = '''function normalizeContentPublishAt(action: string, value: unknown, now: string) {
            const currentPublishAt = trimString(value);

            if (action === "publish") {
              return currentPublishAt || now;
            }

            return currentPublishAt;
          }
          '''
          new_normalizer = '''function isPublishAtAtOrBefore(value: string, now: string) {
            const valueMillis = Date.parse(value);
            const nowMillis = Date.parse(now);

            return Number.isFinite(valueMillis) && Number.isFinite(nowMillis) && valueMillis <= nowMillis;
          }

          function resolveContentPublishAt(status: string, value: unknown, existing: ContentRow | null, now: string) {
            const requestedPublishAt = trimString(value);
            const existingPublishAt = trimString(existing?.publish_at);

            if (status === "published") {
              if (
                existing?.status === "published" &&
                existingPublishAt &&
                isPublishAtAtOrBefore(existingPublishAt, now)
              ) {
                return existingPublishAt;
              }

              return now;
            }

            if (status === "scheduled") {
              if (!requestedPublishAt) {
                throw new AdminHttpError("scheduled publishAt is required", 400, { field: "publishAt" });
              }

              const requestedMillis = Date.parse(requestedPublishAt);
              const nowMillis = Date.parse(now);

              if (!Number.isFinite(requestedMillis) || !Number.isFinite(nowMillis) || requestedMillis <= nowMillis) {
                throw new AdminHttpError("scheduled publishAt must be a valid future timestamp", 400, {
                  field: "publishAt"
                });
              }

              return requestedPublishAt;
            }

            const inactivePublishAt = requestedPublishAt || existingPublishAt;
            return inactivePublishAt && isPublishAtAtOrBefore(inactivePublishAt, now) ? inactivePublishAt : "";
          }

          function normalizeContentPublishAt(action: string, value: unknown, now: string) {
            const currentPublishAt = trimString(value);

            if (action === "publish") {
              return currentPublishAt && isPublishAtAtOrBefore(currentPublishAt, now) ? currentPublishAt : now;
            }

            return currentPublishAt && isPublishAtAtOrBefore(currentPublishAt, now) ? currentPublishAt : "";
          }
          '''
          if old_normalizer not in source:
            raise SystemExit("normalizeContentPublishAt source block did not match")
          source = source.replace(old_normalizer, new_normalizer, 1)

          old_create = '''  const type = assertAllowedValue(optionalString(body.type, existing?.type ?? ""), CONTENT_TYPES, "content type");
            const id = optionalString(body.id, existing?.id ?? makeId("content"));

            return {
          '''
          new_create = '''  const type = assertAllowedValue(optionalString(body.type, existing?.type ?? ""), CONTENT_TYPES, "content type");
            const id = optionalString(body.id, existing?.id ?? makeId("content"));
            const publishAt = resolveContentPublishAt(status, body.publishAt, existing, now);

            return {
          '''
          if old_create not in source:
            raise SystemExit("createContentRow prelude did not match")
          source = source.replace(old_create, new_create, 1)

          old_publish_at = '''    publish_at: optionalString(body.publishAt, existing?.publish_at ?? now),
          '''
          if old_publish_at not in source:
            raise SystemExit("createContentRow publish_at assignment did not match")
          source = source.replace(old_publish_at, '''    publish_at: publishAt,
          ''', 1)
          worker.write_text(source)

          tests = Path("cloudflare/public-api/test/adminWriteRoutes.test.ts")
          test_source = tests.read_text()
          marker = '''  it("returns stale revision for content publish conflicts instead of a generic write failure", async () => {
          '''
          additions = r'''  it("uses Worker time for direct published creates instead of a future client clock", async () => {
            const { db, tables } = createAdminWriteMockDb();
            const env = makeEnv(db);
            const clientFuture = "2099-10-30T15:45:00+07:00";

            const response = await worker.fetch(
              makeJsonRequest("/api/admin/content", {
                ...contentInput,
                status: "published",
                publishAt: clientFuture
              }),
              env
            );

            expect(response.status).toBe(201);
            expect(tables.contents[0]).toMatchObject({ status: "published" });
            expect(tables.contents[0]?.publish_at).toBe(tables.contents[0]?.updated_at);
            expect(tables.contents[0]?.publish_at).not.toBe(clientFuture);
          });

          it("uses Worker time when a normal PATCH publishes a draft with a future client timestamp", async () => {
            const { db, tables } = createAdminWriteMockDb();
            const env = makeEnv(db);
            const clientFuture = "2099-10-30T15:45:00+07:00";

            expect((await worker.fetch(makeJsonRequest("/api/admin/content", contentInput), env)).status).toBe(201);
            const response = await worker.fetch(
              makeJsonRequest(
                "/api/admin/content/m18-preview-content-001",
                {
                  ...contentInput,
                  status: "published",
                  publishAt: clientFuture,
                  expectedRevision: 0
                },
                { method: "PATCH" }
              ),
              env
            );

            expect(response.status).toBe(200);
            expect(tables.contents[0]).toMatchObject({ status: "published", revision: 1 });
            expect(tables.contents[0]?.publish_at).toBe(tables.contents[0]?.updated_at);
            expect(tables.contents[0]?.publish_at).not.toBe(clientFuture);
          });

          it("preserves the historical server-approved publish time when editing published content", async () => {
            const { db, tables } = createAdminWriteMockDb();
            const env = makeEnv(db);

            expect(
              (
                await worker.fetch(
                  makeJsonRequest("/api/admin/content", { ...contentInput, status: "published", publishAt: "2099-01-01T00:00:00.000Z" }),
                  env
                )
              ).status
            ).toBe(201);
            const originalPublishAt = String(tables.contents[0]?.publish_at ?? "");

            const response = await worker.fetch(
              makeJsonRequest(
                "/api/admin/content/m18-preview-content-001",
                {
                  ...contentInput,
                  status: "published",
                  title: "Published item edited later",
                  publishAt: "2099-12-31T23:59:00.000Z",
                  expectedRevision: 0
                },
                { method: "PATCH" }
              ),
              env
            );

            expect(response.status).toBe(200);
            expect(tables.contents[0]?.publish_at).toBe(originalPublishAt);
            expect(tables.contents[0]?.publish_at).not.toBe("2099-12-31T23:59:00.000Z");
          });

          it("allows future publish timestamps only for scheduled content", async () => {
            const { db, tables } = createAdminWriteMockDb();
            const env = makeEnv(db);
            const scheduledAt = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();

            const scheduledResponse = await worker.fetch(
              makeJsonRequest("/api/admin/content", {
                ...contentInput,
                id: "scheduled-content",
                slug: "scheduled-content",
                status: "scheduled",
                publishAt: scheduledAt
              }),
              env
            );
            const draftResponse = await worker.fetch(
              makeJsonRequest("/api/admin/content", {
                ...contentInput,
                id: "future-draft",
                slug: "future-draft",
                status: "draft",
                publishAt: scheduledAt
              }),
              env
            );
            const invalidScheduleResponse = await worker.fetch(
              makeJsonRequest("/api/admin/content", {
                ...contentInput,
                id: "past-schedule",
                slug: "past-schedule",
                status: "scheduled",
                publishAt: "2020-01-01T00:00:00.000Z"
              }),
              env
            );

            expect(scheduledResponse.status).toBe(201);
            expect(tables.contents.find((row) => row.id === "scheduled-content")?.publish_at).toBe(scheduledAt);
            expect(draftResponse.status).toBe(201);
            expect(tables.contents.find((row) => row.id === "future-draft")?.publish_at).toBe("");
            expect(invalidScheduleResponse.status).toBe(400);
            await expect(readJson(invalidScheduleResponse)).resolves.toMatchObject({
              error: "scheduled publishAt must be a valid future timestamp",
              field: "publishAt"
            });
          });

          it("clamps a legacy future publish timestamp when the dedicated publish route is used", async () => {
            const { db, tables } = createAdminWriteMockDb();
            const env = makeEnv(db);

            expect((await worker.fetch(makeJsonRequest("/api/admin/content", contentInput), env)).status).toBe(201);
            tables.contents[0].publish_at = "2099-10-30T15:45:00+07:00";

            const response = await worker.fetch(
              makeJsonRequest("/api/admin/content/m18-preview-content-001/publish", {}),
              env
            );

            expect(response.status).toBe(200);
            expect(tables.contents[0]).toMatchObject({ status: "published", revision: 1 });
            expect(tables.contents[0]?.publish_at).toBe(tables.contents[0]?.updated_at);
            expect(tables.contents[0]?.publish_at).not.toBe("2099-10-30T15:45:00+07:00");
          });

          '''
          if marker not in test_source:
            raise SystemExit("test insertion marker did not match")
          test_source = test_source.replace(marker, additions + marker, 1)
          tests.write_text(test_source)
          PY
      - name: Run focused Worker regression tests
        run: pnpm exec vitest run cloudflare/public-api/test/adminWriteRoutes.test.ts
      - name: Commit tested patch and remove one-off workflow
        run: |
          rm .github/workflows/one-off-server-time-authority-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/public-api/src/routes/adminWrite.ts cloudflare/public-api/test/adminWriteRoutes.test.ts .github/workflows/one-off-server-time-authority-patch.yml
          git commit -m "fix(content): make worker authoritative for publish time"
          git push origin HEAD:fix/server-authoritative-publish-time
