name: Prepare Main Branch Migration

on:
  push:
    branches:
      - migration/default-main
    paths:
      - ".github/workflows/default-main-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: migration/default-main
          fetch-depth: 0

      - name: Prepare dual master/main branch contracts
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          workflow_dir = Path('.github/workflows')
          self_path = workflow_dir / 'default-main-migration.yml'

          for path in workflow_dir.glob('*.yml'):
              if path == self_path:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # Keep master working during the transition while enabling main.
              lines = text.splitlines(keepends=True)
              out = []
              for index, line in enumerate(lines):
                  out.append(line)
                  match = re.match(r'^(\s*)- master(\r?\n)$', line)
                  if match:
                      next_line = lines[index + 1] if index + 1 < len(lines) else ''
                      if not re.match(r'^\s*- main\r?\n$', next_line):
                          out.append(f"{match.group(1)}- main{match.group(2)}")
              text = ''.join(out)

              replacements = {
                  "github.ref == 'refs/heads/master'": "(github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')",
                  'github.ref == "refs/heads/master"': '(github.ref == "refs/heads/master" || github.ref == "refs/heads/main")',
                  "github.ref_name == 'master'": "(github.ref_name == 'master' || github.ref_name == 'main')",
                  'github.ref_name == "master"': '(github.ref_name == "master" || github.ref_name == "main")',
                  "github.event.workflow_run.head_branch == 'master'": "(github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main')",
                  'github.event.workflow_run.head_branch == "master"': '(github.event.workflow_run.head_branch == "master" || github.event.workflow_run.head_branch == "main")',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(text, encoding='utf-8')

          vercel_path = Path('vercel.json')
          vercel = json.loads(vercel_path.read_text(encoding='utf-8'))
          deployment = vercel.setdefault('git', {}).setdefault('deploymentEnabled', {})
          deployment['master'] = True
          deployment['main'] = True
          # Preserve the existing deny-by-default policy.
          deployment['**'] = False
          vercel_path.write_text(json.dumps(vercel, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          resolver_path = Path('scripts/resolve-d1-drill-environment-deployment.mjs')
          resolver = resolver_path.read_text(encoding='utf-8')
          resolver = resolver.replace(
              'deployment?.ref === "master" &&',
              '["master", "main"].includes(deployment?.ref) &&'
          )
          resolver_path.write_text(resolver, encoding='utf-8')

          # Add explicit regression coverage for the new branch without removing the old compatibility assertion.
          resolver_test = Path('scripts/resolve-d1-drill-environment-deployment.test.mjs')
          if resolver_test.exists():
              test_text = resolver_test.read_text(encoding='utf-8')
              if 'accepts the main branch during default-branch migration' not in test_text:
                  insert = '''\n\n  it("accepts the main branch during default-branch migration", () => {\n    const deployments = [\n      {\n        id: 1002,\n        environment: "production",\n        ref: "main",\n        sha: "abc123",\n        creator: { login: "operator" },\n        performed_via_github_app: { slug: "github-actions" },\n        production_environment: false,\n        created_at: "2026-01-01T00:00:10Z"\n      }\n    ];\n    expect(resolve(deployments)).toBe("1002");\n  });\n'''
                  marker = '\n});\n'
                  pos = test_text.rfind(marker)
                  if pos != -1:
                      test_text = test_text[:pos] + insert + test_text[pos:]
                      resolver_test.write_text(test_text, encoding='utf-8')

          # The migration helper must not remain in the final branch tree.
          self_path.unlink()

      - name: Show remaining operational master references
        run: |
          echo "Operational references retained for dual-branch compatibility:"
          git grep -n "master" -- .github/workflows vercel.json scripts/resolve-d1-drill-environment-deployment.mjs || true

      - name: Commit prepared migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows vercel.json scripts/resolve-d1-drill-environment-deployment.mjs scripts/resolve-d1-drill-environment-deployment.test.mjs
          git commit -m "chore(repo): prepare main default branch migration"
          git push origin HEAD:migration/default-main
