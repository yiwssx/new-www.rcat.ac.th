name: Deployment Taxonomy Bootstrap v2

on:
  push:
    branches:
      - chore/deployment-history-taxonomy
    paths:
      - ".github/workflows/deployment-taxonomy-bootstrap-v2.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/deployment-history-taxonomy
          fetch-depth: 0
      - name: Apply deployment taxonomy migration
        run: python .github/scripts/deployment-taxonomy-bootstrap.py
      - name: Commit transformed branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(deployments): separate production history from credential gates"
          git push origin HEAD:chore/deployment-history-taxonomy
