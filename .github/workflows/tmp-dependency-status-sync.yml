name: Temporary Dependency Status Sync

on:
  push:
    branches:
      - chore/sync-dependency-status-react-refresh-057

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/sync-dependency-status-react-refresh-057
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts

      - name: Generate dependency status
        run: pnpm deps:status

      - name: Commit generated dependency status
        shell: bash
        run: |
          if git diff --quiet -- docs/maintenance/dependency-current-status.md; then
            echo "Dependency status already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          git commit -m "docs(deps): refresh generated dependency status"
          git push origin HEAD:chore/sync-dependency-status-react-refresh-057
