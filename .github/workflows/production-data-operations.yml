name: Production Data Operations

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/production-data-operations.yml"
      - "scripts/facebook/facebook-content-classifier.mjs"
      - "scripts/facebook/refetch-imported-facebook-posts.mjs"
      - "scripts/facebook/reclassify-facebook-imports.mjs"
      - "scripts/facebook/transform-posts-to-d1-sql.mjs"
  workflow_dispatch:
    inputs:
      operation:
        description: "Production data operation"
        required: true
        type: choice
        default: cms-link-audit
        options:
          - cms-link-audit
          - authenticated-cms-field
          - fixture-audit
          - fixture-cleanup
          - facebook-audit
          - facebook-apply
      cleanup_confirmation:
        description: "Fixture cleanup only: enter DELETE_CONFIRMED_LOCAL_FIXTURES_ONLY"
        required: false
        type: string
      facebook_apply_confirmation:
        description: "Facebook apply only: enter RECLASSIFY_FACEBOOK_IMPORTS"
        required: false
        type: string

permissions:
  contents: read
  statuses: read

concurrency:
  group: production-data-operations-${{ github.event_name == 'push' && 'facebook-audit' || inputs.operation }}
  cancel-in-progress: false

jobs:
  cms-link-audit:
    name: Production CMS Link Integrity
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.operation == 'cms-link-audit' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Require protected D1 read credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID"
      - name: Resolve exact production D1 identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs --database-list "$RUNNER_TEMP/d1-databases.json" --verify-identity-only
      - name: Read link-bearing CMS fields
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/cms-link-audit"
          mkdir -p "$audit_dir"
          query() { local output="$1"; local sql="$2"; pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command="$sql" --json > "$audit_dir/$output"; }
          query contents.json "SELECT id, canonical_url, body_doc_url FROM contents WHERE COALESCE(deleted_at, '') = '';"
          query documents.json "SELECT id, file_url FROM documents WHERE COALESCE(deleted_at, '') = '';"
          query home-sections.json "SELECT id, href FROM public_home_sections WHERE COALESCE(deleted_at, '') = '';"
          query menu.json "SELECT id, href FROM menu_items;"
          query carousel.json "SELECT id, image_url, mobile_image_url, href FROM carousel_slides;"
          query external-services.json "SELECT id, href FROM external_services;"
          query media.json "SELECT id, drive_url, preview_url, embed_url, thumbnail_url FROM media_assets;"
          query site-settings.json "SELECT id, settings_json FROM site_settings;"
          query homepage-settings.json "SELECT id, settings_json FROM homepage_settings;"
      - name: Validate CMS link policy
        run: node scripts/audit-production-cms-links.mjs "$RUNNER_TEMP/cms-link-audit"

  authenticated-cms-field:
    name: Authenticated Disposable CMS Field
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.operation == 'authenticated-cms-field' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      deployment: false
    env:
      TARGET_URL: https://www.rcat.ac.th
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview
    steps:
      - uses: actions/checkout@v7
      - name: Wait for matching Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            payload="$(curl --fail-with-body --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            status_json="$(printf '%s' "$payload" | node -e '
              let input = ""; process.stdin.setEncoding("utf8"); process.stdin.on("data", (chunk) => (input += chunk)); process.stdin.on("end", () => { const payload = JSON.parse(input); const vercel = payload.statuses.find((status) => status.context === "Vercel"); process.stdout.write(JSON.stringify({state: vercel?.state || "missing", description: vercel?.description || "", targetUrl: vercel?.target_url || ""})); });
            ')"
            state="$(printf '%s' "$status_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).state')"
            description="$(printf '%s' "$status_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).description')"
            target_url="$(printf '%s' "$status_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).targetUrl')"
            case "$state" in
              success)
                if [[ "$description" == *"Canceled by Ignored Build Step"* || "$description" == *"Ignored Build Step"* ]]; then echo "Vercel did not create a production deployment for $GITHUB_SHA: $description" >&2; exit 1; fi
                test -n "$target_url" || { echo "Vercel status is missing a deployment target URL." >&2; exit 1; }
                exit 0 ;;
              failure|error) echo "Vercel deployment failed: $state ($description)" >&2; exit 1 ;;
              pending|missing) sleep 10 ;;
              *) echo "Unexpected Vercel commit status: $state ($description)" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for Vercel deployment status for $GITHUB_SHA." >&2
          exit 1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Require protected Cloudflare production credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID" || exit 1
      - name: Resolve exact production D1 identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs --database-list "$RUNNER_TEMP/d1-databases.json" --verify-identity-only
      - name: Prepare isolated QA fixture
        run: node scripts/phase-c3-disposable-fixture.mjs prepare
      - name: Require clean disposable namespace
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command "$(cat "$RUNNER_TEMP/phase-c3-verify.sql")" --json > "$RUNNER_TEMP/phase-c3-preflight.json"
          node scripts/phase-c3-disposable-fixture.mjs assert-clean "$RUNNER_TEMP/phase-c3-preflight.json"
      - name: Provision disposable editor identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command "$(cat "$RUNNER_TEMP/phase-c3-provision.sql")" --json > "$RUNNER_TEMP/phase-c3-provision-result.json"
      - name: Verify disposable editor identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command "$(cat "$RUNNER_TEMP/phase-c3-verify.sql")" --json > "$RUNNER_TEMP/phase-c3-provision-verify.json"
          node scripts/phase-c3-disposable-fixture.mjs assert-provisioned "$RUNNER_TEMP/phase-c3-provision-verify.json"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run authenticated disposable CMS field test
        env:
          PHASE_C3_PRODUCTION_BASE_URL: ${{ env.TARGET_URL }}
        run: pnpm exec playwright test --config playwright.phase-c3.config.ts
      - name: Capture sanitized authentication failure state
        if: ${{ failure() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ ! -f "$RUNNER_TEMP/phase-c3-diagnose.sql" ]]; then exit 0; fi
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command "$(cat "$RUNNER_TEMP/phase-c3-diagnose.sql")" --json > "$RUNNER_TEMP/phase-c3-auth-diagnostic.json"
          node scripts/phase-c3-disposable-fixture.mjs diagnose "$RUNNER_TEMP/phase-c3-auth-diagnostic.json"
      - name: Deterministic infrastructure cleanup
        if: ${{ always() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ ! -f "$RUNNER_TEMP/phase-c3-cleanup.sql" ]]; then exit 0; fi
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command "$(cat "$RUNNER_TEMP/phase-c3-cleanup.sql")" --json > "$RUNNER_TEMP/phase-c3-cleanup-result.json"
      - name: Verify deterministic cleanup
        if: ${{ always() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -f "$RUNNER_TEMP/phase-c3-verify.sql" || exit 1
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command "$(cat "$RUNNER_TEMP/phase-c3-verify.sql")" --json > "$RUNNER_TEMP/phase-c3-cleanup-verify.json"
          node scripts/phase-c3-disposable-fixture.mjs assert-clean "$RUNNER_TEMP/phase-c3-cleanup-verify.json"
      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-cms-field-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/phase-c3
          if-no-files-found: ignore
          retention-days: 7

  fixture-integrity:
    name: Production Fixture Integrity
    if: >-
      github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'fixture-audit' || inputs.operation == 'fixture-cleanup')
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Require protected Cloudflare production credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.operation == 'fixture-cleanup' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID" || exit 1
      - name: Resolve exact production D1 identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.operation == 'fixture-cleanup' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs --database-list "$RUNNER_TEMP/d1-databases.json" --verify-identity-only
      - name: Capture pre-change Time Travel bookmark
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.operation == 'fixture-cleanup' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: pnpm wrangler d1 time-travel info "$PRODUCTION_D1_RESOURCE_NAME" --json > "$RUNNER_TEMP/d1-production-time-travel.json"
      - name: Inspect production fixture schema
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.operation == 'fixture-cleanup' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          schema_json="$RUNNER_TEMP/production-fixture-schema.json"
          schema_stderr="$RUNNER_TEMP/production-fixture-schema.stderr"
          schema_sql="SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('documents','contents','visitor_daily_stats','public_home_sections') ORDER BY name;"
          set +e
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command="$schema_sql" --json > "$schema_json" 2> "$schema_stderr"
          schema_status=$?
          set -e
          if [[ "$schema_status" -ne 0 ]]; then
            echo "::error::Production fixture schema inspection failed (wrangler exit $schema_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$schema_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$schema_json" --label "wrangler stdout" || true
            exit "$schema_status"
          fi
          node -e '
            const fs = require("fs"); const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/production-fixture-schema.json", "utf8")); const statements = Array.isArray(value) ? value : [value]; const names = new Set(statements.flatMap((statement) => Array.isArray(statement?.results) ? statement.results.map((row) => row?.name).filter(Boolean) : [])); const required = ["documents", "contents", "visitor_daily_stats"]; const missing = required.filter((name) => !names.has(name)); if (missing.length > 0) throw new Error(`required table(s) missing: ${missing.join(", ")}`); const homePresent = names.has("public_home_sections"); fs.appendFileSync(process.env.GITHUB_ENV, `PUBLIC_HOME_SECTIONS_PRESENT=${homePresent ? "true" : "false"}\n`);
          '
      - name: Audit exact local/dev fixtures
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.operation == 'fixture-cleanup' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          audit_json="$RUNNER_TEMP/production-fixture-audit.json"
          audit_stderr="$RUNNER_TEMP/production-fixture-audit.stderr"
          audit_sql="$(cat cloudflare/public-api/sql/production-fixture-audit.sql)"
          set +e
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --command="$audit_sql" \
            --json > "$audit_json" 2> "$audit_stderr"
          audit_status=$?
          set -e

          if [[ "$audit_status" -ne 0 ]]; then
            echo "::error::Production fixture audit query failed before payload validation (wrangler exit $audit_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_json" --label "wrangler stdout" || true
            exit "$audit_status"
          fi

          node scripts/check-production-fixture-audit.mjs --file "$audit_json"
      - name: Audit optional public_home_sections fixture
        if: ${{ env.PUBLIC_HOME_SECTIONS_PRESENT == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.operation == 'fixture-cleanup' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          audit_json="$RUNNER_TEMP/production-home-section-fixture-audit.json"
          audit_stderr="$RUNNER_TEMP/production-home-section-fixture-audit.stderr"
          audit_sql="$(cat cloudflare/public-api/sql/production-home-section-fixture-audit.sql)"
          set +e
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --command="$audit_sql" \
            --json > "$audit_json" 2> "$audit_stderr"
          audit_status=$?
          set -e

          if [[ "$audit_status" -ne 0 ]]; then
            echo "::error::Optional public_home_sections fixture audit failed (wrangler exit $audit_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_json" --label "wrangler stdout" || true
            exit "$audit_status"
          fi

          node scripts/check-production-fixture-audit.mjs --file "$audit_json"
      - name: Require exact cleanup confirmation
        if: ${{ inputs.operation == 'fixture-cleanup' }}
        env:
          CLEANUP_CONFIRMATION: ${{ inputs.cleanup_confirmation }}
        run: |
          test "$CLEANUP_CONFIRMATION" = "DELETE_CONFIRMED_LOCAL_FIXTURES_ONLY" || { echo "Cleanup confirmation does not match the required exact phrase." >&2; exit 1; }
      - name: Delete only confirmed exact fixture rows
        if: ${{ inputs.operation == 'fixture-cleanup' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --file cloudflare/public-api/sql/production-fixture-cleanup.sql
      - name: Delete optional public_home_sections fixture row
        if: ${{ inputs.operation == 'fixture-cleanup' && env.PUBLIC_HOME_SECTIONS_PRESENT == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --file cloudflare/public-api/sql/production-home-section-fixture-cleanup.sql
      - name: Verify production fixture sentinel is clean
        if: ${{ inputs.operation == 'fixture-cleanup' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          audit_json="$RUNNER_TEMP/production-fixture-post-audit.json"
          audit_stderr="$RUNNER_TEMP/production-fixture-post-audit.stderr"
          audit_sql="$(cat cloudflare/public-api/sql/production-fixture-audit.sql)"
          set +e
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --command="$audit_sql" \
            --json > "$audit_json" 2> "$audit_stderr"
          audit_status=$?
          set -e

          if [[ "$audit_status" -ne 0 ]]; then
            echo "::error::Post-cleanup production fixture audit query failed before payload validation (wrangler exit $audit_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_json" --label "wrangler stdout" || true
            exit "$audit_status"
          fi

          node scripts/check-production-fixture-audit.mjs --file "$audit_json" --expect-clean

      - name: Verify optional public_home_sections sentinel is clean
        if: ${{ inputs.operation == 'fixture-cleanup' && env.PUBLIC_HOME_SECTIONS_PRESENT == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          audit_json="$RUNNER_TEMP/production-home-section-fixture-post-audit.json"
          audit_stderr="$RUNNER_TEMP/production-home-section-fixture-post-audit.stderr"
          audit_sql="$(cat cloudflare/public-api/sql/production-home-section-fixture-audit.sql)"
          set +e
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --command="$audit_sql" \
            --json > "$audit_json" 2> "$audit_stderr"
          audit_status=$?
          set -e

          if [[ "$audit_status" -ne 0 ]]; then
            echo "::error::Post-cleanup public_home_sections fixture audit failed (wrangler exit $audit_status)."
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_stderr" --label "wrangler stderr" || true
            node scripts/sanitize-cloudflare-cli-output.mjs --file "$audit_json" --label "wrangler stdout" || true
            exit "$audit_status"
          fi

          node scripts/check-production-fixture-audit.mjs --file "$audit_json" --expect-clean

  facebook-reclassification:
    name: Facebook Metadata Reclassification
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'facebook-audit' || inputs.operation == 'facebook-apply')))
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview
      RECLASSIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'facebook-apply' && 'apply' || 'audit' }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Require protected production credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'facebook-apply' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID" || exit 1
          test -n "$META_PAGE_ACCESS_TOKEN" || exit 1
          if [[ "$RECLASSIFICATION_MODE" == "apply" && "${{ inputs.facebook_apply_confirmation }}" != "RECLASSIFY_FACEBOOK_IMPORTS" ]]; then echo "Apply confirmation mismatch." >&2; exit 1; fi
      - name: Resolve exact production D1 identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'facebook-apply' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs --database-list "$RUNNER_TEMP/d1-databases.json" --verify-identity-only
      - run: node scripts/facebook/facebook-content-classifier.mjs --self-test
      - name: Read only facebook-import production rows
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'facebook-apply' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/facebook-reclassification/result"
          query="SELECT id, slug, title, summary, category, tags_json, canonical_url, template, owner, created_by, updated_by, revision, publish_at FROM contents WHERE type = 'news' AND COALESCE(deleted_at, '') = '' AND template = 'facebook-embed' AND (id LIKE 'facebook-post-%' OR slug LIKE 'facebook-%') AND (owner = 'facebook-import' OR created_by = 'facebook-import') ORDER BY publish_at ASC;"
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command="$query" --json > "$RUNNER_TEMP/facebook-reclassification/d1-before.json"
      - name: Count scoped facebook-import rows
        run: |
          node --input-type=module - <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          import { flattenWranglerRows, isFacebookImportRow } from "./scripts/facebook/reclassify-facebook-imports.mjs";
          const payload = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/facebook-reclassification/d1-before.json", "utf8"));
          const rows = flattenWranglerRows(payload).filter(isFacebookImportRow);
          if (rows.length === 0) throw new Error("No facebook-import production rows were found.");
          await appendFile(process.env.GITHUB_ENV, `FACEBOOK_IMPORT_COUNT=${rows.length}\n`);
          NODE
      - name: Refetch exact original source for every facebook-import row
        run: node scripts/facebook/refetch-imported-facebook-posts.mjs --d1-json "$RUNNER_TEMP/facebook-reclassification/d1-before.json" --output "$RUNNER_TEMP/facebook-reclassification/facebook-source.json" --concurrency 5 --max-attempts 3
      - name: Build metadata audit and guarded repair SQL
        run: node scripts/facebook/reclassify-facebook-imports.mjs --d1-json "$RUNNER_TEMP/facebook-reclassification/d1-before.json" --facebook-json "$RUNNER_TEMP/facebook-reclassification/facebook-source.json" --output-dir "$RUNNER_TEMP/facebook-reclassification/result" --batch-size 100
      - name: Require safe apply readiness
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const root = process.env.RUNNER_TEMP + "/facebook-reclassification/result";
          const [summary, manifest] = await Promise.all([readFile(root + "/summary.json", "utf8").then(JSON.parse), readFile(root + "/repair-manifest.json", "utf8").then(JSON.parse)]);
          const expectedCount = Number(process.env.FACEBOOK_IMPORT_COUNT);
          if (summary.totalFacebookImports !== expectedCount) throw new Error("Audit row count changed unexpectedly");
          if (summary.facebookExport.chunkErrors !== 0) throw new Error("Unexpected source export errors");
          console.log(`Apply readiness: ${manifest.totalRepairRows} guarded repairs.`);
          NODE
      - name: Capture pre-repair D1 Time Travel bookmark
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm wrangler d1 time-travel info "$PRODUCTION_D1_RESOURCE_NAME" --json > "$RUNNER_TEMP/facebook-reclassification/result/pre-repair-time-travel.json"
      - name: Apply guarded repair batches to production D1
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/facebook-reclassification/result/repair-part-*.sql)
          if [[ "${#files[@]}" -eq 0 ]]; then exit 0; fi
          for file in "${files[@]}"; do pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --file "$file"; done
      - name: Read repaired facebook-import metadata for verification
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          query="SELECT id, category, tags_json, revision FROM contents WHERE type = 'news' AND COALESCE(deleted_at, '') = '' AND template = 'facebook-embed' AND (id LIKE 'facebook-post-%' OR slug LIKE 'facebook-%') AND (owner = 'facebook-import' OR created_by = 'facebook-import') ORDER BY publish_at ASC;"
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --command="$query" --json > "$RUNNER_TEMP/facebook-reclassification/d1-after.json"
      - name: Verify every planned metadata repair
        if: ${{ env.RECLASSIFICATION_MODE == 'apply' }}
        run: node scripts/facebook/reclassify-facebook-imports.mjs --d1-json "$RUNNER_TEMP/facebook-reclassification/d1-after.json" --verify-report "$RUNNER_TEMP/facebook-reclassification/result/report.json" --output-dir "$RUNNER_TEMP/facebook-reclassification/result"
      - name: Upload audit and repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: facebook-metadata-reclassification-${{ github.run_id }}
          path: ${{ runner.temp }}/facebook-reclassification/result/
          if-no-files-found: warn
          retention-days: 30
