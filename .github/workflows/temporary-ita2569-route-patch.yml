name: Temporary ITA 2569 Route Integration

on:
  push:
    branches:
      - agent/ita2569-custom-page

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply ITA route patch
        run: python scripts/temporary-ita2569-route-patch.py
      - name: Format changed files
        run: pnpm exec prettier --write src/public/pages/PublicIta2569Page.tsx src/public/pages/PublicIta2569Page.test.tsx src/routeComponents.tsx src/routes.tsx api/sitemap.mjs src/test/sitemap.test.mjs
      - name: Focused lint
        run: pnpm exec eslint src/public/pages/PublicIta2569Page.tsx src/public/pages/PublicIta2569Page.test.tsx src/routeComponents.tsx src/routes.tsx api/sitemap.mjs --max-warnings=0
      - name: Focused tests
        run: pnpm exec vitest run src/public/pages/PublicIta2569Page.test.tsx src/test/sitemap.test.mjs
      - name: Media governance
        run: pnpm media:check
      - name: Production build
        run: pnpm build
      - name: Commit feature files
        run: |
          git config user.name "Supharoek Sudadet"
          git config user.email "48784420+yiwssx@users.noreply.github.com"
          git add src/public/pages/PublicIta2569Page.tsx src/public/pages/PublicIta2569Page.test.tsx src/routeComponents.tsx src/routes.tsx api/sitemap.mjs src/test/sitemap.test.mjs
          if git diff --cached --quiet; then
            echo "No feature changes to commit"
            exit 0
          fi
          git commit -m "feat(ita): register ITA 2569 public route"
          git push origin HEAD:agent/ita2569-custom-page
