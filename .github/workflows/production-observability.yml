name: Production Observability

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/production-observability.yml"
      - "scripts/check-production-d1-usage.mjs"
      - "scripts/resolve-d1-drill-environment-deployment.mjs"
  schedule:
    # Every six hours at minute 17. D1 Free daily limits reset at 00:00 UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-observability
  cancel-in-progress: true

jobs:
  d1-usage:
    name: D1 Usage Guard
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      D1_USAGE_LOOKBACK_DAYS: "14"
      D1_DAILY_ROWS_READ_LIMIT: ${{ vars.D1_DAILY_ROWS_READ_LIMIT || '5000000' }}
      D1_DAILY_ROWS_WRITTEN_LIMIT: ${{ vars.D1_DAILY_ROWS_WRITTEN_LIMIT || '100000' }}
      D1_USAGE_INFO_RATIO: ${{ vars.D1_USAGE_INFO_RATIO || '0.50' }}
      D1_USAGE_WARNING_RATIO: ${{ vars.D1_USAGE_WARNING_RATIO || '0.70' }}
      D1_USAGE_CRITICAL_RATIO: ${{ vars.D1_USAGE_CRITICAL_RATIO || '0.85' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Require read-only analytics credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID is unavailable from the protected production environment." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_ANALYTICS_READ_TOKEN" || {
            echo "CLOUDFLARE_ANALYTICS_READ_TOKEN is unavailable from the protected production environment." >&2
            echo "Create a dedicated Cloudflare token with Account > Account Analytics > Read only." >&2
            exit 1
          }

      - name: Query Cloudflare D1 billing metrics
        id: usage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}
          D1_USAGE_REPORT_PATH: ${{ runner.temp }}/production-observability-report.json
        run: node scripts/check-production-d1-usage.mjs

      - name: Fail on warning or critical daily usage
        if: ${{ steps.usage.outputs.severity == 'warning' || steps.usage.outputs.severity == 'critical' }}
        shell: bash
        run: |
          echo "D1 usage reached the ${{ steps.usage.outputs.severity }} threshold for the current UTC billing day." >&2
          exit 1
