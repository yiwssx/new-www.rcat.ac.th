name: Temporary Run Media Progress Tests V2

on:
  push:
    branches:
      - agent/media-upload-progress-lock
    paths:
      - .github/workflows/temporary-run-media-progress-tests-v2.yml

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-upload-progress-lock
      - name: Apply test patch
        run: python scripts/temporary-media-progress-tests.py
      - name: Run focused regression suite
        run: |
          corepack enable
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm exec prettier --write src/features/cms-media/mediaBridgeClient.test.ts src/admin/pages/MediaPage.test.tsx src/admin/components/ContentEditorDialog.test.tsx
          pnpm exec eslint src/features/cms-media/mediaBridgeClient.test.ts src/admin/pages/MediaPage.test.tsx src/admin/components/ContentEditorDialog.test.tsx
          pnpm exec vitest run src/features/cms-media/mediaBridgeClient.test.ts src/admin/pages/MediaPage.test.tsx src/admin/components/ContentEditorDialog.test.tsx
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/cms-media/mediaBridgeClient.test.ts src/admin/pages/MediaPage.test.tsx src/admin/components/ContentEditorDialog.test.tsx
          git commit -m "test(media): cover progress and duplicate upload guard"
          git push origin HEAD:agent/media-upload-progress-lock
