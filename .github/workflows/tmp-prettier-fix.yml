name: Temporary Prettier Fix

on:
  push:
    branches:
      - fix/phase-a-overflow-diagnostics

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/phase-a-overflow-diagnostics
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format target file
        run: pnpm exec prettier --write src/test/publicRouteHeadSsrReadiness.test.ts
      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- src/test/publicRouteHeadSsrReadiness.test.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/publicRouteHeadSsrReadiness.test.ts
          git diff --cached --check
          git commit -m "style(ssr): apply repository formatting"
          git push origin HEAD:fix/phase-a-overflow-diagnostics
