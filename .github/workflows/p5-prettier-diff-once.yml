name: P5 Prettier Diff Once

on:
  push:
    branches:
      - agent/p5-worker-production-preflight

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Show exact Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write \
            cloudflare/public-api/scripts/worker-production-preflight.mjs \
            cloudflare/public-api/scripts/worker-production-preflight.test.mjs
          git --no-pager diff -- \
            cloudflare/public-api/scripts/worker-production-preflight.mjs \
            cloudflare/public-api/scripts/worker-production-preflight.test.mjs
