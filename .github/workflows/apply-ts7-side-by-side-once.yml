name: Apply TypeScript 7 side-by-side once

on:
  push:
    branches:
      - feat/typescript7-side-by-side
    paths:
      - .github/workflows/apply-ts7-side-by-side-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/typescript7-side-by-side

      - uses: ./.github/actions/setup-project

      - name: Apply migration source changes
        run: node .github/scripts/apply-ts7-side-by-side.mjs

      - name: Resolve lockfile and enforce secure fast-uri
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --strict-peer-dependencies
          echo "native=$(pnpm exec tsc --version)"
          echo "compat=$(pnpm exec tsc6 --version)"
          node - <<'NODE'
          const pkg = require('./node_modules/typescript/package.json');
          console.log(`compat-package=${pkg.name}@${pkg.version}`);
          console.log(`compat-bin=${JSON.stringify(pkg.bin)}`);
          if (pkg.name !== '@typescript/typescript6' || pkg.version !== '6.0.2') {
            throw new Error(`unexpected compatibility package: ${pkg.name}@${pkg.version}`);
          }
          const native = require('./node_modules/@typescript/native/package.json');
          console.log(`native-package=${native.name}@${native.version}`);
          if (native.name !== 'typescript' || native.version !== '7.0.2') {
            throw new Error(`unexpected native package: ${native.name}@${native.version}`);
          }
          NODE
          readlink -f node_modules/.bin/tsc6 || true
          readlink -f node_modules/.bin/tsc || true
          grep -n 'fast-uri@3\.1\.' pnpm-lock.yaml || true
          test "$(pnpm exec tsc --version)" = "Version 7.0.2"
          pnpm exec tsc6 --version | grep -Eq '^Version 6\.0\.[0-9]+$'
          grep -q 'fast-uri@3.1.7:' pnpm-lock.yaml
          if grep -q 'fast-uri@3.1.6:' pnpm-lock.yaml; then
            echo 'fast-uri 3.1.6 must not remain in the lockfile' >&2
            exit 1
          fi

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run scripts/dependency-status-policy.test.mjs
          pnpm deps:status
          pnpm deps:check
          pnpm build
          pnpm worker:typecheck
          pnpm worker:deploy:dry

      - name: Commit migration and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ts7-side-by-side-once.yml .github/scripts/apply-ts7-side-by-side.mjs
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml config/dependency-policy.json scripts/check-dependencies.mjs scripts/dependency-status-policy.mjs scripts/dependency-status-policy.test.mjs scripts/generate-dependency-status.mjs docs/maintenance/dependency-current-status.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: adopt TypeScript 7 compiler side by side'
          git push origin HEAD:feat/typescript7-side-by-side
