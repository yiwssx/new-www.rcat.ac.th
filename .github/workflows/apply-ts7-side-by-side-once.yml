name: Apply TypeScript 7 side-by-side once

on:
  push:
    branches:
      - feat/typescript7-side-by-side
    paths:
      - .github/workflows/apply-ts7-side-by-side-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/typescript7-side-by-side

      - uses: ./.github/actions/setup-project

      - name: Apply migration source changes
        run: node .github/scripts/apply-ts7-side-by-side.mjs

      - name: Reconcile live dependency policy
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['@tanstack/react-query'] = '^5.104.0';
          Object.assign(pkg.devDependencies, {
            '@cloudflare/workers-types': '^5.20260926.1',
            '@types/node': '^24.19.0',
            '@vitest/coverage-v8': '5.0.2',
            'lint-staged': '^17.6.0',
            sigmap: '^8.51.4',
            vitest: '^5.0.2',
            wrangler: '^4.141.0'
          });
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const policy = JSON.parse(fs.readFileSync('config/dependency-policy.json', 'utf8'));
          policy.compatibilityExceptions['@types/node'].selected = '24.19.0';
          fs.writeFileSync('config/dependency-policy.json', `${JSON.stringify(policy, null, 2)}\n`);

          const workspacePath = 'pnpm-workspace.yaml';
          const workspace = fs.readFileSync(workspacePath, 'utf8');
          const oldOverride = '  "undici@>=7.0.0 <7.29.0": 7.29.0';
          const newOverride = '  "undici@>=7.0.0 <7.29.1": 7.29.1';
          if (!workspace.includes(oldOverride)) throw new Error('expected undici override not found');
          fs.writeFileSync(workspacePath, workspace.replace(oldOverride, newOverride));
          NODE

      - name: Resolve lockfile and enforce secure overrides
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --strict-peer-dependencies
          node - <<'NODE'
          const compat = require('./node_modules/typescript/package.json');
          const native = require('./node_modules/@typescript/native/package.json');
          console.log(`compat-package=${compat.name}@${compat.version}`);
          console.log(`native-package=${native.name}@${native.version}`);
          if (compat.name !== '@typescript/typescript6' || compat.version !== '6.0.2') throw new Error('invalid TS6 compatibility alias');
          if (native.name !== 'typescript' || native.version !== '7.0.2') throw new Error('invalid TS7 native alias');
          NODE
          test "$(pnpm exec tsc --version)" = "Version 7.0.2"
          pnpm exec tsc6 --version | grep -Eq '^Version 6\.0\.[0-9]+$'
          grep -q 'fast-uri@3.1.7:' pnpm-lock.yaml
          ! grep -q 'fast-uri@3.1.6:' pnpm-lock.yaml
          grep -q 'undici@7.29.1:' pnpm-lock.yaml
          ! grep -q 'undici@7.29.0:' pnpm-lock.yaml

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run scripts/dependency-status-policy.test.mjs
          pnpm deps:status
          pnpm deps:check
          pnpm build
          pnpm worker:typecheck
          pnpm worker:deploy:dry

      - name: Commit migration and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ts7-side-by-side-once.yml .github/scripts/apply-ts7-side-by-side.mjs
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml config/dependency-policy.json scripts/check-dependencies.mjs scripts/dependency-status-policy.mjs scripts/dependency-status-policy.test.mjs scripts/generate-dependency-status.mjs docs/maintenance/dependency-current-status.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: adopt TypeScript 7 compiler side by side'
          git push origin HEAD:feat/typescript7-side-by-side
