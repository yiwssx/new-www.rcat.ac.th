name: Apply TypeScript 7 side-by-side once

on:
  push:
    branches:
      - feat/typescript7-side-by-side
    paths:
      - .github/workflows/apply-ts7-side-by-side-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/typescript7-side-by-side

      - uses: ./.github/actions/setup-project

      - name: Apply production side-by-side migration
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies.typescript = 'npm:@typescript/typescript6@6.0.3';
          pkg.devDependencies['@typescript/native'] = 'npm:typescript@7.0.2';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const policy = JSON.parse(fs.readFileSync('config/dependency-policy.json', 'utf8'));
          policy.compatibilityExceptions.typescript = {
            selected: '6.0.3',
            blockedLatestMajor: 7,
            reason:
              'The typescript package name remains a TypeScript 6 API compatibility alias required by typescript-eslint, while @typescript/native supplies the TypeScript 7 compiler for build and type-check commands.',
            validation: {
              kind: 'peer-range',
              peerPackage: 'typescript-eslint',
              peerDependency: 'typescript'
            },
            verifyWith: [
              'pnpm view typescript dist-tags --json',
              'pnpm view @typescript/typescript6 version --json',
              'pnpm view typescript-eslint version peerDependencies --json'
            ]
          };
          fs.writeFileSync('config/dependency-policy.json', `${JSON.stringify(policy, null, 2)}\n`);
          NODE

          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, pattern, replacement, flags=re.S):
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement in {path}, got {count}: {pattern}')
              file.write_text(updated)

          workspace = Path('pnpm-workspace.yaml')
          text = workspace.read_text()
          old = '  "fast-uri@>=3.0.0 <3.1.6": 3.1.6'
          new = '  "fast-uri@>=3.0.0 <3.1.7": 3.1.7'
          if old not in text:
              raise SystemExit('Expected fast-uri override was not found')
          workspace.write_text(text.replace(old, new, 1))

          alias_parser = '''function parseDeclaredVersion(specifier) {
            const text = String(specifier || "").trim();
            const aliasMatch = text.match(/^npm:(?:@[^/]+\\/)?[^@]+@(.+)$/u);
            const versionSpecifier = aliasMatch?.[1] || text;
            const match = versionSpecifier.match(/^(?:\\^|~)?(v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)$/u);
            return match ? parseVersion(match[1]) : null;
          }'''

          replace_once(
              'scripts/check-dependencies.mjs',
              r'function parseDeclaredVersion\(specifier\) \{.*?\n\}',
              alias_parser,
          )

          check_path = Path('scripts/check-dependencies.mjs')
          check_text = check_path.read_text()
          old_block = '''const typescript = directVersion("typescript");
          const typescriptEslint = readInstalledPackage("typescript-eslint");
          const typescriptPeerRange = typescriptEslint?.peerDependencies?.typescript;
          record(
            "TypeScript and typescript-eslint peer alignment",
            Boolean(typescript && typescriptEslint?.version && satisfiesRange(typescript, typescriptPeerRange)),
            `typescript ${directSpecifier("typescript")}; typescript-eslint ${
              typescriptEslint?.version || "missing"
            }; peer ${typescriptPeerRange || "missing"}`
          );'''
          new_block = '''const typescript = directVersion("typescript");
          const typescriptCompatInstalled = readInstalledPackage("typescript");
          const typescriptNative = directVersion("@typescript/native");
          const typescriptNativeInstalled = readInstalledPackage("@typescript/native");
          const typescriptEslint = readInstalledPackage("typescript-eslint");
          const typescriptPeerRange = typescriptEslint?.peerDependencies?.typescript;
          record(
            "TypeScript and typescript-eslint peer alignment",
            Boolean(typescript && typescriptEslint?.version && satisfiesRange(typescript, typescriptPeerRange)),
            `typescript ${directSpecifier("typescript")}; typescript-eslint ${
              typescriptEslint?.version || "missing"
            }; peer ${typescriptPeerRange || "missing"}`
          );
          record(
            "TypeScript 6 API and TypeScript 7 native compiler side-by-side alignment",
            Boolean(
              typescript?.major === 6 &&
                typescriptNative?.major === 7 &&
                typescriptCompatInstalled?.name === "@typescript/typescript6" &&
                parseVersion(typescriptCompatInstalled?.version)?.raw === typescript.raw &&
                typescriptNativeInstalled?.name === "typescript" &&
                parseVersion(typescriptNativeInstalled?.version)?.raw === typescriptNative.raw
            ),
            `compat ${directSpecifier("typescript")}/${typescriptCompatInstalled?.version || "missing"}; native ${
              directSpecifier("@typescript/native")
            }/${typescriptNativeInstalled?.version || "missing"}`
          );'''
          if old_block not in check_text:
              raise SystemExit('Expected TypeScript peer-alignment block was not found')
          check_path.write_text(check_text.replace(old_block, new_block, 1))

          policy_path = Path('scripts/dependency-status-policy.mjs')
          policy_text = policy_path.read_text()
          old_manifest = '''function parseManifestSpecifier(value) {
            const text = String(value || "").trim();
            const match = text.match(/^(\\^|~)?(v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)$/u);
            if (!match) return null;
            const version = parseVersion(match[2]);
            if (!version) return null;
            return {
              display: text,
              range: `${match[1] || ""}${version.raw}`,
              version
            };
          }'''
          new_manifest = '''function parseManifestSpecifier(value) {
            const text = String(value || "").trim();
            const aliasMatch = text.match(/^npm:(?:@[^/]+\\/)?[^@]+@(.+)$/u);
            const versionSpecifier = aliasMatch?.[1] || text;
            const match = versionSpecifier.match(/^(\\^|~)?(v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)$/u);
            if (!match) return null;
            const version = parseVersion(match[2]);
            if (!version) return null;
            return {
              display: text,
              range: `${match[1] || ""}${version.raw}`,
              version
            };
          }'''
          if old_manifest not in policy_text:
              raise SystemExit('Expected parseManifestSpecifier block was not found')
          policy_path.write_text(policy_text.replace(old_manifest, new_manifest, 1))

          generator_path = Path('scripts/generate-dependency-status.mjs')
          generator_text = generator_path.read_text()
          old_declared = '''function parseDeclaredVersion(specifier) {
            const match = String(specifier || "")
              .trim()
              .match(/^(?:\\^|~)?(v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)$/);
            return match ? parseVersion(match[1]) : null;
          }'''
          new_declared = '''function parseNpmAlias(specifier) {
            const text = String(specifier || "").trim();
            const match = text.match(/^npm:((?:@[^/]+\\/)?[^@]+)@(.+)$/u);
            return {
              targetName: match?.[1] || "",
              versionSpecifier: match?.[2] || text
            };
          }

          function parseDeclaredVersion(specifier) {
            const { versionSpecifier } = parseNpmAlias(specifier);
            const match = versionSpecifier.match(/^(?:\\^|~)?(v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)$/u);
            return match ? parseVersion(match[1]) : null;
          }'''
          if old_declared not in generator_text:
              raise SystemExit('Expected generator parseDeclaredVersion block was not found')
          generator_text = generator_text.replace(old_declared, new_declared, 1)

          old_rows = '''function directDependencyRows(packageJson) {
            const rows = [];
            for (const section of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              for (const [name, specifier] of Object.entries(packageJson[section] || {})) {
                rows.push({ name, section, specifier, manifestVersion: parseDeclaredVersion(specifier) });
              }
            }
            return rows;
          }'''
          new_rows = '''function directDependencyRows(packageJson) {
            const rows = [];
            for (const section of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              for (const [name, specifier] of Object.entries(packageJson[section] || {})) {
                const alias = parseNpmAlias(specifier);
                rows.push({
                  name,
                  section,
                  specifier,
                  manifestVersion: parseDeclaredVersion(specifier),
                  registryName: name === "@typescript/native" && alias.targetName ? alias.targetName : name
                });
              }
            }
            return rows;
          }'''
          if old_rows not in generator_text:
              raise SystemExit('Expected directDependencyRows block was not found')
          generator_text = generator_text.replace(old_rows, new_rows, 1)

          generator_text = generator_text.replace(
              'async function lookupRegistryMetadata(packageNames, validationKinds = new Map()) {',
              'async function lookupRegistryMetadata(packageNames, validationKinds = new Map(), registryNames = new Map()) {',
              1,
          )
          generator_text = generator_text.replace(
              'const results = await mapWithConcurrency(packageNames, REGISTRY_CONCURRENCY, async (name) => {\n    try {',
              'const results = await mapWithConcurrency(packageNames, REGISTRY_CONCURRENCY, async (name) => {\n    const registryName = registryNames.get(name) || name;\n    try {',
              1,
          )
          generator_text = generator_text.replace(
              'await runPnpmAsync(["view", name, "dist-tags.latest", "time", "--json"]),\n        `pnpm view ${name} dist-tags.latest time --json`',
              'await runPnpmAsync(["view", registryName, "dist-tags.latest", "time", "--json"]),\n        `pnpm view ${registryName} dist-tags.latest time --json`',
              1,
          )
          generator_text = generator_text.replace(
              'const directRows = directDependencyRows(packageJson);\n  const packageNames = [...new Set(directRows.map((row) => row.name))];',
              'const directRows = directDependencyRows(packageJson);\n  const packageNames = [...new Set(directRows.map((row) => row.name))];\n  const registryNames = new Map(directRows.map((row) => [row.name, row.registryName || row.name]));',
              1,
          )
          generator_text = generator_text.replace(
              'const registryMetadata = await lookupRegistryMetadata(packageNames, validationKinds);',
              'const registryMetadata = await lookupRegistryMetadata(packageNames, validationKinds, registryNames);',
              1,
          )
          generator_path.write_text(generator_text)

          test_path = Path('scripts/dependency-status-policy.test.mjs')
          test_text = test_path.read_text()
          anchor = '''  it("rejects a direct dependency behind registry latest", () => {'''
          alias_test = '''  it("accepts a stable npm alias manifest specifier", () => {
            expect(
              classify({
                manifestVersion: "npm:typescript@1.0.2",
                installedVersion: "1.0.2",
                registryLatest: "1.0.2"
              })
            ).toEqual({
              status: DEPENDENCY_STATUS.registryLatest,
              reason: "Installed version matches the stable registry latest.",
              registryLatest: "1.0.2"
            });
          });

'''
          if anchor not in test_text:
              raise SystemExit('Expected dependency policy test anchor was not found')
          test_path.write_text(test_text.replace(anchor, alias_test + anchor, 1))
          PY

      - name: Resolve lockfile and enforce secure fast-uri
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --strict-peer-dependencies
          test "$(pnpm exec tsc --version)" = "Version 7.0.2"
          test "$(pnpm exec tsc6 --version)" = "Version 6.0.3"
          grep -q 'fast-uri@3.1.7:' pnpm-lock.yaml
          if grep -q 'fast-uri@3.1.6:' pnpm-lock.yaml; then
            echo 'fast-uri 3.1.6 must not remain in the lockfile' >&2
            exit 1
          fi

      - name: Validate dependency governance and TypeScript migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run scripts/dependency-status-policy.test.mjs
          pnpm deps:status
          pnpm deps:check
          pnpm build
          pnpm worker:typecheck
          pnpm worker:deploy:dry

      - name: Commit migration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ts7-side-by-side-once.yml
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml config/dependency-policy.json scripts/check-dependencies.mjs scripts/dependency-status-policy.mjs scripts/dependency-status-policy.test.mjs scripts/generate-dependency-status.mjs docs/maintenance/dependency-current-status.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: adopt TypeScript 7 compiler side by side'
          git push origin HEAD:feat/typescript7-side-by-side
