name: P5 Apply Fixup

on:
  push:
    branches:
      - agent/p5a-p5d-data-ssr-efficiency

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5a-p5d-data-ssr-efficiency

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Apply P5 source and regression updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path, pattern, replacement, *, flags=0, already=None):
              file = Path(path)
              text = file.read_text()
              if already and already in text:
                  return
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {pattern[:100]!r}")
              file.write_text(updated)

          sub_once(
              "src/public/pages/PublicContentDetailPage.tsx",
              r"  const mediaAssets = contentDetailQuery\.media;\n  const relatedItems = contentDetailQuery\.relatedItems;",
              "  const mediaAssets = contentDetailQuery.media ?? [];\n  const relatedItems = contentDetailQuery.relatedItems ?? [];",
              already="const mediaAssets = contentDetailQuery.media ?? [];",
          )

          route_test = Path("src/test/publicRouteLoaders.test.ts")
          route = route_test.read_text()
          if 'expect(keys).not.toContainEqual(["cms-snapshot"]);' not in route:
              route = re.sub(r'^\s*const siteSettings = \{ siteName: "RCAT" \};\n', '', route, count=1, flags=re.M)
              route = re.sub(
                  r'^\s*if \(queryKey\[0\] === "cms-snapshot"\) return \{ media: \[\], siteSettings \};\n',
                  '',
                  route,
                  count=1,
                  flags=re.M,
              )
              old = '    expect(keys).toContainEqual(["cms-snapshot"]);\n    expect(loaderData).toEqual({ item, siteSettings, featuredMedia });'
              new = '''    expect(keys).not.toContainEqual(["cms-snapshot"]);
              expect(loaderData).toEqual({
                item: {
                  id: item.id,
                  title: item.title,
                  slug: item.slug,
                  type: item.type,
                  summary: item.summary,
                  seoTitle: undefined,
                  seoDescription: undefined,
                  canonicalUrl: undefined,
                  publishAt: item.publishAt,
                  updatedAt: item.updatedAt,
                  category: undefined,
                  tags: undefined
                },
                featuredMedia
              });'''
              if old not in route:
                  raise RuntimeError("route loader legacy expectation not found")
              route = route.replace(old, new, 1)
              route_test.write_text(route)

          data_path = Path("src/test/publicDataDrivenPages.test.tsx")
          data = data_path.read_text()
          data = data.replace(
              '    expect(usePublicCmsSnapshotMock.mock.calls.every(([options]) => options?.enabled === false)).toBe(true);',
              '    expect(usePublicCmsSnapshotMock).toHaveBeenCalledWith(undefined);',
              1,
          )

          marquee_anchor = '  it("renders one shared marquee on the homepage", () => {'
          marquee_next = '  it("renders shared marquee and public-only mourning mode from shell settings"'
          marquee_start = data.index(marquee_anchor)
          marquee_end = data.index(marquee_next, marquee_start)
          marquee_block = data[marquee_start:marquee_end]
          if 'currentSnapshot = createSnapshot({' not in marquee_block:
              shell_marquee = '''
              currentSnapshot = createSnapshot({
                homepageSettings: {
                  ...createHomeSnapshot().homepageSettings,
                  marquee: {
                    enabled: true,
                    label: "ประกาศ",
                    text: "ประกาศสำหรับทุกหน้า",
                    speedSeconds: 60
                  }
                }
              });
          '''
              marker = '\n    render(<PublicHomePage />);'
              if marker not in marquee_block:
                  raise RuntimeError("marquee render marker not found")
              marquee_block = marquee_block.replace(marker, shell_marquee + marker, 1)
              data = data[:marquee_start] + marquee_block + data[marquee_end:]

          ia_anchor = '  it("renders the approved homepage information architecture", async () => {'
          ia_start = data.index(ia_anchor)
          ia_end = data.index('\n  });', ia_start) + len('\n  });')
          ia_block = data[ia_start:ia_end]
          if 'currentSnapshot = createSnapshot({' not in ia_block:
              shell_site = '''
              currentSnapshot = createSnapshot({
                siteSettings: {
                  ...baseSiteSettings,
                  heroTitle: "ยินดีต้อนรับสู่วิทยาลัยตัวอย่าง",
                  directorTitle: "สารจากผู้อำนวยการ",
                  directorName: "ผู้อำนวยการตัวอย่าง",
                  directorDescription: "มุ่งพัฒนาผู้เรียนสู่อาชีพ",
                  campus: "วิทยาลัยเทคนิคตัวอย่าง",
                  address: "1 ถนนการศึกษา",
                  phone: "02-000-0000",
                  mapUrl: "https://www.google.com/maps/place/example",
                  mapEmbedUrl: "https://www.google.com/maps/embed?pb=test"
                }
              });
          '''
              marker = '\n    render(<PublicHomePage />);'
              if marker not in ia_block:
                  raise RuntimeError("approved IA render marker not found")
              ia_block = ia_block.replace(marker, shell_site + marker, 1)
              data = data[:ia_start] + ia_block + data[ia_end:]

          data_path.write_text(data)

          sub_once(
              "src/test/publicContentDetailRegression.test.tsx",
              r'(usePublicContentDetail:\s*\(\) => \(\{\s*data: currentDetail,)(\s*isLoading: false,\s*isFetching: false)',
              r'\1\n    media: currentSnapshot?.media ?? [],\n    relatedItems: (currentSnapshot?.content ?? []).filter((item) => item.id !== currentDetail?.id),\2',
              flags=re.S,
              already="media: currentSnapshot?.media ?? [],",
          )

          detail_test = Path("src/test/publicContentDetailPage.test.tsx")
          detail = detail_test.read_text()
          anchor = '  it("shows loading instead of not found while the snapshot is loading", () => {'
          start = detail.index(anchor)
          end = detail.index('\n  });', start) + len('\n  });')
          block = detail[start:end]
          if 'currentDetailQueryState = {\n      isLoading: true,' not in block:
              block, count = re.subn(
                  r'(currentDetailQueryState = \{\s*)isLoading: false,',
                  r'\1isLoading: true,',
                  block,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError("detail loading-state marker not found")
              detail = detail[:start] + block + detail[end:]
              detail_test.write_text(detail)
          PY

      - run: pnpm format

      - name: Commit applied updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(p5): align regressions with split data ownership"
          git push origin HEAD:agent/p5a-p5d-data-ssr-efficiency
