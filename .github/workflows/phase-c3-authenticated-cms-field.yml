name: Phase C3 Authenticated CMS Field

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: phase-c3-production-cms
  cancel-in-progress: false

jobs:
  authenticated-field:
    name: Authenticated disposable CMS field
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_URL: https://www.rcat.ac.th
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview

    steps:
      - name: Require master
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "Phase C3 production field verification must run from master." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Wait for matching Vercel production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            payload="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            state="$(printf '%s' "$payload" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                const vercel = payload.statuses.find((status) => status.context === "Vercel");
                process.stdout.write(vercel?.state || "missing");
              });
            ')"

            case "$state" in
              success)
                echo "Vercel deployment for $GITHUB_SHA is ready."
                exit 0
                ;;
              failure|error)
                echo "Vercel deployment for $GITHUB_SHA failed with state: $state" >&2
                exit 1
                ;;
              pending|missing)
                echo "Vercel deployment for $GITHUB_SHA is not ready yet (attempt $attempt/30)."
                sleep 10
                ;;
              *)
                echo "Unexpected Vercel commit status: $state" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Vercel deployment status for $GITHUB_SHA." >&2
          exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require protected Cloudflare production credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID is unavailable from the protected production environment." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN is unavailable from the protected production environment." >&2
            exit 1
          }
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID" || {
            echo "RCAT_PRODUCTION_D1_DATABASE_ID is unavailable from the protected production environment." >&2
            exit 1
          }

      - name: Resolve exact production D1 identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs \
            --database-list "$RUNNER_TEMP/d1-databases.json" \
            --verify-identity-only

      - name: Prepare isolated QA fixture
        run: node scripts/phase-c3-disposable-fixture.mjs prepare

      - name: Require clean disposable namespace
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --file="$RUNNER_TEMP/phase-c3-verify.sql" \
            --json > "$RUNNER_TEMP/phase-c3-preflight.json"
          node scripts/phase-c3-disposable-fixture.mjs assert-clean "$RUNNER_TEMP/phase-c3-preflight.json"

      - name: Provision disposable editor identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --file="$RUNNER_TEMP/phase-c3-provision.sql" \
            --json > "$RUNNER_TEMP/phase-c3-provision-result.json"

      - name: Verify disposable editor identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --file="$RUNNER_TEMP/phase-c3-verify.sql" \
            --json > "$RUNNER_TEMP/phase-c3-provision-verify.json"
          node scripts/phase-c3-disposable-fixture.mjs assert-provisioned "$RUNNER_TEMP/phase-c3-provision-verify.json"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated disposable CMS field test
        env:
          PHASE_C3_PRODUCTION_BASE_URL: ${{ env.TARGET_URL }}
        run: pnpm exec playwright test --config playwright.phase-c3.config.ts

      - name: Deterministic infrastructure cleanup
        if: ${{ always() }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ ! -f "$RUNNER_TEMP/phase-c3-cleanup.sql" ]]; then
            echo "Phase C3 fixture plan was not created; no disposable row could have been provisioned by this workflow."
            exit 0
          fi
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --file="$RUNNER_TEMP/phase-c3-cleanup.sql" \
            --json > "$RUNNER_TEMP/phase-c3-cleanup-result.json"

      - name: Verify deterministic cleanup
        if: ${{ always() }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ ! -f "$RUNNER_TEMP/phase-c3-verify.sql" ]]; then
            echo "Phase C3 verification plan is missing; fixture preparation failed before any production write." >&2
            exit 1
          fi
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --file="$RUNNER_TEMP/phase-c3-verify.sql" \
            --json > "$RUNNER_TEMP/phase-c3-cleanup-verify.json"
          node scripts/phase-c3-disposable-fixture.mjs assert-clean "$RUNNER_TEMP/phase-c3-cleanup-verify.json"

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-c3-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/phase-c3
          if-no-files-found: ignore
          retention-days: 7

      - name: Phase C3 summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Phase C3 Authenticated CMS Field"
            echo
            echo "- Target: $TARGET_URL"
            echo "- Commit: $GITHUB_SHA"
            echo "- Trigger: workflow_dispatch"
            echo "- Identity: isolated disposable editor generated per run"
            echo "- Production content namespace: ${PHASE_C3_CONTENT_SLUG:-not-created}"
            echo "- Browser: desktop Chromium"
            echo "- Normal Admin credentials: none"
            echo "- External paid services: none"
            echo "- Cleanup: infrastructure cleanup and zero-row verification run with always()"
            echo "- Audit trail: immutable operational audit events are intentionally retained"
          } >> "$GITHUB_STEP_SUMMARY"
