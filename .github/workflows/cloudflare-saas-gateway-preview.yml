name: Cloudflare SaaS Gateway Isolated Preview

# Separate release target from the existing public Standby workflow:
# deploys a host-blocked Gateway Candidate on workers.dev, never a zone Route.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-saas-gateway-preview.yml"
      - "cloudflare/web-failover/saas-gateway-worker.mjs"
      - "cloudflare/web-failover/saas-gateway-wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcat-cloudflare-saas-gateway-preview
  cancel-in-progress: false

jobs:
  deploy-candidate:
    name: Validate and publish isolated candidate (NO production routing)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-web-standby
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKERS_SUBDOMAIN: ${{ vars.RCAT_CLOUDFLARE_WORKERS_SUBDOMAIN || 'rcat-digital' }}
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Fail closed on missing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test "$CF_WORKERS_SUBDOMAIN" = "rcat-digital" || { echo "Wrong Workers subdomain" >&2; exit 1; }

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Test primary/fallback routing and immutable safety policy
        run: |
          node --test cloudflare/web-failover/gateway.node-check.mjs cloudflare/web-failover/saas-gateway.node-check.mjs
          node --check cloudflare/web-failover/saas-gateway-worker.mjs

      - name: Validate exact preview scope before deployment
        shell: bash
        run: |
          set -euo pipefail
          # Candidate config must NEVER attach a domain, zone route or D1.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const text = readFileSync("cloudflare/web-failover/saas-gateway-wrangler.toml", "utf8");
            if (!/^name = "rcat-saas-gateway-candidate"$/m.test(text) ||
                !/^workers_dev = true$/m.test(text) ||
                !/^service = "rcat-web-standby"$/m.test(text) ||
                /^(?:route|routes|zone_id|zone_name|custom_domain)\s*=/m.test(text) ||
                /\[\[d1_databases\]\]|\[assets\]/.test(text)) {
              throw Error("Unsafe Gateway candidate configuration; refusing deployment");
            }
          '
          pnpm exec wrangler deploy --config cloudflare/web-failover/saas-gateway-wrangler.toml --dry-run

      - name: Publish candidate to workers.dev ONLY
        run: pnpm exec wrangler deploy --config cloudflare/web-failover/saas-gateway-wrangler.toml

      - name: Verify isolated candidate is configured and remains unrouted
        shell: bash
        run: |
          set -euo pipefail
          URL="https://rcat-saas-gateway-candidate.$CF_WORKERS_SUBDOMAIN.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 \
              "$URL/_rcat/saas-health" -o "$RUNNER_TEMP/saas-gateway-health.json"; then
              break
            fi
            sleep 2
          done
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/saas-gateway-health.json", "utf8"));
            if (health.service !== "rcat-saas-gateway-candidate" ||
                health.configured !== true || health.status !== "not-routed") {
              throw Error("Gateway preview is not safely configured");
            }
          '
          STATUS=$(curl --silent --show-error --max-time 15 \
            -o "$RUNNER_TEMP/saas-candidate-blocked-body.txt" \
            -D "$RUNNER_TEMP/saas-candidate-blocked-headers.txt" \
            -w "%{http_code}" "$URL/news")
          test "$STATUS" = "503" || { echo "Candidate unexpectedly serves normal traffic: $STATUS" >&2; exit 1; }
          grep -qi 'X-RCAT-Gateway: wrong-hostname' "$RUNNER_TEMP/saas-candidate-blocked-headers.txt"
          echo "PASS: isolated SaaS candidate health and hostname-blocking checks" >> "$GITHUB_STEP_SUMMARY"
          echo "No production DNS, custom hostname, Worker Route, Vercel, or D1 changes." >> "$GITHUB_STEP_SUMMARY"
