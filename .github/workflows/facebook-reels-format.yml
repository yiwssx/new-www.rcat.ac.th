name: Facebook Reels Embed Format

on:
  push:
    branches:
      - feature/facebook-reels-embed

permissions:
  contents: write

jobs:
  format-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Clarify Facebook Reels editor labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/admin/components/ContentBlockBuilder.tsx')
          source = path.read_text(encoding='utf-8')
          replacements = {
            '{ type: "facebookPost", label: "โพสต์ Facebook", helper: "ฝังโพสต์ Facebook แบบ public" },':
              '{ type: "facebookPost", label: "Facebook / Reels", helper: "ฝังโพสต์หรือคลิป Reels Facebook แบบ Public" },',
            'โพสต์ต้องตั้งค่าเป็น Public หากภายหลังเปลี่ยนสิทธิ์การมองเห็น Facebook อาจไม่แสดงบนเว็บไซต์':
              'โพสต์หรือ Reels ต้องตั้งค่าเป็น Public หากภายหลังเปลี่ยนสิทธิ์การมองเห็น Facebook อาจไม่แสดงบนเว็บไซต์',
            'label="Facebook Post URL"': 'label="Facebook Post / Reels URL"',
            'helperText="วาง URL โพสต์ Facebook เท่านั้น ไม่ต้องวางโค้ด iframe แนะนำให้คัดลอก URL จากวันที่/เวลาของโพสต์"':
              'helperText="วาง URL โพสต์ Facebook หรือ permalink แบบ /reel/{id} เท่านั้น ไม่ต้องวางโค้ด iframe"',
            'label="แสดงข้อความโพสต์"': 'label="แสดงข้อความโพสต์ (เฉพาะโพสต์ปกติ)"',
            'placeholder="คำบรรยายใต้โพสต์ (ไม่บังคับ)"': 'placeholder="คำบรรยายใต้โพสต์หรือ Reels (ไม่บังคับ)"'
          }

          for old, new in replacements.items():
            assert old in source, f'missing expected editor text: {old}'
            source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Format changed files with project Prettier
        run: pnpm exec prettier src/utils/facebookEmbed.ts src/utils/facebookEmbed.test.ts src/components/embeds/FacebookPostEmbed.tsx src/components/embeds/FacebookPostEmbed.test.tsx src/test/facebookEmbedRegression.test.tsx src/admin/components/ContentBlockBuilder.tsx --write
      - name: Run focused Reels tests
        run: pnpm exec vitest run src/utils/facebookEmbed.test.ts src/components/embeds/FacebookPostEmbed.test.tsx src/test/facebookEmbedRegression.test.tsx
      - name: Typecheck and build
        run: pnpm build
      - name: Remove temporary workflow and commit validated changes
        run: |
          rm .github/workflows/facebook-reels-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/facebookEmbed.ts src/utils/facebookEmbed.test.ts src/components/embeds/FacebookPostEmbed.tsx src/components/embeds/FacebookPostEmbed.test.tsx src/test/facebookEmbedRegression.test.tsx src/admin/components/ContentBlockBuilder.tsx .github/workflows/facebook-reels-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(content): label Facebook Reels in editor [skip ci]"
          git push origin HEAD:feature/facebook-reels-embed
