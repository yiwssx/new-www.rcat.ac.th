name: Dependency Monitoring

on:
  schedule:
    # Daily at 00:15 UTC = 07:15 Asia/Bangkok. Renovate itself is not time-window restricted.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-monitoring
  cancel-in-progress: true

jobs:
  live-registry:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
      - name: Validate live dependency policy and report backlog
        run: node scripts/generate-dependency-status.mjs --monitor
