name: Dependency Monitoring

on:
  schedule:
    # Daily at 00:15 UTC = 07:15 Asia/Bangkok. Renovate itself is not time-window restricted.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-monitoring
  cancel-in-progress: true

jobs:
  live-registry:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Validate live dependency policy and report backlog
        run: node scripts/generate-dependency-status.mjs --monitor
