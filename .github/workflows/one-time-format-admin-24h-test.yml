name: One-time format admin 24-hour test

on:
  push:
    branches:
      - fix/admin-24h-datetime-inputs

permissions:
  contents: write

jobs:
  format-test:
    if: ${{ !contains(github.event.head_commit.message, '[admin-24h-format-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/admin-24h-datetime-inputs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/admin/components/AdminDateTimeField.test.tsx
      - run: pnpm format:check
      - name: Commit formatting and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-format-admin-24h-test.yml
          git add src/admin/components/AdminDateTimeField.test.tsx
          git commit -m "style: format 24-hour datetime test [admin-24h-format-applied]"
          git push origin HEAD:fix/admin-24h-datetime-inputs
