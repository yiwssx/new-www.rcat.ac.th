name: P5G Package Once

on:
  push:
    branches:
      - agent/p5g-apps-script-release-governance
    paths:
      - package.json
      - .github/workflows/p5g-package-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5g-apps-script-release-governance
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Remove local production release commands
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          pkg.scripts["gas:login"] = "pnpm dlx @google/clasp@3.3.0 login";
          delete pkg.scripts["gas:push"];
          delete pkg.scripts["gas:version"];
          pkg.scripts["gas:push:local"] = "cd apps-script && pnpm dlx @google/clasp@3.3.0 push";
          pkg.scripts["gas:deployments"] = "cd apps-script && pnpm dlx @google/clasp@3.3.0 list-deployments";
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm exec prettier package.json --write
      - name: Commit package migration
        run: |
          if git diff --quiet -- package.json; then
            echo "Package scripts already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "refactor(p5g): remove local production Apps Script release path"
          git push origin HEAD:agent/p5g-apps-script-release-governance
