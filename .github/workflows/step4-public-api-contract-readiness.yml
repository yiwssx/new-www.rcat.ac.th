name: Step 4 Public API Contract Readiness

on:
  push:
    branches:
      - refactor/ssr-readiness-step4
    paths:
      - .github/workflows/step4-public-api-contract-readiness.yml
  pull_request:
    branches:
      - refactor/ssr-readiness
    paths:
      - .github/workflows/step4-public-api-contract-readiness.yml
      - scripts/step4-public-api-contract-readiness.mjs

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ssr-readiness-step4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: node scripts/step4-public-api-contract-readiness.mjs
      - name: Format Step 4 files
        run: |
          git diff --name-only --diff-filter=ACM | grep -E '\.(ts|tsx|md)$' | xargs -r pnpm exec prettier --write
      - name: Focused Step 4 tests
        run: >-
          pnpm exec vitest run
          cloudflare/public-api/test/publicReadCoreRoutes.test.ts
          src/test/publicApiContractReadiness.test.ts
          src/test/publicQueryOptions.test.ts
          src/features/public-read/publicReadProviderParity.test.ts
      - run: pnpm lint:strict
      - run: pnpm worker:typecheck
      - run: pnpm build
      - run: pnpm worker:deploy:dry
      - name: Commit Step 4 and remove temporary patch files
        run: |
          rm scripts/step4-public-api-contract-readiness.mjs .github/workflows/step4-public-api-contract-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(ssr): prepare public API contracts"
          git push origin HEAD:refactor/ssr-readiness-step4
