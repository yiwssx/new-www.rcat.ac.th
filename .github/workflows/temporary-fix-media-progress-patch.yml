name: Temporary Fix Media Progress Patch

on:
  push:
    branches:
      - agent/media-upload-progress-lock
    paths:
      - .github/workflows/temporary-fix-media-progress-patch.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-upload-progress-lock
      - name: Fix guarded patch indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temporary-media-upload-progress.yml')
          text = path.read_text()
          needle = "\n            return null;'''"
          if text.count(needle) != 2:
              raise SystemExit(f'expected 2 return-null markers, found {text.count(needle)}')
          path.write_text(text.replace(needle, "\n              return null;'''"))
          Path('.github/workflows/temporary-fix-media-progress-patch.yml').unlink()
          PY
      - name: Commit corrected patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: correct media upload patch guard"
          git push origin HEAD:agent/media-upload-progress-lock
