name: Deploy / Apps Script

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose a read-only preflight or the protected production release"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - release
      release_confirmation:
        description: "For release only, enter DEPLOY_EXISTING_APPS_SCRIPT_WEB_APP"
        required: false
        type: string
      release_note:
        description: "Optional release note"
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Apps Script Production Preflight
    if: ${{ github.ref == 'refs/heads/master' && inputs.operation == 'preflight' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify Apps Script media bridge contracts
        run: pnpm vitest run src/test/appsScriptCode.test.ts server/appsScriptProxy/handler.test.mjs

      - name: Require protected Apps Script production credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          test -n "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID"
          echo "::add-mask::$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > apps-script/.clasp.json
          node -e 'JSON.parse(require("fs").readFileSync(process.env.HOME + "/.clasprc.json", "utf8"))'
          node scripts/apps-script-release-tools.mjs validate-config \
            --project apps-script/.clasp.json \
            --deployment-id "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID"

      - name: Resolve exact existing production deployment
        id: deployment
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: |
          cd apps-script
          pnpm dlx @google/clasp@3.3.0 list-deployments > "$RUNNER_TEMP/apps-script-deployments.txt"
          cd ..
          current_version="$(node scripts/apps-script-release-tools.mjs current-version --deployments "$RUNNER_TEMP/apps-script-deployments.txt" --deployment-id "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID")"
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Read-only production bridge health smoke
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://script.google.com/macros/s/${APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID}/exec" \
            > "$RUNNER_TEMP/apps-script-health.json"
          node scripts/apps-script-release-tools.mjs verify-health --file "$RUNNER_TEMP/apps-script-health.json"

      - name: Preflight summary
        env:
          CURRENT_VERSION: ${{ steps.deployment.outputs.current_version }}
        run: |
          {
            echo "## Apps Script Production Preflight"
            echo "- Existing production deployment: verified"
            echo "- Current immutable version: $CURRENT_VERSION"
            echo "- Production health contract: passed"
            echo "- Source push: not executed"
            echo "- Deployment mutation: not executed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Apps Script credentials
        if: ${{ always() }}
        run: rm -f "$HOME/.clasprc.json" apps-script/.clasp.json

  release:
    name: Apps Script Production Release
    if: ${{ github.ref == 'refs/heads/master' && inputs.operation == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: apps-script-production-write
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require exact release confirmation
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
        run: |
          test "$RELEASE_CONFIRMATION" = "DEPLOY_EXISTING_APPS_SCRIPT_WEB_APP" || {
            echo "Apps Script production release confirmation does not match the required exact phrase." >&2
            exit 1
          }

      - name: Verify Apps Script media bridge contracts
        run: pnpm vitest run src/test/appsScriptCode.test.ts server/appsScriptProxy/handler.test.mjs

      - name: Require protected Apps Script production credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          test -n "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID"
          echo "::add-mask::$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > apps-script/.clasp.json
          node -e 'JSON.parse(require("fs").readFileSync(process.env.HOME + "/.clasprc.json", "utf8"))'
          node scripts/apps-script-release-tools.mjs validate-config \
            --project apps-script/.clasp.json \
            --deployment-id "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID"

      - name: Resolve current production deployment version
        id: before
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: |
          cd apps-script
          pnpm dlx @google/clasp@3.3.0 list-deployments > "$RUNNER_TEMP/apps-script-deployments-before.txt"
          cd ..
          previous_version="$(node scripts/apps-script-release-tools.mjs current-version --deployments "$RUNNER_TEMP/apps-script-deployments-before.txt" --deployment-id "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID")"
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"

      - name: Push repository source to Apps Script HEAD
        working-directory: apps-script
        run: pnpm dlx @google/clasp@3.3.0 push --force

      - name: Create immutable Apps Script version
        id: version
        env:
          RELEASE_NOTE: ${{ inputs.release_note }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          description="github:${short_sha}"
          if [[ -n "$RELEASE_NOTE" ]]; then description="$description $RELEASE_NOTE"; fi
          description="${description:0:180}"
          cd apps-script
          pnpm dlx @google/clasp@3.3.0 create-version "$description" | tee "$RUNNER_TEMP/apps-script-created-version.txt"
          cd ..
          version="$(node scripts/apps-script-release-tools.mjs created-version --file "$RUNNER_TEMP/apps-script-created-version.txt")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Start GitHub Apps Script production deployment record
        id: github_deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ENVIRONMENT: apps-script-production
          DEPLOYMENT_DESCRIPTION: Apps Script production release
        run: node .github/scripts/github-deployment-record.mjs start

      - name: Update only the existing production Web App deployment
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
          VERSION_NUMBER: ${{ steps.version.outputs.version }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          cd apps-script
          pnpm dlx @google/clasp@3.3.0 create-deployment \
            --deploymentId "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID" \
            --versionNumber "$VERSION_NUMBER" \
            --description "github:${short_sha}"

      - name: Verify production deployment version
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
          VERSION_NUMBER: ${{ steps.version.outputs.version }}
        run: |
          cd apps-script
          pnpm dlx @google/clasp@3.3.0 list-deployments > "$RUNNER_TEMP/apps-script-deployments-after.txt"
          cd ..
          node scripts/apps-script-release-tools.mjs assert-deployment-version \
            --deployments "$RUNNER_TEMP/apps-script-deployments-after.txt" \
            --deployment-id "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID" \
            --version "$VERSION_NUMBER"

      - name: Read-only production bridge health smoke
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://script.google.com/macros/s/${APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID}/exec" \
            > "$RUNNER_TEMP/apps-script-health.json"
          node scripts/apps-script-release-tools.mjs verify-health --file "$RUNNER_TEMP/apps-script-health.json"

      - name: Release summary
        env:
          PREVIOUS_VERSION: ${{ steps.before.outputs.previous_version }}
          RELEASED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Apps Script Production Release"
            echo "- Source: master@$GITHUB_SHA"
            echo "- Existing deployment updated in place: yes"
            echo "- Previous immutable version: $PREVIOUS_VERSION"
            echo "- Released immutable version: $RELEASED_VERSION"
            echo "- Production health contract: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Apps Script credentials
        if: ${{ always() }}
        run: rm -f "$HOME/.clasprc.json" apps-script/.clasp.json

      - name: Finalize GitHub Apps Script production deployment record
        if: ${{ always() && steps.github_deployment.outputs.deployment_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.github_deployment.outputs.deployment_id }}
          DEPLOYMENT_ENVIRONMENT: apps-script-production
          JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/github-deployment-record.mjs finish
