name: Temporary Cross-account Gateway Formatter

on:
  pull_request:
    paths:
      - "cloudflare/web-failover/gateway-worker.mjs"
      - "cloudflare/web-failover/gateway.node-check.mjs"
      - "docs/operations/cloudflare-gateway-two-account-handoff.md"
      - "docs/operations/cloudflare-web-failover-emergency.md"
      - ".github/workflows/cloudflare-cross-account-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/cross-account-gateway-readonly-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format only four new or modified gateway files
        run: |
          pnpm exec prettier --write \
            cloudflare/web-failover/gateway-worker.mjs \
            cloudflare/web-failover/gateway.node-check.mjs \
            docs/operations/cloudflare-gateway-two-account-handoff.md \
            docs/operations/cloudflare-web-failover-emergency.md
      - name: Commit formatted files on trusted PR branch only
        shell: bash
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            cloudflare/web-failover/gateway-worker.mjs \
            cloudflare/web-failover/gateway.node-check.mjs \
            docs/operations/cloudflare-gateway-two-account-handoff.md \
            docs/operations/cloudflare-web-failover-emergency.md
          git commit -m "style(operations): format cross-account gateway package (#760)"
          git push origin HEAD:ops/cross-account-gateway-readonly-20261029
