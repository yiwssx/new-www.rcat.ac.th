name: Format Facebook Reclassification Branch

on:
  push:
    branches:
      - fix/facebook-content-reclassification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/facebook-content-reclassification

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Format reclassification scripts
        run: |
          pnpm exec prettier --write \
            scripts/facebook/facebook-content-classifier.mjs \
            scripts/facebook/reclassify-facebook-imports.mjs

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/facebook/facebook-content-classifier.mjs scripts/facebook/reclassify-facebook-imports.mjs
          git commit -m "style(content): format Facebook reclassification scripts"
          git push origin HEAD:fix/facebook-content-reclassification
