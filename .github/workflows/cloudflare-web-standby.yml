# Retired 2026-10-30 by project owner after production Vercel pause incident.
# Historical Cloudflare Standby remains hosted independently, but this
# workflow cannot deploy ANY Worker or mutate DNS/SSL/Access/D1.
# Use an independently approved maintenance change if Standby needs updating.
name: Cloudflare Web Failover — Retired (No Deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired — no deployments or probes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm the experimental deployment workflow is disabled
        run: |
          echo "SaaS/O2O, Gateway preview and automatic Standby deployment are retired."
          echo "No Cloudflare API credentials, Wrangler deployment or DNS operations are executed."
