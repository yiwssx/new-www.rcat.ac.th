name: Emergency Cloudflare Web Standby

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/web-failover/**"
      # Readiness-only changes are checked by the existing offline + live
      # failover workflow; they must not redeploy an unchanged public Standby.
      - "!cloudflare/web-failover/origin-readiness.mjs"
      - "!cloudflare/web-failover/origin-readiness.node-check.mjs"
      - ".github/workflows/cloudflare-web-standby.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target; never changes production DNS or Routes"
        type: choice
        required: true
        default: standby
        options:
          - standby
          - gateway-preview
          - saas-gateway-preview
          - saas-staging-preview

permissions:
  contents: read

concurrency:
  group: rcat-cloudflare-web-standby
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and deploy isolated Workers.dev endpoint
    # Do not allow unreviewed branches to deploy via manual dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-web-standby
    env:
      TARGET: ${{ github.event_name == 'push' && 'standby' || inputs.target }}
      VITE_CLOUDFLARE_PUBLIC_API_URL: https://rcat-web-standby.${{ vars.RCAT_CLOUDFLARE_WORKERS_SUBDOMAIN || 'rcat-digital' }}.workers.dev
      VITE_PUBLIC_IMAGE_DELIVERY_BASE_URL: https://rcat-image-production.rcat-digital.workers.dev
      VITE_PUBLIC_IMAGE_DELIVERY_INTENTS: portrait,carousel,intro-gate
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKERS_SUBDOMAIN: ${{ vars.RCAT_CLOUDFLARE_WORKERS_SUBDOMAIN || 'rcat-digital' }}
      GATEWAY_PREVIEW_APPROVED: ${{ vars.RCAT_ALLOW_GATEWAY_PREVIEW }}
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Configure Node and pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Select isolated SaaS target on reviewed main-only provider changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          // GitHub Actions push events may OMIT added/modified/removed arrays.
          // Use the exact reviewed commit diff checked out with fetch-depth: 2.
          let files = [];
          try {
            files = execFileSync("git", ["diff", "--name-only", "HEAD^", "HEAD"], {
              encoding: "utf8"
            }).split("\n").filter(Boolean);
          } catch {
            console.warn("Cannot read reviewed main diff; preserve standby behavior");
          }
          const previewSources = new Set([
            "cloudflare/web-failover/saas-gateway-worker.mjs",
            "cloudflare/web-failover/saas-gateway-wrangler.toml",
            "cloudflare/web-failover/saas-gateway.node-check.mjs"
          ]);
          const stagingSources = new Set([
            "cloudflare/web-failover/saas-staging-worker.mjs",
            "cloudflare/web-failover/saas-staging-wrangler.toml",
            "cloudflare/web-failover/saas-staging.node-check.mjs"
          ]);
          const approvedPreviewRelease = (event.head_commit?.message || "").includes("[saas-gateway-preview]");
          const saasChanged = files.some((file) => previewSources.has(file));
          const stagingChanged = files.some((file) => stagingSources.has(file));
          const standbyChanged = files.some(
            (file) => file.startsWith("cloudflare/web-failover/") &&
              !previewSources.has(file) && !stagingSources.has(file)
          );
          // Select a single isolated deployment; mixed changes default to Standby.
          // Never attach production DNS or a zone route from this workflow.
          const selected = stagingChanged && !saasChanged && !standbyChanged
            ? "saas-staging-preview"
            : (approvedPreviewRelease || saasChanged) && !standbyChanged && !stagingChanged
              ? "saas-gateway-preview"
              : "standby";
          appendFileSync(process.env.GITHUB_ENV, "TARGET=" + selected + "\n");
          console.log("Selected isolated deployment target: " + selected);
          NODE

      - name: Fail closed on missing credentials and invalid public origin
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret" >&2; exit 1; }
          test -n "$CF_WORKERS_SUBDOMAIN" || { echo "Missing RCAT_CLOUDFLARE_WORKERS_SUBDOMAIN variable" >&2; exit 1; }
          node --input-type=module -e '
            const raw = process.env.VITE_CLOUDFLARE_PUBLIC_API_URL;
            if (!raw) throw Error("Missing derived public standby URL");
            const url = new URL(raw);
            if (url.protocol !== "https:" || url.username || url.password ||
                url.search || url.hash || url.pathname !== "/" ||
                ["localhost", "127.0.0.1"].includes(url.hostname)) {
              throw Error("Standby API URL must be an HTTPS origin without credentials, path, or query");
            }
          '
          case "$TARGET" in
            standby) ;;
            gateway-preview)
              test "$GATEWAY_PREVIEW_APPROVED" = "true" ||
                { echo "Set RCAT_ALLOW_GATEWAY_PREVIEW=true only after operator review" >&2; exit 1; }
              ;;
            saas-gateway-preview) ;;
            saas-staging-preview) ;;
            *) echo "Invalid target" >&2; exit 1 ;;
          esac

      - name: Install pinned project dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Test public standby and gateway invariants
        run: node --test cloudflare/web-failover/worker.node-check.mjs cloudflare/web-failover/gateway.node-check.mjs cloudflare/web-failover/saas-gateway.node-check.mjs cloudflare/web-failover/saas-staging.node-check.mjs

      - name: Build independent CSR public standby
        run: pnpm build

      - name: Check CSR output without Vercel SSR cutover
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test ! -e dist/csr.html
          test -d dist/assets
          grep -q 'id="root"' dist/index.html
          grep -q 'noindex' dist/index.html

      - name: Check SaaS candidate never configures DNS, Routes, TLS or D1
        if: ${{ env.TARGET == 'saas-gateway-preview' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const text = readFileSync("cloudflare/web-failover/saas-gateway-wrangler.toml", "utf8");
            if (!/^name = "rcat-saas-gateway-candidate"$/m.test(text) ||
                !/^workers_dev = true$/m.test(text) ||
                !/^service = "rcat-web-standby"$/m.test(text) ||
                /^(?:route|routes|zone_id|zone_name|custom_domain)\s*=/m.test(text) ||
                /\[\[d1_databases\]\]|\[assets\]/.test(text)) {
              throw Error("Unsafe SaaS candidate scope: refusing deployment");
            }
          '
          pnpm exec wrangler deploy --config cloudflare/web-failover/saas-gateway-wrangler.toml --dry-run

      - name: Check staging-only Worker cannot configure production routes, TLS or D1
        if: ${{ env.TARGET == 'saas-staging-preview' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const cfg = readFileSync("cloudflare/web-failover/saas-staging-wrangler.toml", "utf8");
            if (!/^name = "rcat-saas-gateway-staging"$/m.test(cfg) ||
                !/^PUBLIC_HOSTNAME = "failover-test.rcat.ac.th"$/m.test(cfg) ||
                !/^GATEWAY_TEST_ONLY = "true"$/m.test(cfg) ||
                !/^service = "rcat-web-standby"$/m.test(cfg) ||
                /^(?:route|routes|zone_id|zone_name|custom_domain)\s*=/m.test(cfg) ||
                /\[\[d1_databases\]\]|\[assets\]/.test(cfg)) {
              throw Error("Unsafe Staging Worker configuration");
            }
          '
          pnpm exec wrangler deploy --config cloudflare/web-failover/saas-staging-wrangler.toml --dry-run

      - name: Deploy Workers.dev only (never assign a DNS route)
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            standby)
              SERVICE=rcat-web-standby
              pnpm exec wrangler deploy --config cloudflare/web-failover/wrangler.toml --env standby
              ;;
            gateway-preview)
              SERVICE=rcat-web-gateway
              pnpm exec wrangler deploy --config cloudflare/web-failover/gateway-wrangler.toml
              ;;
            saas-gateway-preview)
              SERVICE=rcat-saas-gateway-candidate
              pnpm exec wrangler deploy --config cloudflare/web-failover/saas-gateway-wrangler.toml
              ;;
            saas-staging-preview)
              SERVICE=rcat-saas-gateway-staging
              pnpm exec wrangler deploy --config cloudflare/web-failover/saas-staging-wrangler.toml
              ;;
          esac
          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"

      - name: Verify isolated Workers.dev health
        if: ${{ env.TARGET == 'standby' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://$SERVICE.$CF_WORKERS_SUBDOMAIN.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$URL/_rcat/failover-health" \
                -o "$RUNNER_TEMP/rcat-cf-health.json"; then
              break
            fi
            sleep 2
          done
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/rcat-cf-health.json", "utf8"));
            const expected = process.env.TARGET === "standby" ? "standby" : "auto";
            if (data.status !== "ok" || data.mode !== expected) throw Error("Incorrect Worker or mode");
          '
          if [[ "$TARGET" == "standby" ]]; then
            curl --fail --silent --show-error --max-time 15 "$URL/news" -o "$RUNNER_TEMP/rcat-standby-news.html"
            grep -q 'id="root"' "$RUNNER_TEMP/rcat-standby-news.html"
          fi
          echo "Validated isolated endpoint: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "No production DNS, Vercel, API Worker, or D1 changes made." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify isolated SaaS Gateway candidate health and host blocking
        if: ${{ env.TARGET == 'saas-gateway-preview' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://rcat-saas-gateway-candidate.$CF_WORKERS_SUBDOMAIN.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 \
              "$URL/_rcat/saas-health" -o "$RUNNER_TEMP/saas-gateway-health.json"; then
              break
            fi
            sleep 2
          done
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/saas-gateway-health.json", "utf8"));
            if (health.service !== "rcat-saas-gateway-candidate" ||
                health.configured !== true || health.status !== "not-routed") {
              throw Error("SaaS candidate Service Binding or not-routed guard missing");
            }
          '
          STATUS=$(curl --silent --show-error --max-time 15 \
            -o "$RUNNER_TEMP/saas-candidate-blocked-body.txt" \
            -D "$RUNNER_TEMP/saas-candidate-blocked-headers.txt" \
            -w "%{http_code}" "$URL/news")
          test "$STATUS" = "503" || { echo "Candidate unexpectedly serves public traffic: $STATUS" >&2; exit 1; }
          grep -qi 'X-RCAT-Gateway: wrong-hostname' "$RUNNER_TEMP/saas-candidate-blocked-headers.txt"
          echo "PASS: isolated SaaS candidate health and hostname-block checks" >> "$GITHUB_STEP_SUMMARY"
          echo "NO DNS, Route, Custom Hostname, TLS, Vercel or D1 changes." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staging Worker health and workers.dev fail-closed hostname
        if: ${{ env.TARGET == 'saas-staging-preview' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://rcat-saas-gateway-staging.$CF_WORKERS_SUBDOMAIN.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 \
              "$URL/_rcat/staging-health" -o "$RUNNER_TEMP/saas-staging-health.json"; then
              break
            fi
            sleep 2
          done
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const h = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/saas-staging-health.json", "utf8"));
            if (h.service !== "rcat-saas-gateway-staging" ||
                h.configured !== true || h.status !== "not-routed") {
              throw Error("Staging Worker is not configured or leaks a route");
            }
          '
          STATUS=$(curl --silent --show-error --max-time 15 \
            -o "$RUNNER_TEMP/saas-staging-blocked.txt" \
            -D "$RUNNER_TEMP/saas-staging-headers.txt" \
            -w "%{http_code}" "$URL/news")
          test "$STATUS" = "503"
          grep -qi "X-RCAT-Staging: wrong-hostname" "$RUNNER_TEMP/saas-staging-headers.txt"
          echo "PASS: staging Worker exists, but refuses workers.dev public routes" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging hostname DNS, Custom Hostname and Worker Routes NOT changed." >> "$GITHUB_STEP_SUMMARY"

      - name: Record gateway preview safely (no DNS, no public traffic)
        if: ${{ env.TARGET == 'gateway-preview' }}
        shell: bash
        run: |
          echo "Gateway Worker uploaded; isolated workers.dev host may still be protected by Cloudflare Access." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT a Vercel failover test. No DNS route is attached." >> "$GITHUB_STEP_SUMMARY"
          echo "The authorized domain account must separately deploy and test the same gateway-worker.mjs." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for real public standby browser smoke
        if: ${{ env.TARGET == 'standby' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify live public API, assets, CORS, protection and hydration
        if: ${{ env.TARGET == 'standby' }}
        env:
          RUN_BROWSER_SMOKE: "true"
        shell: bash
        run: |
          set -euo pipefail
          export STANDBY_BASE_URL="https://$SERVICE.$CF_WORKERS_SUBDOMAIN.workers.dev"
          node cloudflare/web-failover/standby-smoke.mjs
          echo "PASS: live public standby and browser smoke at $STANDBY_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
