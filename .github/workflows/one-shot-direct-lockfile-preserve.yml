name: One-shot conservative direct lockfile refresh

on:
  push:
    branches:
      - deps/direct-package-json-refresh-2026-08-15
    paths:
      - .github/workflows/one-shot-direct-lockfile-preserve.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/direct-package-json-refresh-2026-08-15
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore dependency files from master
        run: git checkout origin/master -- package.json pnpm-lock.yaml

      - name: Change only selected direct package.json versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const updates = {
            dependencies: {
              '@mui/icons-material': '^9.3.1',
              '@mui/material': '^9.3.1',
              '@tanstack/react-table': '^9.1.2'
            },
            devDependencies: {
              '@testing-library/jest-dom': '^7.0.1',
              '@testing-library/user-event': '^14.6.4',
              'eslint-plugin-react-refresh': '^0.5.4',
              'globals': '^17.10.0',
              'wrangler': '^4.121.0'
            }
          };
          for (const [section, deps] of Object.entries(updates)) {
            for (const [name, version] of Object.entries(deps)) {
              if (!Object.prototype.hasOwnProperty.call(pkg[section] || {}, name)) {
                throw new Error(`Refusing to add undeclared dependency: ${section}.${name}`);
              }
              pkg[section][name] = version;
            }
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Update lockfile without independently updating transitive packages
        run: pnpm install --lockfile-only

      - name: Verify dependency policy boundaries
        run: |
          git diff --exit-code -- pnpm-workspace.yaml .node-version .github/workflows/ci.yml .github/workflows/dependency-monitoring.yml .github/workflows/dependency-status-sync.yml .github/workflows/worker-production.yml
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const before = JSON.parse(execFileSync('git', ['show', 'origin/master:package.json'], { encoding: 'utf8' }));
          const after = require('./package.json');
          const allowed = new Set([
            '@mui/icons-material', '@mui/material', '@tanstack/react-table',
            '@testing-library/jest-dom', '@testing-library/user-event',
            'eslint-plugin-react-refresh', 'globals', 'wrangler'
          ]);
          for (const section of ['dependencies', 'devDependencies']) {
            const names = new Set([...Object.keys(before[section] || {}), ...Object.keys(after[section] || {})]);
            for (const name of names) {
              if ((before[section] || {})[name] !== (after[section] || {})[name] && !allowed.has(name)) {
                throw new Error(`Unexpected direct dependency change: ${section}.${name}`);
              }
            }
          }
          for (const field of ['engines', 'packageManager']) {
            if (JSON.stringify(before[field]) !== JSON.stringify(after[field])) throw new Error(`Unexpected metadata change: ${field}`);
          }
          NODE

      - name: Commit conservative direct dependency refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'chore(deps): preserve unchanged transitive resolutions'
          git push origin HEAD:deps/direct-package-json-refresh-2026-08-15
