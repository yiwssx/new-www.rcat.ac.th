name: P5X Dependency Status Once

on:
  push:
    branches:
      - agent/p5x-production-convergence

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ github.event.head_commit.message != 'chore(p5x): commit refreshed dependency status' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5x-production-convergence
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm deps:status
      - name: Commit generated report
        shell: bash
        run: |
          if git diff --quiet -- docs/maintenance/dependency-current-status.md; then
            echo "Dependency status report already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          git commit -m "chore(p5x): commit refreshed dependency status"
          git push origin HEAD:agent/p5x-production-convergence
