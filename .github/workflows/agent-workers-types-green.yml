name: Agent Workers Types Green

on:
  push:
    branches:
      - agent/workers-types-green-20260826

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm add -D @cloudflare/workers-types@5.20260823.1
      - run: pnpm deps:status
      - run: |
          pnpm deps:check
          pnpm deps:latest:check
          pnpm deps:docs:audit
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml docs/maintenance/dependency-current-status.md
          git commit -m "chore(deps): update workers types freshness"
          git push origin HEAD:agent/workers-types-green-20260826
