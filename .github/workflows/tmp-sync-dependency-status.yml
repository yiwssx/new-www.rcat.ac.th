name: Temporary dependency status sync

on:
  push:
    branches:
      - chore/sync-dependency-status-router-17035
    paths-ignore:
      - docs/maintenance/dependency-current-status.md

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm deps:status
      - name: Commit generated dependency status
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/maintenance/dependency-current-status.md
          if git diff --cached --quiet; then
            echo 'Dependency status already matches generated state.'
            exit 0
          fi
          git commit -m 'docs(deps): refresh dependency status after Router update'
          git push origin HEAD:chore/sync-dependency-status-router-17035
