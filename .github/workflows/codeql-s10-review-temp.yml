name: Temporary S10 Context Alert Disposition
on:
  push:
    branches:
      - security/codeql-s10-alert-disposition
permissions:
  contents: read
  security-events: write
jobs:
  document-and-dismiss-context-findings:
    if: github.repository == 'yiwssx/new-www.rcat.ac.th'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify default branch and exact contextual alert rules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPO}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          main_sha="$(curl --fail-with-body -sSL "${headers[@]}" "${api}/branches/main" | jq -r '.commit.sha')"
          test "${main_sha}" = "ada2ae7529c9eaaf20a20e2390f2643dc4af13f1"
          for id in 8 9 10; do
            case "${id}" in
              8) rule="js/clear-text-logging" ;;
              9|10) rule="js/insufficient-password-hash" ;;
            esac
            json="$(curl --fail-with-body -sSL "${headers[@]}" "${api}/code-scanning/alerts/${id}")"
            printf '%s' "${json}" | jq -e --arg rule "${rule}" '.state == "open" and .rule.id == $rule' >/dev/null
          done
          echo "Three contextual alerts verified as open on exact main SHA"
      - name: Record exact false-positive dispositions for 8 9 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPO}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          for id in 8 9 10; do
            case "${id}" in
              8)
                explanation="S07 audited 2026-10-09: this diagnostic logs only numeric aggregate failed-auth/MFA and locked-account counts and severity; no password, credential, user identity or raw event rows are logged. See CodeQL Security tracker and PR #541."
                ;;
              9)
                explanation="S07 audited 2026-10-09: this disposable QA fixture computes a domain-separated SHA-384 prehash, then applies bcrypt cost 12 and verifies bcrypt.compare. Final stored credential is bcrypt-sha384-v1, not the flagged fast hash alone. See CodeQL Security tracker."
                ;;
              10)
                explanation="S07 audited 2026-10-09: HMAC-SHA256 is a secret-keyed pseudonymous map key for rate-limit buckets, not password storage or verification. Authentication passwords use bcrypt-sha384-v1 cost 12. Regression test in PR #541 verifies key derivation."
                ;;
            esac
            body="$(jq -nc --arg reason "${explanation}" '{state: "dismissed", dismissed_reason: "false positive", dismissed_comment: $reason}')"
            response="$(curl --fail-with-body -sSL -X PATCH "${headers[@]}" -H "Content-Type: application/json" -d "${body}" "${api}/code-scanning/alerts/${id}")"
            printf '%s' "${response}" | jq -ec '{number, state, dismissed_reason}'
            printf '%s' "${response}" | jq -e '.state == "dismissed" and .dismissed_reason == "false positive"' >/dev/null
          done
