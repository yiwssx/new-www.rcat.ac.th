name: Temporary S10 Code Scanning Review
on:
  push:
    branches:
      - security/codeql-s10-alert-disposition
permissions:
  contents: read
  security-events: read
jobs:
  inspect-four-context-alerts:
    if: github.repository == 'yiwssx/new-www.rcat.ac.th'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect alert metadata for main (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for alert in 7 8 9 10; do
            json="$(curl --fail-with-body --silent --show-error -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/code-scanning/alerts/${alert}")"
            printf '%s' "$json" | jq -c '{number, state, rule: .rule.id, description: .rule.description, location: .most_recent_instance.location, message: .most_recent_instance.message.text, dismissed_reason}'
          done
