name: Dependency Status Prettier Apply

on:
  push:
    branches:
      - chore/dependency-status-gate-repair

permissions:
  contents: write

jobs:
  prettier-apply:
    if: github.repository == 'yiwssx/new-www.rcat.ac.th' && github.ref == 'refs/heads/chore/dependency-status-gate-repair'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/dependency-status-gate-repair
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Apply canonical formatting only to dependency snapshot
        shell: bash
        run: |
          pnpm exec prettier --write docs/maintenance/dependency-current-status.md
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Dependency snapshot is already formatted."
            exit 0
          fi
          test "$changed" = "docs/maintenance/dependency-current-status.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          git commit -m "style(deps): apply exact Prettier output"
          git push origin HEAD:refs/heads/chore/dependency-status-gate-repair
