name: Dependency Audit Diagnostic

on:
  push:
    branches:
      - chore/full-repo-conflict-cleanup-2026-09-09

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Generate dependency status
        run: pnpm deps:status
      - name: Format generated status
        run: pnpm exec prettier --write docs/maintenance/dependency-current-status.md
      - name: Full audit JSON
        run: pnpm audit --json
      - name: Production audit JSON
        run: pnpm audit --prod --json
      - name: Commit regenerated dependency state
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml docs/maintenance/dependency-current-status.md; then
            echo "No generated dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml docs/maintenance/dependency-current-status.md
          git commit -m "fix(deps): refresh secure dependency state"
          git push
