name: P5X Prettier Once

on:
  push:
    branches:
      - agent/p5x-production-convergence

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message != 'style(p5x): commit exact Prettier output' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5x-production-convergence
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write cloudflare/public-api/scripts/worker-production-preflight.mjs
      - name: Commit exact Prettier output
        shell: bash
        run: |
          if git diff --quiet -- cloudflare/public-api/scripts/worker-production-preflight.mjs; then
            echo "Prettier output already exact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/public-api/scripts/worker-production-preflight.mjs
          git commit -m "style(p5x): commit exact Prettier output"
          git push origin HEAD:agent/p5x-production-convergence
