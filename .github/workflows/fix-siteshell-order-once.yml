name: Fix SiteShell title order once

on:
  push:
    branches:
      - fix/siteshell-award-title-order

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/siteshell-award-title-order
          fetch-depth: 0

      - name: Correct SiteShell award and English-name order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/public/components/PublicSiteShell.tsx')
          text = path.read_text(encoding='utf-8')

          old_top = '''                    {siteSettings.intro && (\n                      <Typography\n                        sx={{\n                          color: "secondary.dark",\n                          fontSize: { xs: "0.74rem", md: "0.82rem" },\n                          fontWeight: 700,\n                          letterSpacing: "0.02em",\n                          lineHeight: 1.25,\n                          textTransform: "uppercase",\n                          mb: { xs: 0.2, md: 0.4 }\n                        }}\n                      >\n                        <FlagEmojiText text={siteSettings.intro} />\n                      </Typography>\n                    )}\n'''

          old_bottom = '''                    {siteSettings.eyebrow && (\n                      <Stack\n                        direction="row"\n                        spacing={0.8}\n                        sx={{\n                          alignItems: "center",\n                          mt: { xs: 0.35, md: 0.6 }\n                        }}\n                      >\n                        <EmojiEventsOutlinedIcon sx={{ color: "secondary.dark", fontSize: { xs: 17, md: 24 } }} />\n                        <Typography\n                          sx={{\n                            color: "text.secondary",\n                            maxWidth: 860,\n                            fontSize: { xs: "0.78rem", md: "1rem" },\n                            overflow: { xs: "hidden", md: "visible" },\n                            display: { xs: "-webkit-box", md: "block" },\n                            WebkitBoxOrient: "vertical",\n                            WebkitLineClamp: { xs: 1, md: "unset" }\n                          }}\n                        >\n                          <FlagEmojiText text={siteSettings.eyebrow} />\n                        </Typography>\n                      </Stack>\n                    )}\n'''

          new_top = '''                    {siteSettings.eyebrow && (\n                      <Stack\n                        direction="row"\n                        spacing={0.8}\n                        sx={{\n                          alignItems: "center",\n                          mb: { xs: 0.2, md: 0.4 }\n                        }}\n                      >\n                        <EmojiEventsOutlinedIcon sx={{ color: "secondary.dark", fontSize: { xs: 17, md: 24 } }} />\n                        <Typography\n                          sx={{\n                            color: "secondary.dark",\n                            fontSize: { xs: "0.74rem", md: "0.82rem" },\n                            fontWeight: 700,\n                            letterSpacing: "0.02em",\n                            lineHeight: 1.25\n                          }}\n                        >\n                          <FlagEmojiText text={siteSettings.eyebrow} />\n                        </Typography>\n                      </Stack>\n                    )}\n'''

          new_bottom = '''                    {siteSettings.intro && (\n                      <Typography\n                        sx={{\n                          color: "text.secondary",\n                          maxWidth: 860,\n                          fontSize: { xs: "0.78rem", md: "1rem" },\n                          fontWeight: 700,\n                          letterSpacing: "0.02em",\n                          lineHeight: 1.25,\n                          textTransform: "uppercase",\n                          mt: { xs: 0.35, md: 0.6 },\n                          overflow: { xs: "hidden", md: "visible" },\n                          display: { xs: "-webkit-box", md: "block" },\n                          WebkitBoxOrient: "vertical",\n                          WebkitLineClamp: { xs: 1, md: "unset" }\n                        }}\n                      >\n                        <FlagEmojiText text={siteSettings.intro} />\n                      </Typography>\n                    )}\n'''

          if text.count(old_top) != 1:
              raise SystemExit(f'expected exactly one current intro-top block, found {text.count(old_top)}')
          if text.count(old_bottom) != 1:
              raise SystemExit(f'expected exactly one current award-bottom block, found {text.count(old_bottom)}')

          text = text.replace(old_top, new_top, 1)
          text = text.replace(old_bottom, new_bottom, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-siteshell-order-once.yml
          git add src/public/components/PublicSiteShell.tsx
          git diff --cached --check
          git commit -m "fix: correct SiteShell award title order"
          git push origin HEAD:fix/siteshell-award-title-order
