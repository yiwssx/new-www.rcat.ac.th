name: v3.3.2 Task 5 Transform

on:
  push:
    branches:
      - feat/v3.3.2-task-5-loading-waterfall-control
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message || '', 'apply loading waterfall control') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: node scripts/v332-task5-waterfall-control.mjs
      - run: pnpm exec prettier --write src/admin/components/contentEditorModuleLoader.ts src/admin/components/RichTextEditor.tsx src/admin/pages/ContentPage.tsx src/admin/pages/ContentPage.test.tsx docs/workstreams/v3.3.2-content-editor-performance-tracker.md
      - name: Commit generated Task 5 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/components/contentEditorModuleLoader.ts src/admin/components/RichTextEditor.tsx src/admin/pages/ContentPage.tsx src/admin/pages/ContentPage.test.tsx docs/workstreams/v3.3.2-content-editor-performance-tracker.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "perf(editor): apply loading waterfall control"
          git push origin HEAD:feat/v3.3.2-task-5-loading-waterfall-control
