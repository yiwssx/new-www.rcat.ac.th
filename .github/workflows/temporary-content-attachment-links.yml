name: Temporary Content Attachment Links

on:
  push:
    branches:
      - agent/content-attachment-links

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply attachment link patch
        run: |
          python scripts/temporary-content-attachment-links.py
          python scripts/temporary-content-attachment-links-test-fix.py
      - name: Format changed files
        run: pnpm exec prettier --write src/utils/contentBlocks.ts src/admin/components/ContentBlockBuilder.tsx src/admin/components/ContentBlockBuilder.test.tsx src/shared/components/ContentBlocksRenderer.tsx src/utils/contentBlocks.test.ts src/test/contentBlocksRenderer.test.tsx
      - name: Focused lint
        run: pnpm exec eslint src/utils/contentBlocks.ts src/admin/components/ContentBlockBuilder.tsx src/admin/components/ContentBlockBuilder.test.tsx src/shared/components/ContentBlocksRenderer.tsx src/utils/contentBlocks.test.ts src/test/contentBlocksRenderer.test.tsx --max-warnings=0
      - name: Focused tests
        run: pnpm exec vitest run src/utils/contentBlocks.test.ts src/admin/components/ContentBlockBuilder.test.tsx src/test/contentBlocksRenderer.test.tsx
      - name: Production build
        run: pnpm build
      - name: Commit feature files
        run: |
          git config user.name "Supharoek Sudadet"
          git config user.email "48784420+yiwssx@users.noreply.github.com"
          git add src/utils/contentBlocks.ts src/admin/components/ContentBlockBuilder.tsx src/admin/components/ContentBlockBuilder.test.tsx src/shared/components/ContentBlocksRenderer.tsx src/utils/contentBlocks.test.ts src/test/contentBlocksRenderer.test.tsx
          if git diff --cached --quiet; then
            echo "No feature changes to commit"
            exit 0
          fi
          git commit -m "feat(content): add attachment link blocks"
          git push origin HEAD:agent/content-attachment-links
