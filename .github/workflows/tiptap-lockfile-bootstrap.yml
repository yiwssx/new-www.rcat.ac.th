name: Bootstrap Tiptap Lockfile

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/tiptap-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/tiptap-rich-text-editor'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tiptap-rich-text-editor
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install and refresh lockfile
        run: pnpm install --lockfile-only --strict-peer-dependencies
      - name: Format changed source files
        run: >
          pnpm prettier --write
          src/admin/components/ContentBlockBuilder.tsx
          src/admin/components/ContentEditorDialog.tsx
          src/admin/components/RichTextEditor.tsx
          src/shared/components/ContentBlocksRenderer.tsx
          src/shared/components/RichTextRenderer.tsx
          src/utils/contentBlocks.ts
          src/utils/contentBlocks.test.ts
      - name: Refresh dependency status
        run: pnpm deps:status
      - name: Commit generated maintenance files
        run: |
          if git diff --quiet; then
            echo "Generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml docs/maintenance/dependency-current-status.md             src/admin/components/ContentBlockBuilder.tsx             src/admin/components/ContentEditorDialog.tsx             src/admin/components/RichTextEditor.tsx             src/shared/components/ContentBlocksRenderer.tsx             src/shared/components/RichTextRenderer.tsx             src/utils/contentBlocks.ts             src/utils/contentBlocks.test.ts
          git commit -m "chore(cms): refresh generated Tiptap artifacts"
          git push origin HEAD:feat/tiptap-rich-text-editor
