name: Bootstrap Tiptap Lockfile

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/tiptap-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/tiptap-rich-text-editor'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tiptap-rich-text-editor
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --strict-peer-dependencies
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh lockfile for Tiptap"
          git push origin HEAD:feat/tiptap-rich-text-editor
