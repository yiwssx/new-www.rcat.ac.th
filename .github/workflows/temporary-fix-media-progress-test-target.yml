name: Temporary Fix Media Progress Test Target

on:
  push:
    branches:
      - agent/media-upload-progress-lock
    paths:
      - .github/workflows/temporary-fix-media-progress-test-target.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-upload-progress-lock
      - name: Fix ES target compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/cms-media/mediaBridgeClient.test.ts')
          text = path.read_text()
          old = 'expect(onProgress.mock.calls.at(-1)?.[0]).toEqual({'
          new = 'expect(onProgress.mock.calls[onProgress.mock.calls.length - 1]?.[0]).toEqual({'
          if text.count(old) != 1:
              raise SystemExit(f'expected one .at regression marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify build
        run: |
          corepack enable
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm exec prettier --write src/features/cms-media/mediaBridgeClient.test.ts
          pnpm exec eslint src/features/cms-media/mediaBridgeClient.test.ts
          pnpm build
      - name: Commit test compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/cms-media/mediaBridgeClient.test.ts
          git commit -m "test(media): keep progress assertions target-compatible"
          git push origin HEAD:agent/media-upload-progress-lock
