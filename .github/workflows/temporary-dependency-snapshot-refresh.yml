name: Temporary Dependency Snapshot Refresh

on:
  push:
    branches:
      - fix/phase-a-smoke-concurrency-2026-09-09

permissions:
  contents: write

concurrency:
  group: temporary-dependency-snapshot-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts

      - name: Regenerate canonical dependency status
        run: |
          pnpm deps:status
          pnpm exec prettier --write docs/maintenance/dependency-current-status.md
          pnpm deps:check
          pnpm deps:docs:audit

      - name: Verify generated change scope
        shell: bash
        run: |
          unexpected="$(git status --porcelain --untracked-files=no | awk '$2 != "docs/maintenance/dependency-current-status.md" { print }')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes after dependency status generation:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          git add docs/maintenance/dependency-current-status.md
          if git diff --cached --quiet; then
            echo "Dependency status snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): refresh Playwright dependency snapshot"
          git push origin HEAD:fix/phase-a-smoke-concurrency-2026-09-09
