name: Organization formatting diagnostic (temporary)
on:
  push:
    branches:
      - agent/org-01-domain-schema
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show formatting differences (do not modify files)
        run: |
          for file in cloudflare/public-api/test/organizationDomainMigration.test.ts cloudflare/public-api/test/organizationReadRepository.test.ts; do
            echo "=== $file ==="
            pnpm exec prettier "$file" | diff -u "$file" - || true
          done
