name: One-shot P2 Formatter

on:
  push:
    branches:
      - p2-hardening-20260815
    paths:
      - .github/workflows/one-shot-p2-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p2-hardening-20260815
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write scripts/check-d1-migration-sequences.mjs scripts/vercel-ignore-build.mjs src/test/vercelIgnoreBuild.test.mjs
      - name: Commit formatted files and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-p2-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-d1-migration-sequences.mjs scripts/vercel-ignore-build.mjs src/test/vercelIgnoreBuild.test.mjs .github/workflows/one-shot-p2-format.yml
          if git diff --cached --quiet; then
            echo "No formatter changes to commit"
            exit 0
          fi
          git commit -m "style(p2): apply repository formatter"
          git push origin HEAD:p2-hardening-20260815
