name: P5 Branch Fixup

on:
  push:
    branches:
      - agent/p5a-p5d-data-ssr-efficiency

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5a-p5d-data-ssr-efficiency

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Apply compatibility test fixups
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          function replace(path, from, to) {
            const source = fs.readFileSync(path, "utf8");
            if (!source.includes(from)) {
              if (source.includes(to)) return;
              throw new Error(`Expected text not found in ${path}: ${from}`);
            }
            fs.writeFileSync(path, source.replace(from, to));
          }

          replace(
            "src/public/routing/publicRouteLoaders.ts",
            "export async function loadPublicCmsSnapshotData() {",
            "export async function loadPublicCmsSnapshotData(_context?: PublicRouteLoaderContext) {"
          );

          replace(
            "src/features/public-content/types.ts",
            "  relatedItems: PublicContentCardItem[];",
            "  relatedItems?: PublicContentCardItem[];"
          );

          replace(
            "src/test/publicDataDrivenPages.test.tsx",
            "function createHomeSnapshot(overrides: Partial<PublicHomeSnapshot> = {}): PublicHomeSnapshot {",
            'type TestHomeSnapshot = PublicHomeSnapshot &\n  Pick<Required<CmsSnapshot>, "siteSettings" | "homepageSettings" | "displaySettings" | "menu">;\n\nfunction createHomeSnapshot(overrides: Partial<PublicHomeSnapshot> = {}): TestHomeSnapshot {'
          );

          replace(
            "src/test/publicCmsCache.test.ts",
            "    const homeSnapshot: PublicHomeSnapshot = {",
            "    const homeSnapshot = {"
          );

          replace(
            "src/test/publicContentDetailPage.test.tsx",
            "  usePublicContentDetail: () => ({\n    data: currentDetail,\n    ...currentDetailQueryState\n  })",
            "  usePublicContentDetail: () => ({\n    data: currentDetail,\n    media: currentSnapshot?.media ?? [],\n    relatedItems: [],\n    ...currentDetailQueryState\n  })"
          );
          NODE

      - run: pnpm format

      - name: Commit branch fixup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No fixup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(p5): apply branch fixups and formatting"
          git push origin HEAD:agent/p5a-p5d-data-ssr-efficiency
