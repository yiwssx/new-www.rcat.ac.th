name: Temporary Run Media Progress Patch

on:
  push:
    branches:
      - agent/media-upload-progress-lock
    paths:
      - .github/workflows/temporary-run-media-progress-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-upload-progress-lock
      - name: Apply guarded source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/temporary-media-upload-progress.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Format touched files"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('unable to locate guarded source patch')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          bad = "\n  return null;'''"
          if script.count(bad) != 2:
              raise SystemExit(f'expected 2 malformed return markers, found {script.count(bad)}')
          script = script.replace(bad, "\n    return null;'''")
          script = script.replace("Path('.github/workflows/temporary-media-upload-progress.yml').unlink()\n", '')
          exec(compile(script, '<guarded-media-progress-patch>', 'exec'), {})
          PY
      - name: Format and validate focused source
        run: |
          corepack enable
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm exec prettier --write \
            src/features/cms-media/mediaBridgeClient.ts \
            src/features/cms-media/api.ts \
            src/features/cms-media/index.ts \
            src/admin/components/MediaUploadProgressFeedback.tsx \
            src/admin/components/ContentEditorDialog.tsx \
            src/admin/pages/MediaPage.tsx \
            src/admin/pages/ContentPage.tsx
          pnpm exec tsc --noEmit
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/cms-media/mediaBridgeClient.ts \
            src/features/cms-media/api.ts \
            src/features/cms-media/index.ts \
            src/admin/components/MediaUploadProgressFeedback.tsx \
            src/admin/components/ContentEditorDialog.tsx \
            src/admin/pages/MediaPage.tsx \
            src/admin/pages/ContentPage.tsx
          git commit -m "feat(media): show upload progress and block duplicate submits"
          git push origin HEAD:agent/media-upload-progress-lock
