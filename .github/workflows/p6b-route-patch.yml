name: P6B Route Patch

on:
  push:
    branches:
      - fix/p6b-dedicated-security-token
    paths:
      - ".github/workflows/p6b-route-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p6b-dedicated-security-token
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Patch route guards
        run: |
          python - <<'PY'
          from pathlib import Path

          cms = Path("cloudflare/public-api/src/routes/cmsAuthInternal.ts")
          text = cms.read_text()
          anchor = 'import { json, jsonError, methodNotAllowed } from "../responses";\n'
          addition = '''import {\n  SecurityRateLimitExceeded,\n  SecurityRateLimitUnavailable,\n  enforceSecurityRateLimit\n} from "../securityRateLimit";\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("cms import anchor missing")
              text = text.replace(anchor, anchor + addition, 1)
          anchor = '''  const authorizationError = await authorizeInternalRequest(request, env);\n\n  if (authorizationError) {\n    return authorizationError;\n  }\n\n  const now = dependencies.now?.() ?? new Date();\n'''
          replacement = '''  const authorizationError = await authorizeInternalRequest(request, env);\n\n  if (authorizationError) {\n    return authorizationError;\n  }\n\n  try {\n    await enforceSecurityRateLimit(request, env, "cms-auth");\n  } catch (error) {\n    if (error instanceof SecurityRateLimitExceeded) {\n      const response = internalError("too many authentication requests", 429);\n      response.headers.set("Retry-After", String(error.retryAfterSeconds));\n      return response;\n    }\n\n    if (error instanceof SecurityRateLimitUnavailable) {\n      return internalError("CMS authentication is unavailable", 503);\n    }\n\n    throw error;\n  }\n\n  const now = dependencies.now?.() ?? new Date();\n'''
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit("cms authorization anchor missing")
              text = text.replace(anchor, replacement, 1)
          cms.write_text(text)

          admin = Path("cloudflare/public-api/src/routes/adminWrite.ts")
          text = admin.read_text()
          anchor = 'import { json, jsonError, methodNotAllowed } from "../responses";\n'
          addition = '''import {\n  SecurityRateLimitExceeded,\n  SecurityRateLimitUnavailable,\n  enforceSecurityRateLimit\n} from "../securityRateLimit";\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("admin import anchor missing")
              text = text.replace(anchor, anchor + addition, 1)
          anchor = '''  if (authResult.response || !authResult.identity) {\n    const response =\n      authResult.response ??\n      jsonError("admin authentication failed", 403, {\n        resource: "admin-structured-data"\n      });\n\n    if (isMediaBridgeAuthorizationProbe) {\n      response.headers.set("Cache-Control", "no-store");\n    }\n\n    return response;\n  }\n\n  if (!env.DB) {\n'''
          replacement = '''  if (authResult.response || !authResult.identity) {\n    const response =\n      authResult.response ??\n      jsonError("admin authentication failed", 403, {\n        resource: "admin-structured-data"\n      });\n\n    if (isMediaBridgeAuthorizationProbe) {\n      response.headers.set("Cache-Control", "no-store");\n    }\n\n    return response;\n  }\n\n  try {\n    await enforceSecurityRateLimit(request, env, "admin-api");\n  } catch (error) {\n    if (error instanceof SecurityRateLimitExceeded) {\n      const response = jsonError("too many admin requests", 429, { resource: "admin-structured-data" });\n      response.headers.set("Cache-Control", "no-store");\n      response.headers.set("Retry-After", String(error.retryAfterSeconds));\n      return response;\n    }\n\n    if (error instanceof SecurityRateLimitUnavailable) {\n      return jsonError("admin security service is unavailable", 503, { resource: "admin-structured-data" });\n    }\n\n    throw error;\n  }\n\n  if (!env.DB) {\n'''
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit("admin auth anchor missing")
              text = text.replace(anchor, replacement, 1)
          admin.write_text(text)
          PY
      - run: pnpm exec prettier --write cloudflare/public-api/src/routes/cmsAuthInternal.ts cloudflare/public-api/src/routes/adminWrite.ts
      - name: Commit route guards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/public-api/src/routes/cmsAuthInternal.ts cloudflare/public-api/src/routes/adminWrite.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(security): enforce Worker auth and admin rate limits"
          git push origin HEAD:fix/p6b-dedicated-security-token
