name: Temporary Dependency Status Repair

on:
  push:
    branches:
      - fix/renovate-status-before-merge-20260921-v2
    paths:
      - .github/workflows/temporary-dependency-status-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/renovate-status-before-merge-20260921-v2
      - uses: ./.github/actions/setup-project
      - run: pnpm deps:status
      - name: Commit repaired status snapshot
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --quiet -- package.json pnpm-lock.yaml pnpm-workspace.yaml config/dependency-policy.json .node-version || {
            echo "Unexpected dependency input mutation"
            exit 1
          }
          if git diff --quiet -- docs/maintenance/dependency-current-status.md; then
            echo "Dependency status already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          HUSKY=0 git commit -m "docs(deps): refresh current dependency status"
          git push origin HEAD
