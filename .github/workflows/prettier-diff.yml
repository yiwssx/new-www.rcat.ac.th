name: Prettier Diff

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write src/admin/components/ContentWorkflowGuide.tsx src/features/cms-content/legacyFacebookThumbnailBackfill.ts
          git diff -- src/admin/components/ContentWorkflowGuide.tsx src/features/cms-content/legacyFacebookThumbnailBackfill.ts
