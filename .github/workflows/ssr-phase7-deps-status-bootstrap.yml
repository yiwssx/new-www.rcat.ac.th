name: SSR Phase 7 Dependency Status Bootstrap

on:
  push:
    branches:
      - feat/ssr-phase7-vercel-cutover
  pull_request:
    branches:
      - refactor/ssr-readiness

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ssr-phase7-vercel-cutover

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm deps:status
      - run: |
          if git diff --quiet -- docs/maintenance/dependency-current-status.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          git commit -m "docs(deps): refresh dependency status for SSR integration"
          git push origin HEAD:feat/ssr-phase7-vercel-cutover
