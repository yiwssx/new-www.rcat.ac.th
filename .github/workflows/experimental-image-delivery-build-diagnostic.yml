name: Experimental / Image Delivery Build Diagnostic

on:
  push:
    branches:
      - experiment/image-delivery-rollout

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Production build diagnostic
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: image-delivery-build-${{ github.run_id }}
          path: build.log
          retention-days: 1
      - name: Fail when build failed
        if: ${{ steps.build.outputs.exit_code != '0' }}
        run: exit 1
