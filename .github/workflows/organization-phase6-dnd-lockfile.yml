name: Organization Phase 6 DnD Lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: org-phase6-dnd-lockfile-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/org-01-domain-schema' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Regenerate pnpm v10 lockfile with strict peer checks
        uses: ./.github/actions/setup-project
        with:
          install-args: --lockfile-only --no-frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Commit lockfile only on exact matching branch head
        id: update
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet --exit-code -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(organization): lock dnd-kit for Phase 6"
          CURRENT_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "Branch advanced: skip obsolete generated lockfile"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch CI on lockfile commit
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api --method POST "repos/$GH_REPO/actions/workflows/ci.yml/dispatches" -f "ref=$BRANCH"
