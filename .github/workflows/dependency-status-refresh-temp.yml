name: Dependency Status Refresh Temp

on:
  push:
    branches:
      - chore/refresh-dependency-status

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm deps:status
      - name: Commit generated dependency status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          if git diff --cached --quiet; then
            echo "Dependency status is already current."
            exit 0
          fi
          git commit -m "docs(deps): refresh dependency status"
          git push
