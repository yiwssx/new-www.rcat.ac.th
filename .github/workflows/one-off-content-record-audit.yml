name: One-off Content Record Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-off-content-record-audit.yml"

permissions:
  contents: read

jobs:
  audit-content-record:
    name: Audit school board news record
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Require protected D1 read credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID"
      - name: Resolve exact production D1 identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs --database-list "$RUNNER_TEMP/d1-databases.json" --verify-identity-only
      - name: Query target content metadata
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          set -euo pipefail
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" --remote --json --command="SELECT id, title, slug, type, status, owner, publish_at, published_at, updated_at, deleted_at, canonical_url FROM contents WHERE title LIKE '%คณะกรรมการสถานศึกษา%' OR summary LIKE '%คณะกรรมการสถานศึกษา%' ORDER BY updated_at DESC LIMIT 20;" > "$RUNNER_TEMP/target-content.json"
          node - "$RUNNER_TEMP/target-content.json" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rows = payload.flatMap((entry) => Array.isArray(entry?.results) ? entry.results : []);
          console.log(JSON.stringify({ count: rows.length, rows }, null, 2));
          if (rows.length === 0) process.exitCode = 2;
          NODE
