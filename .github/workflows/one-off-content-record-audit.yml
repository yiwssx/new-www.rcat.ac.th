name: One-off Content Record Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-off-content-record-audit.yml"

permissions:
  contents: read

jobs:
  audit-content-record:
    name: Audit school board news record
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Require protected D1 read credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID"
      - name: Resolve exact production D1 identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs --database-list "$RUNNER_TEMP/d1-databases.json" --verify-identity-only
      - name: Query production D1 schema and target content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          set -euo pipefail

          query_d1() {
            local label="$1"
            local sql="$2"
            local output="$RUNNER_TEMP/${label}.json"
            local request="$RUNNER_TEMP/${label}-request.json"

            node -e 'require("fs").writeFileSync(process.argv[2], JSON.stringify({ sql: process.argv[1] }))' "$sql" "$request"

            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${RCAT_PRODUCTION_D1_DATABASE_ID}/query" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "@${request}" \
              --output "$output"

            node - "$label" "$output" <<'NODE'
          const fs = require('fs');
          const label = process.argv[2];
          const path = process.argv[3];
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (payload.success !== true) {
            console.error(JSON.stringify({ label, success: false, errors: payload.errors ?? [], messages: payload.messages ?? [] }, null, 2));
            process.exit(1);
          }

          const statements = Array.isArray(payload.result) ? payload.result : [];
          const rows = statements.flatMap((entry) => Array.isArray(entry?.results) ? entry.results : []);
          console.log(JSON.stringify({ label, count: rows.length, rows }, null, 2));
          NODE
          }

          query_d1 "contents-schema" "PRAGMA table_info(contents);"
          query_d1 "school-board-target" "SELECT id, title, slug, type, status, publish_at, updated_at FROM contents WHERE title LIKE '%คณะกรรมการสถานศึกษา%' OR summary LIKE '%คณะกรรมการสถานศึกษา%' ORDER BY updated_at DESC LIMIT 20;"
          query_d1 "recent-news-window" "SELECT id, title, slug, type, status, publish_at, updated_at FROM contents WHERE type = 'news' AND (publish_at >= '2026-09-29' OR updated_at >= '2026-09-29') ORDER BY updated_at DESC LIMIT 30;"
