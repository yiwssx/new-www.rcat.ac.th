name: Temporary MUI FocusTrap Patch

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/temporary-mui-focustrap-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependency-cleanup-react-jsdom-20260920
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Create narrow MUI FocusTrap compatibility patch
        shell: bash
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies
          rm -rf /tmp/mui-material-patch
          pnpm patch @mui/material@9.4.0 --edit-dir /tmp/mui-material-patch
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const root = "/tmp/mui-material-patch";
          const oldText = "if (!disableRestoreFocus && nodeToRestore.current) {";
          const newText =
            "if (!disableRestoreFocus && typeof nodeToRestore.current?.focus === \"function\") {";
          let changed = 0;

          async function visit(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name);
              if (entry.isDirectory()) {
                await visit(path);
                continue;
              }
              if (!/^FocusTrap\.(?:js|mjs)$/.test(entry.name)) {
                continue;
              }
              const source = await readFile(path, "utf8");
              if (!source.includes(oldText)) {
                continue;
              }
              const next = source.replaceAll(oldText, newText);
              await writeFile(path, next);
              changed += 1;
              console.log(`patched ${path}`);
            }
          }

          await visit(root);
          if (changed === 0) {
            throw new Error("MUI FocusTrap restore-focus guard was not found");
          }
          console.log(`patched FocusTrap files: ${changed}`);
          NODE
          pnpm --config.frozen-lockfile=false patch-commit /tmp/mui-material-patch
          pnpm install --no-frozen-lockfile --strict-peer-dependencies
          pnpm deps:status
      - name: Commit patch and generated dependency state
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-workspace.yaml pnpm-lock.yaml patches docs/maintenance/dependency-current-status.md
          if git diff --cached --quiet; then
            echo "No generated patch changes."
            exit 1
          fi
          git commit -m "fix(test): guard MUI focus restoration for jsdom 30.1"
          git push origin HEAD
