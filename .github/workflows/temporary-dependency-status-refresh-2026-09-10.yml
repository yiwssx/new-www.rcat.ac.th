name: Temporary Dependency Status Refresh 2026-09-10

on:
  push:
    branches:
      - chore-refresh-dependency-status-2026-09-10

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore-refresh-dependency-status-2026-09-10
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Regenerate dependency status
        run: pnpm deps:status
      - name: Validate dependency contract
        run: |
          pnpm deps:status:check
          pnpm deps:check
          pnpm deps:docs:audit
      - name: Commit generated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          git diff --cached --quiet && { echo "No snapshot change generated"; exit 1; }
          git commit -m "chore(deps): refresh dependency status after eslint update"
          git push origin HEAD:chore-refresh-dependency-status-2026-09-10
