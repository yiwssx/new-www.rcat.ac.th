name: SSR Phase 7 Undici Probe

on:
  pull_request:
    branches:
      - refactor/ssr-readiness

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Current dependency path
        run: pnpm why undici
      - name: Patched undici metadata
        run: pnpm view undici@7.29.0 version time dist-tags --json
      - name: Current and recent Wrangler metadata
        run: |
          pnpm view wrangler@4.116.0 version dependencies.miniflare --json
          pnpm view wrangler@4.118.0 version dependencies.miniflare --json
          pnpm view wrangler dist-tags time --json
      - name: Miniflare metadata
        run: |
          pnpm view miniflare@4.20260730.0 version dependencies.undici --json || true
          pnpm view miniflare@5.20260730.0-alpha version dependencies.undici --json || true
          pnpm view miniflare dist-tags time --json
