name: Temporary Media Upload Progress Patch

on:
  push:
    branches:
      - agent/media-upload-progress-lock
    paths:
      - .github/workflows/temporary-media-upload-progress.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-upload-progress-lock
      - name: Apply upload progress and double-submit lock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # mediaBridgeClient.ts: expose byte progress from the Drive resumable session.
          p = Path('src/features/cms-media/mediaBridgeClient.ts')
          text = p.read_text()
          old = '''interface MediaUploadRecoveryOptions {
            createUploadKey?: () => string;
            delay?: (milliseconds: number) => Promise<void>;
            random?: () => number;
          }'''
          new = '''export interface MediaUploadProgress {
            uploadedBytes: number;
            totalBytes: number;
            percent: number;
          }

          export interface MediaUploadOptions {
            createUploadKey?: () => string;
            delay?: (milliseconds: number) => Promise<void>;
            random?: () => number;
            onProgress?: (progress: MediaUploadProgress) => void;
          }'''
          if old not in text:
              raise SystemExit('mediaBridgeClient.ts: recovery options marker missing')
          text = text.replace(old, new, 1).replace('MediaUploadRecoveryOptions', 'MediaUploadOptions')
          marker = '''function validateUploadProgressResult(value: unknown, totalBytes: number): MediaUploadChunkResult {'''
          helper = '''function reportUploadProgress(options: MediaUploadOptions, totalBytes: number, uploadedBytes: number) {
            const safeUploadedBytes = Math.min(Math.max(uploadedBytes, 0), totalBytes);
            const percent = totalBytes > 0 ? Math.round((safeUploadedBytes / totalBytes) * 100) : 0;

            try {
              options.onProgress?.({ uploadedBytes: safeUploadedBytes, totalBytes, percent });
            } catch {
              // UI feedback must never interrupt the upload transport.
            }
          }

          ''' + marker
          if text.count(marker) != 1:
              raise SystemExit('mediaBridgeClient.ts: progress marker missing')
          text = text.replace(marker, helper, 1)
          old = '''  const startPayload = { ...metadata, totalBytes };
            let startResult = await requestStartWithRetries(startPayload, totalBytes, recoveryOptions);'''
          new = '''  const startPayload = { ...metadata, totalBytes };
            const reportProgress = (uploadedBytes: number) => reportUploadProgress(recoveryOptions, totalBytes, uploadedBytes);
            let startResult = await requestStartWithRetries(startPayload, totalBytes, recoveryOptions);'''
          if old not in text:
              raise SystemExit('mediaBridgeClient.ts: start payload marker missing')
          text = text.replace(old, new, 1)
          text = text.replace('    return startResult.asset;', '    reportProgress(totalBytes);\n    return startResult.asset;')
          old = '''  let noProgressCycles = 0;

            async function restartSession() {'''
          new = '''  let noProgressCycles = 0;
            reportProgress(currentByte);

            async function restartSession() {'''
          if old not in text:
              raise SystemExit('mediaBridgeClient.ts: initial progress marker missing')
          text = text.replace(old, new, 1)
          old = '''    noProgressCycles = 0;
            return null;'''
          new = '''    noProgressCycles = 0;
            reportProgress(currentByte);
            return null;'''
          if old not in text:
              raise SystemExit('mediaBridgeClient.ts: restart progress marker missing')
          text = text.replace(old, new, 1)
          old = '''    currentByte = nextByte;
            }'''
          new = '''    currentByte = nextByte;
              reportProgress(currentByte);
            }'''
          if old not in text:
              raise SystemExit('mediaBridgeClient.ts: record progress marker missing')
          text = text.replace(old, new, 1)
          text = re.sub(r'(?m)^(\s*)return (status|result|restarted)\.asset;$', r'\1reportProgress(totalBytes);\n\1return \2.asset;', text)
          p.write_text(text)

          # api.ts: thread upload progress options through metadata persistence.
          Path('src/features/cms-media/api.ts').write_text('''import { deleteMediaMetadataFromCloudflare, saveMediaMetadataToCloudflare } from "../admin-write/cloudflareApi";
          import { cacheBridgeMediaAsset, removeBridgeMediaAsset } from "./bridgeCache";
          import {
            deleteMediaAssetFromBridge,
            saveMediaAssetToBridge,
            uploadMediaAssetToBridge,
            type MediaUploadOptions
          } from "./mediaBridgeClient";
          import type { MediaAsset, MediaAssetInput } from "./types";

          async function persistBridgeMetadata(asset: MediaAsset) {
            cacheBridgeMediaAsset(asset);

            try {
              return cacheBridgeMediaAsset(await saveMediaMetadataToCloudflare(asset));
            } catch {
              // Keep the returned bridge metadata visible until a later D1 metadata sync succeeds.
              return asset;
            }
          }

          export async function saveMediaAsset(input: MediaAssetInput, options: MediaUploadOptions = {}) {
            return persistBridgeMetadata(await saveMediaAssetToBridge(input, options));
          }

          export async function uploadMediaAsset(asset: MediaAsset) {
            return persistBridgeMetadata(await uploadMediaAssetToBridge(asset));
          }

          function getMediaAssetId(asset: string | Pick<MediaAsset, "id">) {
            return typeof asset === "string" ? asset : asset.id;
          }

          export async function deleteMediaAsset(asset: string | MediaAsset) {
            const id = getMediaAssetId(asset);
            const result = await deleteMediaAssetFromBridge(asset);

            try {
              await deleteMediaMetadataFromCloudflare(id);
            } catch {
              // The Drive delete succeeded; remove the local bridge entry even if D1 metadata cleanup must be retried.
            }

            removeBridgeMediaAsset(id);
            return result;
          }

          export type { MediaAssetInput } from "./types";
          export type { MediaUploadOptions, MediaUploadProgress } from "./mediaBridgeClient";
          ''')

          Path('src/features/cms-media/index.ts').write_text('''export { deleteMediaAsset, saveMediaAsset, uploadMediaAsset } from "./api";
          export { mergeBridgeMediaAssets } from "./bridgeCache";
          export { MAX_MEDIA_UPLOAD_BYTES } from "./mediaBridgeClient";
          export type { MediaAssetInput, MediaUploadOptions, MediaUploadProgress } from "./api";
          export type { MediaAsset, MediaType } from "./types";
          ''')

          # Shared visible progress UI.
          Path('src/admin/components/MediaUploadProgressFeedback.tsx').write_text('''import { LinearProgress, Stack, Typography } from "@mui/material";
          import type { MediaUploadProgress } from "../../features/cms-media";
          import { formatFileSize } from "../../utils/files";

          interface MediaUploadProgressFeedbackProps {
            preparing: boolean;
            progress: MediaUploadProgress | null;
          }

          export default function MediaUploadProgressFeedback({ preparing, progress }: MediaUploadProgressFeedbackProps) {
            const percent = progress?.percent ?? 0;
            const complete = !preparing && percent >= 100;
            const label = preparing
              ? "กำลังเตรียมไฟล์สำหรับอัปโหลด"
              : complete
                ? "อัปโหลดครบ 100% กำลังบันทึกข้อมูล"
                : "กำลังอัปโหลดไฟล์ไปยัง Drive และบันทึกข้อมูล";

            return (
              <Stack spacing={0.8} role="status" aria-live="polite" aria-busy="true">
                <Stack direction="row" spacing={1} sx={{ alignItems: "center", justifyContent: "space-between" }}>
                  <Typography sx={{ color: "text.secondary" }}>{label}</Typography>
                  {!preparing && (
                    <Typography sx={{ fontWeight: 900, minWidth: 48, textAlign: "right" }}>{percent}%</Typography>
                  )}
                </Stack>
                <LinearProgress
                  variant={preparing ? "indeterminate" : "determinate"}
                  value={preparing ? undefined : percent}
                  aria-label={preparing ? "กำลังเตรียมไฟล์" : `ความคืบหน้าการอัปโหลด ${percent}%`}
                  sx={{ height: 8, borderRadius: 999 }}
                />
                <Typography variant="caption" sx={{ color: "text.secondary" }}>
                  {preparing
                    ? "กำลังอ่านและเตรียมข้อมูลไฟล์ กรุณาอย่าปิดหน้านี้"
                    : progress
                      ? `${formatFileSize(progress.uploadedBytes)} / ${formatFileSize(progress.totalBytes)}`
                      : "กำลังเริ่มการอัปโหลด"}
                </Typography>
              </Stack>
            );
          }
          ''')

          # MediaPage.tsx: immediate lock + visible upload progress.
          p = Path('src/admin/pages/MediaPage.tsx')
          text = p.read_text()
          text = text.replace('import { ChangeEvent, FormEvent, useEffect, useState } from "react";', 'import { ChangeEvent, FormEvent, useEffect, useRef, useState } from "react";', 1)
          old = 'import AdminPagination from "../components/AdminPagination";'
          text = text.replace(old, old + '\nimport MediaUploadProgressFeedback from "../components/MediaUploadProgressFeedback";', 1)
          old = 'import { deleteMediaAsset, MAX_MEDIA_UPLOAD_BYTES, saveMediaAsset } from "../../features/cms-media";'
          new = '''import {
            deleteMediaAsset,
            MAX_MEDIA_UPLOAD_BYTES,
            saveMediaAsset,
            type MediaAssetInput,
            type MediaUploadOptions,
            type MediaUploadProgress
          } from "../../features/cms-media";'''
          if old not in text:
              raise SystemExit('MediaPage.tsx: cms-media import marker missing')
          text = text.replace(old, new, 1)
          old = '''type OperationNotice = {
            severity: "success" | "error";
            message: string;
          };'''
          new = old + '''
          type MediaSaveRequest = {
            input: MediaAssetInput;
            options?: MediaUploadOptions;
          };'''
          text = text.replace(old, new, 1)
          old = '''  const [confirming, setConfirming] = useState(false);
            const [deletingMediaId, setDeletingMediaId] = useState<string | null>(null);'''
          new = '''  const [confirming, setConfirming] = useState(false);
            const saveLockRef = useRef(false);
            const [saveStarting, setSaveStarting] = useState(false);
            const [uploadProgress, setUploadProgress] = useState<MediaUploadProgress | null>(null);
            const [deletingMediaId, setDeletingMediaId] = useState<string | null>(null);'''
          if old not in text:
              raise SystemExit('MediaPage.tsx: save state marker missing')
          text = text.replace(old, new, 1)
          old = '''  const saveMutation = useMutation({
              mutationFn: saveMediaAsset
            });'''
          new = '''  const saveMutation = useMutation({
              mutationFn: ({ input, options }: MediaSaveRequest) => saveMediaAsset(input, options)
            });'''
          text = text.replace(old, new, 1)
          old = '''  const mediaActionsDisabled =
              saveMutation.isPending || deleteMutation.isPending || deletingMediaId !== null || listTransitioning;'''
          new = '''  const isSaveBusy = saveStarting || saveMutation.isPending;
            const mediaActionsDisabled = isSaveBusy || deleteMutation.isPending || deletingMediaId !== null || listTransitioning;'''
          text = text.replace(old, new, 1)
          old = '''  async function handleConfirmSave() {
              if (!canManage) {'''
          new = '''  async function handleConfirmSave() {
              if (saveLockRef.current) {
                return;
              }

              if (!canManage) {'''
          text = text.replace(old, new, 1)
          old = '''    const currentOperation = saveOperation;
              showMediaLoadingModal(getSaveLoadingTitle(currentOperation));

              try {
                const filePayload = file
                  ? {
                      size: formatFileSize(file.size),
                      fileName: file.name,
                      fileBase64: await readFileAsBase64(file),
                      mimeType: file.type
                    }
                  : {};

                await saveMutation.mutateAsync({
                  id: editingAsset?.id,
                  name: form.name.trim(),
                  type: form.type,
                  owner: form.owner.trim(),
                  driveUrl: form.driveUrl.trim() || editingAsset?.driveUrl || "",
                  fileId: editingAsset?.fileId,
                  thumbnailUrl: editingAsset?.thumbnailUrl,
                  previewUrl: editingAsset?.previewUrl,
                  embedUrl: editingAsset?.embedUrl,
                  mimeType: editingAsset?.mimeType,
                  size: editingAsset?.size,
                  ...filePayload
                });'''
          new = '''    saveLockRef.current = true;
              setSaveStarting(true);
              setUploadProgress(null);
              const currentOperation = saveOperation;

              if (!file) {
                showMediaLoadingModal(getSaveLoadingTitle(currentOperation));
              }

              try {
                let filePayload: Partial<MediaAssetInput> = {};
                let uploadOptions: MediaUploadOptions | undefined;

                if (file) {
                  const currentFile = file;
                  const fileBase64 = await readFileAsBase64(currentFile);
                  setUploadProgress({ uploadedBytes: 0, totalBytes: currentFile.size, percent: 0 });
                  uploadOptions = { onProgress: setUploadProgress };
                  filePayload = {
                    size: formatFileSize(currentFile.size),
                    fileName: currentFile.name,
                    fileBase64,
                    mimeType: currentFile.type
                  };
                }

                await saveMutation.mutateAsync({
                  input: {
                    id: editingAsset?.id,
                    name: form.name.trim(),
                    type: form.type,
                    owner: form.owner.trim(),
                    driveUrl: form.driveUrl.trim() || editingAsset?.driveUrl || "",
                    fileId: editingAsset?.fileId,
                    thumbnailUrl: editingAsset?.thumbnailUrl,
                    previewUrl: editingAsset?.previewUrl,
                    embedUrl: editingAsset?.embedUrl,
                    mimeType: editingAsset?.mimeType,
                    size: editingAsset?.size,
                    ...filePayload
                  },
                  options: uploadOptions
                });'''
          if old not in text:
              raise SystemExit('MediaPage.tsx: confirm save body marker missing')
          text = text.replace(old, new, 1)
          old = '''      await appSwal.fire({
                icon: "error",
                title: errorTitle,
                text: message,
                confirmButtonText: "ตกลง"
              });
            }
          }'''
          new = '''      await appSwal.fire({
                icon: "error",
                title: errorTitle,
                text: message,
                confirmButtonText: "ตกลง"
              });
            } finally {
              saveLockRef.current = false;
              setSaveStarting(false);
              setUploadProgress(null);
            }
          }'''
          if old not in text:
              raise SystemExit('MediaPage.tsx: confirm save finally marker missing')
          text = text.replace(old, new, 1)
          text = text.replace('onClose={saveMutation.isPending ? undefined : handleCloseDialog}', 'onClose={isSaveBusy ? undefined : handleCloseDialog}', 1)
          old = '''                {saveMutation.isPending && (
                      <Stack spacing={1}>
                        <LinearProgress />
                        <Typography
                          sx={{
                            color: "text.secondary"
                          }}
                        >
                          {getSavePendingText(saveOperation)}
                        </Typography>
                      </Stack>
                    )}'''
          new = '''                {isSaveBusy && file ? (
                      <MediaUploadProgressFeedback preparing={!uploadProgress} progress={uploadProgress} />
                    ) : isSaveBusy ? (
                      <Stack spacing={1}>
                        <LinearProgress />
                        <Typography sx={{ color: "text.secondary" }}>{getSavePendingText(saveOperation)}</Typography>
                      </Stack>
                    ) : null}'''
          if old not in text:
              raise SystemExit('MediaPage.tsx: pending feedback marker missing')
          text = text.replace(old, new, 1)
          text = text.replace('disabled={!canManage || saveMutation.isPending}', 'disabled={!canManage || isSaveBusy}', 1)
          text = text.replace('disabled={saveMutation.isPending}', 'disabled={isSaveBusy}', 2)
          text = text.replace('{saveMutation.isPending ? "กำลังบันทึก" : isEditing ? "บันทึก" : "อัปโหลด"}', '{isSaveBusy ? (file && uploadProgress ? `กำลังอัปโหลด ${uploadProgress.percent}%` : file ? "กำลังเตรียมไฟล์" : "กำลังบันทึก") : isEditing ? "บันทึก" : "อัปโหลด"}', 1)
          text = text.replace('disabled={saveMutation.isPending}>\n                  ยกเลิก', 'disabled={isSaveBusy}>\n                  ยกเลิก', 1)
          text = text.replace('disabled={!canManage || saveMutation.isPending}>\n                  ดำเนินการต่อ', 'disabled={!canManage || isSaveBusy}>\n                  ดำเนินการต่อ', 1)
          p.write_text(text)

          # ContentEditorDialog.tsx: progress UI + synchronous duplicate guard.
          p = Path('src/admin/components/ContentEditorDialog.tsx')
          text = p.read_text()
          old = 'import type { MediaAssetInput } from "../../features/cms-media";'
          new = 'import type { MediaAssetInput, MediaUploadOptions, MediaUploadProgress } from "../../features/cms-media";'
          text = text.replace(old, new, 1)
          old = 'import AdminPagination from "./AdminPagination";'
          text = text.replace(old, old + '\nimport MediaUploadProgressFeedback from "./MediaUploadProgressFeedback";', 1)
          text = text.replace('onUploadMedia?: (input: MediaAssetInput) => Promise<MediaAsset>;', 'onUploadMedia?: (input: MediaAssetInput, options?: MediaUploadOptions) => Promise<MediaAsset>;', 1)
          old = '''  const [uploadError, setUploadError] = useState("");
            const [uploading, setUploading] = useState(false);'''
          new = '''  const [uploadError, setUploadError] = useState("");
            const uploadLockRef = useRef(false);
            const [uploading, setUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState<MediaUploadProgress | null>(null);'''
          text = text.replace(old, new, 1)
          old = '''    setUploadError("");
              setUploading(false);
              setTagInputValue'''
          new = '''    setUploadError("");
              uploadLockRef.current = false;
              setUploading(false);
              setUploadProgress(null);
              setTagInputValue'''
          text = text.replace(old, new, 1)
          old = '''  async function handleUploadMedia() {
              if (!uploadFile || !onUploadMedia) {'''
          new = '''  async function handleUploadMedia() {
              if (uploadLockRef.current) {
                return;
              }

              if (!uploadFile || !onUploadMedia) {'''
          text = text.replace(old, new, 1)
          old = '''    try {
                setUploading(true);
                setUploadError("");
                const fileBase64 = await readFileAsBase64(uploadFile);
                const asset = await onUploadMedia({
                  name: uploadName.trim() || uploadFile.name,
                  type: uploadType,
                  size: formatFileSize(uploadFile.size),
                  owner: draft.owner.trim() || "ผู้แก้ไข CMS",
                  fileName: uploadFile.name,
                  fileBase64,
                  mimeType: uploadFile.type
                });'''
          new = '''    uploadLockRef.current = true;
              try {
                setUploading(true);
                setUploadProgress(null);
                setUploadError("");
                const currentFile = uploadFile;
                const fileBase64 = await readFileAsBase64(currentFile);
                setUploadProgress({ uploadedBytes: 0, totalBytes: currentFile.size, percent: 0 });
                const asset = await onUploadMedia(
                  {
                    name: uploadName.trim() || currentFile.name,
                    type: uploadType,
                    size: formatFileSize(currentFile.size),
                    owner: draft.owner.trim() || "ผู้แก้ไข CMS",
                    fileName: currentFile.name,
                    fileBase64,
                    mimeType: currentFile.type
                  },
                  { onProgress: setUploadProgress }
                );'''
          if old not in text:
              raise SystemExit('ContentEditorDialog.tsx: upload body marker missing')
          text = text.replace(old, new, 1)
          old = '''    } finally {
                setUploading(false);
              }
            }'''
          new = '''    } finally {
                uploadLockRef.current = false;
                setUploading(false);
                setUploadProgress(null);
              }
            }'''
          if old not in text:
              raise SystemExit('ContentEditorDialog.tsx: upload finally marker missing')
          text = text.replace(old, new, 1)
          old = '''                {uploadFile && (
                      <Typography
                        variant="body2"
                        sx={{
                          color: "text.secondary"
                        }}
                      >
                        {uploadFile.name} / {formatFileSize(uploadFile.size)}
                      </Typography>
                    )}'''
          new = old + '''
                    {uploading && <MediaUploadProgressFeedback preparing={!uploadProgress} progress={uploadProgress} />}'''
          if old not in text:
              raise SystemExit('ContentEditorDialog.tsx: upload file feedback marker missing')
          text = text.replace(old, new, 1)
          text = text.replace('label="ชื่อสื่อ"\n                  value={uploadName}', 'label="ชื่อสื่อ"\n                  value={uploadName}\n                  disabled={uploading}', 1)
          text = text.replace('label="ประเภท"\n                  value={uploadType}', 'label="ประเภท"\n                  value={uploadType}\n                  disabled={uploading}', 1)
          text = text.replace('{uploading ? "กำลังอัปโหลด" : "อัปโหลดและแนบ"}', '{uploading ? (uploadProgress ? `กำลังอัปโหลด ${uploadProgress.percent}%` : "กำลังเตรียมไฟล์") : "อัปโหลดและแนบ"}', 1)
          p.write_text(text)

          # ContentPage.tsx: pass progress options through TanStack mutation.
          p = Path('src/admin/pages/ContentPage.tsx')
          text = p.read_text()
          text = text.replace('import { saveMediaAsset, type MediaAssetInput } from "../../features/cms-media";', 'import { saveMediaAsset, type MediaAssetInput, type MediaUploadOptions } from "../../features/cms-media";', 1)
          old = '''  const mediaMutation = useMutation({
              mutationFn: saveMediaAsset,
              onSuccess: async () => {'''
          new = '''  const mediaMutation = useMutation({
              mutationFn: ({ input, options }: { input: MediaAssetInput; options?: MediaUploadOptions }) =>
                saveMediaAsset(input, options),
              onSuccess: async () => {'''
          if old not in text:
              raise SystemExit('ContentPage.tsx: media mutation marker missing')
          text = text.replace(old, new, 1)
          old = '''  async function handleUploadMedia(input: MediaAssetInput) {
              if (!canManageMedia) {
                throw new Error(ADMIN_READ_ONLY_NOTICE);
              }

              return mediaMutation.mutateAsync(input);
            }'''
          new = '''  async function handleUploadMedia(input: MediaAssetInput, options?: MediaUploadOptions) {
              if (!canManageMedia) {
                throw new Error(ADMIN_READ_ONLY_NOTICE);
              }

              return mediaMutation.mutateAsync({ input, options });
            }'''
          if old not in text:
              raise SystemExit('ContentPage.tsx: upload handler marker missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          Path('.github/workflows/temporary-media-upload-progress.yml').unlink()
          PY
      - name: Format touched files
        run: |
          corepack enable
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm exec prettier --write \
            src/features/cms-media/mediaBridgeClient.ts \
            src/features/cms-media/api.ts \
            src/features/cms-media/index.ts \
            src/admin/components/MediaUploadProgressFeedback.tsx \
            src/admin/components/ContentEditorDialog.tsx \
            src/admin/pages/MediaPage.tsx \
            src/admin/pages/ContentPage.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(media): show upload progress and block duplicate submits"
          git push origin HEAD:agent/media-upload-progress-lock
