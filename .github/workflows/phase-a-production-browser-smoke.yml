name: Phase A Production Browser Smoke

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS site URL to verify
        required: true
        default: https://www.rcat.ac.th
        type: string

permissions:
  contents: read
  statuses: read

# workflow_run fires for CI on every branch. Scope concurrency to the source
# branch so a completed PR/Renovate CI cannot cancel an in-flight master smoke.
concurrency:
  group: phase-a-production-browser-smoke-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Read-only Field QA
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://www.rcat.ac.th' }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Wait for matching Vercel production deployment
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            payload="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status")"

            status_json="$(printf '%s' "$payload" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                const vercel = payload.statuses.find((status) => status.context === "Vercel");
                process.stdout.write(JSON.stringify({
                  state: vercel?.state || "missing",
                  description: vercel?.description || "",
                  targetUrl: vercel?.target_url || ""
                }));
              });
            ')"
            state="$(printf '%s' "$status_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).state')"
            description="$(printf '%s' "$status_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).description')"
            target_url="$(printf '%s' "$status_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).targetUrl')"

            case "$state" in
              success)
                if [[ "$description" == *"Canceled by Ignored Build Step"* || "$description" == *"Ignored Build Step"* ]]; then
                  echo "Vercel did not create a production deployment for $TARGET_SHA: $description" >&2
                  exit 1
                fi
                if [[ -z "$target_url" ]]; then
                  echo "Vercel status for $TARGET_SHA is missing a deployment target URL." >&2
                  exit 1
                fi
                echo "Vercel production deployment for $TARGET_SHA is ready: $target_url"
                exit 0
                ;;
              failure|error)
                echo "Vercel deployment for $TARGET_SHA failed with state: $state ($description)" >&2
                exit 1
                ;;
              pending|missing)
                echo "Vercel deployment for $TARGET_SHA is not ready yet (attempt $attempt/30)."
                sleep 10
                ;;
              *)
                echo "Unexpected Vercel commit status: $state ($description)" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Vercel deployment status for $TARGET_SHA." >&2
          exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run read-only production browser smoke
        env:
          PHASE_A_PRODUCTION_BASE_URL: ${{ env.TARGET_URL }}
        run: pnpm exec playwright test --config playwright.production.config.ts

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-a-production-browser-smoke-${{ github.run_id }}
          path: |
            playwright-report/production
            test-results/production
          if-no-files-found: ignore
          retention-days: 7

      - name: Field QA summary
        if: ${{ always() }}
        run: |
          {
            echo "## Phase A Production Browser Smoke"
            echo
            echo "- Target: $TARGET_URL"
            echo "- Commit: $TARGET_SHA"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Mode: read-only"
            echo "- Automatic path: successful master CI -> non-ignored Vercel deployment status with target URL -> browser smoke"
            echo "- Browsers: desktop Chromium + mobile Chromium"
            echo "- Runtime diagnostics: page errors, same-origin console errors, request failures, HTTP 5xx, critical asset/document 4xx"
            echo "- Production writes: none"
            echo "- External paid services: none"
          } >> "$GITHUB_STEP_SUMMARY"
