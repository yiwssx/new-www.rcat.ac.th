name: Phase A Production Browser Smoke

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS site URL to verify
        required: true
        default: https://www.rcat.ac.th
        type: string

permissions:
  contents: read
  statuses: read

# workflow_run is filtered to master at the trigger. Keep concurrency scoped to
# the source branch so manual runs remain isolated from automatic production smoke.
concurrency:
  group: phase-a-production-browser-smoke-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Read-only Field QA
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://www.rcat.ac.th' }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Classify Vercel runtime impact
        id: runtime_impact
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          CHANGED_PATHS_FILE: ${{ runner.temp }}/phase-a-changed-paths
        shell: bash
        run: |
          set -euo pipefail

          git diff --name-only -z HEAD^ HEAD > "$CHANGED_PATHS_FILE"
          git diff --name-only HEAD^ HEAD

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { shouldIgnoreVercelBuild } from "./scripts/vercel-ignore-build.mjs";

          const changedPaths = fs
            .readFileSync(process.env.CHANGED_PATHS_FILE)
            .toString("utf8")
            .split("\0")
            .filter(Boolean);
          const expectedIgnored = shouldIgnoreVercelBuild(changedPaths);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_ignored=${expectedIgnored}\n`);
          console.log(
            expectedIgnored
              ? `Vercel runtime classifier: ${changedPaths.length} non-runtime path(s); an ignored build is expected.`
              : "Vercel runtime classifier: a production deployment is required for this change."
          );
          NODE

      - name: Wait for matching Vercel production deployment
        id: vercel_gate
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_IGNORED: ${{ steps.runtime_impact.outputs.expected_ignored }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            payload="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status")"

            status_json="$(printf '%s' "$payload" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                const vercel = payload.statuses.find((status) => status.context === "Vercel");
                process.stdout.write(JSON.stringify({
                  state: vercel?.state || "missing",
                  description: vercel?.description || "",
                  targetUrl: vercel?.target_url || ""
                }));
              });
            ')"
            state="$(printf '%s' "$status_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).state')"
            description="$(printf '%s' "$status_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).description')"
            target_url="$(printf '%s' "$status_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).targetUrl')"

            case "$state" in
              success)
                if [[ "$description" == *"Canceled by Ignored Build Step"* || "$description" == *"Ignored Build Step"* ]]; then
                  if [[ "$EXPECTED_IGNORED" == "true" ]]; then
                    echo "Vercel intentionally skipped a non-runtime-only change for $TARGET_SHA: $description"
                    echo "skip_smoke=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "Vercel unexpectedly skipped a runtime-impacting change for $TARGET_SHA: $description" >&2
                  exit 1
                fi
                if [[ -z "$target_url" ]]; then
                  echo "Vercel status for $TARGET_SHA is missing a deployment target URL." >&2
                  exit 1
                fi
                echo "Vercel production deployment for $TARGET_SHA is ready: $target_url"
                echo "skip_smoke=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failure|error)
                echo "Vercel deployment for $TARGET_SHA failed with state: $state ($description)" >&2
                exit 1
                ;;
              pending|missing)
                echo "Vercel deployment for $TARGET_SHA is not ready yet (attempt $attempt/30)."
                sleep 10
                ;;
              *)
                echo "Unexpected Vercel commit status: $state ($description)" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Vercel deployment status for $TARGET_SHA." >&2
          exit 1

      - uses: pnpm/action-setup@v6
        if: ${{ github.event_name == 'workflow_dispatch' || steps.vercel_gate.outputs.skip_smoke != 'true' }}
        with:
          version: 12.4.2
          run_install: false

      - uses: actions/setup-node@v7
        if: ${{ github.event_name == 'workflow_dispatch' || steps.vercel_gate.outputs.skip_smoke != 'true' }}
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.vercel_gate.outputs.skip_smoke != 'true' }}

      - name: Install Chromium
        if: ${{ github.event_name == 'workflow_dispatch' || steps.vercel_gate.outputs.skip_smoke != 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run read-only production browser smoke
        if: ${{ github.event_name == 'workflow_dispatch' || steps.vercel_gate.outputs.skip_smoke != 'true' }}
        env:
          PHASE_A_PRODUCTION_BASE_URL: ${{ env.TARGET_URL }}
        run: pnpm exec playwright test --config playwright.production.config.ts

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-a-production-browser-smoke-${{ github.run_id }}
          path: |
            playwright-report/production
            test-results/production
          if-no-files-found: ignore
          retention-days: 7

      - name: Field QA summary
        if: ${{ always() }}
        run: |
          {
            echo "## Phase A Production Browser Smoke"
            echo
            echo "- Target: $TARGET_URL"
            echo "- Commit: $TARGET_SHA"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Mode: read-only"
            if [[ "${{ steps.vercel_gate.outputs.skip_smoke }}" == "true" ]]; then
              echo "- Automatic path: successful master CI -> expected non-runtime Vercel ignore -> no browser smoke required"
              echo "- Browser smoke: not required because no new production deployment was created"
            else
              echo "- Automatic path: successful master CI -> matching Vercel deployment with target URL -> browser smoke"
              echo "- Browser smoke: required"
            fi
            echo "- Browsers: desktop Chromium + mobile Chromium"
            echo "- Runtime diagnostics: page errors, same-origin console errors, request failures, HTTP 5xx, critical asset/document 4xx"
            echo "- Production writes: none"
            echo "- External paid services: none"
          } >> "$GITHUB_STEP_SUMMARY"
