name: Temporary Runtime Major Policy Fix

on:
  push:
    branches:
      - fix/runtime-major-dependency-policy-2026-09-10

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-major-dependency-policy-2026-09-10
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: python scripts/temporary-runtime-major-policy-fix.py
      - run: pnpm exec vitest run scripts/runtime-major-registry-policy.test.mjs scripts/dependency-status-policy.test.mjs
      - run: pnpm deps:check

      - name: Remove temporary tooling and commit repair
        shell: bash
        run: |
          rm .github/workflows/temporary-runtime-major-policy-fix.yml scripts/temporary-runtime-major-policy-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(deps): harden runtime-major registry validation"
          git push origin HEAD:fix/runtime-major-dependency-policy-2026-09-10
