name: Temporary Runtime Major Policy Fix

on:
  push:
    branches:
      - fix/runtime-major-dependency-policy-2026-09-10

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-major-dependency-policy-2026-09-10
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Patch runtime-major registry validation
        shell: python
        run: |
          from pathlib import Path

          generator = Path("scripts/generate-dependency-status.mjs")
          text = generator.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '} from "./dependency-status-policy.mjs";\n',
              '} from "./dependency-status-policy.mjs";\nimport { resolveCompatibilityRegistryWindow } from "./runtime-major-registry-policy.mjs";\n'
          )

          replace_once(
              'async function lookupRegistryMetadata(packageNames) {',
              'async function lookupRegistryMetadata(packageNames, validationKinds = new Map()) {'
          )

          replace_once(
              '''      const eligibleLatest = eligibleVersions.at(-1) || "";
      if (!eligibleLatest) {
        throw new Error(`No stable ${name} release has passed the ${MINIMUM_RELEASE_AGE_HOURS}-hour age gate.`);
      }
      return { name, version: version.raw, publishedAt, eligibleLatest, eligibleVersions, error: "" };
    } catch (error) {
      return { name, version: "", publishedAt: "", eligibleLatest: "", eligibleVersions: [], error: error.message };
    }
''',
              '''      const eligibleLatest = eligibleVersions.at(-1) || "";
      if (!eligibleLatest) {
        throw new Error(`No stable ${name} release has passed the ${MINIMUM_RELEASE_AGE_HOURS}-hour age gate.`);
      }
      const validationWindow = resolveCompatibilityRegistryWindow({
        distTagLatest: version.raw,
        versionTimes: value.time,
        validationKind: validationKinds.get(name) || "",
        minimumReleaseAgeHours: MINIMUM_RELEASE_AGE_HOURS
      });
      return {
        name,
        version: version.raw,
        publishedAt,
        eligibleLatest,
        eligibleVersions,
        validationLatest: validationWindow.latest,
        validationEligibleVersions: validationWindow.eligibleVersions,
        error: ""
      };
    } catch (error) {
      return {
        name,
        version: "",
        publishedAt: "",
        eligibleLatest: "",
        eligibleVersions: [],
        validationLatest: "",
        validationEligibleVersions: [],
        error: error.message
      };
    }
'''
          )

          replace_once(
              '''        latest: result.version,
        publishedAt: result.publishedAt,
        eligibleLatest: result.eligibleLatest,
        eligibleVersions: result.eligibleVersions
''',
              '''        latest: result.version,
        publishedAt: result.publishedAt,
        eligibleLatest: result.eligibleLatest,
        eligibleVersions: result.eligibleVersions,
        validationLatest: result.validationLatest,
        validationEligibleVersions: result.validationEligibleVersions
'''
          )

          replace_once(
              '''  const registryMetadata = await lookupRegistryMetadata(packageNames);
  const registryLatest = new Map([...registryMetadata].map(([name, metadata]) => [name, metadata.latest]));
  const eligibleVersions = new Map([...registryMetadata].map(([name, metadata]) => [name, metadata.eligibleVersions]));
''',
              '''  const validationKinds = new Map(
    Object.entries(policy?.compatibilityExceptions || {}).map(([name, exception]) => [
      name,
      exception?.validation?.kind || ""
    ])
  );
  const registryMetadata = await lookupRegistryMetadata(packageNames, validationKinds);
  const registryLatest = new Map([...registryMetadata].map(([name, metadata]) => [name, metadata.validationLatest]));
  const eligibleVersions = new Map(
    [...registryMetadata].map(([name, metadata]) => [name, metadata.validationEligibleVersions])
  );
'''
          )

          generator.write_text(text, encoding="utf-8")

          helper = Path("scripts/runtime-major-registry-policy.mjs")
          helper.write_text('''import { compareVersions, parseVersion, releaseAgeEligibleVersions } from "./dependency-status-policy.mjs";

function highestStableVersion(versionTimes) {
  const versions = Object.keys(versionTimes || {})
    .map((value) => parseVersion(value))
    .filter((version) => version && !version.prerelease)
    .sort(compareVersions);
  return versions.at(-1)?.raw || "";
}

export function resolveCompatibilityRegistryWindow({
  distTagLatest,
  versionTimes,
  validationKind = "",
  minimumReleaseAgeHours = 72,
  now = Date.now()
}) {
  const distTagVersion = parseVersion(distTagLatest);
  if (!distTagVersion || distTagVersion.prerelease) {
    throw new Error("dist-tag latest must be a stable semantic version");
  }

  const validationLatest =
    validationKind === "runtime-major" ? highestStableVersion(versionTimes) || distTagVersion.raw : distTagVersion.raw;
  const eligibleVersions = releaseAgeEligibleVersions({
    versionTimes,
    registryLatest: validationLatest,
    minimumReleaseAgeHours,
    now
  });

  if (!eligibleVersions.length) {
    throw new Error("no stable validation release has passed the release-age gate");
  }

  return { latest: validationLatest, eligibleVersions };
}
''', encoding="utf-8")

          test = Path("scripts/runtime-major-registry-policy.test.mjs")
          test.write_text('''import { describe, expect, it } from "vitest";
import { resolveCompatibilityRegistryWindow } from "./runtime-major-registry-policy.mjs";

const versionTimes = {
  "22.20.1": "2026-09-01T00:00:00.000Z",
  "22.20.2": "2026-09-02T00:00:00.000Z",
  "24.13.2": "2026-09-01T00:00:00.000Z",
  "24.13.3": "2026-09-02T00:00:00.000Z",
  "26.4.1": "2026-09-01T00:00:00.000Z",
  "26.5.0": "2026-09-02T00:00:00.000Z"
};
const now = Date.parse("2026-09-10T00:00:00.000Z");

describe("runtime-major registry validation window", () => {
  it("does not let a regressed cross-major latest dist-tag force a runtime type downgrade", () => {
    expect(
      resolveCompatibilityRegistryWindow({
        distTagLatest: "22.20.2",
        versionTimes,
        validationKind: "runtime-major",
        minimumReleaseAgeHours: 72,
        now
      })
    ).toEqual({
      latest: "26.5.0",
      eligibleVersions: ["22.20.1", "22.20.2", "24.13.2", "24.13.3", "26.4.1", "26.5.0"]
    });
  });

  it("keeps ordinary dependency validation bounded by the actual latest dist-tag", () => {
    expect(
      resolveCompatibilityRegistryWindow({
        distTagLatest: "22.20.2",
        versionTimes,
        validationKind: "peer-range",
        minimumReleaseAgeHours: 72,
        now
      })
    ).toEqual({
      latest: "22.20.2",
      eligibleVersions: ["22.20.1", "22.20.2"]
    });
  });
});
''', encoding="utf-8")

          docs = Path("docs/maintenance/dependencies.md")
          docs_text = docs.read_text(encoding="utf-8")
          old = '''The Node engine declaration, `.node-version`, CI runtime, active local runtime,
and `@types/node` major must agree. The compatibility policy selects the newest
stable `@types/node` release in the active runtime major and fails when the
registry latest release no longer requires an exception.
'''
          new = '''The Node engine declaration, `.node-version`, CI runtime, active local runtime,
and `@types/node` major must agree. The compatibility policy selects the newest
age-eligible stable `@types/node` release in the active runtime major. Runtime-major
validation derives its blocking comparison from the stable registry version inventory
instead of trusting a cross-major `latest` dist-tag, so a temporary dist-tag regression
cannot force an invalid type downgrade. The exception still fails closed when the
registry inventory or runtime-major selection no longer satisfies the policy.
'''
          if docs_text.count(old) != 1:
              raise SystemExit("dependency guidance patch target did not match exactly once")
          docs.write_text(docs_text.replace(old, new, 1), encoding="utf-8")

      - name: Run focused regression tests
        run: pnpm exec vitest run scripts/runtime-major-registry-policy.test.mjs scripts/dependency-status-policy.test.mjs

      - name: Run committed dependency policy checks
        run: pnpm deps:check

      - name: Remove temporary workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/temporary-runtime-major-policy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(deps): harden runtime-major registry validation"
          git push origin HEAD:fix/runtime-major-dependency-policy-2026-09-10
