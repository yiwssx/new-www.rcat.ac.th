name: Dependency Status Sync

# Renovate updates must carry the generated dependency snapshot in the PR itself.
# This workflow writes that snapshot back to same-repository Renovate branches before
# merge. On master, it first checks only committed dependency-input hashes so normal
# live-registry movement cannot be misclassified as post-merge dependency-state drift.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - config/dependency-policy.json
      - .node-version
  push:
    branches:
      - master
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - config/dependency-policy.json
      - .node-version
      - .github/workflows/dependency-status-sync.yml

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: dependency-status-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'renovate[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Reject incomplete Renovate dependency artifact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          package_changed=false
          lockfile_changed=false

          if grep -Fxq "package.json" <<<"$changed_files"; then
            package_changed=true
          fi
          if grep -Fxq "pnpm-lock.yaml" <<<"$changed_files"; then
            lockfile_changed=true
          fi

          if [ "$package_changed" = "true" ] && [ "$lockfile_changed" != "true" ]; then
            {
              echo "## Incomplete Renovate dependency artifact"
              echo "Renovate changed package.json without updating pnpm-lock.yaml."
              echo "The branch must be retried by Renovate before snapshot synchronization or full CI."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Renovate changed package.json without pnpm-lock.yaml; refusing to synchronize an invalid dependency state."
            exit 1
          fi

      - name: Install validated dependency artifact for snapshot generation
        uses: ./.github/actions/setup-project
        with:
          install-args: --frozen-lockfile --strict-peer-dependencies --ignore-scripts

      - name: Check committed dependency snapshot input hashes
        id: committed_snapshot
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set +e
          pnpm deps:status:check
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Dependency snapshot input hashes are current"
              echo "The committed snapshot matches package.json, pnpm-lock.yaml, pnpm-workspace.yaml, and config/dependency-policy.json."
              echo "Live registry movement alone does not require a post-merge repair."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Dependency snapshot input hashes are stale"
              echo "A committed dependency input changed without a matching dependency snapshot."
              echo "The workflow will generate and validate a bounded repair branch."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refresh dependency status document in workspace
        if: github.event_name == 'pull_request' || steps.committed_snapshot.outputs.current != 'true'
        run: pnpm deps:status

      - name: Verify generated change scope
        if: github.event_name == 'pull_request' || steps.committed_snapshot.outputs.current != 'true'
        shell: bash
        run: |
          unexpected="$(git status --porcelain --untracked-files=no | awk '$2 != "docs/maintenance/dependency-current-status.md" { print }')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes after dependency status generation:"
            echo "$unexpected"
            exit 1
          fi

      - name: Detect dependency status drift
        id: drift
        if: github.event_name == 'pull_request' || steps.committed_snapshot.outputs.current != 'true'
        shell: bash
        run: |
          if git diff --quiet -- docs/maintenance/dependency-current-status.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependency status snapshot is already current."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Dependency status snapshot differs from the generated result."
          git diff --stat -- docs/maintenance/dependency-current-status.md

      - name: Commit refreshed snapshot to Renovate PR branch
        id: renovate_commit
        if: github.event_name == 'pull_request' && steps.drift.outputs.changed == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          HUSKY=0 git commit -m "docs(deps): refresh dependency status"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"

          echo "branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          {
            echo "## Renovate dependency snapshot committed"
            echo "The generated dependency status was committed to the Renovate branch before merge."
            echo "The updated head will be validated before the required quality status is published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish post-merge repair branch
        id: repair_commit
        if: github.event_name != 'pull_request' && steps.committed_snapshot.outputs.current != 'true' && steps.drift.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sync_branch="automation/dependency-status-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          HUSKY=0 git commit -m "docs(deps): refresh dependency status"
          git push --force origin "HEAD:refs/heads/$sync_branch"

          echo "branch=$sync_branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A snapshot commit triggers a new synchronize event and cancels this run. The
      # successor sees no drift, so it must still bridge its current Renovate head.
      - name: Resolve required quality validation target
        id: validation_target
        if: github.event_name == 'pull_request' || steps.repair_commit.outputs.branch != ''
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPAIR_BRANCH: ${{ steps.repair_commit.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target_branch="$PR_BRANCH"
          else
            target_branch="$REPAIR_BRANCH"
          fi

          test -n "$target_branch"
          target_sha="$(git rev-parse HEAD)"

          echo "branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      # Dependency policy contract marker: the shared validator owns
      # `gh workflow run ci.yml` and mirrors its result as required `quality`.
      - name: Validate updated head and publish required quality status
        if: github.event_name == 'pull_request' || steps.repair_commit.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.validation_target.outputs.branch }}
          TARGET_SHA: ${{ steps.validation_target.outputs.sha }}
        shell: bash
        run: bash scripts/validate-required-quality.sh "$TARGET_BRANCH" "$TARGET_SHA"

      - name: Report current dependency status
        if: github.event_name != 'pull_request' && steps.committed_snapshot.outputs.current == 'true'
        run: |
          {
            echo "## Dependency status"
            echo "The checked-in dependency snapshot matches the committed dependency inputs."
            echo "Registry-only movement remains the responsibility of scheduled monitoring and Renovate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed on genuine post-merge snapshot drift
        if: github.event_name != 'pull_request' && steps.repair_commit.outputs.branch != ''
        shell: bash
        run: |
          {
            echo "## Post-merge dependency snapshot drift requires maintainer PR"
            echo "The validated repair is available on branch automation/dependency-status-sync."
            echo "Repository rules require a pull request and the required quality gate for master."
            echo "GitHub Actions PR creation remains disabled; no repository-wide permission was widened."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Validated repair branch published; maintainer pull request is required by repository policy."
          exit 1
