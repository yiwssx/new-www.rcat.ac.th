name: Dependency Status Sync

# Renovate remains responsible only for direct dependencies declared in package.json.
# When dependency state changes make the checked-in status snapshot stale, this workflow
# refreshes the snapshot on a dedicated automation branch and opens or updates a PR.
on:
  push:
    branches:
      - master
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - config/dependency-policy.json
      - .node-version

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependency-status-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-project
        with:
          install-args: --frozen-lockfile --strict-peer-dependencies --ignore-scripts

      - name: Refresh dependency status document in workspace
        run: pnpm deps:status

      - name: Verify generated change scope
        shell: bash
        run: |
          unexpected="$(git status --porcelain --untracked-files=no | awk '$2 != "docs/maintenance/dependency-current-status.md" { print }')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes after dependency status generation:"
            echo "$unexpected"
            exit 1
          fi

      - name: Detect dependency status drift
        id: drift
        shell: bash
        run: |
          if git diff --quiet -- docs/maintenance/dependency-current-status.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependency status snapshot is already current."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Dependency status snapshot differs from the generated result."
          git diff --stat -- docs/maintenance/dependency-current-status.md

      - name: Publish refreshed dependency status branch
        if: steps.drift.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sync_branch="automation/dependency-status-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-current-status.md
          HUSKY=0 git commit -m "docs(deps): refresh dependency status"
          git push --force origin "HEAD:refs/heads/$sync_branch"

      - name: Open or update dependency status PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          sync_branch="automation/dependency-status-sync"
          existing_pr="$(gh pr list             --base master             --head "$sync_branch"             --state open             --json number             --jq '.[0].number // empty')"

          if [ -z "$existing_pr" ]; then
            gh pr create               --base master               --head "$sync_branch"               --title "docs(deps): refresh dependency status"               --body "Automated refresh of the committed dependency status snapshot after a Renovate dependency update."               --label dependencies
          else
            gh pr edit "$existing_pr"               --body "Automated refresh of the committed dependency status snapshot after the latest Renovate dependency update."
          fi

          gh workflow run ci.yml --ref "$sync_branch"

          {
            echo "## Dependency status drift remediated"
            echo "The generated dependency status differed from the checked-in snapshot."
            echo "The dedicated automation branch was refreshed and a pull request now carries the update."
            echo "CI was explicitly dispatched for the automation branch because GITHUB_TOKEN-created events do not recursively trigger normal workflow chains."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report current dependency status
        if: steps.drift.outputs.changed != 'true'
        run: |
          {
            echo "## Dependency status"
            echo "The checked-in dependency status snapshot is current."
          } >> "$GITHUB_STEP_SUMMARY"
