name: Dependency Status Sync

# Dependency status is intentionally read-only under the protected-master policy.
# Renovate remains responsible only for direct dependencies declared in package.json.
on:
  push:
    branches:
      - master
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - config/dependency-policy.json
      - .node-version

permissions:
  contents: read

concurrency:
  group: dependency-status-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts

      - name: Refresh dependency status document in workspace
        run: pnpm deps:status

      - name: Verify generated change scope
        shell: bash
        run: |
          unexpected="$(git status --porcelain --untracked-files=no | awk '$2 != "docs/maintenance/dependency-current-status.md" { print }')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes after dependency status generation:"
            echo "$unexpected"
            exit 1
          fi

      - name: Report dependency status drift
        shell: bash
        run: |
          if git diff --quiet -- docs/maintenance/dependency-current-status.md; then
            echo "Dependency status snapshot is already current."
            {
              echo "## Dependency status"
              echo "The checked-in dependency status snapshot is current."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Dependency status snapshot differs from the generated result."
          git diff --stat -- docs/maintenance/dependency-current-status.md
          {
            echo "## Dependency status drift detected"
            echo "The generated dependency status differs from the checked-in snapshot."
            echo "Direct pushes to master are intentionally disabled by repository governance."
            echo "Refresh the snapshot through a normal pull request when the report needs to be persisted."
          } >> "$GITHUB_STEP_SUMMARY"
