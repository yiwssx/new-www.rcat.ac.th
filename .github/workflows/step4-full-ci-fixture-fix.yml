name: Step 4 Full CI Fixture Fix

on:
  push:
    branches:
      - refactor/ssr-readiness-step4
    paths:
      - .github/workflows/step4-full-ci-fixture-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ssr-readiness-step4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: node scripts/step4-full-ci-fixture-fix.mjs
      - run: pnpm exec prettier --write src/test/publicDataDrivenPages.test.tsx src/public/hooks/usePublicContentDetail.test.tsx
      - run: pnpm exec vitest run src/test/publicDataDrivenPages.test.tsx src/public/hooks/usePublicContentDetail.test.tsx
      - name: Commit fixture fixes and remove temporary files
        run: |
          rm scripts/step4-full-ci-fixture-fix.mjs .github/workflows/step4-full-ci-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ssr): align Step 4 contract fixtures"
          git push origin HEAD:refactor/ssr-readiness-step4
