name: v3.3.2 Task 8 Verify

on:
  push:
    branches:
      - feat/v3.3.2-task-8-dependency-graph-isolation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message || '', 'format verified isolation gate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write scripts/editor-dependency-isolation.mjs scripts/editor-dependency-isolation.test.mjs scripts/check-admin-editor-bundle.mjs docs/workstreams/v3.3.2-editor-dependency-isolation.md docs/workstreams/v3.3.2-content-editor-performance-tracker.md
      - run: node scripts/run-vitest.mjs run scripts/editor-dependency-isolation.test.mjs
      - run: pnpm editor:bundle:check
      - run: pnpm lint:server
      - name: Commit canonical Task 8 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/editor-dependency-isolation.mjs scripts/editor-dependency-isolation.test.mjs scripts/check-admin-editor-bundle.mjs docs/workstreams/v3.3.2-editor-dependency-isolation.md docs/workstreams/v3.3.2-content-editor-performance-tracker.md
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "test(editor): format verified isolation gate"
          git push origin HEAD:feat/v3.3.2-task-8-dependency-graph-isolation
