name: SSR Phase 7 Lock Refresh Probe

on:
  pull_request:
    branches:
      - refactor/ssr-readiness

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Refresh compatible lockfile resolutions only
        run: pnpm update --lockfile-only --depth Infinity
      - name: Show manifest and lockfile diff
        run: git diff -- package.json pnpm-lock.yaml
      - name: Full audit after compatible refresh
        run: pnpm audit --audit-level=high
      - name: Production audit after compatible refresh
        run: pnpm audit --prod --audit-level=moderate
