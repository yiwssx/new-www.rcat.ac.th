name: Hashed Client Assets Patch

on:
  push:
    branches:
      - fix/hashed-client-assets
    paths:
      - .github/workflows/hashed-client-assets-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hashed-client-assets
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Patch cache headers and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          vercel_path = Path('vercel.json')
          config = json.loads(vercel_path.read_text())
          headers = config.get('headers', [])
          headers = [
              rule for rule in headers
              if rule.get('source') not in {'/assets/rcat-client.js', '/assets/rcat-client.css', '/assets/:path*'}
          ]
          headers.append({
              'source': '/assets/:path*',
              'headers': [
                  {'key': 'Cache-Control', 'value': 'public, max-age=31536000, immutable'}
              ]
          })
          config['headers'] = headers
          vercel_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')

          routing_path = Path('src/test/vercelSsrRouting.test.mjs')
          source = routing_path.read_text()
          source = source.replace('import path from "node:path";\n', '')
          source = source.replace(
              '  const source = await readFile(path.join(process.cwd(), "vercel.json"), "utf8");',
              '  const source = await readFile(new URL("../../vercel.json", import.meta.url), "utf8");'
          )
          source = source.replace(
              'it("protects the internal CSR fallback and fixed client entry assets from stale browser caching", async () => {',
              'it("protects the CSR fallback while caching hashed client assets immutably", async () => {'
          )
          source = source.replace(
              '    expect(headerValue("/assets/rcat-client.js", "Cache-Control")).toBe("public, max-age=0, must-revalidate");\n'
              '    expect(headerValue("/assets/rcat-client.css", "Cache-Control")).toBe("public, max-age=0, must-revalidate");\n',
              '    expect(headerValue("/assets/:path*", "Cache-Control")).toBe("public, max-age=31536000, immutable");\n'
          )
          insert_anchor = '    expect(config.functions?.["api/ssr.ts"]?.supportsCancellation).toBe(true);\n'
          if 'vite build --ssr src/vercelSsr.ts' not in source:
              source = source.replace(
                  insert_anchor,
                  insert_anchor
                  + '    expect(config.buildCommand).toContain("vite build --ssr src/vercelSsr.ts");\n'
              )
          routing_path.write_text(source)

          cutover_path = Path('src/test/vercelSsrCutover.test.tsx')
          source = cutover_path.read_text()
          if 'data-rcat-client-stylesheet="true"' not in source:
              source = source.replace(
                  '    expect(html).toContain("/assets/rcat-client.css");\n',
                  '    expect(html).toContain("/assets/rcat-client.css");\n'
                  '    expect(html).toContain(\'data-rcat-client-stylesheet="true"\');\n'
              )
          if 'data-rcat-client-entry="true"' not in source:
              source = source.replace(
                  '    expect(html).toContain("/assets/rcat-client.js");\n',
                  '    expect(html).toContain("/assets/rcat-client.js");\n'
                  '    expect(html).toContain(\'data-rcat-client-entry="true"\');\n'
              )
          cutover_path.write_text(source)
          PY

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          vite.config.ts
          src/ssrAssets.ts
          src/routeComponents.tsx
          scripts/prepare-ssr-cutover-output.mjs
          vercel.json
          src/test/vercelSsrRouting.test.mjs
          src/test/vercelSsrCutover.test.tsx

      - name: Commit formatted patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts src/ssrAssets.ts src/routeComponents.tsx scripts/prepare-ssr-cutover-output.mjs vercel.json src/test/vercelSsrRouting.test.mjs src/test/vercelSsrCutover.test.tsx
          HUSKY=0 git commit -m "fix(cache): use hashed manifest-driven client assets"
          git push origin HEAD:fix/hashed-client-assets
