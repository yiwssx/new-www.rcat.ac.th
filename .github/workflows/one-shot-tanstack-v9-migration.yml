name: One-shot TanStack Table v9 migration

on:
  push:
    branches:
      - deps/direct-package-json-refresh-2026-08-15
    paths:
      - .github/workflows/one-shot-tanstack-v9-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/direct-package-json-refresh-2026-08-15
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Migrate the existing table adapter to TanStack Table v9
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path('src/admin/pages/ContentPage.tsx')
          text = path.read_text()

          replacements = [
              (
                  re.compile(r'import \{\s*createColumnHelper,\s*flexRender,\s*getCoreRowModel,\s*getSortedRowModel,\s*useReactTable\s*\} from "@tanstack/react-table";'),
                  '''import {
                    createColumnHelper,
                    flexRender,
                    stockFeatures,
                    useTable,
                    type StockFeatures
                  } from "@tanstack/react-table";'''.replace('                  ', ''),
                  'TanStack import block',
              ),
              (
                  re.compile(r'const columnHelper = createColumnHelper<AdminContentListItem>\(\);'),
                  'const columnHelper = createColumnHelper<StockFeatures, AdminContentListItem>();',
                  'column helper',
              ),
              (
                  re.compile(r'const table = useReactTable\(\{\s*data: items,\s*columns,\s*getCoreRowModel: getCoreRowModel\(\),\s*getSortedRowModel: getSortedRowModel\(\)\s*\}\);'),
                  '''const table = useTable({
                    features: stockFeatures,
                    data: items,
                    columns
                  });'''.replace('                  ', ''),
                  'table hook',
              ),
          ]

          for pattern, replacement, label in replacements:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} match, found {count}')

          columns_start = '  const columns = useMemo(\n    () => ['
          columns_start_replacement = '  const columns = useMemo(\n    () =>\n      columnHelper.columns(['
          if text.count(columns_start) != 1:
              raise SystemExit(f'Expected exactly one columns start, found {text.count(columns_start)}')
          text = text.replace(columns_start, columns_start_replacement, 1)

          columns_tail = '\n    ],\n    [\n      canDelete,'
          columns_tail_replacement = '\n      ]),\n    [\n      canDelete,'
          tail_index = text.find(columns_tail, text.find(columns_start_replacement))
          if tail_index < 0:
              raise SystemExit('Unable to find columns dependency-array boundary')
          text = text[:tail_index] + columns_tail_replacement + text[tail_index + len(columns_tail):]

          path.write_text(text)
          PY

      - name: Format migrated source
        run: pnpm exec prettier --write src/admin/pages/ContentPage.tsx

      - name: Refresh dependency status document
        run: pnpm deps:status

      - name: Verify build and performance budget
        run: |
          pnpm build
          pnpm perf:check

      - name: Commit migration and dependency status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/pages/ContentPage.tsx docs/maintenance/dependency-current-status.md
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'fix(deps): migrate content table to TanStack Table v9'
          git push origin HEAD:deps/direct-package-json-refresh-2026-08-15
