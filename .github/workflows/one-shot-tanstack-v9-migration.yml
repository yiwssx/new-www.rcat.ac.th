name: One-shot TanStack Table v9 migration

on:
  push:
    branches:
      - deps/direct-package-json-refresh-2026-08-15
    paths:
      - .github/workflows/one-shot-tanstack-v9-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/direct-package-json-refresh-2026-08-15
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Migrate the existing table adapter to TanStack Table v9
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path('src/admin/pages/ContentPage.tsx')
          text = path.read_text()

          import_pattern = re.compile(
              r'import \{\s*createColumnHelper,\s*flexRender,\s*getCoreRowModel,\s*getSortedRowModel,\s*useReactTable\s*\} from "@tanstack/react-table";'
          )
          import_replacement = '''import {
            createColumnHelper,
            flexRender,
            stockFeatures,
            useTable,
            type StockFeatures
          } from "@tanstack/react-table";'''.replace('          ', '')

          helper_pattern = re.compile(r'const columnHelper = createColumnHelper<AdminContentListItem>\(\);')
          helper_replacement = 'const columnHelper = createColumnHelper<StockFeatures, AdminContentListItem>();'

          table_pattern = re.compile(
              r'const table = useReactTable\(\{\s*data: items,\s*columns,\s*getCoreRowModel: getCoreRowModel\(\),\s*getSortedRowModel: getSortedRowModel\(\)\s*\}\);'
          )
          table_replacement = '''const table = useTable({
            features: stockFeatures,
            data: items,
            columns
          });'''.replace('          ', '')

          replacements = [
              (import_pattern, import_replacement, 'TanStack import block'),
              (helper_pattern, helper_replacement, 'column helper'),
              (table_pattern, table_replacement, 'table hook'),
          ]

          for pattern, replacement, label in replacements:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} match, found {count}')

          path.write_text(text)
          PY

      - name: Format migrated source
        run: pnpm exec prettier --write src/admin/pages/ContentPage.tsx

      - name: Refresh dependency status document
        run: pnpm deps:status

      - name: Verify build and performance budget
        run: |
          pnpm build
          pnpm perf:check

      - name: Commit migration and dependency status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/pages/ContentPage.tsx docs/maintenance/dependency-current-status.md
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'fix(deps): migrate content table to TanStack Table v9'
          git push origin HEAD:deps/direct-package-json-refresh-2026-08-15
