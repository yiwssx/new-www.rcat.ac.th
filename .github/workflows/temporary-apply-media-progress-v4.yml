name: Temporary Apply Media Progress V4

on:
  push:
    branches:
      - agent/media-upload-progress-lock
    paths:
      - .github/workflows/temporary-apply-media-progress-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-upload-progress-lock
      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def j(lines):
              return "\n".join(lines)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one marker, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Drive resumable client: publish exact confirmed-byte progress.
          p = Path('src/features/cms-media/mediaBridgeClient.ts')
          text = p.read_text()
          old = j([
              'interface MediaUploadRecoveryOptions {',
              '  createUploadKey?: () => string;',
              '  delay?: (milliseconds: number) => Promise<void>;',
              '  random?: () => number;',
              '}'
          ])
          new = j([
              'export interface MediaUploadProgress {',
              '  uploadedBytes: number;',
              '  totalBytes: number;',
              '  percent: number;',
              '}',
              '',
              'export interface MediaUploadOptions {',
              '  createUploadKey?: () => string;',
              '  delay?: (milliseconds: number) => Promise<void>;',
              '  random?: () => number;',
              '  onProgress?: (progress: MediaUploadProgress) => void;',
              '}'
          ])
          if text.count(old) != 1:
              raise SystemExit('mediaBridgeClient.ts: upload option interface marker mismatch')
          text = text.replace(old, new, 1).replace('MediaUploadRecoveryOptions', 'MediaUploadOptions')

          marker = 'function validateUploadProgressResult(value: unknown, totalBytes: number): MediaUploadChunkResult {'
          helper = j([
              'function reportUploadProgress(options: MediaUploadOptions, totalBytes: number, uploadedBytes: number) {',
              '  const safeUploadedBytes = Math.min(Math.max(uploadedBytes, 0), totalBytes);',
              '  const percent = totalBytes > 0 ? Math.round((safeUploadedBytes / totalBytes) * 100) : 0;',
              '',
              '  try {',
              '    options.onProgress?.({ uploadedBytes: safeUploadedBytes, totalBytes, percent });',
              '  } catch {',
              '    // UI feedback must never interrupt the upload transport.',
              '  }',
              '}',
              '',
              marker
          ])
          if text.count(marker) != 1:
              raise SystemExit('mediaBridgeClient.ts: validate progress marker mismatch')
          text = text.replace(marker, helper, 1)

          old = j([
              '  const startPayload = { ...metadata, totalBytes };',
              '  let startResult = await requestStartWithRetries(startPayload, totalBytes, recoveryOptions);',
              '',
              '  if (startResult.uploadComplete) {',
              '    return startResult.asset;',
              '  }'
          ])
          new = j([
              '  const startPayload = { ...metadata, totalBytes };',
              '  const reportProgress = (uploadedBytes: number) =>',
              '    reportUploadProgress(recoveryOptions, totalBytes, uploadedBytes);',
              '  let startResult = await requestStartWithRetries(startPayload, totalBytes, recoveryOptions);',
              '',
              '  if (startResult.uploadComplete) {',
              '    reportProgress(totalBytes);',
              '    return startResult.asset;',
              '  }'
          ])
          if text.count(old) != 1:
              raise SystemExit('mediaBridgeClient.ts: start block mismatch')
          text = text.replace(old, new, 1)

          old = j([
              '  let sessionRestarts = 0;',
              '  let chunkRetriesAtCurrentByte = 0;',
              '  let noProgressCycles = 0;',
              '',
              '  async function restartSession() {'
          ])
          new = j([
              '  let sessionRestarts = 0;',
              '  let chunkRetriesAtCurrentByte = 0;',
              '  let noProgressCycles = 0;',
              '  reportProgress(currentByte);',
              '',
              '  async function restartSession() {'
          ])
          if text.count(old) != 1:
              raise SystemExit('mediaBridgeClient.ts: initial progress block mismatch')
          text = text.replace(old, new, 1)

          old = j([
              '    uploadUrl = startResult.uploadUrl;',
              '    currentByte = startResult.nextByte;',
              '    chunkRetriesAtCurrentByte = 0;',
              '    noProgressCycles = 0;',
              '    return null;'
          ])
          new = j([
              '    uploadUrl = startResult.uploadUrl;',
              '    currentByte = startResult.nextByte;',
              '    chunkRetriesAtCurrentByte = 0;',
              '    noProgressCycles = 0;',
              '    reportProgress(currentByte);',
              '    return null;'
          ])
          if text.count(old) != 1:
              raise SystemExit('mediaBridgeClient.ts: restart progress block mismatch')
          text = text.replace(old, new, 1)

          old = j([
              '    }',
              '    currentByte = nextByte;',
              '  }',
              '',
              '  while (true) {'
          ])
          new = j([
              '    }',
              '    currentByte = nextByte;',
              '    reportProgress(currentByte);',
              '  }',
              '',
              '  while (true) {'
          ])
          if text.count(old) != 1:
              raise SystemExit('mediaBridgeClient.ts: record progress block mismatch')
          text = text.replace(old, new, 1)
          text = re.sub(
              r'(?m)^(\s*)return (status|result|restarted)\.asset;$',
              r'\1reportProgress(totalBytes);\n\1return \2.asset;',
              text
          )
          p.write_text(text)

          # 2) Thread progress options through public media API.
          Path('src/features/cms-media/api.ts').write_text(j([
              'import { deleteMediaMetadataFromCloudflare, saveMediaMetadataToCloudflare } from "../admin-write/cloudflareApi";',
              'import { cacheBridgeMediaAsset, removeBridgeMediaAsset } from "./bridgeCache";',
              'import {',
              '  deleteMediaAssetFromBridge,',
              '  saveMediaAssetToBridge,',
              '  uploadMediaAssetToBridge,',
              '  type MediaUploadOptions',
              '} from "./mediaBridgeClient";',
              'import type { MediaAsset, MediaAssetInput } from "./types";',
              '',
              'async function persistBridgeMetadata(asset: MediaAsset) {',
              '  cacheBridgeMediaAsset(asset);',
              '',
              '  try {',
              '    return cacheBridgeMediaAsset(await saveMediaMetadataToCloudflare(asset));',
              '  } catch {',
              '    // Keep the returned bridge metadata visible until a later D1 metadata sync succeeds.',
              '    return asset;',
              '  }',
              '}',
              '',
              'export async function saveMediaAsset(input: MediaAssetInput, options: MediaUploadOptions = {}) {',
              '  return persistBridgeMetadata(await saveMediaAssetToBridge(input, options));',
              '}',
              '',
              'export async function uploadMediaAsset(asset: MediaAsset) {',
              '  return persistBridgeMetadata(await uploadMediaAssetToBridge(asset));',
              '}',
              '',
              'function getMediaAssetId(asset: string | Pick<MediaAsset, "id">) {',
              '  return typeof asset === "string" ? asset : asset.id;',
              '}',
              '',
              'export async function deleteMediaAsset(asset: string | MediaAsset) {',
              '  const id = getMediaAssetId(asset);',
              '  const result = await deleteMediaAssetFromBridge(asset);',
              '',
              '  try {',
              '    await deleteMediaMetadataFromCloudflare(id);',
              '  } catch {',
              '    // The Drive delete succeeded; remove the local bridge entry even if D1 metadata cleanup must be retried.',
              '  }',
              '',
              '  removeBridgeMediaAsset(id);',
              '  return result;',
              '}',
              '',
              'export type { MediaAssetInput } from "./types";',
              'export type { MediaUploadOptions, MediaUploadProgress } from "./mediaBridgeClient";',
              ''
          ]))
          Path('src/features/cms-media/index.ts').write_text(j([
              'export { deleteMediaAsset, saveMediaAsset, uploadMediaAsset } from "./api";',
              'export { mergeBridgeMediaAssets } from "./bridgeCache";',
              'export { MAX_MEDIA_UPLOAD_BYTES } from "./mediaBridgeClient";',
              'export type { MediaAssetInput, MediaUploadOptions, MediaUploadProgress } from "./api";',
              'export type { MediaAsset, MediaType } from "./types";',
              ''
          ]))

          # 3) Reusable inline progress UI.
          Path('src/admin/components/MediaUploadProgressFeedback.tsx').write_text(j([
              'import { LinearProgress, Stack, Typography } from "@mui/material";',
              'import type { MediaUploadProgress } from "../../features/cms-media";',
              'import { formatFileSize } from "../../utils/files";',
              '',
              'interface MediaUploadProgressFeedbackProps {',
              '  preparing: boolean;',
              '  progress: MediaUploadProgress | null;',
              '}',
              '',
              'export default function MediaUploadProgressFeedback({ preparing, progress }: MediaUploadProgressFeedbackProps) {',
              '  const percent = progress?.percent ?? 0;',
              '  const complete = !preparing && percent >= 100;',
              '  const label = preparing',
              '    ? "กำลังเตรียมไฟล์สำหรับอัปโหลด"',
              '    : complete',
              '      ? "อัปโหลดครบ 100% กำลังบันทึกข้อมูล"',
              '      : "กำลังอัปโหลดไฟล์ไปยัง Drive และบันทึกข้อมูล";',
              '',
              '  return (',
              '    <Stack spacing={0.8} role="status" aria-live="polite" aria-busy="true">',
              '      <Stack direction="row" spacing={1} sx={{ alignItems: "center", justifyContent: "space-between" }}>',
              '        <Typography sx={{ color: "text.secondary" }}>{label}</Typography>',
              '        {!preparing && (',
              '          <Typography sx={{ fontWeight: 900, minWidth: 48, textAlign: "right" }}>{percent}%</Typography>',
              '        )}',
              '      </Stack>',
              '      <LinearProgress',
              '        variant={preparing ? "indeterminate" : "determinate"}',
              '        value={preparing ? undefined : percent}',
              '        aria-label={preparing ? "กำลังเตรียมไฟล์" : `ความคืบหน้าการอัปโหลด ${percent}%`}',
              '        sx={{ height: 8, borderRadius: 999 }}',
              '      />',
              '      <Typography variant="caption" sx={{ color: "text.secondary" }}>',
              '        {preparing',
              '          ? "กำลังอ่านและเตรียมข้อมูลไฟล์ กรุณาอย่าปิดหน้านี้"',
              '          : progress',
              '            ? `${formatFileSize(progress.uploadedBytes)} / ${formatFileSize(progress.totalBytes)}`',
              '            : "กำลังเริ่มการอัปโหลด"}',
              '      </Typography>',
              '    </Stack>',
              '  );',
              '}',
              ''
          ]))

          # 4) Main Media Library upload: immediate lock before FileReader + progress UI.
          p = Path('src/admin/pages/MediaPage.tsx')
          text = p.read_text()
          text = text.replace(
              'import { ChangeEvent, FormEvent, useEffect, useState } from "react";',
              'import { ChangeEvent, FormEvent, useEffect, useRef, useState } from "react";',
              1
          )
          text = text.replace(
              'import AdminPagination from "../components/AdminPagination";',
              j(['import AdminPagination from "../components/AdminPagination";', 'import MediaUploadProgressFeedback from "../components/MediaUploadProgressFeedback";']),
              1
          )
          text = text.replace(
              'import { deleteMediaAsset, MAX_MEDIA_UPLOAD_BYTES, saveMediaAsset } from "../../features/cms-media";',
              j([
                  'import {',
                  '  deleteMediaAsset,',
                  '  MAX_MEDIA_UPLOAD_BYTES,',
                  '  saveMediaAsset,',
                  '  type MediaAssetInput,',
                  '  type MediaUploadOptions,',
                  '  type MediaUploadProgress',
                  '} from "../../features/cms-media";'
              ]),
              1
          )
          old = j(['type OperationNotice = {', '  severity: "success" | "error";', '  message: string;', '};'])
          new = j([
              'type OperationNotice = {',
              '  severity: "success" | "error";',
              '  message: string;',
              '};',
              'type MediaSaveRequest = {',
              '  input: MediaAssetInput;',
              '  options?: MediaUploadOptions;',
              '};'
          ])
          if text.count(old) != 1:
              raise SystemExit('MediaPage.tsx: operation type marker mismatch')
          text = text.replace(old, new, 1)
          old = j([
              '  const [formError, setFormError] = useState("");',
              '  const [confirming, setConfirming] = useState(false);',
              '  const [deletingMediaId, setDeletingMediaId] = useState<string | null>(null);'
          ])
          new = j([
              '  const [formError, setFormError] = useState("");',
              '  const [confirming, setConfirming] = useState(false);',
              '  const saveLockRef = useRef(false);',
              '  const [saveStarting, setSaveStarting] = useState(false);',
              '  const [uploadProgress, setUploadProgress] = useState<MediaUploadProgress | null>(null);',
              '  const [deletingMediaId, setDeletingMediaId] = useState<string | null>(null);'
          ])
          if text.count(old) != 1:
              raise SystemExit('MediaPage.tsx: save states marker mismatch')
          text = text.replace(old, new, 1)
          old = j(['  const saveMutation = useMutation({', '    mutationFn: saveMediaAsset', '  });'])
          new = j([
              '  const saveMutation = useMutation({',
              '    mutationFn: ({ input, options }: MediaSaveRequest) => saveMediaAsset(input, options)',
              '  });'
          ])
          if text.count(old) != 1:
              raise SystemExit('MediaPage.tsx: save mutation marker mismatch')
          text = text.replace(old, new, 1)
          old = j([
              '  const mediaActionsDisabled =',
              '    saveMutation.isPending || deleteMutation.isPending || deletingMediaId !== null || listTransitioning;'
          ])
          new = j([
              '  const isSaveBusy = saveStarting || saveMutation.isPending;',
              '  const mediaActionsDisabled = isSaveBusy || deleteMutation.isPending || deletingMediaId !== null || listTransitioning;'
          ])
          if text.count(old) != 1:
              raise SystemExit('MediaPage.tsx: disabled marker mismatch')
          text = text.replace(old, new, 1)

          start = text.index('  async function handleConfirmSave() {')
          end = text.index('\n  async function handleDelete(asset: MediaAsset) {', start)
          replacement = j([
              '  async function handleConfirmSave() {',
              '    if (saveLockRef.current) {',
              '      return;',
              '    }',
              '',
              '    if (!canManage) {',
              '      setFormError(ADMIN_READ_ONLY_NOTICE);',
              '      return;',
              '    }',
              '',
              '    if (mediaActionsDisabled) {',
              '      return;',
              '    }',
              '',
              '    if (file && file.size > MAX_MEDIA_UPLOAD_BYTES) {',
              '      setFormError("ไฟล์ต้องมีขนาดไม่เกิน 100 MB");',
              '      setFile(null);',
              '      return;',
              '    }',
              '',
              '    saveLockRef.current = true;',
              '    setSaveStarting(true);',
              '    setUploadProgress(null);',
              '    const currentOperation = saveOperation;',
              '',
              '    if (!file) {',
              '      showMediaLoadingModal(getSaveLoadingTitle(currentOperation));',
              '    }',
              '',
              '    try {',
              '      let filePayload: Partial<MediaAssetInput> = {};',
              '      let uploadOptions: MediaUploadOptions | undefined;',
              '',
              '      if (file) {',
              '        const currentFile = file;',
              '        const fileBase64 = await readFileAsBase64(currentFile);',
              '        setUploadProgress({ uploadedBytes: 0, totalBytes: currentFile.size, percent: 0 });',
              '        uploadOptions = { onProgress: setUploadProgress };',
              '        filePayload = {',
              '          size: formatFileSize(currentFile.size),',
              '          fileName: currentFile.name,',
              '          fileBase64,',
              '          mimeType: currentFile.type',
              '        };',
              '      }',
              '',
              '      await saveMutation.mutateAsync({',
              '        input: {',
              '          id: editingAsset?.id,',
              '          name: form.name.trim(),',
              '          type: form.type,',
              '          owner: form.owner.trim(),',
              '          driveUrl: form.driveUrl.trim() || editingAsset?.driveUrl || "",',
              '          fileId: editingAsset?.fileId,',
              '          thumbnailUrl: editingAsset?.thumbnailUrl,',
              '          previewUrl: editingAsset?.previewUrl,',
              '          embedUrl: editingAsset?.embedUrl,',
              '          mimeType: editingAsset?.mimeType,',
              '          size: editingAsset?.size,',
              '          ...filePayload',
              '        },',
              '        options: uploadOptions',
              '      });',
              '      if (currentOperation === "upload") {',
              '        setListState({ page: 1 }, { replace: true });',
              '      }',
              '      await Promise.all([invalidateAdminListQueries(queryClient, "media"), invalidatePublicCmsData(queryClient)]);',
              '      await appSwal.close();',
              '      const successTitle = getSaveSuccessTitle(currentOperation);',
              '      const successText = getSaveSuccessText(currentOperation);',
              '      handleCloseDialog();',
              '      setOperationNotice({',
              '        severity: "success",',
              '        message: formatOperationNotice(successTitle, successText)',
              '      });',
              '      await waitForDialogTransition();',
              '      await appSwal.fire({',
              '        icon: "success",',
              '        title: successTitle,',
              '        text: successText,',
              '        confirmButtonText: "ตกลง"',
              '      });',
              '    } catch (currentError) {',
              '      const message = getErrorMessage(currentError, "กรุณาตรวจสอบรายละเอียดสื่อ");',
              '      const errorTitle = getSaveErrorTitle(currentOperation);',
              '      await appSwal.close();',
              '      setFormError(message);',
              '      setOperationNotice({',
              '        severity: "error",',
              '        message: formatOperationNotice(errorTitle, message)',
              '      });',
              '      await appSwal.fire({',
              '        icon: "error",',
              '        title: errorTitle,',
              '        text: message,',
              '        confirmButtonText: "ตกลง"',
              '      });',
              '    } finally {',
              '      saveLockRef.current = false;',
              '      setSaveStarting(false);',
              '      setUploadProgress(null);',
              '    }',
              '  }',
              ''
          ])
          text = text[:start] + replacement + text[end + 1:]
          text = text.replace(
              'onClose={saveMutation.isPending ? undefined : handleCloseDialog}',
              'onClose={isSaveBusy ? undefined : handleCloseDialog}',
              1
          )
          pending_old = j([
              '                {saveMutation.isPending && (',
              '                  <Stack spacing={1}>',
              '                    <LinearProgress />',
              '                    <Typography',
              '                      sx={{',
              '                        color: "text.secondary"',
              '                      }}',
              '                    >',
              '                      {getSavePendingText(saveOperation)}',
              '                    </Typography>',
              '                  </Stack>',
              '                )}'
          ])
          pending_new = j([
              '                {isSaveBusy && file ? (',
              '                  <MediaUploadProgressFeedback preparing={!uploadProgress} progress={uploadProgress} />',
              '                ) : isSaveBusy ? (',
              '                  <Stack spacing={1}>',
              '                    <LinearProgress />',
              '                    <Typography sx={{ color: "text.secondary" }}>{getSavePendingText(saveOperation)}</Typography>',
              '                  </Stack>',
              '                ) : null}'
          ])
          if text.count(pending_old) != 1:
              raise SystemExit('MediaPage.tsx: pending UI marker mismatch')
          text = text.replace(pending_old, pending_new, 1)
          text = text.replace('disabled={!canManage || saveMutation.isPending}', 'disabled={!canManage || isSaveBusy}', 1)
          text = text.replace('disabled={saveMutation.isPending}', 'disabled={isSaveBusy}', 2)
          text = text.replace(
              '{saveMutation.isPending ? "กำลังบันทึก" : isEditing ? "บันทึก" : "อัปโหลด"}',
              '{isSaveBusy ? (file && uploadProgress ? `กำลังอัปโหลด ${uploadProgress.percent}%` : file ? "กำลังเตรียมไฟล์" : "กำลังบันทึก") : isEditing ? "บันทึก" : "อัปโหลด"}',
              1
          )
          p.write_text(text)

          # 5) Quick upload in Content editor: same immediate lock + progress UI.
          p = Path('src/admin/components/ContentEditorDialog.tsx')
          text = p.read_text()
          text = text.replace(
              'import type { MediaAssetInput } from "../../features/cms-media";',
              'import type { MediaAssetInput, MediaUploadOptions, MediaUploadProgress } from "../../features/cms-media";',
              1
          )
          text = text.replace(
              'import AdminPagination from "./AdminPagination";',
              j(['import AdminPagination from "./AdminPagination";', 'import MediaUploadProgressFeedback from "./MediaUploadProgressFeedback";']),
              1
          )
          text = text.replace(
              '  onUploadMedia?: (input: MediaAssetInput) => Promise<MediaAsset>;',
              '  onUploadMedia?: (input: MediaAssetInput, options?: MediaUploadOptions) => Promise<MediaAsset>;',
              1
          )
          old = j([
              '  const [uploadType, setUploadType] = useState<MediaType>("image");',
              '  const [uploadError, setUploadError] = useState("");',
              '  const [uploading, setUploading] = useState(false);'
          ])
          new = j([
              '  const [uploadType, setUploadType] = useState<MediaType>("image");',
              '  const [uploadError, setUploadError] = useState("");',
              '  const uploadLockRef = useRef(false);',
              '  const [uploading, setUploading] = useState(false);',
              '  const [uploadProgress, setUploadProgress] = useState<MediaUploadProgress | null>(null);'
          ])
          if text.count(old) != 1:
              raise SystemExit('ContentEditorDialog.tsx: upload states marker mismatch')
          text = text.replace(old, new, 1)
          text = text.replace(
              j(['    setUploadError("");', '    setUploading(false);', '    setTagInputValue(recovered ? recoveredTagInputValue : "");']),
              j(['    setUploadError("");', '    uploadLockRef.current = false;', '    setUploading(false);', '    setUploadProgress(null);', '    setTagInputValue(recovered ? recoveredTagInputValue : "");']),
              1
          )
          start = text.index('  async function handleUploadMedia() {')
          end = text.index('\n  function handleSubmit(event: FormEvent<HTMLFormElement>) {', start)
          replacement = j([
              '  async function handleUploadMedia() {',
              '    if (uploadLockRef.current) {',
              '      return;',
              '    }',
              '',
              '    if (!uploadFile || !onUploadMedia) {',
              '      setUploadError("กรุณาเลือกไฟล์ก่อนอัปโหลด");',
              '      return;',
              '    }',
              '',
              '    if (uploadFile.size > MAX_MEDIA_UPLOAD_BYTES) {',
              '      setUploadFile(null);',
              '      setUploadName("");',
              '      setUploadType("image");',
              '      setUploadError("ไฟล์ต้องมีขนาดไม่เกิน 100 MB");',
              '      return;',
              '    }',
              '',
              '    uploadLockRef.current = true;',
              '    try {',
              '      setUploading(true);',
              '      setUploadProgress(null);',
              '      setUploadError("");',
              '      const currentFile = uploadFile;',
              '      const fileBase64 = await readFileAsBase64(currentFile);',
              '      setUploadProgress({ uploadedBytes: 0, totalBytes: currentFile.size, percent: 0 });',
              '      const asset = await onUploadMedia(',
              '        {',
              '          name: uploadName.trim() || currentFile.name,',
              '          type: uploadType,',
              '          size: formatFileSize(currentFile.size),',
              '          owner: draft.owner.trim() || "ผู้แก้ไข CMS",',
              '          fileName: currentFile.name,',
              '          fileBase64,',
              '          mimeType: currentFile.type',
              '        },',
              '        { onProgress: setUploadProgress }',
              '      );',
              '',
              '      markDirty();',
              '      setUploadedAssets((current) => [asset, ...current.filter((item) => item.id !== asset.id)]);',
              '      setDraft((current) => ({',
              '        ...current,',
              '        mediaIds: Array.from(new Set([...normalizeMediaIds(current.mediaIds), asset.id])),',
              '        featuredMediaId: current.featuredMediaId || (asset.type === "image" || asset.type === "video" ? asset.id : ""),',
              '        updatedAt: new Date().toISOString()',
              '      }));',
              '      setUploadFile(null);',
              '      setUploadName("");',
              '      setUploadType("image");',
              '    } catch (currentError) {',
              '      setUploadError(currentError instanceof Error ? currentError.message : "ไม่สามารถอัปโหลดสื่อได้");',
              '    } finally {',
              '      uploadLockRef.current = false;',
              '      setUploading(false);',
              '      setUploadProgress(null);',
              '    }',
              '  }',
              ''
          ])
          text = text[:start] + replacement + text[end + 1:]
          file_info = j([
              '                {uploadFile && (',
              '                  <Typography',
              '                    variant="body2"',
              '                    sx={{',
              '                      color: "text.secondary"',
              '                    }}',
              '                  >',
              '                    {uploadFile.name} / {formatFileSize(uploadFile.size)}',
              '                  </Typography>',
              '                )}'
          ])
          if text.count(file_info) != 1:
              raise SystemExit('ContentEditorDialog.tsx: file info marker mismatch')
          text = text.replace(
              file_info,
              file_info + '\n                {uploading && <MediaUploadProgressFeedback preparing={!uploadProgress} progress={uploadProgress} />}',
              1
          )
          text = text.replace('                  value={uploadName}\n                  onChange=', '                  value={uploadName}\n                  disabled={uploading}\n                  onChange=', 1)
          marker = j(['                  value={uploadType}', '                  onChange={(event) => setUploadType(event.target.value as MediaType)}'])
          replacement_marker = j(['                  value={uploadType}', '                  disabled={uploading}', '                  onChange={(event) => setUploadType(event.target.value as MediaType)}'])
          if text.count(marker) != 1:
              raise SystemExit('ContentEditorDialog.tsx: upload type field marker mismatch')
          text = text.replace(marker, replacement_marker, 1)
          text = text.replace(
              '{uploading ? "กำลังอัปโหลด" : "อัปโหลดและแนบ"}',
              '{uploading ? (uploadProgress ? `กำลังอัปโหลด ${uploadProgress.percent}%` : "กำลังเตรียมไฟล์") : "อัปโหลดและแนบ"}',
              1
          )
          p.write_text(text)

          # 6) Parent Content page forwards progress callback through mutation.
          p = Path('src/admin/pages/ContentPage.tsx')
          text = p.read_text()
          text = text.replace(
              'import { saveMediaAsset, type MediaAssetInput } from "../../features/cms-media";',
              'import { saveMediaAsset, type MediaAssetInput, type MediaUploadOptions } from "../../features/cms-media";',
              1
          )
          old = j([
              '  const mediaMutation = useMutation({',
              '    mutationFn: saveMediaAsset,',
              '    onSuccess: async () => {'
          ])
          new = j([
              '  const mediaMutation = useMutation({',
              '    mutationFn: ({ input, options }: { input: MediaAssetInput; options?: MediaUploadOptions }) =>',
              '      saveMediaAsset(input, options),',
              '    onSuccess: async () => {'
          ])
          if text.count(old) != 1:
              raise SystemExit('ContentPage.tsx: media mutation marker mismatch')
          text = text.replace(old, new, 1)
          old = j([
              '  async function handleUploadMedia(input: MediaAssetInput) {',
              '    if (!canManageMedia) {',
              '      throw new Error(ADMIN_READ_ONLY_NOTICE);',
              '    }',
              '',
              '    return mediaMutation.mutateAsync(input);',
              '  }'
          ])
          new = j([
              '  async function handleUploadMedia(input: MediaAssetInput, options?: MediaUploadOptions) {',
              '    if (!canManageMedia) {',
              '      throw new Error(ADMIN_READ_ONLY_NOTICE);',
              '    }',
              '',
              '    return mediaMutation.mutateAsync({ input, options });',
              '  }'
          ])
          if text.count(old) != 1:
              raise SystemExit('ContentPage.tsx: upload handler marker mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Format and typecheck
        run: |
          corepack enable
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm exec prettier --write \
            src/features/cms-media/mediaBridgeClient.ts \
            src/features/cms-media/api.ts \
            src/features/cms-media/index.ts \
            src/admin/components/MediaUploadProgressFeedback.tsx \
            src/admin/components/ContentEditorDialog.tsx \
            src/admin/pages/MediaPage.tsx \
            src/admin/pages/ContentPage.tsx
          pnpm exec tsc --noEmit
      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/cms-media/mediaBridgeClient.ts \
            src/features/cms-media/api.ts \
            src/features/cms-media/index.ts \
            src/admin/components/MediaUploadProgressFeedback.tsx \
            src/admin/components/ContentEditorDialog.tsx \
            src/admin/pages/MediaPage.tsx \
            src/admin/pages/ContentPage.tsx
          git commit -m "feat(media): show upload progress and block duplicate submits"
          git push origin HEAD:agent/media-upload-progress-lock
