name: P5X Format Changed Once

on:
  push:
    branches:
      - agent/p5x-production-convergence

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message != 'style(p5x): commit formatted changed files' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5x-production-convergence
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format P5X changed files
        shell: bash
        run: |
          pnpm exec prettier --write \
            .github/workflows/d1-recovery-drill.yml \
            .github/workflows/production-data-integrity.yml \
            .github/workflows/worker-production-preflight.yml \
            .github/workflows/worker-production.yml \
            cloudflare/public-api/README.md \
            cloudflare/public-api/package.json \
            cloudflare/public-api/scripts/productionDeployGuard.test.mjs \
            cloudflare/public-api/scripts/productionResource.mjs \
            cloudflare/public-api/scripts/worker-production-deploy.mjs \
            cloudflare/public-api/scripts/worker-production-preflight.mjs \
            cloudflare/public-api/scripts/worker-production-preflight.test.mjs \
            cloudflare/public-api/test/schemaContract.test.ts \
            docs/architecture/current-runtime-ownership.md \
            docs/architecture/production-environment-convergence-2026-08-16.md \
            docs/deployment/runtime-deployment-guide.md \
            docs/development/environment-variables.md \
            docs/maintenance/dependency-current-status.md \
            package.json
      - name: Commit formatted changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Changed files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/d1-recovery-drill.yml \
            .github/workflows/production-data-integrity.yml \
            .github/workflows/worker-production-preflight.yml \
            .github/workflows/worker-production.yml \
            cloudflare/public-api/README.md \
            cloudflare/public-api/package.json \
            cloudflare/public-api/scripts/productionDeployGuard.test.mjs \
            cloudflare/public-api/scripts/productionResource.mjs \
            cloudflare/public-api/scripts/worker-production-deploy.mjs \
            cloudflare/public-api/scripts/worker-production-preflight.mjs \
            cloudflare/public-api/scripts/worker-production-preflight.test.mjs \
            cloudflare/public-api/test/schemaContract.test.ts \
            docs/architecture/current-runtime-ownership.md \
            docs/architecture/production-environment-convergence-2026-08-16.md \
            docs/deployment/runtime-deployment-guide.md \
            docs/development/environment-variables.md \
            docs/maintenance/dependency-current-status.md \
            package.json
          git commit -m "style(p5x): commit formatted changed files"
          git push origin HEAD:agent/p5x-production-convergence
