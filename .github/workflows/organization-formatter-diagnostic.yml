name: Organization formatter diagnostic (temporary)
on:
  push:
    branches:
      - agent/org-01-domain-schema
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Print Prettier patch without modifying repository
        run: |
          for FILE in cloudflare/public-api/src/auth/adminStepUp.ts cloudflare/public-api/test/organizationPersonnelAudit.test.ts; do
            pnpm exec prettier "$FILE" > /tmp/org-format.ts
            diff -u "$FILE" /tmp/org-format.ts || true
          done
