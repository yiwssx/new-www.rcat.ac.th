name: Temporary Phase A Overflow Diagnostic

on:
  push:
    branches:
      - fix/phase-a-overflow-diagnostics

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run production overflow diagnostic
        env:
          PHASE_A_PRODUCTION_BASE_URL: https://www.rcat.ac.th
        run: pnpm exec playwright test --config playwright.production.config.ts
