name: Temporary Carousel Accessibility Patch

on:
  push:
    branches:
      - fix/phase-a-overflow-diagnostics

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(carousel): use pixel values for visually hidden content'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/phase-a-overflow-diagnostics
      - name: Patch visually hidden dimensions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/public/components/PublicHomeCarousel.tsx")
          text = path.read_text()
          old = '''const visuallyHiddenSx = {
            position: "absolute",
            width: 1,
            height: 1,
            p: 0,
            m: -1,
            overflow: "hidden",
            clip: "rect(0 0 0 0)",
            whiteSpace: "nowrap",
            border: 0
          } as const;'''
          new = '''const visuallyHiddenSx = {
            position: "absolute",
            width: "1px",
            height: "1px",
            p: 0,
            m: "-1px",
            overflow: "hidden",
            clip: "rect(0 0 0 0)",
            whiteSpace: "nowrap",
            border: 0
          } as const;'''

          if old not in text:
            raise SystemExit("expected visuallyHiddenSx block not found")

          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/components/PublicHomeCarousel.tsx
          git diff --cached --check
          git commit -m "fix(carousel): use pixel values for visually hidden content"
          git push origin HEAD:fix/phase-a-overflow-diagnostics
