name: Temporary Carousel Accessibility Patch

on:
  push:
    branches:
      - fix/phase-a-overflow-diagnostics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/phase-a-overflow-diagnostics
      - name: Patch visually hidden dimensions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/public/components/PublicHomeCarousel.tsx")
          text = path.read_text()
          old = '''const visuallyHiddenSx = {
            position: "absolute",
            width: 1,
            height: 1,
            p: 0,
            m: -1,
            overflow: "hidden",
            clip: "rect(0 0 0 0)",
            whiteSpace: "nowrap",
            border: 0
          } as const;'''
          new = '''const visuallyHiddenSx = {
            position: "absolute",
            width: "1px",
            height: "1px",
            p: 0,
            m: "-1px",
            overflow: "hidden",
            clip: "rect(0 0 0 0)",
            whiteSpace: "nowrap",
            border: 0
          } as const;'''

          if old in text:
            path.write_text(text.replace(old, new, 1))
          elif new not in text:
            raise SystemExit("expected visuallyHiddenSx block not found")
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet -- src/public/components/PublicHomeCarousel.tsx; then
            echo "Carousel patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/components/PublicHomeCarousel.tsx
          git diff --cached --check
          git commit -m "fix(carousel): use pixel values for visually hidden content"
          git push origin HEAD:fix/phase-a-overflow-diagnostics
