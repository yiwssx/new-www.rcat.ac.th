name: Temporary / Format Media Reliability

on:
  push:
    branches:
      - fix/apps-script-bridge-reliability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/apps-script-bridge-reliability
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Tune retry policy
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/features/cms-media/mediaBridgeClient.ts")
          text = path.read_text()
          replacements = {
              "const MAX_CHUNK_RETRIES = 4;\nconst MAX_STATUS_RETRIES = 4;\nconst MAX_SESSION_RESTARTS = 1;\nconst MAX_NO_PROGRESS_CYCLES = 5;\nconst RETRY_DELAYS_MS = [500, 1000, 2000, 4000];":
                  "const MAX_START_RETRIES = 4;\nconst MAX_CHUNK_RETRIES = 2;\nconst MAX_STATUS_RETRIES = 2;\nconst MAX_SESSION_RESTARTS = 1;\nconst MAX_NO_PROGRESS_CYCLES = 3;\nconst START_RETRY_DELAYS_MS = [500, 1000, 2000, 4000];\nconst RECOVERY_RETRY_DELAYS_MS = [1000, 3000];",
              "async function waitBeforeRetry(retryNumber: number, options: MediaUploadOptions) {\n  const base = RETRY_DELAYS_MS[Math.min(Math.max(retryNumber - 1, 0), RETRY_DELAYS_MS.length - 1)];":
                  "async function waitBeforeRetry(\n  retryNumber: number,\n  options: MediaUploadOptions,\n  delays = RECOVERY_RETRY_DELAYS_MS\n) {\n  const base = delays[Math.min(Math.max(retryNumber - 1, 0), delays.length - 1)];",
              "if (!isTransientMediaBridgeError(error) || attempt >= MAX_CHUNK_RETRIES) {\n        throw error;\n      }\n      await waitBeforeRetry(attempt + 1, options);":
                  "if (!isTransientMediaBridgeError(error) || attempt >= MAX_START_RETRIES) {\n        throw error;\n      }\n      await waitBeforeRetry(attempt + 1, options, START_RETRY_DELAYS_MS);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected media retry source not found: {old[:80]}")
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          server/appsScriptProxy/facebookThumbnail.test.mjs
          server/appsScriptProxy/handler.mjs
          server/appsScriptProxy/resumableFacebookThumbnail.mjs
          src/features/cms-media/facebookThumbnailClient.test.ts
          src/features/cms-media/facebookThumbnailClient.ts
          src/features/cms-media/mediaBridgeClient.ts
          src/features/cms-media/mediaBridgeReliability.test.ts
          src/features/cms-media/types.ts
      - name: Commit formatted result and remove temporary workflow
        run: |
          rm .github/workflows/tmp-format-media-reliability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(media): format reliability patch"
          git push origin HEAD:fix/apps-script-bridge-reliability
