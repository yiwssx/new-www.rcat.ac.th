name: Swap SiteShell taglines once

on:
  push:
    branches:
      - fix/swap-siteshell-taglines

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/swap-siteshell-taglines
          fetch-depth: 0

      - name: Swap SiteShell eyebrow and intro positions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/public/components/PublicSiteShell.tsx')
          text = path.read_text(encoding='utf-8')

          targets = {
              '{siteSettings.eyebrow && (': 1,
              '{siteSettings.intro && (': 1,
              '<FlagEmojiText text={siteSettings.eyebrow} />': 1,
              '<FlagEmojiText text={siteSettings.intro} />': 1,
          }
          for needle, expected in targets.items():
              actual = text.count(needle)
              if actual != expected:
                  raise SystemExit(f'expected {expected} occurrence(s) of {needle!r}, found {actual}')

          text = text.replace('{siteSettings.eyebrow && (', '{__RCAT_SWAP_CONDITION_TOP__}', 1)
          text = text.replace('{siteSettings.intro && (', '{siteSettings.eyebrow && (', 1)
          text = text.replace('{__RCAT_SWAP_CONDITION_TOP__}', '{siteSettings.intro && (', 1)

          text = text.replace('<FlagEmojiText text={siteSettings.eyebrow} />', '<FlagEmojiText text={__RCAT_SWAP_TEXT_TOP__} />', 1)
          text = text.replace('<FlagEmojiText text={siteSettings.intro} />', '<FlagEmojiText text={siteSettings.eyebrow} />', 1)
          text = text.replace('<FlagEmojiText text={__RCAT_SWAP_TEXT_TOP__} />', '<FlagEmojiText text={siteSettings.intro} />', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit SiteShell swap and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/swap-siteshell-taglines-once.yml
          git add src/public/components/PublicSiteShell.tsx
          git diff --cached --check
          git commit -m "fix: swap SiteShell English name and award tagline"
          git push origin HEAD:fix/swap-siteshell-taglines
