name: Agent Project Identity Format

on:
  push:
    branches:
      - agent/project-identity-v3-3-0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write README.md CHANGELOG.md docs/PROJECT_HISTORY.md package.json docs/maintenance/dependency-current-status.md
      - run: pnpm exec prettier --check README.md CHANGELOG.md docs/PROJECT_HISTORY.md package.json docs/maintenance/dependency-current-status.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/PROJECT_HISTORY.md package.json docs/maintenance/dependency-current-status.md
          git commit -m "style(project): format identity baseline"
          git push origin HEAD:agent/project-identity-v3-3-0
