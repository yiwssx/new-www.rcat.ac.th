name: Temporary Runtime Major Live Validation

on:
  push:
    branches:
      - fix/runtime-major-dependency-policy-2026-09-10

permissions:
  contents: write

jobs:
  live-validation:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-major-dependency-policy-2026-09-10
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify live registry no longer invalidates runtime-major exception
        shell: bash
        run: |
          set +e
          pnpm deps:latest:check 2>&1 | tee /tmp/deps-live.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -Fq "Compatibility policy validation failed:" /tmp/deps-live.log; then
            echo "Compatibility policy still fails under live registry data."
            exit 1
          fi
          if grep -Fq -- "- @types/node:" /tmp/deps-live.log; then
            echo "@types/node still appears as an enforcement failure."
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "Live registry currently has no eligible outdated dependencies."
          else
            grep -Fq "Direct dependencies are not registry latest or a validated compatibility exception:" /tmp/deps-live.log
            echo "Runtime-major exception is valid; remaining nonzero status is from real eligible updates."
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-runtime-major-live-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary live validation"
          git push origin HEAD:fix/runtime-major-dependency-policy-2026-09-10
