name: Temporary Fast URI Lock Repair

on:
  push:
    branches:
      - fix/phase-a-automatic-post-deploy
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/tmp-fast-uri-lock-repair.yml

permissions:
  contents: write

jobs:
  repair:
    name: Regenerate dependency state
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Regenerate lockfile with patched fast-uri
        run: pnpm install --lockfile-only --no-frozen-lockfile --strict-peer-dependencies

      - name: Refresh dependency status document
        run: pnpm deps:status

      - name: Commit regenerated dependency state
        shell: bash
        run: |
          set -euo pipefail

          git add pnpm-lock.yaml docs/maintenance/dependency-current-status.md

          if git diff --cached --quiet; then
            echo "Dependency state already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          HUSKY=0 git commit -m "fix(deps): resolve patched fast-uri"
          git push origin "HEAD:${GITHUB_REF_NAME}"
