name: PR Prettier autofix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

# Only same-repository PR branches can be written. Never run foreign fork code
# with a write-capable token.
permissions:
  contents: write
  actions: write

concurrency:
  group: prettier-autofix-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Prettier autofix
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
        with:
          install-args: --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Format the complete repository using pinned Prettier
        run: pnpm exec prettier --write .
      - name: Push a format-only commit when necessary
        id: push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet --exit-code; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --update
          git commit -m "style: apply pinned Prettier to PR branch"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ "$REMOTE_SHA" != "${{ github.event.pull_request.head.sha }}" ]; then
            echo "PR branch advanced to $REMOTE_SHA; skip obsolete formatting."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git push origin "HEAD:refs/heads/$BRANCH"; then
            REMOTE_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
            if [ "$REMOTE_SHA" != "${{ github.event.pull_request.head.sha }}" ]; then
              echo "PR branch moved while formatting; newer run will handle it."
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'Push failed without branch advancement: check token/branch policies.' >&2
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Verify exact branch and dispatch fresh CI for formatted commit
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api --method POST "repos/$GH_REPO/actions/workflows/ci.yml/dispatches" -f "ref=$BRANCH"
