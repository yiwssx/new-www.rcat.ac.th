name: P5H Refactor Once

on:
  push:
    branches:
      - agent/p5h-maintainability-observability
    paths:
      - .github/workflows/p5h-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5h-maintainability-observability
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Extract menu mutation hotspot and install link validation boundary
        shell: python
        run: |
          from pathlib import Path

          admin_write = Path("cloudflare/public-api/src/routes/adminWrite.ts")
          text = admin_write.read_text()
          import_marker = 'import type { Env } from "../env";\n'
          validator_import = 'import { validateAdminLinkWriteRequest } from "../adminLinkValidation";\n'
          if validator_import not in text:
              if import_marker not in text:
                  raise SystemExit("adminWrite Env import marker not found")
              text = text.replace(import_marker, validator_import + import_marker, 1)
          call_marker = "  try {\n    const schemaMismatch = await getPreviewSchemaMismatch(env, request, segments);"
          call_replacement = "  try {\n    await validateAdminLinkWriteRequest(request);\n    const schemaMismatch = await getPreviewSchemaMismatch(env, request, segments);"
          if "await validateAdminLinkWriteRequest(request);" not in text:
              if call_marker not in text:
                  raise SystemExit("adminWrite validation insertion marker not found")
              text = text.replace(call_marker, call_replacement, 1)
          admin_write.write_text(text)

          pagination = Path("cloudflare/public-api/src/routes/adminPagination.ts")
          text = pagination.read_text()
          text = text.replace("  MENU_ITEM_ADMIN_ROW_COLUMNS,\n", "", 1)
          responses_import = 'import { json, jsonError } from "../responses";\n'
          menu_import = 'import { handleAdminMenuMutation } from "./adminMenuMutations";\n'
          if menu_import not in text:
              if responses_import not in text:
                  raise SystemExit("adminPagination responses import marker not found")
              text = text.replace(responses_import, responses_import + menu_import, 1)
          start = text.find("async function readRequestRecord(request: Request) {")
          end = text.find("async function paginatedResponse<TRow, TItem>(")
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("adminPagination menu mutation extraction markers not found")
          text = text[:start] + text[end:]
          text = text.replace("return handleMenuItemMutation(request, env, segments, identity);", "return handleAdminMenuMutation(request, env, segments, identity);", 1)
          pagination.write_text(text)
      - name: Format P5H files
        run: >-
          pnpm exec prettier --write
          cloudflare/public-api/src/adminLinkValidation.ts
          cloudflare/public-api/src/routes/adminMenuMutations.ts
          cloudflare/public-api/src/routes/adminPagination.ts
          cloudflare/public-api/src/routes/adminWrite.ts
          cloudflare/public-api/test/adminLinkValidation.test.ts
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cloudflare/public-api/src/adminLinkValidation.ts \
            cloudflare/public-api/src/routes/adminMenuMutations.ts \
            cloudflare/public-api/src/routes/adminPagination.ts \
            cloudflare/public-api/src/routes/adminWrite.ts \
            cloudflare/public-api/test/adminLinkValidation.test.ts
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git commit -m "refactor(p5h): split menu mutations and validate CMS links"
          git push origin HEAD:agent/p5h-maintainability-observability
