name: SSR Phase 4 Lockfile Bootstrap

on:
  push:
    branches:
      - feat/ssr-emotion-critical-css
    paths:
      - .github/workflows/ssr-phase4-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm add '@emotion/cache@^11.14.0' '@emotion/server@^11.11.0'

      - name: Commit generated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "build(ssr): add Emotion SSR dependencies"
          git push origin HEAD:feat/ssr-emotion-critical-css
