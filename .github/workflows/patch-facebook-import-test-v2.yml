name: Patch Facebook Import Test V2

on:
  push:
    branches:
      - fix/facebook-metadata-reclassification-v2

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/facebook-metadata-reclassification-v2

      - name: Align legacy tag regression with classifier v2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path("src/test/facebookImportTransform.test.mjs")
          source = file.read_text(encoding="utf-8")
          old = '''  it("creates valid JSON tags from hashtags and keywords", () => {\n    const tags = JSON.parse(rowFor(announcementPost).tags_json);\n\n    expect(tags).toContain("รับสมัคร");\n    expect(tags).toContain("RCAT");\n    expect(tags).toContain("ประกาศ");\n  });\n'''
          new = '''  it("creates controlled semantic tags without generic hashtags or category duplication", () => {\n    const row = rowFor(announcementPost);\n    const tags = JSON.parse(row.tags_json);\n\n    expect(row.category).toBe("ประกาศ");\n    expect(tags).toContain("รับสมัคร");\n    expect(tags).toContain("นักเรียน");\n    expect(tags).toContain("นักศึกษา");\n    expect(tags).not.toContain("RCAT");\n    expect(tags).not.toContain("ประกาศ");\n  });\n'''
          if old not in source:
              raise SystemExit("legacy Facebook tag assertion block was not found")
          file.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check

      - name: Commit test update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/facebookImportTransform.test.mjs
          git commit -m "test(content): align Facebook import tags with classifier v2"
          git push origin HEAD:fix/facebook-metadata-reclassification-v2
