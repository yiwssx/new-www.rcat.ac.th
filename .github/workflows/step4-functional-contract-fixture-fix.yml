name: Step 4 Functional Contract Fixture Fix

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/step4-functional-contract-fixture-fix.yml
      - scripts/step4-functional-contract-fixture-fix.mjs

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ssr-readiness-step4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: node scripts/step4-functional-contract-fixture-fix.mjs
      - run: pnpm exec prettier --write tests/functional/fixtures/publicShellClsFixture.ts tests/functional/fixtures/publicAuthIsolationFixture.ts tests/functional/publicMediaPerformance.spec.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Focused functional regression suite
        run: >-
          pnpm exec playwright test
          tests/functional/cms-auth.spec.ts
          tests/functional/designSystemUiUx.spec.ts
          tests/functional/publicMediaPerformance.spec.ts
          tests/functional/publicShellClsStability.spec.ts
          tests/functional/publicTelemetry.spec.ts
      - name: Commit functional fixture fixes and remove temporary files
        run: |
          rm scripts/step4-functional-contract-fixture-fix.mjs .github/workflows/step4-functional-contract-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ssr): align Step 4 functional fixtures"
          git push origin HEAD:refactor/ssr-readiness-step4
