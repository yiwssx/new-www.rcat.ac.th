name: P6B Format Once

on:
  push:
    branches:
      - feat/p6b-security-enforcement
    paths:
      - ".github/workflows/p6b-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format P6B files
        run: pnpm exec prettier --write scripts/check-p6b-security-enforcement.mjs scripts/check-production-auth-security-events.mjs scripts/p6b-csp-production-smoke.mjs src/entry-server.tsx
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "P6B files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-p6b-security-enforcement.mjs scripts/check-production-auth-security-events.mjs scripts/p6b-csp-production-smoke.mjs src/entry-server.tsx
          git commit -m "style(security): format P6B implementation"
          git push
