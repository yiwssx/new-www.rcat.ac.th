          text = test.read_text()
          needle = '''    expect(response.headers.get("X-Robots-Tag")).toBe("noindex, nofollow");\n    expect(html).toContain(`ข่าว | ${projectSettings.site.name}`);'''
          replacement = '''    expect(response.headers.get("X-Robots-Tag")).toBe("noindex, nofollow");\n    const nonce = html.match(/nonce="([^"]+)"/)?.[1];\n    expect(nonce).toBeTruthy();\n    expect(response.headers.get("Content-Security-Policy-Report-Only")).toContain(`'nonce-${nonce}'`);\n    expect(html).toContain(`ข่าว | ${projectSettings.site.name}`);'''
          if needle not in text:
