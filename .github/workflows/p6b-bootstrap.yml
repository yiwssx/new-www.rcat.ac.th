name: P6B Bootstrap

on:
  push:
    branches:
      - feat/p6b-security-enforcement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Patch existing P6B runtime files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/runtime.ts",
              "export interface CreateAppRuntimeOptions {\n  documentMode?: boolean;\n}\n\nexport function createAppRuntime({ documentMode = false }: CreateAppRuntimeOptions = {}) {",
              "export interface CreateAppRuntimeOptions {\n  documentMode?: boolean;\n  cspNonce?: string;\n}\n\nexport function createAppRuntime({ documentMode = false, cspNonce }: CreateAppRuntimeOptions = {}) {"
          )
          replace(
              "src/runtime.ts",
              "  const router = createAppRouter({ queryClient, documentMode });",
              "  const router = createAppRouter({ queryClient, documentMode, cspNonce });"
          )

          replace(
              "src/routes.tsx",
              "export interface CreateAppRouterInput {\n  queryClient: QueryClient;\n  documentMode?: boolean;\n}",
              "export interface CreateAppRouterInput {\n  queryClient: QueryClient;\n  documentMode?: boolean;\n  cspNonce?: string;\n}"
          )
          replace(
              "src/routes.tsx",
              "export function createAppRouter({ queryClient, documentMode = false }: CreateAppRouterInput) {\n  return createRouter({\n    routeTree,\n    context: { queryClient, documentMode },",
              "export function createAppRouter({ queryClient, documentMode = false, cspNonce }: CreateAppRouterInput) {\n  return createRouter({\n    routeTree,\n    context: { queryClient, documentMode },\n    ssr: cspNonce ? { nonce: cspNonce } : undefined,"
          )

          replace(
              "src/entry-server.tsx",
              "import React from \"react\";",
              "import { randomBytes } from \"node:crypto\";\nimport React from \"react\";"
          )
          replace(
              "src/entry-server.tsx",
              "import { createAppRuntime } from \"./runtime\";",
              "import { createAppRuntime } from \"./runtime\";\nimport { buildContentSecurityPolicy } from \"./security/cspPolicy\";"
          )
          replace(
              "src/entry-server.tsx",
              "export async function renderSsrResponse(request: Request) {\n  const runtime = createAppRuntime({ documentMode: true });",
              "export async function renderSsrResponse(request: Request) {\n  const cspNonce = randomBytes(24).toString(\"base64url\");\n  const runtime = createAppRuntime({ documentMode: true, cspNonce });"
          )
          replace(
              "src/entry-server.tsx",
              "    const emotionResponse = await finalizeEmotionSsrResponse(response);\n\n    return applyPublicSsrHttpSemantics({\n      request,\n      response: emotionResponse,",
              "    const emotionResponse = await finalizeEmotionSsrResponse(response);\n    const securityHeaders = new Headers(emotionResponse.headers);\n    securityHeaders.set(\n      \"Content-Security-Policy-Report-Only\",\n      buildContentSecurityPolicy({ scriptNonce: cspNonce })\n    );\n    const securedResponse = new Response(emotionResponse.body, {\n      status: emotionResponse.status,\n      statusText: emotionResponse.statusText,\n      headers: securityHeaders\n    });\n\n    return applyPublicSsrHttpSemantics({\n      request,\n      response: securedResponse,"
          )

          replace(
              "src/entry-client.tsx",
              "export function shouldHydrateSsrDocument(documentElement: HTMLElement = document.documentElement) {\n  return documentElement.getAttribute(SSR_DOCUMENT_MARKER_ATTRIBUTE) === SSR_DOCUMENT_MARKER_VALUE;\n}\n",
              "export function shouldHydrateSsrDocument(documentElement: HTMLElement = document.documentElement) {\n  return documentElement.getAttribute(SSR_DOCUMENT_MARKER_ATTRIBUTE) === SSR_DOCUMENT_MARKER_VALUE;\n}\n\nexport function readDocumentCspNonce(documentNode: Document = document) {\n  const script = documentNode.querySelector<HTMLScriptElement>(\"script[nonce]\");\n  return script?.nonce || script?.getAttribute(\"nonce\") || undefined;\n}\n"
          )
          replace(
              "src/entry-client.tsx",
              "  const runtime = createAppRuntime({ documentMode });",
              "  const runtime = createAppRuntime({\n    documentMode,\n    cspNonce: documentMode ? readDocumentCspNonce() : undefined\n  });"
          )

          vercel_path = Path("vercel.json")
          vercel = json.loads(vercel_path.read_text())
          block = next(entry for entry in vercel["headers"] if entry["source"] == "/(.*)")
          csp = next(header for header in block["headers"] if header["key"] in {"Content-Security-Policy", "Content-Security-Policy-Report-Only"})
          csp["key"] = "Content-Security-Policy-Report-Only"
          csp["value"] = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.workers.dev https://*.rcat.ac.th https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-src https://www.facebook.com https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://docs.google.com https://drive.google.com; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; report-uri /api/csp-report"
          marker = next((header for header in block["headers"] if header["key"] == "X-RCAT-Security-Baseline"), None)
          if marker:
              marker["value"] = "p6b-candidate-v1"
          else:
              block["headers"].append({"key": "X-RCAT-Security-Baseline", "value": "p6b-candidate-v1"})
          vercel_path.write_text(json.dumps(vercel, indent=2) + "\n")

          ci = Path(".github/workflows/ci.yml")
          ci_text = ci.read_text()
          needle = "      - run: node scripts/check-csp-enforcement-readiness.mjs\n"
          if needle not in ci_text:
              raise SystemExit("CI governance insertion point not found")
          ci.write_text(ci_text.replace(needle, needle + "      - run: node scripts/check-p6b-security-enforcement.mjs\n", 1))

          test = Path("src/test/ssrRuntimeFoundation.test.tsx")
          test_text = test.read_text()
          old = "    expect(response.headers.get(\"X-Robots-Tag\")).toBe(\"noindex, nofollow\");\n    expect(html).toContain(`ข่าว | ${projectSettings.site.name}`);"
          new = "    expect(response.headers.get(\"X-Robots-Tag\")).toBe(\"noindex, nofollow\");\n    const nonce = html.match(/nonce=\"([^\"]+)\"/)?.[1];\n    expect(nonce).toBeTruthy();\n    expect(response.headers.get(\"Content-Security-Policy-Report-Only\")).toContain(`'nonce-${nonce}'`);\n    expect(html).toContain(`ข่าว | ${projectSettings.site.name}`);"
          if old not in test_text:
              raise SystemExit("SSR test insertion point not found")
          test.write_text(test_text.replace(old, new, 1))
          PY

      - run: pnpm format
      - run: pnpm format:check
      - run: pnpm lint:strict
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm worker:typecheck
      - run: pnpm worker:deploy:dry
      - run: node scripts/check-p6b-security-enforcement.mjs

      - name: Commit deterministic P6B runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.ts src/routes.tsx src/entry-server.tsx src/entry-client.tsx vercel.json .github/workflows/ci.yml src/test/ssrRuntimeFoundation.test.tsx
          git commit -m "feat(security): wire P6B CSP enforcement candidate"
          git push
