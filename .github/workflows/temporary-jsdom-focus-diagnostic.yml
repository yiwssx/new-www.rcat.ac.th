name: Temporary jsdom Focus Diagnostic

on:
  push:
    branches:
      - fix/dependency-cleanup-react-jsdom-20260920
    paths:
      - .github/workflows/temporary-jsdom-focus-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Inspect jsdom focus event targets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { JSDOM } from "jsdom";

          const dom = new JSDOM("<!doctype html><html><body><button id='trigger'>Trigger</button><div id='dialog' tabindex='-1'></div></body></html>");
          const { document } = dom.window;
          const trigger = document.getElementById("trigger");
          const dialog = document.getElementById("dialog");

          const describe = (value) => ({
            ctor: value?.constructor?.name ?? null,
            nodeName: value?.nodeName ?? null,
            hasFocusMethod: typeof value?.focus === "function"
          });

          console.log("initial", describe(document.activeElement));
          trigger.focus();
          console.log("after-trigger", describe(document.activeElement));

          dialog.addEventListener("focus", (event) => {
            console.log("dialog-focus-related", describe(event.relatedTarget));
          });
          dialog.focus();
          console.log("after-dialog", describe(document.activeElement));

          dialog.remove();
          console.log("after-remove-dialog", describe(document.activeElement));

          const dialog2 = document.createElement("div");
          dialog2.tabIndex = -1;
          document.body.appendChild(dialog2);
          document.body.focus();
          dialog2.addEventListener("focus", (event) => {
            console.log("dialog2-focus-related", describe(event.relatedTarget));
          });
          dialog2.focus();
          console.log("after-dialog2", describe(document.activeElement));
          NODE
