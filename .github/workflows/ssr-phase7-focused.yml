name: SSR Phase 7 Focused

on:
  push:
    branches:
      - feat/ssr-phase7-vercel-cutover
  pull_request:
    branches:
      - refactor/ssr-readiness

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm prettier --write src/routeComponents.tsx src/test/vercelSsrCutover.test.tsx && git diff -- src/routeComponents.tsx src/test/vercelSsrCutover.test.tsx && exit 1
