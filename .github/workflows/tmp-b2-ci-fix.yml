name: Temporary B2 CI Fix

on:
  push:
    branches:
      - feat/phase-b2-runtime-incident-feed

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(b2): apply CI fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase-b2-runtime-incident-feed

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Apply exact B2 CI fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            const current = fs.readFileSync(path, 'utf8');
            if (!current.includes(before)) {
              throw new Error(`Expected text not found in ${path}`);
            }
            fs.writeFileSync(path, current.replace(before, after));
          }

          const controlPattern = 'const CONTROL_CHARACTER_PATTERN = /[\\u0000-\\u001f\\u007f]/u;';
          const controlHelper = `function containsControlCharacter(value: string) {
            return Array.from(value).some((character) => {
              const code = character.charCodeAt(0);
              return code <= 0x1f || code === 0x7f;
            });
          }`;

          for (const path of [
            'cloudflare/public-api/src/routes/runtimeIncidents.ts',
            'src/features/runtime-incidents/client.ts'
          ]) {
            replaceExact(path, controlPattern, controlHelper);
            replaceExact(path, 'CONTROL_CHARACTER_PATTERN.test(decoded)', 'containsControlCharacter(decoded)');
          }

          replaceExact(
            'cloudflare/public-api/test/cmsMfaD1Integration.test.ts',
            '    expect(migrationNames.at(-1)).toBe("0013_cms_mfa_and_reauthentication.sql");',
            `    const migration0013Index = migrationNames.indexOf("0013_cms_mfa_and_reauthentication.sql");
            const migration0014Index = migrationNames.indexOf("0014_b2_runtime_incidents.sql");
            expect(migration0013Index).toBeGreaterThanOrEqual(0);
            expect(migration0014Index).toBe(migration0013Index + 1);`
          );
          NODE

      - name: Format patched files
        run: pnpm exec prettier --write cloudflare/public-api/src/routes/runtimeIncidents.ts src/features/runtime-incidents/client.ts cloudflare/public-api/test/cmsMfaD1Integration.test.ts

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/public-api/src/routes/runtimeIncidents.ts src/features/runtime-incidents/client.ts cloudflare/public-api/test/cmsMfaD1Integration.test.ts
          git commit -m "fix(reliability): satisfy B2 CI contracts"
          git push origin HEAD:feat/phase-b2-runtime-incident-feed
