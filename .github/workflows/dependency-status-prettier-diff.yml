name: Dependency Status Prettier Diff

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prettier-diff:
    if: github.head_ref == 'chore/dependency-status-gate-repair'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write docs/maintenance/dependency-current-status.md
          git --no-pager diff -- docs/maintenance/dependency-current-status.md
