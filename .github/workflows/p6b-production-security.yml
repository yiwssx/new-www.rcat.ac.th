name: Production / Security

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/p6b-production-security.yml"
      - "vercel.json"
      - "middleware.ts"
      - "src/entry-server.tsx"
      - "src/entry-client.tsx"
      - "src/runtime.ts"
      - "src/routes.tsx"
      - "src/security/cspPolicy.ts"
      - "server/security/edgeWafPolicy.ts"
      - "cloudflare/public-api/src/securityRateLimit.ts"
      - "cloudflare/public-api/src/routes/cmsAuthInternal.ts"
      - "cloudflare/public-api/src/routes/adminWrite.ts"
      - "cloudflare/public-api/wrangler.toml"
      - "scripts/p6b-csp-production-smoke.mjs"
      - "scripts/p6b-edge-waf-production-smoke.mjs"
      - "scripts/check-production-auth-security-events.mjs"
  schedule:
    # Lightweight WAF smoke only: every six hours at minute 47.
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-security
  cancel-in-progress: true

jobs:
  edge-waf:
    name: Vercel Edge WAF Smoke
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify Vercel edge WAF on production
        run: node scripts/p6b-edge-waf-production-smoke.mjs

  csp-browser:
    name: CSP Browser Smoke
    if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify production CSP enforcement
        env:
          P6B_CSP_EXPECTED_MARKER: p6b-enforced-v1
        run: node scripts/p6b-csp-production-smoke.mjs

  auth-anomaly:
    name: Auth Anomaly Diagnostic
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      AUTH_SECURITY_LOOKBACK_MINUTES: "135"
      AUTH_SECURITY_WARNING_EVENTS: "10"
      AUTH_SECURITY_CRITICAL_EVENTS: "30"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Require protected D1 read credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID" || exit 1

      - name: Query sanitized auth anomaly aggregates
        id: auth_security
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: node scripts/check-production-auth-security-events.mjs

      - name: Fail on auth anomaly warning or critical
        if: ${{ steps.auth_security.outputs.severity == 'warning' || steps.auth_security.outputs.severity == 'critical' }}
        run: |
          echo "Sensitive authentication activity reached ${{ steps.auth_security.outputs.severity }} severity." >&2
          exit 1
