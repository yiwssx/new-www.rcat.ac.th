name: Maintenance Dependency Refresh

on:
  push:
    branches:
      - "chore/governed-deps-node24-20260902"

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-refresh]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Apply governed direct dependency versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

          pkg.engines.node = '24.x';
          pkg.engines.pnpm = '10.34.5';
          pkg.packageManager = 'pnpm@10.34.5';

          Object.assign(pkg.dependencies, {
            '@mui/icons-material': '^9.4.0',
            '@mui/material': '^9.4.0',
            '@tanstack/react-table': '^9.2.4'
          });

          Object.assign(pkg.devDependencies, {
            '@cloudflare/workers-types': '^5.20260830.1',
            wrangler: '^4.127.1'
          });

          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          printf '24.20.0\n' > .node-version
      - name: Refresh lockfile with pnpm 10
        run: pnpm install --no-frozen-lockfile --strict-peer-dependencies
      - name: Refresh dependency status
        run: pnpm deps:status
      - name: Verify governed dependency state
        run: |
          pnpm deps:latest:check
          pnpm deps:check
          pnpm deps:docs:audit
      - name: Commit generated maintenance state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .node-version docs/maintenance/dependency-current-status.md
          if git diff --cached --quiet; then
            echo "No dependency maintenance changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): apply governed maintenance [lockfile-refresh]"
          git push origin HEAD:${GITHUB_REF_NAME}
