name: P5 Test Fixup

on:
  push:
    branches:
      - agent/p5a-p5d-data-ssr-efficiency

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p5a-p5d-data-ssr-efficiency

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Update legacy test helper typing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "src/test/publicDataDrivenPages.test.tsx";
          let source = fs.readFileSync(path, "utf8");
          const from = `type TestHomeSnapshot = PublicHomeSnapshot &
            Pick<Required<CmsSnapshot>, "siteSettings" | "homepageSettings" | "displaySettings" | "menu">;

          function createHomeSnapshot(overrides: Partial<PublicHomeSnapshot> = {}): TestHomeSnapshot {`;
          const to = `type TestHomeSnapshot = PublicHomeSnapshot & {
            siteSettings: NonNullable<CmsSnapshot["siteSettings"]>;
            homepageSettings: NonNullable<CmsSnapshot["homepageSettings"]>;
            displaySettings: NonNullable<CmsSnapshot["displaySettings"]>;
            menu: NonNullable<CmsSnapshot["menu"]>;
          };

          function createHomeSnapshot(overrides: Partial<TestHomeSnapshot> = {}): TestHomeSnapshot {`;
          if (!source.includes(from)) throw new Error("Expected TestHomeSnapshot helper not found");
          source = source.replace(from, to);
          fs.writeFileSync(path, source);
          NODE

      - run: pnpm format

      - name: Commit test fixup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(p5): align legacy fixtures with split home contract"
          git push origin HEAD:agent/p5a-p5d-data-ssr-efficiency
