name: Deploy / Image Test Worker

on:
  pull_request:
    branches:
      - master
    paths:
      - "cloudflare/image-test/**"
      - "scripts/benchmark-image-delivery.mjs"
      - ".github/workflows/image-test-worker.yml"
  push:
    branches:
      - master
    paths:
      - "cloudflare/image-test/**"
      - "scripts/benchmark-image-delivery.mjs"
      - ".github/workflows/image-test-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-test-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Image Test Worker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Show canonical benchmark formatting
        run: |
          pnpm exec prettier --write scripts/benchmark-image-delivery.mjs
          git diff -- scripts/benchmark-image-delivery.mjs
          if ! git diff --quiet -- scripts/benchmark-image-delivery.mjs; then
            echo "Benchmark script differs from canonical Prettier output." >&2
            exit 1
          fi
      - name: Lint image test Worker
        run: pnpm exec eslint "cloudflare/image-test/src/**/*.ts"
      - name: Typecheck image test Worker
        run: pnpm exec tsc -p cloudflare/image-test/tsconfig.json --noEmit
      - name: Build Wrangler dry run
        run: pnpm wrangler deploy --config cloudflare/image-test/wrangler.toml --dry-run --outdir "$RUNNER_TEMP/image-test-worker"

  benchmark:
    name: Benchmark Production Image Delivery
    needs:
      - validate
      - deploy
    if: ${{ always() && needs.validate.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.deploy.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Compare direct Drive and Cloudflare image delivery
        env:
          PRODUCTION_PUBLIC_API_URL: https://rcat-public-api-preview.rcat-digital.workers.dev
          IMAGE_TEST_WORKER_URL: https://rcat-image-test.rcat-digital.workers.dev
        run: |
          set -o pipefail
          benchmark_log="$RUNNER_TEMP/image-delivery-benchmark.md"
          node scripts/benchmark-image-delivery.mjs | tee "$benchmark_log"
          cat "$benchmark_log" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Image Test Worker
    needs: validate
    if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: image-test-worker-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Deploy isolated Worker
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          deploy_log="$RUNNER_TEMP/image-test-worker-deploy.log"
          pnpm wrangler deploy --config cloudflare/image-test/wrangler.toml 2>&1 | tee "$deploy_log"
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$deploy_log" | tail -n 1)"
          if [[ -z "$worker_url" ]]; then
            echo "Wrangler did not report a workers.dev URL." >&2
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Deployed isolated Worker: $worker_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test health endpoint
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$WORKER_URL/health" | tee "$RUNNER_TEMP/image-test-worker-health.json"
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/image-test-worker-health.json", "utf8"));
            if (body?.service !== "rcat-image-test" || body?.status !== "ok") {
              throw new Error("unexpected image test Worker health response");
            }
          '
