name: Cloudflare Emergency Failover Check

on:
  # A narrowly scoped post-merge live check of the origin preflight itself.
  # Avoids repeated manual dispatch; no writes or domain/route changes.
  push:
    branches:
      - main
    paths:
      - "cloudflare/web-failover/origin-readiness.mjs"
  pull_request:
    paths:
      - "cloudflare/web-failover/**"
      - ".github/workflows/cloudflare-web-failover-check.yml"
      - ".github/workflows/cloudflare-web-standby.yml"
      - "docs/operations/cloudflare-web-failover-emergency.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-failover-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline unit tests and Wrangler dry run (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Show exact Prettier diff for production handoff
        run: |
          pnpm exec prettier --write docs/operations/rcat-production-o2o-handoff.md
          git diff -- docs/operations/rcat-production-o2o-handoff.md
      - name: Verify routing, status and zero-write invariants
        run: node --test cloudflare/web-failover/worker.node-check.mjs cloudflare/web-failover/gateway.node-check.mjs cloudflare/web-failover/saas-gateway.node-check.mjs cloudflare/web-failover/saas-staging.node-check.mjs cloudflare/web-failover/origin-readiness.node-check.mjs
      - name: Syntax-check isolated live smoke without network access
        run: |
          node --check cloudflare/web-failover/standby-smoke.mjs
          node --check cloudflare/web-failover/origin-readiness.mjs
      - name: Build standalone React/Vite CSR
        env:
          VITE_CLOUDFLARE_PUBLIC_API_URL: https://rcat-web-standby.rcat-digital.workers.dev
          VITE_PUBLIC_IMAGE_DELIVERY_BASE_URL: https://rcat-image-production.rcat-digital.workers.dev
          VITE_PUBLIC_IMAGE_DELIVERY_INTENTS: portrait,carousel,intro-gate
        run: pnpm build
      - name: Check static CSR bootstrap and offline Wrangler bundling
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          test ! -e dist/csr.html
          pnpm exec wrangler deploy --config cloudflare/web-failover/wrangler.toml --env standby --dry-run
          pnpm exec wrangler deploy --config cloudflare/web-failover/gateway-wrangler.toml --dry-run
          pnpm exec wrangler deploy --config cloudflare/web-failover/saas-gateway-wrangler.toml --dry-run
          pnpm exec wrangler deploy --config cloudflare/web-failover/saas-staging-wrangler.toml --dry-run

  origin-readiness:
    name: Live Vercel and standby preflight (read-only; no DNS)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Inspect Vercel project alias and existing Cloudflare standby without writes
        run: node cloudflare/web-failover/origin-readiness.mjs
