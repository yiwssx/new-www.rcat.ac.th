name: SSR Phase 3 Focused

on:
  push:
    branches:
      - feat/ssr-query-hydration
  pull_request:
    branches:
      - refactor/ssr-readiness

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Show Prettier diff
        run: |
          cp src/queryHydration.ts /tmp/queryHydration.before.ts
          pnpm exec prettier src/queryHydration.ts --write
          diff -u /tmp/queryHydration.before.ts src/queryHydration.ts || true
          exit 1
