name: Agent Trigger Dependency Monitor

on:
  push:
    branches:
      - agent/trigger-dependency-monitor-20260826

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch dependency monitoring on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dependency-monitoring.yml --repo "${{ github.repository }}" --ref master
