name: Patch content placeholder

on:
  push:
    branches:
      - fix/remove-content-placeholder
    paths:
      - .github/workflows/patch-content-placeholder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-content-placeholder

      - name: Remove standard content featured placeholder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/public/pages/PublicContentDetailPage.tsx")
          source = path.read_text()
          old = '''              <Box
                className="rcat-image-frame"
                sx={{
                  minHeight: featuredMedia?.type === "image" && featuredMediaImageUrl ? 0 : { xs: 180, md: 260 },
                  display: "grid",
                  placeItems: "center",
                  bgcolor: "primary.light",
                  color: "primary.main"
                }}
              >
                {featuredMedia?.type === "image" && featuredMediaImageUrl ? (
                  <PublicResponsiveImage
                    source={featuredMedia}
                    intent="content-featured"
                    alt={featuredMedia.name}
                    loadMode="critical"
                    sizes="(max-width: 600px) 100vw, (max-width: 1200px) 85vw, 960px"
                    reservedMinHeight={{ xs: 220, md: 360 }}
                    imageSx={{ objectFit: "contain" }}
                  />
                ) : featuredMedia?.type === "video" && featuredMediaEmbedUrl ? (
                  <PublicDeferredEmbed
                    title={featuredMedia.name}
                    src={featuredMediaEmbedUrl}
                    loadMode="eager"
                    sx={{ width: "100%", height: { xs: 240, md: 390 } }}
                    allow="autoplay"
                  />
                ) : (
                  <ArticleOutlinedIcon sx={{ fontSize: 92 }} />
                )}
              </Box>
'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one standard featured placeholder block, found {count}")
          path.write_text(source.replace(old, "", 1))
          PY

          git diff --check
          git diff -- src/public/pages/PublicContentDetailPage.tsx

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/pages/PublicContentDetailPage.tsx
          git commit --no-verify -m "fix(content): remove standard featured media placeholder"
          git push origin HEAD:fix/remove-content-placeholder
