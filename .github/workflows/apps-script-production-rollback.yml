name: Apps Script Production Rollback

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: "Immutable Apps Script version to restore"
        required: true
        type: string
      rollback_confirmation:
        description: "Enter ROLLBACK_EXISTING_APPS_SCRIPT_WEB_APP"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Roll Back Existing Production Media Bridge
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require exact rollback confirmation
        shell: bash
        env:
          ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}
        run: |
          test "$ROLLBACK_CONFIRMATION" = "ROLLBACK_EXISTING_APPS_SCRIPT_WEB_APP" || {
            echo "Apps Script production rollback confirmation does not match the required exact phrase." >&2
            exit 1
          }

      - name: Require protected Apps Script production credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "CLASPRC_JSON is unavailable from the protected production Environment." >&2; exit 1; }
          test -n "$CLASP_JSON" || { echo "CLASP_JSON is unavailable from the protected production Environment." >&2; exit 1; }
          test -n "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID" || { echo "APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID is unavailable from the protected production Environment." >&2; exit 1; }
          echo "::add-mask::$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > apps-script/.clasp.json
          node -e 'JSON.parse(require("fs").readFileSync(process.env.HOME + "/.clasprc.json", "utf8")); console.log("Apps Script OAuth config parsed.")'
          node scripts/apps-script-release-tools.mjs validate-config \
            --project apps-script/.clasp.json \
            --deployment-id "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID"

      - name: Resolve current deployment and rollback target
        id: target
        shell: bash
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
          ROLLBACK_VERSION: ${{ inputs.version_number }}
        run: |
          cd apps-script
          pnpm dlx @google/clasp@3.3.0 list-deployments > "$RUNNER_TEMP/apps-script-deployments-before.txt"
          pnpm dlx @google/clasp@3.3.0 list-versions > "$RUNNER_TEMP/apps-script-versions.txt"
          cd ..
          current_version="$(node scripts/apps-script-release-tools.mjs current-version \
            --deployments "$RUNNER_TEMP/apps-script-deployments-before.txt" \
            --deployment-id "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID")"
          node scripts/apps-script-release-tools.mjs assert-version-exists \
            --versions "$RUNNER_TEMP/apps-script-versions.txt" \
            --version "$ROLLBACK_VERSION"
          test "$current_version" != "$ROLLBACK_VERSION" || {
            echo "Requested rollback version is already deployed." >&2
            exit 1
          }
          echo "previous_version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Point existing deployment at rollback version
        shell: bash
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
          ROLLBACK_VERSION: ${{ inputs.version_number }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          cd apps-script
          pnpm dlx @google/clasp@3.3.0 create-deployment \
            --deploymentId "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID" \
            --versionNumber "$ROLLBACK_VERSION" \
            --description "rollback github:${short_sha} to v${ROLLBACK_VERSION}"

      - name: Verify rollback deployment version
        shell: bash
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
          ROLLBACK_VERSION: ${{ inputs.version_number }}
        run: |
          cd apps-script
          pnpm dlx @google/clasp@3.3.0 list-deployments > "$RUNNER_TEMP/apps-script-deployments-after.txt"
          cd ..
          node scripts/apps-script-release-tools.mjs assert-deployment-version \
            --deployments "$RUNNER_TEMP/apps-script-deployments-after.txt" \
            --deployment-id "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID" \
            --version "$ROLLBACK_VERSION"

      - name: Read-only production bridge health smoke
        shell: bash
        env:
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://script.google.com/macros/s/${APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID}/exec" \
            > "$RUNNER_TEMP/apps-script-health.json"
          node scripts/apps-script-release-tools.mjs verify-health \
            --file "$RUNNER_TEMP/apps-script-health.json"

      - name: Rollback summary
        env:
          PREVIOUS_VERSION: ${{ steps.target.outputs.previous_version }}
          ROLLBACK_VERSION: ${{ inputs.version_number }}
        run: |
          {
            echo "## Apps Script Production Rollback"
            echo
            echo "- Source control branch: master"
            echo "- Protected Environment: production"
            echo "- Existing deployment updated in place: yes"
            echo "- Previous immutable version: $PREVIOUS_VERSION"
            echo "- Restored immutable version: $ROLLBACK_VERSION"
            echo "- Source push: not executed"
            echo "- New deployment created: no"
            echo "- Web App URL changed: no"
            echo "- Production health contract: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Apps Script credentials
        if: ${{ always() }}
        run: rm -f "$HOME/.clasprc.json" apps-script/.clasp.json
