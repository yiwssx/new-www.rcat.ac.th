name: SSR Phase 5 Focused

on:
  push:
    branches:
      - feat/ssr-dynamic-seo
  pull_request:
    branches:
      - refactor/ssr-readiness

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Show exact Prettier diff
        run: |
          pnpm prettier src/public/routing/publicRouteHeadImpl.ts src/routes.tsx --write
          git diff -- src/public/routing/publicRouteHeadImpl.ts src/routes.tsx
          exit 1
