name: Repository History Maintenance

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deployment-history-maintenance.yml"
      - ".github/scripts/cleanup-deployment-history.mjs"
      - ".github/scripts/cleanup-unsuccessful-workflow-runs.mjs"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect retention-expired deployment and Actions history without deleting records"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  deployments: write

jobs:
  cleanup:
    name: Maintain Deployment and Actions History
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Reconcile stale deployments and apply deployment retention
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node .github/scripts/cleanup-deployment-history.mjs
      - name: Apply bounded retention to completed non-success Actions runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node .github/scripts/cleanup-unsuccessful-workflow-runs.mjs
