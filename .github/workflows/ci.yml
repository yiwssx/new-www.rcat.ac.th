name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm deps:status:check
      - run: pnpm deps:check
      - run: pnpm deps:docs:audit
      - name: Show exact ITA Prettier diff
        run: |
          pnpm exec prettier src/public/pages/PublicIta2569Page.tsx --write
          git diff -- src/public/pages/PublicIta2569Page.tsx
          exit 1
      - run: pnpm lint:strict
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm perf:check
      - run: pnpm media:check
      - run: pnpm layout:check
      - run: pnpm design:check
      - run: pnpm worker:typecheck
      - run: pnpm worker:deploy:dry
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:functional
