name: CI

# Re-register this workflow after GitHub Actions history cleanup on 2026-08-15.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-preflight:
    name: Dependency Preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Validate dependency artifact before full CI
        uses: ./.github/actions/setup-project
        with:
          install-args: --frozen-lockfile --strict-peer-dependencies --ignore-scripts

  dependencies:
    name: Dependencies
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Verify dependency status freshness
        id: dependency_freshness
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          dependency_state_paths=(
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            config/dependency-policy.json
            .node-version
            docs/maintenance/dependency-current-status.md
          )

          if [ -z "$BASE_SHA" ]; then
            git fetch origin master --no-tags
            BASE_SHA="$(git merge-base origin/master HEAD)"
          fi

          if [ -n "$BASE_SHA" ] && \
            [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && \
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && \
            git diff --quiet "$BASE_SHA" HEAD -- "${dependency_state_paths[@]}"; then
            echo "Dependency state files are unchanged by this change; inherited snapshot drift does not block this CI run."
            echo "inherited_drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "inherited_drift=false" >> "$GITHUB_OUTPUT"
          pnpm deps:status:check
      - name: Run dependency policy and audits
        shell: bash
        env:
          INHERITED_DRIFT: ${{ steps.dependency_freshness.outputs.inherited_drift }}
        run: |
          if [ "$INHERITED_DRIFT" = "true" ]; then
            pnpm deps:check -- --skip-documentation-freshness
          else
            pnpm deps:check
          fi
      - name: Audit dependency documentation
        shell: bash
        env:
          INHERITED_DRIFT: ${{ steps.dependency_freshness.outputs.inherited_drift }}
        run: |
          if [ "$INHERITED_DRIFT" = "true" ]; then
            pnpm deps:docs:audit -- --skip-status-hashes
          else
            pnpm deps:docs:audit
          fi

  static-quality:
    name: Static Quality
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm format:check
      - run: pnpm lint:strict

  unit:
    name: Unit Tests
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm test:unit
      - name: Enforce critical coverage thresholds
        run: >-
          node scripts/run-vitest.mjs run
          server/cmsAuth/handlers.test.mjs
          src/features/public-read/request.test.ts
          --config vitest.critical-coverage.config.ts
          --coverage

  integration:
    name: Integration Tests
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm test:integration

  build:
    name: Build
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm build

  governance:
    name: Governance
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: node scripts/check-release-version-consistency.mjs
      - run: pnpm perf:check
      - run: pnpm media:check
      - run: pnpm layout:check
      - run: pnpm design:check
      - run: node scripts/check-csp-enforcement-readiness.mjs
      - run: node scripts/check-p6b-security-enforcement.mjs
      - run: node scripts/check-p6c-recovery-reliability.mjs
      - run: node scripts/check-p5f-security-boundary.mjs
      - run: node scripts/check-p5g-apps-script-release-governance.mjs
      - run: node scripts/check-p5h-maintainability-observability.mjs

  worker:
    name: Worker
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: node scripts/check-d1-migration-sequences.mjs
      - run: pnpm worker:typecheck
      - run: pnpm worker:deploy:dry

  functional:
    name: Functional E2E
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Validate production Playwright suite discovery
        run: pnpm exec playwright test --config playwright.production.config.ts --list
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:functional

  # Compatibility contract: Vercel deployment checks historically consume the
  # GitHub Actions check named `quality`. Keep this aggregate check even though
  # the real CI work runs in parallel lanes above.
  quality:
    if: ${{ always() }}
    needs:
      - dependency-preflight
      - dependencies
      - static-quality
      - unit
      - integration
      - build
      - governance
      - worker
      - functional
    runs-on: ubuntu-latest

    steps:
      - name: Verify all CI lanes passed
        env:
          DEPENDENCY_PREFLIGHT: ${{ needs.dependency-preflight.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          STATIC_QUALITY: ${{ needs.static-quality.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          BUILD: ${{ needs.build.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          WORKER: ${{ needs.worker.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
        run: |
          printf '%s\n' \
            "dependency-preflight=$DEPENDENCY_PREFLIGHT" \
            "dependencies=$DEPENDENCIES" \
            "static-quality=$STATIC_QUALITY" \
            "unit=$UNIT" \
            "integration=$INTEGRATION" \
            "build=$BUILD" \
            "governance=$GOVERNANCE" \
            "worker=$WORKER" \
            "functional=$FUNCTIONAL"
          test "$DEPENDENCY_PREFLIGHT" = "success"
          test "$DEPENDENCIES" = "success"
          test "$STATIC_QUALITY" = "success"
          test "$UNIT" = "success"
          test "$INTEGRATION" = "success"
          test "$BUILD" = "success"
          test "$GOVERNANCE" = "success"
          test "$WORKER" = "success"
          test "$FUNCTIONAL" = "success"
