name: CI

# Re-register this workflow after GitHub Actions history cleanup on 2026-08-15.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect PR changes against the synthetic merge commit; main always runs full CI.
  impact:
    name: Change Impact
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.detect.outputs.plan }}
      require_dependencies: ${{ steps.detect.outputs.require_dependencies }}
      require_static_quality: ${{ steps.detect.outputs.require_static_quality }}
      require_unit: ${{ steps.detect.outputs.require_unit }}
      require_integration: ${{ steps.detect.outputs.require_integration }}
      require_build: ${{ steps.detect.outputs.require_build }}
      require_governance: ${{ steps.detect.outputs.require_governance }}
      require_worker: ${{ steps.detect.outputs.require_worker }}
      require_functional: ${{ steps.detect.outputs.require_functional }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Calculate verified PR impact or fail closed to full checks
        id: detect
        env:
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/detect-impact.mjs

  dependency-preflight:
    name: Dependency Preflight
    needs: impact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Validate dependency artifact before full CI
        uses: ./.github/actions/setup-project
        with:
          install-args: --frozen-lockfile --strict-peer-dependencies --ignore-scripts

  dependencies:
    name: Dependencies
    needs: [impact, dependency-preflight]
    if: ${{ needs.impact.outputs.require_dependencies == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Run deterministic dependency policy and audits
        run: pnpm deps:check -- --skip-documentation-freshness
      - name: Audit dependency governance documentation
        run: pnpm deps:docs:audit -- --skip-status-hashes

  static-quality:
    name: Static Quality
    needs: [impact, dependency-preflight]
    if: ${{ needs.impact.outputs.require_static_quality == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm format:check
      - run: pnpm lint:strict

  unit:
    name: Unit Tests
    needs: [impact, dependency-preflight]
    if: ${{ needs.impact.outputs.require_unit == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Run changed unit test files when safe, or the full unit suite
        env:
          CI_PLAN: ${{ needs.impact.outputs.plan }}
        run: node scripts/ci/run-affected-unit.mjs
      - name: Verify vendored Cloudflare security audit validators with Node test runner
        run: node --test .agents/skills/security-audit/validate-coverage-ledger.test.cjs .agents/skills/security-audit/validate-findings.test.cjs
      - name: Verify Actions history retention safety and idempotency
        run: node --test .github/scripts/cleanup-unsuccessful-workflow-runs.node-test.mjs
      - name: Verify security preflight presence-check contract (trusted test fixtures)
        run: node --test scripts/security-audit/audit-controls.test.cjs
      - name: Enforce critical coverage thresholds
        run: >-
          node scripts/run-vitest.mjs run
          server/cmsAuth/handlers.test.mjs
          src/features/public-read/request.test.ts
          --config vitest.critical-coverage.config.ts
          --coverage

  integration:
    name: Integration Tests
    needs: [impact, dependency-preflight]
    if: ${{ needs.impact.outputs.require_integration == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm test:integration

  build:
    name: Build
    needs: [impact, dependency-preflight]
    if: ${{ needs.impact.outputs.require_build == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm build

  governance:
    name: Governance
    needs: [impact, dependency-preflight]
    if: ${{ needs.impact.outputs.require_governance == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: node scripts/check-release-version-consistency.mjs
      - run: pnpm perf:check
      - run: pnpm editor:bundle:check
      - run: pnpm media:check
      - run: pnpm layout:check
      - run: pnpm design:check
      - run: node scripts/check-csp-enforcement-readiness.mjs
      - run: node scripts/check-p6b-security-enforcement.mjs
      - run: node scripts/check-p6c-recovery-reliability.mjs
      - run: node scripts/check-p5f-security-boundary.mjs
      - run: node scripts/check-p5g-apps-script-release-governance.mjs
      - run: node scripts/check-p5h-maintainability-observability.mjs
      - name: Preload pinned offline security audit toolchain
        run: docker pull node:24-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
      - name: Verify security audit sandbox isolation
        run: bash scripts/security-audit/run-sandbox.sh
      - name: Verify offline security preflight profiles
        run: |
          bash scripts/security-audit/run-preflight.sh quick
          bash scripts/security-audit/run-preflight.sh standard

  worker:
    name: Worker
    needs: [impact, dependency-preflight]
    if: ${{ needs.impact.outputs.require_worker == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: node scripts/check-d1-migration-sequences.mjs
      - run: pnpm worker:typecheck
      - run: pnpm worker:deploy:dry

  functional:
    name: Functional E2E
    needs: [impact, dependency-preflight]
    if: ${{ needs.impact.outputs.require_functional == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Validate production Playwright suite discovery
        run: pnpm exec playwright test --config playwright.production.config.ts --list
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:functional

  # Compatibility contract: Vercel deployment checks and the production branch ruleset consume
  # the GitHub Actions check named `quality`. Keep this aggregate check stable.
  quality:
    if: ${{ always() }}
    needs:
      - impact
      - dependency-preflight
      - dependencies
      - static-quality
      - unit
      - integration
      - build
      - governance
      - worker
      - functional
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Verify planned CI lanes and justified skips
        env:
          CI_PLAN: ${{ needs.impact.outputs.plan }}
          CI_IMPACT_STATUS: ${{ needs.impact.result }}
          CI_PREFLIGHT_STATUS: ${{ needs.dependency-preflight.result }}
          CI_RESULTS: >-
            {"dependencies":"${{ needs.dependencies.result }}","static-quality":"${{ needs.static-quality.result }}","unit":"${{ needs.unit.result }}","integration":"${{ needs.integration.result }}","build":"${{ needs.build.result }}","governance":"${{ needs.governance.result }}","worker":"${{ needs.worker.result }}","functional":"${{ needs.functional.result }}"}
        run: node scripts/ci/quality-gate.mjs
