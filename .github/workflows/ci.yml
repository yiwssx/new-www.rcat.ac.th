name: CI

# Re-register this workflow after GitHub Actions history cleanup on 2026-08-15.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-preflight:
    name: Dependency Preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Validate dependency artifact before full CI
        uses: ./.github/actions/setup-project
        with:
          install-args: --frozen-lockfile --strict-peer-dependencies --ignore-scripts

  finalize-pr423:
    name: Finalize PR 423
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'refactor/workflow-architecture-consolidation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: ./.github/actions/setup-project
      - name: Restore production data safety contracts
        shell: bash
        run: |
          if [[ -f scripts/_temp_pr423_repair.py ]]; then
            python scripts/_temp_pr423_repair.py
          fi
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            .github/workflows/production-data-operations.yml \
            scripts/check-p5f-security-boundary.mjs \
            scripts/check-p5h-maintainability-observability.mjs \
            scripts/check-p6b-security-enforcement.mjs \
            scripts/check-p6c-recovery-reliability.mjs \
            src/test/dependencyAutomationContract.test.ts \
            src/test/phaseAAutomationContract.test.ts \
            src/test/phaseAProductionBrowserSmokeContract.test.ts \
            src/test/workflowInventoryGovernance.test.ts
      - name: Stage workflow repair outside the workflow directory
        run: |
          mkdir -p tmp
          cp .github/workflows/production-data-operations.yml tmp/pr423-production-data-operations.yml
          rm -f scripts/_temp_pr423_repair.py
      - name: Commit non-workflow repair output
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            scripts/_temp_pr423_repair.py \
            scripts/check-p5f-security-boundary.mjs \
            scripts/check-p5h-maintainability-observability.mjs \
            scripts/check-p6b-security-enforcement.mjs \
            scripts/check-p6c-recovery-reliability.mjs \
            src/test/dependencyAutomationContract.test.ts \
            src/test/phaseAAutomationContract.test.ts \
            src/test/phaseAProductionBrowserSmokeContract.test.ts \
            src/test/workflowInventoryGovernance.test.ts \
            tmp/pr423-production-data-operations.yml
          if git diff --cached --quiet; then
            echo "No non-workflow repair changes required."
            exit 0
          fi
          git commit -m "fix(ci): stage deterministic workflow consolidation repair"
          git push origin "HEAD:$HEAD_BRANCH"

  dependencies:
    name: Dependencies
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Run deterministic dependency policy and audits
        run: pnpm deps:check -- --skip-documentation-freshness
      - name: Audit dependency governance documentation
        run: pnpm deps:docs:audit -- --skip-status-hashes

  static-quality:
    name: Static Quality
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm format:check
      - run: pnpm lint:strict

  unit:
    name: Unit Tests
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm test:unit
      - name: Enforce critical coverage thresholds
        run: >-
          node scripts/run-vitest.mjs run
          server/cmsAuth/handlers.test.mjs
          src/features/public-read/request.test.ts
          --config vitest.critical-coverage.config.ts
          --coverage

  integration:
    name: Integration Tests
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm test:integration

  build:
    name: Build
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm build

  governance:
    name: Governance
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: node scripts/check-release-version-consistency.mjs
      - run: pnpm perf:check
      - run: pnpm media:check
      - run: pnpm layout:check
      - run: pnpm design:check
      - run: node scripts/check-csp-enforcement-readiness.mjs
      - run: node scripts/check-p6b-security-enforcement.mjs
      - run: node scripts/check-p6c-recovery-reliability.mjs
      - run: node scripts/check-p5f-security-boundary.mjs
      - run: node scripts/check-p5g-apps-script-release-governance.mjs
      - run: node scripts/check-p5h-maintainability-observability.mjs

  worker:
    name: Worker
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: node scripts/check-d1-migration-sequences.mjs
      - run: pnpm worker:typecheck
      - run: pnpm worker:deploy:dry

  functional:
    name: Functional E2E
    needs: dependency-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Validate production Playwright suite discovery
        run: pnpm exec playwright test --config playwright.production.config.ts --list
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:functional

  # Compatibility contract: Vercel deployment checks and the master ruleset consume
  # the GitHub Actions check named `quality`. Keep this aggregate check stable.
  quality:
    if: ${{ always() }}
    needs:
      - dependency-preflight
      - dependencies
      - static-quality
      - unit
      - integration
      - build
      - governance
      - worker
      - functional
    runs-on: ubuntu-latest

    steps:
      - name: Verify all CI lanes passed
        env:
          DEPENDENCY_PREFLIGHT: ${{ needs.dependency-preflight.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          STATIC_QUALITY: ${{ needs.static-quality.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          BUILD: ${{ needs.build.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          WORKER: ${{ needs.worker.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
        run: |
          printf '%s\n' \
            "dependency-preflight=$DEPENDENCY_PREFLIGHT" \
            "dependencies=$DEPENDENCIES" \
            "static-quality=$STATIC_QUALITY" \
            "unit=$UNIT" \
            "integration=$INTEGRATION" \
            "build=$BUILD" \
            "governance=$GOVERNANCE" \
            "worker=$WORKER" \
            "functional=$FUNCTIONAL"
          test "$DEPENDENCY_PREFLIGHT" = "success"
          test "$DEPENDENCIES" = "success"
          test "$STATIC_QUALITY" = "success"
          test "$UNIT" = "success"
          test "$INTEGRATION" = "success"
          test "$BUILD" = "success"
          test "$GOVERNANCE" = "success"
          test "$WORKER" = "success"
          test "$FUNCTIONAL" = "success"
