name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: node scripts/generate-dependency-status.mjs --no-write
      - name: Run blocking dependency checks
        shell: bash
        run: |
          set +e
          output="$(pnpm deps:check 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          summary="$(printf '%s\n' "$output" | grep 'Dependency check summary:' | tail -n 1)"
          expected='manifest=0; peers=0; audit=0; productionAudit=0; documentationFreshness=1;'

          if [[ "$summary" == *"$expected"* ]]; then
            echo "Dependency snapshot freshness is non-blocking in CI; blocking checks passed."
            exit 0
          fi

          echo "Blocking dependency checks failed."
          exit "$status"
      - run: pnpm deps:docs:audit
      - run: pnpm format:check
      - run: pnpm lint:strict
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm perf:check
      - run: pnpm media:check
      - run: pnpm layout:check
      - run: pnpm design:check
      - run: pnpm worker:typecheck
      - run: pnpm worker:deploy:dry
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:functional
