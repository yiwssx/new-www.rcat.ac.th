name: CI

# Re-register this workflow after GitHub Actions history cleanup on 2026-08-15.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Refresh dependency status for Renovate update
        if: (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]') || (github.event_name == 'push' && github.actor == 'renovate[bot]')
        run: pnpm deps:status
      - run: pnpm deps:status:check
      - run: pnpm deps:check
      - run: pnpm deps:docs:audit

  static-quality:
    name: Static Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm format:check
      - run: pnpm lint:strict

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm test:unit
      - name: Enforce critical coverage thresholds
        run: >-
          node scripts/run-vitest.mjs run
          server/cmsAuth/handlers.test.mjs
          src/features/public-read/request.test.ts
          --config vitest.critical-coverage.config.ts
          --coverage

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm test:integration

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm build

  governance:
    name: Governance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm perf:check
      - run: pnpm media:check
      - run: pnpm layout:check
      - run: pnpm design:check
      - run: node scripts/check-csp-enforcement-readiness.mjs

  worker:
    name: Worker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: node scripts/check-d1-migration-sequences.mjs
      - run: pnpm worker:typecheck
      - run: pnpm worker:deploy:dry

  functional:
    name: Functional E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:functional

  # Compatibility contract: Vercel deployment checks historically consume the
  # GitHub Actions check named `quality`. Keep this aggregate check even though
  # the real CI work runs in parallel lanes above.
  quality:
    if: ${{ always() }}
    needs:
      - dependencies
      - static-quality
      - unit
      - integration
      - build
      - governance
      - worker
      - functional
    runs-on: ubuntu-latest

    steps:
      - name: Verify all CI lanes passed
        env:
          DEPENDENCIES: ${{ needs.dependencies.result }}
          STATIC_QUALITY: ${{ needs.static-quality.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          BUILD: ${{ needs.build.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          WORKER: ${{ needs.worker.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
        run: |
          printf '%s\n' \
            "dependencies=$DEPENDENCIES" \
            "static-quality=$STATIC_QUALITY" \
            "unit=$UNIT" \
            "integration=$INTEGRATION" \
            "build=$BUILD" \
            "governance=$GOVERNANCE" \
            "worker=$WORKER" \
            "functional=$FUNCTIONAL"
          test "$DEPENDENCIES" = "success"
          test "$STATIC_QUALITY" = "success"
          test "$UNIT" = "success"
          test "$INTEGRATION" = "success"
          test "$BUILD" = "success"
          test "$GOVERNANCE" = "success"
          test "$WORKER" = "success"
          test "$FUNCTIONAL" = "success"
