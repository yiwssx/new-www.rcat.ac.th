name: P6C Production Reliability

on:
  schedule:
    # Four end-to-end checkpoints per day. This intentionally bounds D1-backed
    # search reads while retaining production SSR/Worker/D1 reliability coverage.
    - cron: "7 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/p6c-production-reliability.yml"
      - "scripts/p6c-production-reliability-smoke.mjs"
      - "scripts/check-p6c-recovery-reliability.mjs"
      - "config/p6c-recovery-readiness.json"
      - "docs/operations/p6c-recovery-reliability.md"

permissions:
  contents: read

concurrency:
  group: p6c-production-reliability
  cancel-in-progress: true

jobs:
  smoke:
    name: Public Recovery Baseline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Run public production reliability smoke
        run: node scripts/p6c-production-reliability-smoke.mjs
      - name: Reliability summary
        if: ${{ success() }}
        run: |
          {
            echo "## P6C Production Reliability"
            echo
            echo "- Credential mode: public/read-only"
            echo "- Protected production Environment: not used"
            echo "- Scheduled cadence: every six hours"
            echo "- Home SSR/security baseline: passed"
            echo "- Live search/Worker/D1 dependency: passed"
            echo "- Login reachability/noindex boundary: passed"
            echo "- Vercel edge WAF: intentionally owned by P6B Production Security, not duplicated here"
          } >> "$GITHUB_STEP_SUMMARY"
