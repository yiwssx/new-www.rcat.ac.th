name: Deploy / Image Production Worker

on:
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/image-production/**"
      - ".github/workflows/image-production-worker.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare/image-production/**"
      - ".github/workflows/image-production-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-production-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Image Production Worker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Lint image production Worker
        run: pnpm exec eslint "cloudflare/image-production/src/**/*.ts"
      - name: Typecheck image production Worker
        run: pnpm exec tsc -p cloudflare/image-production/tsconfig.json --noEmit
      - name: Build Wrangler dry run
        run: pnpm wrangler deploy --config cloudflare/image-production/wrangler.toml --dry-run --outdir "$RUNNER_TEMP/image-production-worker"

  deploy:
    name: Deploy Image Production Worker
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: image-production-worker-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Deploy production Worker
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          deploy_log="$RUNNER_TEMP/image-production-worker-deploy.log"
          pnpm wrangler deploy --config cloudflare/image-production/wrangler.toml 2>&1 | tee "$deploy_log"
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$deploy_log" | tail -n 1)"
          if [[ -z "$worker_url" ]]; then
            echo "Wrangler did not report a workers.dev URL." >&2
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Deployed production Worker: $worker_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test health endpoint
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          health_file="$RUNNER_TEMP/image-production-worker-health.json"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$WORKER_URL/health" > "$health_file"; then
              cat "$health_file"
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Image production Worker health endpoint did not become ready after deployment." >&2
              exit 1
            fi
            sleep 3
          done
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/image-production-worker-health.json", "utf8"));
            if (body?.service !== "rcat-image-production" || body?.status !== "ok") {
              throw new Error("unexpected image production Worker health response");
            }
          '
