name: Test / Full Image Delivery Benchmark

on:
  push:
    branches:
      - experiment/image-delivery-full-benchmark
    paths:
      - ".github/scripts/image-delivery-full-benchmark-v2.mjs"
      - ".github/workflows/image-delivery-full-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: Browser A/B image delivery benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser benchmark
        run: node .github/scripts/image-delivery-full-benchmark-v2.mjs
