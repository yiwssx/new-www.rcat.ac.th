name: SSR Phase 7 Targeted Lock Probe

on:
  pull_request:
    branches:
      - refactor/ssr-readiness

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Resolve only eligible patched transitives
        run: pnpm update --lockfile-only fast-uri@3.1.5 brace-expansion@5.0.9
      - name: Show manifest and lockfile diff
        run: git diff -- package.json pnpm-lock.yaml
      - name: Verify package manifest is unchanged
        run: git diff --quiet -- package.json
      - name: Audit after targeted refresh
        run: pnpm audit --audit-level=high || true
