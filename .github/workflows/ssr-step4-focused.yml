name: SSR Step 4 Focused

on:
  push:
    branches:
      - fix/ssr-readiness-step4-hardening
  pull_request:
    branches:
      - refactor/ssr-readiness

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Show Prettier diff
        run: |
          pnpm exec prettier --write cloudflare/public-api/src/db/contentRepository.ts src/features/public-read/cloudflareApi.ts
          git diff --check
          git diff -- cloudflare/public-api/src/db/contentRepository.ts src/features/public-read/cloudflareApi.ts
          exit 1
