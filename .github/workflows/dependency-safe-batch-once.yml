name: Dependency Safe Batch Once

on:
  push:
    branches:
      - chore/deps-safe-batch-2026-09-19

permissions:
  contents: write

concurrency:
  group: dependency-safe-batch-once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/deps-safe-batch-2026-09-19
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Apply release-age-eligible dependency versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          Object.assign(pkg.devDependencies, {
            "@vitest/coverage-v8": "5.0.1",
            "sigmap": "^8.49.1",
            "typescript-eslint": "^8.70.0",
            "vite": "^8.3.0",
            "vitest": "^5.0.1",
            "wrangler": "^4.132.0"
          });
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Resolve lockfile with strict peers
        run: pnpm install --no-frozen-lockfile --strict-peer-dependencies --ignore-scripts

      - name: Verify selected versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expected = {
            "@vitest/coverage-v8": "5.0.1",
            "sigmap": "^8.49.1",
            "typescript-eslint": "^8.70.0",
            "vite": "^8.3.0",
            "vitest": "^5.0.1",
            "wrangler": "^4.132.0"
          };
          for (const [name, version] of Object.entries(expected)) {
            if (pkg.devDependencies[name] !== version) {
              throw new Error(`${name}: expected ${version}, got ${pkg.devDependencies[name]}`);
            }
          }
          NODE
          pnpm list @vitest/coverage-v8 sigmap typescript-eslint vite vitest wrangler --depth 0

      - name: Generate canonical dependency status
        run: pnpm deps:status

      - name: Verify generated change scope
        shell: bash
        run: |
          allowed='^(package.json|pnpm-lock.yaml|docs/maintenance/dependency-current-status.md|.github/workflows/dependency-safe-batch-once.yml)$'
          unexpected="$(git status --porcelain --untracked-files=no | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-time workflow and commit batch
        shell: bash
        run: |
          rm .github/workflows/dependency-safe-batch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml docs/maintenance/dependency-current-status.md .github/workflows/dependency-safe-batch-once.yml
          git diff --cached --check
          git commit -m "chore(deps): update release-age-eligible dependencies"
          git push origin HEAD:chore/deps-safe-batch-2026-09-19
