name: SSR readiness bootstrap

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/ssr-readiness-bootstrap.yml'
      - 'scripts/ssr-readiness-bootstrap.mjs'
      - 'scripts/fix-ssr-readiness-bootstrap.mjs'
      - 'scripts/post-ssr-readiness-fixes.mjs'
      - 'scripts/post-ssr-readiness-fixes-2.mjs'
      - 'scripts/post-ssr-readiness-fixes-3.mjs'
      - 'scripts/post-ssr-readiness-fixes-4.mjs'
      - 'scripts/post-ssr-readiness-fixes-5.mjs'
      - 'scripts/post-ssr-readiness-fixes-6.mjs'

permissions:
  contents: write

jobs:
  refactor-and-validate:
    if: github.head_ref == 'refactor/ssr-readiness-1-7'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply SSR readiness refactor
        run: |
          node scripts/fix-ssr-readiness-bootstrap.mjs
          node scripts/ssr-readiness-bootstrap.mjs
          node scripts/post-ssr-readiness-fixes.mjs
          node scripts/post-ssr-readiness-fixes-2.mjs
          node scripts/post-ssr-readiness-fixes-3.mjs
          node scripts/post-ssr-readiness-fixes-4.mjs
          node scripts/post-ssr-readiness-fixes-5.mjs
          node scripts/post-ssr-readiness-fixes-6.mjs
      - name: Format changed sources
        run: pnpm exec prettier --write src cloudflare/public-api/src cloudflare/public-api/test api README.md docs package.json
      - name: Focused SSR-readiness tests
        run: pnpm exec vitest run src/test/ssrReadiness.test.ts src/test/sitemap.test.mjs src/test/publicShellLayoutStability.test.tsx
      - name: Strict lint
        run: pnpm lint:strict
      - name: Worker typecheck
        run: pnpm worker:typecheck
      - name: Build
        run: pnpm build
      - name: Public governance checks
        run: pnpm perf:check && pnpm media:check && pnpm layout:check && pnpm design:check
      - name: Unit suite
        run: pnpm test:unit
      - name: Integration suite
        run: pnpm test:integration
      - name: Diff safety
        run: git diff --check
      - name: Commit validated refactor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/ssr-readiness-bootstrap.yml scripts/ssr-readiness-bootstrap.mjs scripts/fix-ssr-readiness-bootstrap.mjs scripts/post-ssr-readiness-fixes.mjs scripts/post-ssr-readiness-fixes-2.mjs scripts/post-ssr-readiness-fixes-3.mjs scripts/post-ssr-readiness-fixes-4.mjs scripts/post-ssr-readiness-fixes-5.mjs scripts/post-ssr-readiness-fixes-6.mjs
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ssr): prepare public architecture"
          git push origin HEAD:${{ github.head_ref }}
