name: Experimental / Format Image Delivery Rollout

on:
  push:
    branches:
      - experiment/image-delivery-rollout

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style(media): format image delivery rollout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format rollout files
        run: |
          pnpm exec prettier --write \
            .github/workflows/experimental-image-delivery-rollout-validation.yml \
            cloudflare/image-test/src/index.ts \
            docs/performance/image-delivery-rollout-2026-09-27.md \
            src/features/cms-carousel/api.ts \
            src/features/cms-settings/api.ts \
            src/public/components/PublicIntroGate.tsx \
            src/shared/components/CarouselImageStage.tsx \
            src/shared/media/PublicResponsiveImage.tsx \
            src/shared/media/publicImageDeliveryWarmup.ts \
            src/shared/media/publicImageDeliveryWarmup.test.ts \
            src/shared/media/publicImageSources.ts \
            src/shared/media/publicImageSources.test.ts \
            src/test/PublicIntroGateRegression.test.tsx
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/experimental-image-delivery-rollout-validation.yml \
            cloudflare/image-test/src/index.ts \
            docs/performance/image-delivery-rollout-2026-09-27.md \
            src/features/cms-carousel/api.ts \
            src/features/cms-settings/api.ts \
            src/public/components/PublicIntroGate.tsx \
            src/shared/components/CarouselImageStage.tsx \
            src/shared/media/PublicResponsiveImage.tsx \
            src/shared/media/publicImageDeliveryWarmup.ts \
            src/shared/media/publicImageDeliveryWarmup.test.ts \
            src/shared/media/publicImageSources.ts \
            src/shared/media/publicImageSources.test.ts \
            src/test/PublicIntroGateRegression.test.tsx
          git commit -m "style(media): format image delivery rollout"
          git push origin HEAD:experiment/image-delivery-rollout
