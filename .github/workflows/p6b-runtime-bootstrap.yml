name: P6B Runtime Bootstrap

on:
  push:
    branches:
      - fix/p6b-dedicated-security-token
    paths:
      - ".github/workflows/p6b-runtime-bootstrap.yml"

permissions:
  contents: write

jobs:
  dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p6b-dedicated-security-token
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm add @vercel/functions
      - name: Commit dependency lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "build(p6b): add Vercel functions runtime"
          git push origin HEAD:fix/p6b-dedicated-security-token
