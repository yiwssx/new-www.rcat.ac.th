    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require protected production credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID"

      - name: Resolve exact production D1 identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs \
            --database-list "$RUNNER_TEMP/d1-databases.json" \
            --verify-identity-only

      - name: Reconstruct reviewed import payload
        shell: bash
        run: |
          IMPORT_FILE="$RUNNER_TEMP/rcat-o10-procurement-import.sql"
          printf '%s' "$O10_PAYLOAD_B64" | tr -d '[:space:]' | base64 -d | gunzip > "$IMPORT_FILE"
          actual_sha="$(sha256sum "$IMPORT_FILE" | awk '{print $1}')"
          test "$actual_sha" = "e03277abc9e28cf82c1a305b62b614fad4feb853ef60bf943ff00099406362b3"
          test "$(grep -c '^INSERT OR IGNORE INTO contents' "$IMPORT_FILE")" = "25"
          echo "IMPORT_FILE=$IMPORT_FILE" >> "$GITHUB_ENV"
          echo "Reviewed O10 payload verified: 25 idempotent inserts."

      - name: Inspect existing O10 import scope
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --env production \
            --config cloudflare/public-api/wrangler.toml \
            --command="SELECT COUNT(*) AS existing_count FROM contents WHERE created_by = 'gdrive-o10-import' AND COALESCE(deleted_at, '') = '';" \
            --json > "$RUNNER_TEMP/o10-before.json"
          cat "$RUNNER_TEMP/o10-before.json"

      - name: Capture pre-import Time Travel bookmark
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 time-travel info "$PRODUCTION_D1_RESOURCE_NAME" \
            --env production \
            --config cloudflare/public-api/wrangler.toml \
            --json > "$RUNNER_TEMP/o10-pre-import-time-travel.json"
          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/o10-pre-import-time-travel.json", "utf8"));
          const metadata = Array.isArray(value) ? value[0] : value;
          if (typeof metadata?.bookmark !== "string" || metadata.bookmark.length === 0) {
            throw new Error("Production Time Travel bookmark was not returned; refusing import.");
          }
          console.log("Pre-import Time Travel bookmark captured.");
          NODE

      - name: Import 25 procurement announcements
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --env production \
            --config cloudflare/public-api/wrangler.toml \
            --file "$IMPORT_FILE"

      - name: Verify production rows
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 execute "$PRODUCTION_D1_RESOURCE_NAME" \
            --remote \
            --env production \
            --config cloudflare/public-api/wrangler.toml \
            --command="SELECT COUNT(*) AS row_count, COUNT(DISTINCT body_doc_id) AS distinct_files, MIN(publish_at) AS oldest, MAX(publish_at) AS newest FROM contents WHERE created_by = 'gdrive-o10-import' AND COALESCE(deleted_at, '') = '';" \
            --json > "$RUNNER_TEMP/o10-after.json"
          cat "$RUNNER_TEMP/o10-after.json"
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/o10-after.json", "utf8"));
          const statements = Array.isArray(payload) ? payload : [payload];
          const rows = statements.flatMap((s) => (Array.isArray(s?.results) ? s.results : []));
          const row = rows[0] || {};
          if (Number(row.row_count) !== 25 || Number(row.distinct_files) !== 25) {
            throw new Error(`O10 verification failed: row_count=${row.row_count}, distinct_files=${row.distinct_files}`);
          }
          if (row.oldest !== "2024-05-20T00:00:00.000Z" || row.newest !== "2026-07-09T00:00:00.000Z") {
            throw new Error(`O10 date range mismatch: ${row.oldest} .. ${row.newest}`);
          }
          console.log("O10 production import verified: 25 rows, 25 source files, expected date range.");
          NODE
