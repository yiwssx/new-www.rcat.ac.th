name: Format Facebook Metadata V2

on:
  push:
    branches:
      - fix/facebook-metadata-reclassification-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/facebook-metadata-reclassification-v2

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Format Facebook metadata files
        run: |
          pnpm exec prettier --write \
            scripts/facebook/reclassify-facebook-imports.mjs \
            scripts/facebook/transform-posts-to-d1-sql.test.mjs
          pnpm exec prettier --check \
            .github/workflows/facebook-metadata-reclassification.yml \
            scripts/facebook/facebook-content-classifier.mjs \
            scripts/facebook/facebook-content-classifier.test.mjs \
            scripts/facebook/facebook-reclassification.test.mjs \
            scripts/facebook/reclassify-facebook-imports.mjs \
            scripts/facebook/transform-posts-to-d1-sql.mjs \
            scripts/facebook/transform-posts-to-d1-sql.test.mjs

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/facebook/reclassify-facebook-imports.mjs scripts/facebook/transform-posts-to-d1-sql.test.mjs
          git commit -m "style(content): format Facebook metadata repair"
          git push origin HEAD:fix/facebook-metadata-reclassification-v2
