name: Format Rich Text Insert Tools

on:
  push:
    branches:
      - feat/cms-rich-text-insert-tools

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cms-rich-text-insert-tools
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format touched files
        run: >
          pnpm exec prettier --write
          src/admin/components/ContentBlockBuilder.tsx
          src/admin/components/RichTextEditor.tsx
          src/admin/components/RichTextMediaPickerDialog.tsx
          src/admin/components/richTextInsert.ts
          src/admin/components/richTextInsert.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/components/ContentBlockBuilder.tsx             src/admin/components/RichTextEditor.tsx             src/admin/components/RichTextMediaPickerDialog.tsx             src/admin/components/richTextInsert.ts             src/admin/components/richTextInsert.test.ts
          git commit -m "style(cms): format rich-text insert tools"
          git push origin HEAD:feat/cms-rich-text-insert-tools
