name: Worker Production Rollback

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "40-character ancestor commit containing the known-good Worker runtime"
        required: true
        type: string
      incident_reference:
        description: "Short incident/change reference for the audit trail"
        required: true
        type: string
      rollback_confirmation:
        description: "Enter ROLLBACK_WORKER_RUNTIME_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-production-recovery
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll Back Production Worker Runtime
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_D1_RESOURCE_NAME: rcat-public-api-preview

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Require exact runtime-only rollback confirmation
        shell: bash
        env:
          ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}
        run: |
          test "$ROLLBACK_CONFIRMATION" = "ROLLBACK_WORKER_RUNTIME_ONLY" || {
            echo "Worker rollback confirmation does not match the required exact phrase." >&2
            exit 1
          }

      - name: Validate rollback target
        id: target
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Rollback target must be an exact 40-character commit SHA." >&2
            exit 1
          }
          git cat-file -e "$TARGET_SHA^{commit}"
          test "$TARGET_SHA" != "$GITHUB_SHA" || {
            echo "Rollback target is already the current master revision." >&2
            exit 1
          }
          git merge-base --is-ancestor "$TARGET_SHA" "$GITHUB_SHA" || {
            echo "Rollback target must be an ancestor of the workflow master revision." >&2
            exit 1
          }
          git cat-file -e "$TARGET_SHA:cloudflare/public-api/wrangler.toml"
          git cat-file -e "$TARGET_SHA:cloudflare/public-api/src/index.ts"
          target_config="$(git show "$TARGET_SHA:cloudflare/public-api/wrangler.toml")"
          grep -Fq 'binding = "CMS_AUTH_RATE_LIMITER"' <<<"$target_config" || {
            echo "Rollback target predates the required CMS Auth rate-limit binding." >&2
            exit 1
          }
          grep -Fq 'binding = "ADMIN_API_RATE_LIMITER"' <<<"$target_config" || {
            echo "Rollback target predates the required Admin API rate-limit binding." >&2
            exit 1
          }
          echo "short_sha=${TARGET_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "Worker rollback target is a security-baseline-preserving ancestor revision."

      - name: Require protected Cloudflare production credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is unavailable from production." >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is unavailable from production." >&2; exit 1; }
          test -n "$RCAT_PRODUCTION_D1_DATABASE_ID" || { echo "RCAT_PRODUCTION_D1_DATABASE_ID is unavailable from production." >&2; exit 1; }

      - name: Resolve exact production D1 identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: |
          pnpm wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node cloudflare/public-api/scripts/worker-production-preflight.mjs \
            --database-list "$RUNNER_TEMP/d1-databases.json" \
            --verify-identity-only

      - name: Confirm Time Travel is available before runtime mutation
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 time-travel info "$PRODUCTION_D1_RESOURCE_NAME" --json > "$RUNNER_TEMP/p6c-pre-rollback-time-travel.json"
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/p6c-pre-rollback-time-travel.json", "utf8"));
            const metadata = Array.isArray(value) ? value[0] : value;
            if (typeof metadata?.bookmark !== "string" || metadata.bookmark.length === 0) throw new Error("pre-rollback Time Travel bookmark was not returned");
            console.log("Pre-rollback D1 Time Travel readiness confirmed; bookmark retained only in runner temp storage.");
          '

      - name: Extract known-good Worker runtime
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          rm -rf .p6c-worker-rollback
          mkdir -p .p6c-worker-rollback
          git archive "$TARGET_SHA" cloudflare/public-api | tar -x -C .p6c-worker-rollback

      - name: Deploy runtime rollback without D1 migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RCAT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RCAT_PRODUCTION_D1_DATABASE_ID }}
        run: node scripts/deploy-worker-runtime-rollback.mjs --worker-dir .p6c-worker-rollback/cloudflare/public-api

      - name: Verify public production after Worker rollback
        run: node scripts/p6c-production-reliability-smoke.mjs

      - name: Rollback summary
        env:
          TARGET_SHORT_SHA: ${{ steps.target.outputs.short_sha }}
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
        run: |
          {
            echo "## Worker Production Rollback"
            echo
            echo "- Incident/change reference: $INCIDENT_REFERENCE"
            echo "- Restored Worker source revision: $TARGET_SHORT_SHA"
            echo "- Existing production Worker updated in place: yes"
            echo "- D1 migrations applied: no"
            echo "- D1 Time Travel restore: no"
            echo "- Protected production Environment: required"
            echo "- Post-rollback public reliability smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove extracted rollback source
        if: ${{ always() }}
        run: rm -rf .p6c-worker-rollback
