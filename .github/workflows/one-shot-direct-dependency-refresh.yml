name: One-shot direct dependency refresh

on:
  push:
    branches:
      - deps/direct-package-json-refresh-2026-08-15
    paths:
      - .github/workflows/one-shot-direct-dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/direct-package-json-refresh-2026-08-15
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore dependency files from master
        run: git checkout origin/master -- package.json pnpm-lock.yaml

      - name: Update only mature named direct package.json dependencies
        run: |
          pnpm update --latest --lockfile-only \
            @mui/icons-material \
            @mui/material \
            @tanstack/react-table \
            @testing-library/jest-dom \
            @testing-library/user-event \
            eslint-plugin-react-refresh \
            globals \
            wrangler

      - name: Verify dependency policy boundaries
        run: |
          git diff --exit-code -- pnpm-workspace.yaml .node-version .github/workflows/ci.yml .github/workflows/dependency-monitoring.yml .github/workflows/dependency-status-sync.yml .github/workflows/worker-production.yml
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const before = JSON.parse(execFileSync('git', ['show', 'origin/master:package.json'], { encoding: 'utf8' }));
          const after = require('./package.json');
          const allowed = new Set([
            '@mui/icons-material',
            '@mui/material',
            '@tanstack/react-table',
            '@testing-library/jest-dom',
            '@testing-library/user-event',
            'eslint-plugin-react-refresh',
            'globals',
            'wrangler'
          ]);

          for (const section of ['dependencies', 'devDependencies']) {
            const names = new Set([
              ...Object.keys(before[section] || {}),
              ...Object.keys(after[section] || {})
            ]);
            for (const name of names) {
              if ((before[section] || {})[name] !== (after[section] || {})[name] && !allowed.has(name)) {
                throw new Error(`Unexpected direct dependency change: ${section}.${name}`);
              }
            }
          }

          for (const field of ['engines', 'packageManager']) {
            if (JSON.stringify(before[field]) !== JSON.stringify(after[field])) {
              throw new Error(`Unexpected package metadata change: ${field}`);
            }
          }
          NODE

      - name: Commit direct dependency refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No mature direct dependency changes to commit.'
            exit 0
          fi
          git commit -m 'chore(deps): refresh mature direct dependencies only'
          git push origin HEAD:deps/direct-package-json-refresh-2026-08-15
