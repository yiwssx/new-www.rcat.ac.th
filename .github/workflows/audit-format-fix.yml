name: Audit Format Fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  format-fix:
    if: github.event.pull_request.number == 73 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format audit documentation
        run: pnpm exec prettier --write docs/development/environment-variables.md
      - name: Commit formatter output
        run: |
          if git diff --quiet -- docs/development/environment-variables.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/environment-variables.md
          git commit -m "style(docs): apply prettier formatting"
          git push origin HEAD:${{ github.head_ref }}
