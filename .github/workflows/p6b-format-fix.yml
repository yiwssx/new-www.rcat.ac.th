name: P6B Format Fix

on:
  push:
    branches:
      - fix/p6b-dedicated-security-token
    paths:
      - ".github/workflows/p6b-format-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p6b-dedicated-security-token
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write scripts/check-p6b-security-enforcement.mjs
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-p6b-security-enforcement.mjs
          git diff --cached --quiet && exit 0
          git commit -m "style(p6b): format security governance checker"
          git push origin HEAD:fix/p6b-dedicated-security-token
