name = "rcat-public-api"
main = "src/index.ts"
compatibility_date = "2026-05-27"

# M2.2 local/non-production D1 binding.
# This placeholder exists so `wrangler dev`, local migrations, and fake local
# seed commands can exercise the Worker binding shape. Do not commit a real
# preview or production database_id until that environment is explicitly scoped.
[[d1_databases]]
binding = "DB"
database_name = "rcat-public-api-local"
database_id = "local-placeholder"

# M5 preview-only binding placeholder.
# This env is for non-production Cloudflare Worker preview testing only.
# Replace `preview-placeholder` outside git when a real preview D1 database is
# created. Never use this section for production traffic or real school data.
[env.preview]
name = "rcat-public-api-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "rcat-public-api-preview"
database_id = "preview-placeholder"

[env.production]
name = "rcat-public-api-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "rcat-public-api-production"
database_id = "production-placeholder"
