name = "rcat-public-api"
main = "src/index.ts"
compatibility_date = "2026-05-27"
keep_vars = true

# Local-only D1 binding for development, tests, and fake sample data.
[[d1_databases]]
binding = "DB"
database_name = "rcat-public-api-local"
database_id = "local-placeholder"

# Canonical production runtime promoted in place.
# Both the existing Worker and data-bearing D1 retain their historical physical
# Cloudflare name `rcat-public-api-preview`, while their canonical role is now
# production. This preserves the live Worker URL, dashboard-managed non-secret
# vars not represented here, encrypted secrets, and all D1 data. The protected
# production D1 UUID is injected at release time; never commit the real ID.
[env.production]
name = "rcat-public-api-preview"

[env.production.vars]
ENVIRONMENT = "production"
ADMIN_WRITE_PREVIEW_ENABLED = "false"
ADMIN_WRITE_SMOKE_ENABLED = "false"
PUBLIC_ANALYTICS_ALLOWED_ORIGINS = "https://www.rcat.ac.th"

[env.production.triggers]
crons = ["17 19 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "rcat-public-api-preview"
database_id = "production-placeholder"
