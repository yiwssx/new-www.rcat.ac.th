name = "rcat-public-api"
main = "src/index.ts"
compatibility_date = "2026-05-27"

# M2.2 local/non-production D1 binding.
# This placeholder exists so `wrangler dev`, local migrations, and fake local
# seed commands can exercise the Worker binding shape. Do not commit a real
# preview or production database_id until that environment is explicitly scoped.
[[d1_databases]]
binding = "DB"
database_name = "rcat-public-api-local"
database_id = "local-placeholder"
