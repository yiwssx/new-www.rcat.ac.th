name = "rcat-public-api"
main = "src/index.ts"
compatibility_date = "2026-05-27"
keep_vars = true

# Local-only D1 binding for development, tests, and fake sample data.
[[d1_databases]]
binding = "DB"
database_name = "rcat-public-api-local"
database_id = "local-placeholder"

# Public analytics rate limits run on Cloudflare's Rate Limiting binding instead
# of writing a counter row into D1 for every telemetry request. Namespace IDs
# are intentionally distinct from the canonical production bindings below.
[[ratelimits]]
name = "PUBLIC_SITE_VIEW_RATE_LIMITER"
namespace_id = "2690101"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "PUBLIC_PRESENCE_RATE_LIMITER"
namespace_id = "2690102"

[ratelimits.simple]
limit = 240
period = 60

[[ratelimits]]
name = "PUBLIC_CONTENT_VIEW_RATE_LIMITER"
namespace_id = "2690103"

[ratelimits.simple]
limit = 90
period = 60

# P6B sensitive-route controls run in Cloudflare's edge rate-limit service.
# CMS authentication is intentionally tighter than authenticated Admin API traffic.
[[ratelimits]]
name = "CMS_AUTH_RATE_LIMITER"
namespace_id = "2690104"

[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "ADMIN_API_RATE_LIMITER"
namespace_id = "2690105"

[ratelimits.simple]
limit = 120
period = 60

# Canonical production runtime promoted in place.
# Both the existing Worker and data-bearing D1 retain their historical physical
# Cloudflare name `rcat-public-api-preview`, while their canonical role is now
# production. This preserves the live Worker URL, dashboard-managed non-secret
# vars not represented here, encrypted secrets, and all D1 data. The protected
# production D1 UUID is injected at release time; never commit the real ID.
[env.production]
name = "rcat-public-api-preview"

[env.production.vars]
ENVIRONMENT = "production"
ADMIN_WRITE_PREVIEW_ENABLED = "false"
ADMIN_WRITE_SMOKE_ENABLED = "false"
PUBLIC_ANALYTICS_ALLOWED_ORIGINS = "https://www.rcat.ac.th"

[env.production.triggers]
crons = ["17 19 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "rcat-public-api-preview"
database_id = "production-placeholder"

[[env.production.ratelimits]]
name = "PUBLIC_SITE_VIEW_RATE_LIMITER"
namespace_id = "2690201"

[env.production.ratelimits.simple]
limit = 120
period = 60

[[env.production.ratelimits]]
name = "PUBLIC_PRESENCE_RATE_LIMITER"
namespace_id = "2690202"

[env.production.ratelimits.simple]
limit = 240
period = 60

[[env.production.ratelimits]]
name = "PUBLIC_CONTENT_VIEW_RATE_LIMITER"
namespace_id = "2690203"

[env.production.ratelimits.simple]
limit = 90
period = 60

[[env.production.ratelimits]]
name = "CMS_AUTH_RATE_LIMITER"
namespace_id = "2690204"

[env.production.ratelimits.simple]
limit = 30
period = 60

[[env.production.ratelimits]]
name = "ADMIN_API_RATE_LIMITER"
namespace_id = "2690205"

[env.production.ratelimits.simple]
limit = 120
period = 60
