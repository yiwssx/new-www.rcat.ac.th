name = "rcat-public-api"
main = "src/index.ts"
compatibility_date = "2026-05-27"

# Local-only D1 binding for development, tests, and fake sample data.
[[d1_databases]]
binding = "DB"
database_name = "rcat-public-api-local"
database_id = "local-placeholder"

# Canonical production runtime.
# The data-bearing D1 was originally provisioned under the physical Cloudflare
# name `rcat-public-api-preview`. It is promoted in place as the sole production
# database to avoid copying or rebuilding live data. The protected production
# UUID is injected at release time; never commit the real D1 database_id.
[env.production]
name = "rcat-public-api-production"

[env.production.vars]
ENVIRONMENT = "production"
ADMIN_WRITE_PREVIEW_ENABLED = "false"
ADMIN_WRITE_SMOKE_ENABLED = "false"
PUBLIC_ANALYTICS_ALLOWED_ORIGINS = "https://www.rcat.ac.th"

[env.production.triggers]
crons = ["17 19 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "rcat-public-api-preview"
database_id = "production-placeholder"
