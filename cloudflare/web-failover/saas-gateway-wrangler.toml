# CLOUDFLARE FOR SAAS / O2O PRODUCTION GATEWAY — PROVIDER ACCOUNT ONLY.
# rcat.dpdns.org is the independently active SaaS provider zone; its fallback
# origin is active. www.rcat.ac.th registration and certificate are managed by API.
# Deploying this host-locked Worker to workers.dev cannot itself switch www DNS;
# its public paths MUST continue to return 503 on workers.dev.
#
# This file creates NO routes, domains, DNS records, SaaS custom hostnames,
# certificates, D1 bindings or Vercel changes. Owner DNS cutover is separate.
name = "rcat-saas-gateway"
main = "saas-gateway-worker.mjs"
compatibility_date = "2026-10-29"
workers_dev = true

[vars]
PUBLIC_HOSTNAME = "www.rcat.ac.th"
RCAT_VERCEL_ORIGIN = "https://new-wwwrcatacth-rcat-it-dev-team.vercel.app"
STANDBY_ORIGIN = "https://rcat-web-standby.rcat-digital.workers.dev"

# Both Workers are in OUR rcat-digital account, so this binding is permitted.
[[services]]
binding = "STANDBY"
service = "rcat-web-standby"
